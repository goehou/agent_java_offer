<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Offer · 入口汇总</title>
<style>
  :root {
    --color-primary: #1E293B;
    --color-on-primary: #FFFFFF;
    --color-accent: #22C55E;
    --color-background: #0F172A;
    --color-foreground: #F8FAFC;
    --color-muted: #272F42;
    --color-muted-fg: #94A3B8;
    --color-border: #475569;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--color-background);
    color: var(--color-foreground);
    font: 16px/1.5 Inter, system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px;
  }
  header { text-align: center; max-width: 640px; }
  header h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; }
  header p { color: var(--color-muted-fg); margin-top: 8px; font-size: 15px; }
  main {
    display: grid;
    grid-template-columns: repeat(2, minmax(280px, 400px));
    gap: 24px;
    margin-top: 40px;
    width: 100%;
    max-width: 880px;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: var(--color-muted);
    border: 1px solid var(--color-border);
    border-radius: 12px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    transition: border-color 200ms ease, transform 200ms ease, box-shadow 200ms ease;
  }
  .card:hover {
    border-color: var(--color-accent);
    transform: translateY(-2px);
    box-shadow: 0 0 10px rgba(34, 197, 94, .15);
  }
  .card:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .card h2 { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .card svg { width: 20px; height: 20px; stroke: var(--color-accent); flex: none; }
  .card p { color: var(--color-muted-fg); font-size: 14px; }
  .card .meta { margin-top: auto; font-size: 13px; color: var(--color-accent); }
  footer { margin-top: 48px; color: var(--color-muted-fg); font-size: 13px; }
  .actions { display: flex; gap: 12px; margin-top: 32px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 500;
    text-decoration: none; cursor: pointer;
    transition: background-color 200ms ease, border-color 200ms ease;
  }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }
  .btn-outline {
    color: var(--color-foreground);
    background: var(--color-muted);
    border: 1px solid var(--color-border);
  }
  .btn-outline:hover { border-color: var(--color-muted-fg); }
  .btn-star {
    color: #0F172A;
    background: var(--color-accent);
    border: 1px solid var(--color-accent);
  }
  .btn-star:hover { background: #16A34A; border-color: #16A34A; }
  @media (max-width: 768px) { main { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
  <header>
    <h1>Agent Offer · 入口汇总</h1>
    <p>同一份 docs/interview_prep 面试复习资料的两个生成版本</p>
  </header>
  <main>
    <a class="card" href="tools/viewer/index.html">
      <h2>
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
        </svg>
        Claude 版 · 单文件可视化

      <p>全部资料打包进一个 HTML：总览、知识地图、卡片练习、全文搜索、复习路线图，单页内切换。</p>
      <span class="meta">打开 tools/viewer/index.html →</span>
    </a>
    <a class="card" href="kimi_html/kimi.html">

        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <span class="meta">打开 kimi_html/kimi.html →</span>
    </a>
  </main>
  <div class="actions">

    <a class="btn btn-star" href="https://github.com/goehou/agent_java_offer" target="_blank" rel="noopener">

        <path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01Z"/>

  </div>

</html>
