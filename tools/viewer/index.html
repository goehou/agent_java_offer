然语言文本**，而是一个特殊格式的、结构化的**JSON对象**（或其他格式）。\n  - 这个JSON对象会精确地包含：\n    - **要调用的函数名称**。\n    - **一个包含所有参数名和值的对象**。\n  - 例如，对于用户提问“今天新加坡天气怎么样？”，LLM可能输出：\n    ```\n    {\n      \"tool_call\": {\n        \"name\": \"get_current_weather\",\n        \"arguments\": {\n          \"location\": \"Singapore\",\n          \"unit\": \"celsius\"\n        }\n      }\n    }\n    ```\n4. **外部执行与结果返回 (External Execution & Result Return):**\n  - Agent的控制代码（Orchestrator）会捕获这个特殊的JSON输出。\n  - 它会解析JSON，找到函数名和参数，然后在**外部环境中实际执行**这个函数（例如，调用一个真实的天气API）。\n  - 函数执行完毕后，会返回一个结果（例如，`{\"temperature\": 32, \"condition\": \"sunny\"}`）。\n5. **整合结果并生成最终回复 (Integrating Result & Generating Final Response):**\n  - 控制代码将工具的返回结果**再次格式化**，并将其作为新的上下文信息，连同之前的对话历史一起，再次发送给LLM。\n\n### 3. 子问题：LangChain/LangGraph 里工具调用怎么做可靠性治理？\n\n答：\n我会做三层治理：工具输入 schema 校验、调用层重试与超时、结果层幂等与去重。工具返回统一结构（status/data/error），禁止“字符串拼接式”返回。再配合回退策略（备用工具/降级答案）避免单工具故障拖垮全链路。\n\n追问：如何区分“该重试”与“不该重试”的错误类型？\n\n**“不改输入也有机会成功”= 该重试；“输入/权限/业务规则不变就必失败”= 不该重试**\n\n## 2. 主干问题：LangChain/LangGraph/LlamaIndex 等框架如何选型？\n\n### 1. 子问题：框架选型与架构关系（LangChain/LangGraph/LlamaIndex/RAG框架）\n\n主问题：常见 Agent/RAG 框架如何选型？\n\n口述答案：\n我的选型逻辑是“问题驱动而非框架驱动”。如果重点是工具编排与流程控制，优先 LangChain/LangGraph；如果重点是知识接入和检索能力，优先 LlamaIndex 或专门 RAG 框架；如果是数据规模和工程复杂度上升，再考虑框架组合。LangChain 更偏组件编排，LangGraph 更偏有状态图编排；很多项目是“LangChain 组件 + LangGraph 托管状态机”。选型最终看任务成功率、时延、成本、可维护性，不看单点 Demo 漂亮程度。\n\n常见追问：\n\n1. CrewAI、AutoGen、Ragflow 适合什么阶段？\n2. 你会如何做框架迁移与回滚？\n3. 如何避免“框架耦合”导致技术锁定？\n\n### 2. 子问题：请比较两个流行的 Agent 开发框架，如 LangChain 和 LlamaIndex。它们的核心应用场景有何不同？\n\n答：\n我一般按“逻辑编排驱动”还是“数据检索驱动”来选。LangChain 强在工作流编排、多工具协作和 Agent 执行控制，适合复杂任务链；LlamaIndex 强在数据接入、索引构建和检索优化，适合知识库问答与高质量 RAG。实际项目常是组合用：用 LlamaIndex 管数据能力，用 LangChain 做上层编排。\n\n- **参考答案：** LangChain和LlamaIndex是构建LLM应用最流行的两个开源框架，它们都极大地简化了开发流程，但它们的**核心哲学和设计重点有所不同**，导致了它们在应用场景上的差异。\n**核心定位的差异：**\n  - **LangChain：一个通用的LLM应用“编排”框架 (General-purpose Orchestration Framework)**\n    - **哲学：** LangChain的目标是提供一个全面的工具集，用于将LLM与各种组件（工具、记忆、数据源）“链接”在一起，构建复杂的应用程序，其中Agent是其核心应用之一。它更关注于 **“工作流”的构建**。\n    - **核心抽象：** Chains (调用链), Agents (智能体), Memory (记忆模块), Callbacks (回调系统)。\n  - **LlamaIndex：一个专注于外部数据的“数据”框架 (Data Framework for External Data)**\n    - **哲学：** LlamaIndex的出发点是解决LLM与私有或外部数据连接的核心问题，即**RAG (Retrieval-Augmented Generation)**。它专注于如何高效地**摄入（ingest）、索引（index）、和查询（query）外部数据。它更关注于“数据流”的管理**。\n    - **核心抽象：** Data Connectors (数据连接器), Indexes (索引结构), Retrievers (检索器), Query Engines (查询引擎)。\n    **核心应用场景的不同：**\n\n  | **特性**     | **LangChain**                                                                                                  | **LlamaIndex**                                                                                                                 |\n  | ---------- | -------------------------------------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------ |\n  | **最擅长的场景** | **构建复杂的、多步骤的Agent**：当你的应用需要调用多个不同的工具、维护复杂的对话状态、并遵循一个精心设计的执行逻辑时，LangChain的Agent Executor和Chains提供了极大的灵活性。       | **构建高性能的RAG系统**：当你的核心需求是搭建一个强大的知识库问答系统（Q&A over your data），需要处理复杂的非结构化数据（PDF, PPT）、构建高级索引（如树索引、关键词表索引）、并优化检索质量时，LlamaIndex是首选。 |\n  | **应用举例**   | 1. 一个能上网搜索、执行代码、并调用计算器的**通用研究助手**。 2. 一个能连接公司内部API来查询订单、更新客户信息的**自动化客服Agent**。 3. 一个能执行一系列复杂操作的**自动化流程（RPA）**。 | 1. 一个能够回答关于公司内部海量技术文档问题的**开发者助手**。 2. 一个能够结合多份PDF财报进行深度分析和回答的**金融分析工具**。 3. 一个私人的、基于个人笔记库（Notion, Obsidian）的**知识管理和问答系统**。     |\n  | **功能交叉**   | LangChain也内置了RAG功能（Document Loaders, Vector Stores, Retrievers），但相对LlamaIndex来说，其高级功能和可定制性较少。                  | LlamaIndex也引入了Agent的概念（Data Agent），允许LLM智能地选择不同的数据源和查询策略，但其Agent的通用性和复杂工具编排能力不如LangChain。                                      |\n\n  **总结：**\n  - 如果你的项目**以Agent为核心，需要复杂的逻辑编排和多工具协作**，首选**LangChain**。\n  - 如果你的项目**以数据为核心，需要构建强大的知识库和问答能力**，首选**LlamaIndex**。\n  - 在实际开发中，两者也常常被**结合使用**：例如，使用LlamaIndex构建一个强大的知识库检索工具，然后将这个工具接入到LangChain构建的Agent中，让Agent能够利用这个知识库来完成更复杂的任务。\n\n### 3. 子问题：你用过哪些 Agent 框架？选型是如何选的？你最终场景的评价指标是什么？\n\n答：\n我最常用的主要有两个：**LangChain** 和 **LlamaIndex**。\n\n选型：\n\n**1.当项目是“逻辑编排驱动”时，我首选LangChain,** 这类项目的核心是构建一个复杂的、需要执行一系列步骤、并与多种外部工具（APIs, 数据库, 文件系统）交互的Agent, 一个自动化的研究助手，需要先上网搜索，然后对结果进行总结，再用代码执行器进行数据分析\n\n**2.当项目是“数据驱动”时，我首选LlamaIndex,** 这类项目的核心是构建一个围绕特定知识库的问答或分析系统，即高级RAG（Retrieval-Augmented Generation）。例如，一个能回答公司内部上千份PDF技术文档的客服机器人\n\n**最终场景的评价指标是什么？**\n\n**1.任务成功率**\n\n**2.完成任务过程中的资源消耗: token费用, api费用, 延迟, 步骤数(次数越少意味规划能力越强)**\n\n**3.鲁棒性与可预测性: 错误处理能力; 输出一致性; 安全评估**\n\n### 4. 子问题：知道或者使用过哪些开源 RAG 框架比如 Ragflow？如何选择合适场景？\n\n答：\n\n除了最广为人知的、作为基础工具库的 **LangChain** 和 **LlamaIndex** 之外，还涌现出了一批更专注于提供端到端RAG解决方案的平台，其中 **RAGFlow** 就是一个很有代表性的例子。其他类似的框架还包括 **Haystack**, **DSPy** 等。\n\n**对RAGFlow的理解：** 它更像一个 **“开箱即用”的、对业务人员更友好的RAG应用平台**。它的特点是：\n\n- **自动化与可视化：** RAGFlow试图将RAG流水线中许多复杂的、需要编码和经验调优的步骤自动化。例如，它提供了基于深度学习的、“智能”的文本分块方法，而不是让用户手动设置`chunk_size`。它通常还提供一个GUI界面，让用户可以方便地上传文档、测试效果、查看引用来源。\n- **端到端整合：** 它提供了一个相对完整的解决方案，从数据接入、处理、索引到最终的应用接口，都整合在一个系统里。\n- **为非专家设计：** 它的目标用户不仅是开发者，也包括了希望快速搭建和验证RAG应用的业务分析师或产品经理。\n\n**如何选择合适场景？**\n\n选择哪个框架主要取决于**项目的需求、团队的技能和对定制化的要求**。\n\n1. **选择 LangChain / LlamaIndex 的场景：**\n  - **高度定制化需求：** 当你需要对RAG流水线的每一个环节（例如，自定义分块逻辑、实现复杂的混合检索策略、集成公司内部的特定工具）进行深度控制和定制时。\n  - **作为底层库集成：** 当你不是要构建一个独立的RAG应用，而是想把RAG能力作为一部分，嵌入到一个更大的、复杂的软件系统中时。\n  - **开发者为核心的团队：** 当你的团队主要是由熟悉Python和AI开发的工程师组成，他们乐于从零开始、灵活地构建和优化系统。\n  - **一句话总结：** **选择它们是为了“灵活性”和“控制力”**。\n2. **选择 RAGFlow / Haystack 这类平台的场景：**\n  - **快速原型验证（Rapid Prototyping）：** 当你想在几天内快速搭建一个高质量的RAG原型，来验证一个业务想法的可行性时。\n  - **追求最佳实践（Best Practices Out-of-the-Box）：** 当你希望直接利用领域内已经验证过的最佳实践（如先进的分块和索引技术），而不是自己去重新实现和调试时。\n  - **技术团队规模有限或业务人员主导：** 当团队希望更多地关注业务逻辑，而不是底层AI技术的复杂实现时。\n  - **一句话总结：** **选择它们是为了“效率”和“易用性”**。\n\n**我的选择策略：** 在项目初期，如果需要快速看到效果，我会考虑使用RAGFlow这样的平台来搭建一个**基线（Baseline）**。在验证了业务价值后，如果发现平台的标准化流程无法满足我们更深度的性能优化或业务逻辑定制需求，我可能会考虑使用LangChain或LlamaIndex，将RAGFlow中验证过的有效模块，用代码进行更精细化的**重构和实现**。\n\n---\n\n### 四、模型评估与 Agent 评估面试题（10）\n\n### 5. 子问题：LangChain 和 LangGraph 的关系与区别？\n\n答：\nLangChain 更偏组件库和表达式编排（Prompt、Model、Retriever、Tools、Runnable），适合快速搭建链路。LangGraph 是面向有状态、多步骤、可恢复任务的图编排框架，适合 Agent 工作流。两者不是替代关系，常见是用 LangChain 组件 + LangGraph 做状态机编排。\n\n追问：什么时候必须从 LangChain Chain 升级到 LangGraph 图？\n\n当流程从‘线性调用’变成‘有状态、有分支、可恢复、可治理’时，Chain 的表达力就不够了，这时候就该升级到 LangGraph 图。\n\n## 3. 主干问题：LangGraph 生产治理要关注什么？\n\n### 1. 子问题：LangGraph生产治理（LCEL/防循环/Checkpoint）\n\n主问题：LangGraph 在生产里怎么做“可控、可恢复、可治理”？\n\n口述答案：\nLangGraph 的核心价值是把复杂 Agent 流程变成显式状态机。落地上我会做四件事：第一，流程组件化（LCEL）便于替换与复用；第二，图层硬约束（终止条件、步数上限、超时）防死循环；第三，Checkpoint + 幂等键保证中断恢复不产生重复副作用；第四，节点级观测定位故障来源。这样系统既能迭代快，也能在事故时快速止损。\n\n常见追问：\n\n1. 出现死循环第一步怎么止血？\n2. Checkpoint 恢复后如何避免重复下单/重复发消息？\n3. 如何区分编排问题、工具问题、Prompt问题？\n\n### 2. 子问题：你怎么做 LangChain 的可组合编排（LCEL）？\n\n答：\n我会把 Prompt、模型、解析器、检索器都抽成 Runnable，通过 LCEL 组合成可复用链路，并把输入输出标准化。这样便于做链路替换和 A/B 对比，也能把失败点定位到具体节点，而不是整条链“黑盒失败”。\n\n追问：LCEL 和手写 if/else 调用代码相比，工程收益在哪？\n\n核心收益是把 LLM 流程从‘过程代码’变成‘可组合的数据流组件’，在可维护性和可运营性上明显更好。\n\n具体工程收益有 7 点：\n\n1. **统一抽象**：Prompt/Model/Retriever/Parser 都是 Runnable，可插拔替换。\n2. **可组合复用**：链路像搭积木，公共子链可复用，避免复制粘贴。\n3. **可观测性更好**：节点级 trace、耗时、token、错误定位更清晰。\n4. **内建运行能力**：天然支持 streaming、batch、并行、重试、fallback。\n5. **测试更容易**：每个节点可单测/Mock，回归粒度比整段 if/else 更细。\n6. **变更成本更低**：换模型、换检索器、加校验器通常只改局部节点。\n7. **团队协作更稳**：流程结构显式，便于 code review 和规范治理。\n\n### 3. 子问题：LangGraph 如何防循环、防失控？\n\n答：\n\n在图层面加条件边与终止条件，并配置最大步数、最大重试次数、超时和置信度阈值。\n\n对高风险节点加人工审批或兜底节点，不允许无条件回环。\n\n核心是把“结束条件”设计成硬约束，而不是靠模型自觉停机。\n\n追问：线上出现死循环时，你第一步怎么止损？\n\n第一步我会先做**流量止血**：立刻关闭该 LangGraph 工作流入口（feature flag/路由开关），把请求切到降级路径（单轮回答或人工兜底），**先阻止新循环继续产生**。\n\n然后才做两件事：\n\n1. 批量中断在跑实例（按 run_id/thread_id 取消，必要时清理队列）。\n2. 临时加硬阈值（max_steps/recursion_limit/timeout）再恢复小流量。\n\n### 4. 子问题：LangGraph 的 Checkpoint 有什么价值？\n\n答：\n\nCheckpoint 解决的是可恢复性。长任务中断后可以从最近状态恢复，不必整条链重跑；也便于做审计回放和故障复盘。\n\n生产里我会把 checkpoint 和任务 ID 绑定，确保每次恢复都有可追踪上下文，支持幂等重放。\n\n追问：Checkpoint 恢复后如何避免重复副作用（比如重复下单/重复发消息）？\n\n**Checkpoint 只保证“从哪继续”，幂等设计才保证“不重复副作用”**。\n\n## 4. 补充问：Agent 调 MCP 的逻辑\n\n### 1. 子问题：agent如何实现调用mcp的逻辑，有几个阶段，每个阶段分别做了什么，分别和ai交流了哪些内容\n\n**口述答案（约300字）**：\n我一般拆成四个阶段。第一阶段是工具发现：通过MCP拿到可用工具清单和schema，告诉模型“有哪些能力可选”。第二阶段是工具决策：模型根据当前任务状态输出调用意图，包含工具名、参数和预期结果。第三阶段是执行与回填：运行工具，拿到结果或错误码，把结果标准化写回状态。第四阶段是结果吸收：模型读取工具结果，决定继续调用、改计划还是结束。和AI交流的内容分别是：工具目录、调用规范、执行结果和下一步策略。工程上我会补三点：参数校验、防越权和幂等。参数校验防止模型传错字段；防越权通过白名单和权限上下文控制；幂等保证重试不产生重复副作用。这样MCP不是“能调工具”，而是“可控、可审计、可恢复”地调工具。\n**来源**：公开社区资料\n\n## 5. 补充问：MCP 解决什么问题\n\n### 1. 子问题：如何理解mcp的，他主要解决什么问题，他这个协议的发展现状有什么问题吗，哪些地方可以优化呢\n\n**口述答案（约300字）**：\n我对MCP的理解是“模型与外部工具之间的标准化协议层”。它解决的核心问题是：不同模型、不同框架、不同工具之间的接入成本高、格式不统一、可移植性差。用MCP后，工具对外暴露统一描述和调用方式，模型侧可以按同一协议发现和调用。现状上我认为优点是生态在增长、接入门槛在下降；不足主要有三点：第一，工具描述质量参差不齐，schema不规范时模型调用成功率会下降；第二，安全与权限治理在复杂场景下还不够细；第三，跨语言、跨环境的调试和观测链路还不统一。优化方向我会放在：工具规范治理（版本化+契约测试）、权限与审计（最小权限+操作留痕）、以及观测体系（调用成功率、延迟、错误分类统一上报）。这样MCP才能从“协议可用”升级到“生产可用”。\n**来源**：公开社区资料\n\n## 6. 补充问：MCP API 与普通大模型 API 的差别\n\n### 1. 子问题：mcp的api和普通大模型的api有什么区别呢\n\n**口述答案（约300字）**：\n普通大模型API本质是“输入文本，输出文本”；MCP API是“输入任务上下文，输出可执行工具行为”。区别可以从三点说。第一，交互对象不同：普通API主要和模型交互，MCP还要和工具生态交互。第二，数据结构不同：普通API重点是prompt和response，MCP强调工具schema、参数校验、执行结果和错误码。第三，工程目标不同：普通API追求回答质量，MCP追求“可执行性+可治理性”。在面试里我会补一句：两者不是替代关系，而是组合关系。常见模式是模型负责决策，MCP负责执行和回填。这样可以把模型能力延伸到真实系统，同时保持安全边界和审计能力。落地时建议把工具调用封成统一执行器，避免业务代码里散落调用逻辑。\n**来源**：公开社区资料\n\n## 7. 补充问：SSE 原理与作用\n\n### 1. 子问题：sse是什么呢，如何实现的呢，在调用过程中他具体做了什么\n\n**口述答案（约300字）**：\nSSE是服务端向客户端单向持续推送事件的机制，适合流式文本生成。实现上通常是HTTP长连接，响应头设置`text/event-stream`，服务端按事件帧持续写入，客户端边接收边渲染。调用过程中它做了三件事：第一，降低首字等待时间，用户能先看到部分结果；第二，支持过程可视化，比如当前节点、工具调用中、重试中；第三，便于中断和恢复，前端断开后可按会话状态继续。工程上注意三点：心跳保活、防代理超时、事件幂等。心跳避免连接被中间层回收；幂等避免重连后重复展示或重复落库。我在Agent项目里会把SSE事件分类型，比如`token`、`tool_start`、`tool_end`、`final`，这样前端能更精确地展示过程而不是只拼文本。\n**来源**：公开社区资料\n\n## 8. 补充问：如何把普通 API MCP 化\n\n### 1. 子问题：一个普通的api，如何把他mcp化\n\n**口述答案（约300字）**：\n把普通API做成MCP，我会按“包装、约束、观测”三步走。第一步包装：把原API能力抽象成工具，定义清晰的输入输出schema，包括必填项、类型、枚举和错误码。第二步约束：加权限控制、参数校验和幂等键，明确哪些场景可调用、谁可调用、失败如何处理。第三步观测：接入日志和指标，至少要能看调用成功率、P95时延、错误分布和重试次数。然后把工具描述注册到MCP Server，模型就能发现并调用。上线前我会做两类测试：契约测试保证schema不破，回放测试保证关键case稳定。这样“mcp化”不只是加一层协议，而是把接口变成可被模型稳定消费的标准能力。\n**来源**：公开社区资料\n\n## 9. 补充问：为什么选 Spring AI\n\n### 1. 子问题：为什么选择 Spring AI 框架？\n\n**口述答案（约300字）**：\n我选择Spring AI主要是基于团队技术栈和工程效率。第一，它和Spring生态天然兼容，依赖注入、配置管理、监控链路都能复用，接入成本低。第二，它对模型调用、Prompt模板、向量存储、工具调用有统一抽象，能减少重复造轮子。第三，对Java后端团队友好，便于把AI能力和原有业务服务做一体化部署与治理。它不是唯一选择，LangChain/LangGraph在Agent编排上生态更活跃；但在我们场景里，Spring AI让“后端工程规范+AI能力”结合更顺滑。我的选型原则是：先看团队熟练度和交付周期，再看框架能力边界，必要时允许混合方案而不是框架宗教。\n**来源**：公开社区资料\n\n## 10. 补充问：多模型支持架构如何设计\n\n### 1. 子问题：如何设计多模型支持架构？\n\n**口述答案（约300字）**：\n多模型架构我会做“统一网关+策略路由+观测闭环”。统一网关负责标准化请求与响应，屏蔽不同模型SDK差异；策略路由按任务类型、时延预算、成本上限和稳定性动态选择模型；观测闭环记录每次调用的质量、耗时和成本，反哺路由策略。实现上我会抽象`ModelProvider`接口，统一超时、重试、熔断和降级，支持主备模型切换。对高风险任务可配置“双模型交叉校验”或“主模型失败后回退模板回复”。面试里我会补一句：多模型不是越多越好，关键是“可灰度、可监控、可回滚”，否则只是把复杂度前移。\n**来源**：公开社区资料\n\n## 11. 补充问：MCP 的现状和优化方向\n\n### 38.如何理解mcp的，他主要解决什么问题，他这个协议的发展现状有什么问题吗，哪些地方可以优化呢\n\n我对MCP的理解是“模型与外部工具之间的标准化协议层”。它解决的核心问题是：不同模型、不同框架、不同工具之间的接入成本高、格式不统一、可移植性差。用MCP后，工具对外暴露统一描述和调用方式，模型侧可以按同一协议发现和调用.\n\n## 12. 补充问：MCP、Skill 和 RAG 的关系\n\nSkill 更像“方法论”或者“流程模板”, 更适合封装重复性流程和团队经验，它定义的是模型遇到某类任务时应该按什么步骤做；  \nRAG 解决的是“知识从哪里来”的问题，它把当前任务真正相关、而且可能实时变化的外部信息检索出来，再喂给模型。  \n所以 Skill 是能力封装，RAG 是知识供给，两者通常是配合关系，不是替代关系。  \n甚至很多时候，一个 Skill 内部就会规定：先检索、再筛选、再生成、再校验。这里面的“检索”本身往往就是 RAG。\n\n## 13. 补充问：Claude Code 的 Subagent 模式和 Agent Team 的模式有什么区别\n\nSubagent: 一般比较会处理一些比较轻量级的，短周期的一些事务。比如说开发某一个用户模块的某一个登录的功能，然后把这几个功能拆分为方案设计、前端开发、后台开发和测试这么几个子的任务。然后由一个主的 Agent 来负责分任务，并且去和各个 Sub Agent 之间进行通信。然后当这个任务整个开发执行完之后，这个 Subagent 就会被回收，它的周期是比较短的。\n\nAgent Team: 就会负责一个比较大的任务，也适合整个上下游、多团队多角色的并行协作。Agent team 之间会共享一些状态、记忆和任务看板，协作起来有团队级的路由、评审、投票之类的一些机制。好像我们现实工作中开发一个大项目，比如说涉及到多个链路模块，涉及到用户模块、活动模块、通知模块等，就更像多个团队协作。\n\n## 14. 补充问：什么是 Harness Engineering\n\n\"Harness\" 直译是马具，中文可以叫：驾驭工程。它的核心思想是：系统性地设计约束、反馈链路和持续改进机制，使 AI Agent 能够在大规模、长周期的软件开发中可靠运行。它包含系统提示词、工具、文件系统、沙箱、编排逻辑和检查机制，本质上回答三个问题：AI 在哪干活？用什么干活？怎么知道干得对不对？\n\nOpenAI 的思路是搭好工作台。  \n用精简的目录文件加结构化文档体系和工具信息，让 AI 在需要时找到对应信息（渐进式披露）。再给 AI 配备完整的工具链和可观测性堆栈——日志、指标、UI 界面全部暴露给 AI，让它能看到代码运行的真实状态，并重写了 Linter 错误信息，使其面向 AI 而非人类。\n\nHarness Engineering 的本质是把你的工作方法和判断标准，转化为 AI 能理解和执行的环境。每当 AI 出错，应该反问“我的环境里缺了什么”——这是工程师角色从“写代码”转向“设计环境/标准、建立反馈”的根本转变。\n\n## 15. 补充问：Claude Code 架构设计的启发\n\n第一课：agent 的工程特别重要，不光光全是模型的能力，工程设计也很重要。Claude Code 的源码里，真正调用 LLM API 的部分不到 5%，剩下那 95% 是安全检查、权限管理、上下文压缩、错误恢复、多 Agent 协调。\n\n第二课：提示词分层管理。它把提示词拆成静态层和动态层，静态部分走缓存节省费用，动态部分每次注入实时环境信息；每个工具还配一份专门给 AI 看的“使用手册”。\n\n第三课：安全的重视。默认所有工具状态是“不安全的、会写入的”，除非开发者明确声明它是安全的，否则系统就按最保守的方式处理。\n\n第四课：上下文管理是 Agent 的生命线，必须主动设计。上下文窗口不是一个开关，而是一套策略，要区分哪些内容可以丢、哪些必须保留。\n\n第五课：记忆系统要“精确”，不要“贪多”。宁可漏掉一条可能有用的记忆，也不把不相关的记忆塞进上下文污染模型判断。\n\n第六课：多 Agent 协作要给每个 Agent 明确的“身份”。协调者就只协调，执行者就只执行，职责边界必须在设计阶段写死。","title":"08_框架协议与工程化核心问答"},"01_AI/09_追加补充/01_核心问答.md":{"md":"\n\n## 1. mcp, skill 和 rag 解释下?\n\nSkill 更像“方法论”或者“流程模板”, 更适合封装重复性流程和团队经验，它定义的是模型遇到某类任务时应该按什么步骤做；\nRAG 解决的是“知识从哪里来”的问题，它把当前任务真正相关、而且可能实时变化的外部信息检索出来，再喂给模型。\n所以 Skill 是 能力封装，RAG 是 知识供给，两者通常是配合关系，不是替代关系。\n甚至很多时候，一个 Skill 内部就会规定：先检索、再筛选、再生成、再校验。这里面的“检索”本身往往就是 RAG。\n\n## 2. Claude Code 的 Subagent 模式和 Agent Team 的模式有什么区别呢？\n\nSubagent: 一般比较会处理一些比较轻量级的，短周期的一些事务。比如说开发某一个用户模块的某一个登录的功能，然后呢把开发这一个功能的时候。把这几个功能拆分为，方案设计、前端开发、后台开发和测试这么几个子的任务。然后由一个主的 Agent 来负责，就是分任务和，并且去和各个 Sub Agent 之间进行通信。然后当这个任务整个开发进行执行完之后，这个 Subway 真的就会被回收，它的周期是比较短的。\n\nAgent Team: 就会负责一个比较大的任务，然后也适适合就是整个上下游，多团队多角色的并行的一个协作。agent的 team 之间呢，他们是是一些共享一些状态和记忆和任务看板的。咱们协作起来有团队的路由、评审、之类投票之类的一些机制。好像我们现实工作中开发一个大项目，比如说涉及到多个链路模块，涉及到用户模块，活动模块，然后通知模块等涉及到多个团队的并行，就是像多个团队这样协作的沟通。\n\n\n\n## 3. 什么是 Harness Engineering？​\n\n\"Harness\"直译是马具, 中文可以叫:驾驭工程, 它的核心思想是：系统性地设计约束、反馈链路和持续改进机制，使 AI Agent 能够在大规模、长周期的软件开发中可靠运行。它包含系统提示词、工具、文件系统、沙箱、编排逻辑和检查机制，本质上回答三个问题：AI 在哪干活？用什么干活？怎么知道干得对不对？\n\nOpenAI 的思路是搭好工作台。  \n用精简的目录文件加结构化文档体系 和工具信息，让 AI 在需要时找到对应信息 (渐进式披露)。再给 AI 配备了完整的工具链和可观测性堆栈——日志、指标、UI 界面全部暴露给 AI，让它能看到代码运行的真实状态，并重写了 Linter(静态代码检查工具) 错误信息，使其面向 AI 而非人类, 使得AI 可以根据反馈进行持续的改进。\n\n我自己实践下来就是，除了有一个开发的一个 Agent ，还会一定要并行起一个测试的 Agent 。把反馈链路给打通, 让这个测试 Agent 它能够读到所有的那个调用的工具链的一个可观测性的日志，然后呢并且让这个测试 Agent 它能够端到端的，就是去去模仿人在浏览器上去进行每个 功能的一个验证。然后呢自己去收集报多信息，然后给到开发去来进行修正。\n\n使其面向 AI 而非人类:\nOpenAI 重写 Linter 错误信息的目标，不是单纯的说哪里错了, 是让每一条报错都包含 AI 做决策所需的完整信息，大致包括：\n规则的意图：这条规则存在是为了防止什么问题？\n具体的修复方向：不是\"你错了\"，而是\"你应该这样改\"。\n上下文约束：比如项目的架构规则要求依赖方向是单向的，违反时要说清楚是哪条链路出了问题。\n\nHarness Engineering 的本质是把你的工作方法和判断标准，转化为 AI 能理解和执行的环境。每当 AI 出错，应该反问\"我的环境里缺了什么\"——这是工程师角色从\"写代码\"转向\"设计环境/标准、建立反馈\"的根本转变。\n\n## 4. claude code源码泄漏,cc的架构设计的启发\n\n从 Claude Code 这次源码意外曝光里，作为 Agent 开发者，我们到底能学到什么？\n\n---\n\n### **第一课：agent的工程特别重要，不不光光全是模型的能力，工程设计也很重要。**\n\nClaude Code 的源码——51万行代码里，真正调用 LLM API 的部分不到 5%。剩下那 95% 是什么？是安全检查、权限管理、上下文压缩、错误恢复、多 Agent 协调。\n\n换句话说，模型只是发动机，你造的是整辆车。发动机再好，没有底盘、没有刹车、没有方向盘，车照样跑不起来。\n\n---\n\n### **第二课：提示词分层管理**\n\nClaude Code 的做法完全不同：它把提示词拆成静态层和动态层，静态部分走缓存节省费用，动态部分每次注入实时环境信息；每个工具还配一份专门给 AI 看的\"使用手册\"，明确告诉模型这个工具能干什么、绝对不能干什么。\n\n---\n\n### **第三课：安全的重视**\n\nClaude Code 为了让一个 BashTool 能安全运行，写了 18 个安全相关文件，设计了 9 层审查流程。他们默认所有工具状态是\"不安全的、会写入的\"，除非开发者明确声明它是安全的，否则系统就按最保守的方式处理。\n\n对我们来说，**在设计工具权限的时候，默认收紧，按需放开，而不是默认放开，出事再收**。尤其是涉及文件读写、网络请求、数据库操作这类有副作用的工具，一定要在设计阶段就想清楚边界在哪里。\n\n---\n\n### **第四课：上下文管理是 Agent 的生命线，必须主动设计**\n\n上下文窗口 三层递进压缩：先只清理旧的工具调用结果（对话主线保留），再在 token 用量接近 87% 时自动触发压缩，最后实在不行了才让 AI 生成全局摘要替换历史。\n\n这个思路对我们很有参考价值：**上下文管理不是一个开关，而是一套策略**。你需要分清楚哪些内容是\"可以丢的\"（比如中间过程的工具返回结果），哪些是\"必须保留的\"（比如用户的核心指令和对话主线），然后按优先级来处理。\n\n---\n\n### **第五课：记忆系统要\"精确\"，不要\"贪多\"**\n\nClaude Code 的记忆检索策略有一句核心原则：精确度优先于召回率。意思是，宁可漏掉一条可能有用的记忆，也不把不相关的记忆塞进上下文污染模型的判断。\n\n我们通常觉得\"多给点信息总没错\"。但对 LLM 来说，无关信息不是中性的，它会干扰模型的注意力，让输出质量下降。所以在设计记忆系统时，与其堆砌所有历史，不如想清楚：**这条记忆对当前任务真的有帮助吗？** 如果不确定，就不要注入。\n\n---\n\n### **第六课：多 Agent 协作要给每个 Agent 明确的\"身份\"**\n\nClaude Code 在生成子 Agent 时，会往它的上下文里注入一段非常强硬的指令：你是一个工人，不是经理，不许再派活给别人，直接干，汇报结果不超过500字。防止这个子agent再无限生成它的子agent。\n\n对我们的启示是：**在多 Agent 架构里，每个 Agent 的职责边界必须在设计阶段就写死，而不是靠它自己\"聪明地\"判断**。协调者就只协调，执行者就只执行.\n\n---\n\n围绕它的安全机制、上下文管理、记忆系统、多 Agent 协调、提示词工程——这些\"配套设施\"才是决定产品能不能真正好用的关键。Claude Code 用 51 万行代码告诉了我们这个答案，而我们不需要重走一遍，直接拿来用就好。","title":"01_核心问答"},"01_AI/README.md":{"md":"# 01_AI\n\n## 主题索引\n\n- [01_Agent基础](01_Agent基础/01_核心问答.md)\n- [02_Workflow与多Agent](02_Workflow与多Agent/01_核心问答.md)\n- [03_RAG](03_RAG/01_核心问答.md)\n- [04_上下文工程与记忆](04_上下文工程与记忆/01_核心问答.md)\n- [05_模型调优与微调](05_模型调优与微调/01_核心问答.md)\n- [06_评测与监控](06_评测与监控/01_核心问答.md)\n- [07_安全与风控](07_安全与风控/01_核心问答.md)\n- [08_框架协议与工程化](08_框架协议与工程化/01_核心问答.md)\n- [09_追加补充](09_追加补充/01_核心问答.md)\n\n## 说明\n\n1. 当前 AI 板块已经完成第一版迁移。\n2. 内容主要来自 AI 主题资料、公开面经与个人整理。\n3. 后续如果某个主题仍然过长，再在主题内部细分，不新增多份“高频题/口述版/追问”并列文件。\n","title":"01_AI"},"02_后端/01_MySQL/01_核心问答.md":{"md":"# MySQL核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. MySQL 核心索引、事务与调优问题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## MySQL（8）\n\n### 1. 为什么 OLTP（联机事务处理） 常用 B+Tree 而不是 Hash？\n\n场景:\n`OLTP`（联机交易）典型查询不只是 `=`，还有很多：\n\n1. 范围查询：`create_time between ...`\n2. 排序分页：`order by id limit ...`\n3. 联合索引前缀查询：`where a=? and b>?`\n\n能力/特性:\n`B+Tree` 为什么更适合：\n\n1. **支持范围和排序**：叶子节点有序且链表相连，范围扫和顺序读很高效。\n2. **支持最左前缀**：联合索引可以服务多种查询形态，复用性高。\n3. **磁盘友好**：一个页能放很多 key（扇出高），树高通常 2-4 层，I/O 次数稳定。\n4. **覆盖广**：同一套索引既能做点查，也能做范围、排序、分页。\n\n`Hash` 为什么不常作为主索引：\n\n1. 只擅长等值查找，不支持范围和排序。\n2. 无法利用最左前缀做联合条件优化。\n3. 查询能力单一，不匹配 OLTP 复杂多样的 SQL 形态。\n\n一句话总结：  \n“OLTP 要的是‘一套索引覆盖多种查询’，B+Tree 既支持等值也支持范围/排序，且 I/O 稳定；Hash 虽然点查快，但能力太窄，所以一般不作为主流索引结构。”\n\n---\n\n### 2. OLAP, HTAP, OLTP; 现在生产场景业内都用哪些比较有代表性的数据库呀？这些都简单介绍一下吧。\n\n**1) OLTP（事务型）常见数据库**\n\n1. `MySQL`：最主流，生态成熟，互联网业务默认选型。\n2. `PostgreSQL`：功能强（SQL能力、扩展性好），复杂业务很常见。\n3. `TiDB`：MySQL 协议 + 分布式扩展，适合大规模在线事务。\n4. `OceanBase`：金融/运营商等高要求场景较多。\n5. `SQL Server / Oracle`：传统企业核心系统仍大量使用。\n\n**2) OLAP（分析型）常见数据库/数仓**\n\n1. `ClickHouse`：高并发实时报表、日志分析非常常见。\n2. `Doris`：实时分析+明细查询，一体化体验好。\n3. `StarRocks`：面向实时分析和湖仓查询，近年增长快。\n4. `Trino/Presto`：联邦查询引擎，常做多源分析。\n5. `Snowflake / BigQuery / Redshift`：云上数仓代表。\n\n**3) HTAP（混合事务分析）代表**\n\n1. `TiDB`：TP+AP 一体（行列混合能力）。\n2. `OceanBase`：也在强化 HTAP 能力。\n3. `SingleStore`：海外常见 HTAP 选型。\n4. `PostgreSQL + 扩展方案`：部分公司通过扩展和架构组合实现“准 HTAP”。\n\n**怎么区分选型（面试可说）**\n\n1. 交易核心链路：优先 `OLTP`（一致性和延迟优先）。\n2. 经营分析/报表：优先 `OLAP`（扫描和聚合性能优先）。\n3. 既要实时写又要近实时分析：考虑 `HTAP`，但要评估成本和复杂度。\n\n一句话总结：  \n`OLTP` 负责“稳交易”，`OLAP` 负责“快分析”，`HTAP` 负责“同库兼顾，但架构和治理更复杂”。\n\n---\n\n### 3. MySQL和PostgreSQL异同\n\n**1. 定位差异**\n\n1. `MySQL`：工程化和生态非常成熟，互联网 OLTP 默认选型，团队上手快。\n2. `PostgreSQL`：功能更“全能型”，SQL 标准支持更强，适合复杂数据模型和复杂查询。\n\n**2. 关键技术差异**\n\n1. SQL/特性：\n\nMySQL 常用能力够用；PostgreSQL 在高级 SQL、窗口分析、复杂约束、函数能力上通常更强。  \n2. 数据类型：  \nPostgreSQL 对 `JSONB`、数组、范围类型、地理空间（PostGIS）支持很强。  \n3. 索引能力：  \nMySQL 以 B+Tree 为主；PostgreSQL 有更丰富索引体系（GIN/GiST/BRIN/表达式索引/部分索引）。  \n4. 事务并发：  \n两者都支持 MVCC。MySQL（InnoDB）在典型事务场景成熟稳定；PostgreSQL 在复杂并发和复杂查询下可玩性更高。  \n5. 扩展生态：  \nMySQL 生态偏“业务系统工程化”；PostgreSQL 扩展能力强（如 PostGIS、Timescale）。\n\n**场景怎么选**\n\n1. 选 `MySQL`：\n\n高并发交易、常规 CRUD、团队经验主要在 MySQL、希望快速稳定落地。  \n2. 选 `PostgreSQL`：  \n复杂报表/复杂 SQL、地理空间、半结构化数据、需要更强约束和扩展能力。  \n3. 大厂常见做法：  \n核心交易链路 MySQL，某些分析/地理/复杂建模模块用 PostgreSQL（按场景拆分）。\n\n**4. 面试可直接说的一句话**\n如果是标准互联网交易系统我优先 MySQL；如果是地理空间、复杂 SQL、JSON 深度检索这类需求，我会选 PostgreSQL。核心是按业务复杂度和团队成本做取舍。\n\n\n\n\n---\n\n### 4. 什么是最左匹配原则？\n\n联合索引按定义顺序生效，查询必须从最左列开始连续命中，优化器才能走索引。中间断开或跳列时，后续列通常无法用于索引过滤，只能回表或扫描更多数据。\n\n### 5. InnoDB 的 RR 如何避免幻读？\n\nRC（Read Committed）：每条 SELECT 都拿一个新的快照（statement 级 Read View）。\nRR（Repeatable Read）：事务第一次快照读后，后续快照读复用同一个快照（transaction 级 Read View）。\n大多数 MySQL 线上默认 RR（InnoDB 默认），读一致性更强。\n如果业务更追求并发、能接受读到“更新后已提交新值”，可考虑 RC。\n关键交易链路常配合当前读（for update）确保强一致更新。\n\n**先定义幻读**\n\n- 同一个事务里，按同一条件查两次，第二次“多/少了行”（通常是别的事务插入了新行）。\n\n**InnoDB 在 RR 下怎么避免幻读：分两种读法**\n\n1. **快照读（普通 `select`）**\n\n- 依赖 `MVCC + Read View`。  \n- RR 下第一次快照读会固定一个一致性视图，后续同事务再查还是这个视图。  \n- 所以你“看起来”不会出现幻读。\n\n1. **当前读（`select ... for update` / `lock in share mode` / `update` / `delete`）**\n\n- 依赖锁，不是纯 MVCC。  \n- 用 **next-key lock = 记录锁(record lock) + 间隙锁(gap lock)** 锁住索引区间。  \n- 这样其他事务不能往这个区间插入新行，从源头防止幻读。\n\n---\n\n**具体例子（最常考）**\n\n- 条件：`age between 20 and 30`，且 `age` 有索引。  \n- 事务A（RR）：`select * from t where age between 20 and 30 for update;`  \n  - A 会对这个范围加 next-key 锁。\n- 事务B：`insert into t(age,...) values(25,...)`  \n  - 会被阻塞，直到 A 提交。\n- 所以 A 在事务内再查这个范围，不会突然多出新行。\n\n---\n\n**面试 30 秒口述版**\n“RC 是语句级快照，每次读最新已提交，所以可能不可重复读；RR 是事务级快照，同事务快照读结果可重复. RR 防幻读分两层：普通 `select` 走 MVCC 的一致性视图，事务内重复读结果稳定；`for update` 这类当前读走 next-key lock（记录锁+间隙锁）锁住索引区间，阻止其他事务在区间插入，从而真正避免幻读。”\n\n### 6. 索引越多越好吗？\n\n不是。索引能提速读，但会增加写入成本（插入/更新要维护多棵索引树），还会占用更多内存和磁盘。索引过多还会增加优化器决策复杂度，可能出现“有索引反而慢”。\n\n### 7. 覆盖索引和回表区别？\n\nInnoDB 结构记住：\n1.主键索引（聚簇索引）叶子节点存“整行数据”\n2.二级索引叶子节点存“索引列 + 主键值”，不存整行\n覆盖索引是查询字段都在二级索引里，直接从索引页返回结果，不需要再查主键。回表是先走二级索引拿主键，再去聚簇索引取完整行，I/O 次数和延迟都更高。\n\n### 8. `ACID` 是事务最核心的 4 个特性：\n\n原子性(Atomic):\n\n- 事务包含的所有操作要么全部执行,要么全部不执行.\n\n一致性(Consistency):\n\n- 事务应确保数据库状态从一个一致的状态转变为另外一个一致的状态, 比如A和B无论怎么转账,两者的金额之和不变.\n\n隔离性(Isolation):\n\n- 多个事务并行执行时,一个事务的执行不能影响其他事务的执行.\n\n持久性(Durability):\n\n- 一个事务一旦提交它对数据库的修改应该永久性的保存在数据库中,即当数据库发生故障时,确保已经提交的事务不能丢失.\n\n### 9. 深分页怎么优化？\n\n`limit offset` 很大时，MySQL 需要先扫描并丢弃前面大量记录，成本线性增长。常用优化是基于有序索引做游标分页（`where id > last_id`），或“先查主键再回表”的延迟关联方案。\n\n### 10. 行锁与表锁影响？\n\n行锁粒度细、并发高，适合 OLTP；表锁粒度粗，实现简单但会显著降低并发吞吐。实际排障里要重点看是否因为索引失效导致“行锁退化为大量行冲突”。\n\n### 11. 慢 SQL 调优步骤？\n\n先用慢日志和监控定位 Top SQL，再用 EXPLAIN 看是否全表扫、是否 filesort/temporary、扫描行数是否过大。优化时按改 SQL、补索引、控返回行数三个方向推进，最后做压测和灰度回归，确保指标真实改善且不回退。\n\n### 12. MySQL的分库分表、读写分离\n\n**核心区别**\n1. `分库分表`：解决“单机存储/写入瓶颈”。  \n2. `读写分离`：解决“读取压力过大”。  \n3. 通常先做读写分离，再做分库分表。\n\n**分库分表**\n1. 垂直拆分：按业务域拆库（用户库、订单库）。  \n2. 水平拆分：同一表按分片键拆（如 `user_id % 64`）。  \n3. 关键点：分片键选得好不好决定热点和扩容难度。  \n4. 常见问题：跨分片 `join/count/page`、分布式事务、全局ID。  \n5. 工程做法：业务层聚合/冗余字段/汇总表，ID用雪花或号段。  \n6. 扩容迁移：双写 -> 回填 -> 校验 -> 灰度切流 -> 下线旧分片。\n\n**读写分离**\n1. 架构：主库写、从库读（通过中间件/代理路由）。  \n2. 风险：主从延迟导致“刚写就读不到”。  \n3. 兜底：写后短时间强制读主、延迟监控、超阈值切主读。  \n4. 还要做：从库负载均衡、故障自动切换、GTID/复制健康检查。\n\n\n\n\n<a id=\"toc-redis\"><\/a>\n\n## 13. 补充原文：MySQL 深分页\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n#### 2.6.1 MySQL深分页\n\nMySQL 的深分页：\n- 执行流程：\n  1. 通过普通二级索引树 `idx_update_time`，过滤 `update_time` 条件，找到满足条件的记录 ID。\n  2. 通过 ID，回到主键索引树，找到满足记录的行，然后取出展示的列（回表）。\n  3. 扫描满足条件的 `100010` 行，然后扔掉前 `100000` 行，返回结果。\n- 变慢原因：\n  - `limit` 语句会先扫描 `offset + n` 行，然后再丢弃掉前 `offset` 行，返回后 `n` 行数据。也就是说 `limit 100000,10` 会扫描 `100010` 行，而 `limit 0,10` 只扫描 `10` 行。\n  - `limit 100000,10` 扫描更多的行数，也意味着回表更多的次数。\n- 解法：\n  - 通过子查询优化，先根据 `update_time` 条件找到主键 ID，同时把 `limit 100000` 也转移到子查询中，然后再根据主键 ID 回表查具体字段。\n  - 示例：`select id,name,balance from account where id >= (select a.id from account a where a.update_time >= '2020-09-19' limit 100000, 1) limit 10;`\n\n## 补充原文：高并发下数据库连接池优化\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 高并发场景下的数据库连接池应该如何优化\n\n1. **maxWait**\n- 表示从连接池获取连接时最多等待多久。\n- 如果默认无限等待，高并发下连接池一旦耗尽，大量请求会长期卡死在线程里，最后把应用线程池也拖死，服务呈现“假死”。\n- 实践上通常会设置一个有限等待时间，而不是无限等。\n\n2. **connectionTimeout 和 socketTimeout**\n- `connectionTimeout`：建立 TCP 连接的超时时间；\n- `socketTimeout`：发出请求后等待数据库响应的超时时间。\n- 高并发场景下如果网络异常，这两个超时不配好，连接可能长期僵死，占着池子不释放，最终拖垮整个服务。\n\n3. **maxActive / 最大连接数**\n- 最大连接数不是越大越好。\n- 如果连接数开得过大，数据库 CPU、上下文切换和锁竞争反而会更严重，整体吞吐可能下降。\n- 工程上通常按数据库承载能力、SQL RT 和并发模型来压测后设定，不会无脑拉满。\n\n面试里可以一句话总结：\n**连接池调优不是“多给连接”，而是“限制等待、设置超时、控制上限”，避免应用线程和数据库一起被拖死。**\n","title":"MySQL核心问答"},"02_后端/02_Redis/01_核心问答.md":{"md":"# Redis核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. Redis 数据结构、集群与常见治理问题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## Redis（8）\n\n### 1. Redis 为什么快？\n\n核心原因是基于内存、单线程事件循环减少锁竞争、并使用高效数据结构（哈希表、跳表、压缩结构）。再叠加 I/O 多路复用和合理 pipeline，单机可实现很高吞吐和低延迟。\n\n### 2. redis中的数据类型, 用于计数的HyperLogLog , 用于支持存储地理位置信息的Geo.\n\n1. `HyperLogLog`（去重计数）\n\n- 作用：做“基数统计”，比如 UV、独立设备数，结果是近似值。\n- 优势：内存非常省（每个 key 大约固定 12KB），适合海量去重计数。\n- 代价：有误差（标准误差约 `0.81%`），不能拿来做精确计费。\n- 常用命令：`PFADD`、`PFCOUNT`、`PFMERGE`。\n\n1. `Geo`（地理位置）\n\n- 作用：存经纬度并做“附近的人/店/骑手”查询。\n- 底层：基于 `Sorted Set` + `GeoHash` 编码。\n- 常用命令：`GEOADD`、`GEODIST`、`GEOSEARCH`（新版推荐）。\n- 场景：外卖附近商家、打车最近司机、门店距离排序。\n\n面试一句话：\n`HyperLogLog` 解决“海量去重计数省内存”，`Geo` 解决“经纬度存储和附近检索”。前者重统计，后者重空间查询。\n\n### 3. 从海量key里查出某一固定前缀的key\n\n1.低频排查/运维场景\n用 SCAN，不要用 KEYS。海量 key 会卡 Redis 主线程。\n正确方式：\nSCAN 0 MATCH prefix:* COUNT 1000\n特点：非阻塞、渐进遍历，但结果不是强一致快照，可能有重复/漏读（业务要容忍）。\n\n2.高频业务查询场景\n给key前缀单独建立set/zset建二级索引,写入业务 key 时，同时写二级索引集合. 查询时走 Set/ZSet，不扫全库；再配合 Lua 原子更新、脏索引清理，在海量 key 下稳定运行\n\n### 4. redis的哨兵机制\n\n解决主从模式master宕机后服务不可用的问题, 是一个独立的进程,监控多个master-slave集群,通过多哨兵投票确认故障并自动选主切换，保证服务在主节点故障后可恢复.\n高可用用 Sentinel；要横向扩容/分片用 Redis Cluster;\n\n### 5. Redis Cluster是什么\n\nRedis Cluster 是 Redis 官方的分布式方案，核心目标是同时解决横向扩容和高可用, 更适合大数据量和高并发场景. 将不同的key通过某个规则分散存储在多个redis节点上,即数据分片.redis-client采用无中心结构,每个节点都和其他节点连接,采用Gossip协议传播信息和发现新的节点.\n\n如何将不同的key均匀放在不同的redis集群节点? \n一致性哈希算法: 对2^32取模,将哈希值空间组成虚拟的圆环.按顺时针组织,选用服务的ip或者主机名作为关键字,来进行hash,来确定每台服务器在hash环上的位置, key 顺时针找到第一个节点作为归属, 新增或下线一个节点时，只影响它相邻区间的数据，迁移量显著降低. \n哈希环的数据倾斜问题:在节点很少时会因为节点分布不均匀而造成大量数据集中缓存到某一台服务器上, 为每台服务器计算虚拟节点,均匀分布到环上,多了一步虚拟节点到实体节点的映射,数据定位算法不变.这样相对较少的数据节点也能实现数据的均匀分布.实际应用中将虚拟节点设置为32.\n\n### 6. 缓存击穿如何处理？\n\n击穿是热点 key 失效瞬间并发打到 DB, 治理核心是把“多线程重建”收敛成“单线程重建”，其余线程要么等、要么快速返回. 常用方案是互斥重建（分布式锁）:只有一个线程去查库并回填缓存，其他线程等待或快速失败重试、热点永不过期配合主动更新\n\n### 7. 缓存穿透如何处理？\n\n缓存穿透是指请求查询的数据本身不存在，导致每次都 miss 缓存并打到 DB，容易被恶意流量放大。\n\n可举个例子：\n查用户 user (line 99999999)，该 ID 不存在。若不处理，10000 并发会都打到 DB。加上三层后：非法 ID 先被拦，合法但不存在的 ID 多数被布隆挡住，少量漏过的请求查库后写入空值，后续直接命中空缓存，不再压 DB。\n\n治理一般做三层防线：\n  1.入口参数校验\n  先拦非法请求，比如负数 ID、超长字符串、明显异常格式。这层成本最低，能先挡掉一批无效流量。\n  2.布隆过滤器（Bloom Filter）把主键集合放进布隆过滤器。查询前先判定：若“肯定不存在”直接返回，不查 Redis/DB。布隆过滤器要跟随数据增量更新，避免“新数据刚写入却被误拦”.\n  3.空值缓存（Null Cache）当 DB 查不到时，把空结果也写入缓存，设置短 TTL（如 30s~120s）。防止同一个不存在 key 被反复打 DB。空值 TTL 要短，避免数据刚创建时被旧空缓存影响太久\n\n### 8. 布隆过滤器是什么?\n\n布隆过滤器可以理解为“省内存的存在性判断器”。生产里 Bloom 通常放在“昂贵查询之前做第一层粗筛”，核心价值是用很小内存挡掉大量确定不存在的请求，典型就是缓存穿透治理和海量去重场景。\n\n1. 它是什么\n\n- 用来判断元素“可能存在 / 一定不存在”。  \n- 结论特性：  \n- 返回不存在：一定不存在。  \n- 返回存在：可能存在（有误判）。\n\n1. 实现原理\n\n- 底层是一个位数组（bit array）+ 多个哈希函数。  \n- 插入元素时：用 `k` 个哈希函数算出 `k` 个位置，把这些 bit 置为 1。  \n- 查询元素时：再算这 `k` 个位置。  \n- 只要有一个位是 0 => 一定不存在。  \n- 全是 1 => 可能存在。\n\n1. 为什么会误判\n\n- 不同元素可能把同一批 bit 置为 1，导致“本不存在的元素查询时恰好全是 1”。\n\n1. 优缺点\n\n- 优点：极省内存，查询/写入都很快，适合海量 key 预过滤。  \n- 缺点：有误判；标准布隆不支持精确删除（可用 Counting Bloom 改进）。\n\n1. 常见场景\n\n- 缓存穿透防护（先判 key 是否可能存在）。  \n- 爬虫 URL 去重。  \n- 黑名单/白名单预判。\n\n### 9. 缓存雪崩如何处理？\n\n缓存雪崩是“同一时刻大量缓存失效”或“Redis整体不可用”，导致请求集中回源 DB，引发级联故障。治理要分预防和止血两层。\n\n预防层（减少同一时刻失效）\n\n1. TTL 随机抖动：\n\n- 不要都设 30 分钟，改成 `30min + rand(0~5min)`。  \n- 作用：把失效时间打散，避免同秒回源峰值。\n\n1. 热点永不过期 + 主动更新：\n\n- 对核心 key 不设 TTL，由 MQ/配置变更主动刷新。  \n- 作用：把“被动过期”改成“主动可控更新”。\n\n1. 多级缓存：\n\n- Redis 前再加本地缓存（如 Caffeine），顶住短时流量尖峰。  \n- Redis 抖动时本地缓存可当缓冲层。\n\n止血层（雪崩发生时保护 DB）\n\n1. 限流与熔断：\n\n- 对回源接口做 QPS 限流，超过阈值快速失败或排队。  \n- DB/下游超时时触发熔断，避免线程池被打满。\n\n1. 降级兜底：\n\n- 返回默认值、旧值、本地快照，优先保证可用性。\n- 核心场景可做“只读降级”，暂时关闭非关键写操作。\n\n一句话：  \n雪崩处理不是单点技巧，而是“打散过期 + 多级缓存 + 限流熔断 + 降级兜底”组合拳。\n\n### 10. 大 key 风险？\n\n大key的本质问题: 一次命令处理数据太多，会放大 Redis 单线程模型的时延风险；治理关键是“提前发现、结构拆分、分页访问、异步删除”.\n大 key 会导致单次操作阻塞事件循环、网络包过大、主从数据迁移和复制耗时长，还会造成集群槽位热点。治理方案: 1.拆分 key（核心）; 2.避免全量读写,用分页命令：HSCAN/SSCAN/ZSCAN、ZRANGE 分页，避免一次全拉; 3.删除用异步\n\n### 11. RDB 与 AOF 取舍？\n\nRDB 是全量快照存储，文件紧凑、恢复快，但可能丢失最近一段数据；AOF 记录写命令存储，数据更完整但文件更大、恢复更慢。生产常用混合策略：RDB 做基线，AOF 做增量保障。\n\n### 12. 分布式锁如何安全释放？\n\nJava 推荐直接用 Redisson（可重入、续期、解锁安全、）.比手写 SET NX PX 更常用:\nRLock 支持可重入：同一线程可以重复加锁，不会自己把自己锁死。\n自动续期（Watchdog）：业务没执行完时自动延长过期时间，降低“锁提前失效”风险。\n解锁安全：内部用 Lua 校验锁持有者，避免误删别人的锁。\n等锁更高效：基于 Pub/Sub 通知，减少无脑轮询 Redis。\nAPI 完整：公平锁、读写锁、联锁、多锁等开箱即用。\n\n### 13. 为什么不把所有查询都塞到 Redis？\n\nRedis 适合高频热点和低延迟读，不适合无限扩张成“全量数据库”。全塞进去会带来高内存成本、复杂一致性和失效治理问题，冷热分层和按访问特征选型更可持续。\n\n<a id=\"toc-mq-kafka\"><\/a>\n\n## 14. 补充原文：Redis Hash 扩容\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n#### 2.7.1 Redis Hash扩容\n\nRedis 的 hash 结构扩容：\n- 扩容：当 hash 内部的元素比较拥挤时（hash 碰撞比较频繁），就需要进行扩容。扩容需要申请新的两倍大小的数组，然后将所有的键值对重新分配到新的数组下标对应的链表中（rehash）。如果 hash 结构很大，比如有上百万个键值对，那么一次完整 rehash 的过程就会耗时很长。这对于单线程的 Redis 来说压力很大，所以 Redis 采用了渐进式 rehash 的方案。它会同时保留新旧两个 hash 结构，在后续的定时任务以及 hash 结构的读写指令中，将旧结构的元素逐渐迁移到新结构中。这样就可以避免因扩容导致的线程卡顿现象。\n- 缩容：Redis 的 hash 结构不但有扩容还有缩容，从这一点出发，它要比 Java 的 HashMap 更完整。缩容原理和扩容一致，只不过新的数组大小要比旧数组小一倍。\n\n## 15. 补充原文：Redis 限流实现\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n#### 2.7.2 Redis限流实现\n\nRedis 实现限流：\n- 基于 `zset` 实现：限流最核心的是滑动窗口。可以把每次请求都写入一个 `zset`，其中 `value` 保持唯一（可用 UUID 生成），`score` 使用当前时间戳。\n- 判断当前时间窗口内的请求数时，只需要统计两个时间戳之间的元素数量。\n- 这种方案的优点是窗口平滑、精度高，适合做“最近 N 秒最多允许 M 次请求”的限流规则。\n","title":"Redis核心问答"},"02_后端/03_Kafka/01_核心问答.md":{"md":"# Kafka与MQ核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. MQ / Kafka 的可靠性、幂等与高性能问题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## MQ/Kafka（8）\n\n### 1. 至少一次与恰好一次怎么选？\n\n恰好一次语义实现复杂、成本高，跨系统链路很难端到端保证。多数业务采用“至少一次投递 + 消费端幂等”，在可控复杂度下获得足够的可靠性。\n\n### 2. 消费幂等如何做？\n\n核心是为每条业务事件定义唯一幂等键（订单号、业务流水号等），消费前先查重。常见实现是去重表、唯一索引、redis分布式锁，确保重复消息不会重复生效。在线上先用 Redis SETNX 做高性能幂等，降低重复消费压力；对资金/发券等关键链路，再用数据库唯一键做最终兜底，避免 Redis 异常导致重复执行\n\n### 3. 消息积压怎么处理？\n\n先定位根因: 判断是生产激增还是消费变慢，再看是否有慢分区或下游阻塞。\n先止血: 处理上用扩容消费者、按优先级分流、临时降级非核心业务.\n再做回补，避免二次冲击: 积压清理不能“满速回放”，要限速回补。单独开回补 consumer group，配合令牌桶限速，保护 DB 和下游接口。\n最后补齐监控和容量治理，确保同类问题不再反复出现\n\n### 4. 为什么按业务 key 分区？\n\n按orderId、userId业务 key 分区能保证同一 key 的消息进入同一分区，天然保持局部有序。与此同时，不同 key 可并行消费，既满足顺序要求又保留水平扩展能力。\n\n### 5. MQ生产端可靠性怎么配？\n\n我会先保证不丢，再控制重复和乱序，最后再调批量与压缩拿吞吐\nKafka 生产端通常要配置 `acks=all`、合理重试和超时，提升写入可靠性。再结合批量发送与压缩提升吞吐，同时设置最大 in-flight 等参数控制乱序和重复风险。\n\n### 6. 死信队列价值？\n\n死信队列用于隔离多次重试仍失败的“毒消息”(数据格式错、字段脏、下游永久失败、代码 bug)，防止主队列被反复阻塞。它还能保留问题现场，便于人工修复、补偿重放和规则迭代。\n\n### 7. 端到端不丢消息怎么做？\n\n生产端要确保发送成功确认(Kafka 常配 acks=all、enable.idempotence=true,生产端的幂等允许重复发送)，Broker 侧做持久化和多副本同步；\n消费端严格执行“处理成功再提交ack位点”。同时配合幂等与消费失败补偿机制(消费失败走重试队列或延迟重试，超过阈值进 DLQ，不能无限阻塞主链路)，才能在重试场景下实现“逻辑不丢不重”。\n\n### 8.Kafka消息去重保证\nKafka 的“去重保证”要分三层理解。\n第一层是生产端去重：开启 enable.idempotence=true，并配合 acks=all、合理重试，Kafka 会用生产者ID和序号在分区内去重，防止网络重试造成重复写入。\n第二层是 Kafka 内部端到端一致：如果是“消费一条再生产一条”的链路，可用事务（transactional.id）加 read_committed，做到 Kafka 到 Kafka 的 Exactly-Once。\n第三层是最容易被忽略的：一旦消费后要写数据库、发券、扣库存，Kafka 本身不能替业务系统去重，必须做业务幂等。常见做法是给每条消息带全局唯一 eventId，消费端落幂等表或用唯一索引（如订单号唯一），重复消息直接丢弃；并坚持“处理成功再提交 offset”。\n\n### 9.Kafka为什么高性能\n主要是在持久化的那个性能做了一些优化。\n1.顺序写磁盘：避免随机 I/O，吞吐远高于随机写。\n2.Page Cache：大量读写走操作系统缓存，减少磁盘真实访问。\n3.零拷贝（sendfile/transferTo）：数据从内核缓存直接到网卡，减少用户态拷贝和 CPU 开销。\n4.批量处理：生产端批量发送、Broker 批量落盘、消费端批量拉取，显著降低系统调用次数。\n\n\n<a id=\"toc-jvm-gc\"><\/a>\n\n## 补充原文：Kafka 高可用、重复消费与顺序性\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### Kafka 的高可用\n\nKafka 是分布式的，topic 会被拆成多个 partition，分布在不同机器上。每个 partition 会有一个 leader 和多个 follower：\n- 生产者只向 leader 写；\n- follower 主动从 leader 拉数据；\n- leader 宕机后，follower 中会重新选出新的 leader，继续提供服务。\n\n写入流程可以这么理解：\n1. 生产者把消息发给 leader；\n2. leader 先写本地磁盘；\n3. follower 从 leader 同步数据；\n4. 当满足副本确认条件后，leader 才给生产者返回 ack。\n\n如果要尽量避免 broker 故障导致的数据丢失，常见配置是：\n- `replication.factor > 1`\n- `min.insync.replicas > 1`\n- `acks=all`\n- `retries` 设为足够大\n\n这套配置的核心思想是：**至少要有多个副本真正跟上，并且所有必要副本确认后，才把消息视为写成功。**\n\n### 重复消费与幂等\n\nKafka 消费端可能重复消费，本质原因是：\n- 业务已经处理成功；\n- 但 offset 还没来得及提交；\n- 消费者重启后又会从旧 offset 再拉一次。\n\n所以常见工程做法是：\n- 关闭自动提交 offset；\n- 处理成功后手动提交；\n- 同时在业务层做幂等。\n\n业务幂等常见做法：\n- 用数据库唯一键防重；\n- 或者用 Redis / 内存 Set 做去重判断。\n\n### Kafka 如何保障不丢消息\n\n1. **生产端**\n- 要拿到 broker 的成功确认；\n- 失败时要自动重试。\n\n2. **Broker 端**\n- 做持久化和多副本复制；\n- leader 切换时只从满足同步条件的副本中选举。\n\n3. **消费端**\n- 处理成功再提交 offset；\n- 失败时允许重试，但业务必须幂等。\n\n### Kafka 如何保证顺序性\n\nKafka 的顺序性是“分区内有序，不是全局有序”。\n常见做法是：\n- 生产时按业务 key（如订单 ID）路由到同一个 partition；\n- 消费时避免同一个 key 被多个线程并发打乱；\n- 如果消费者内部多线程处理，可再按 key hash 到本地内存队列，由单线程顺序消费。\n\n所以面试里可以一句话总结：\n**Kafka 能保证同一 partition 内的消息顺序；要把业务顺序映射到 Kafka 顺序，关键是分区键设计和消费端串行处理。**\n","title":"Kafka与MQ核心问答"},"02_后端/04_并发与异步任务/01_核心问答.md":{"md":"# 并发与异步任务核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. 并发/JUC 关键问题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 并发/JUC（8）\n\n### 1. `synchronized` vs `ReentrantLock`？\n\n`synchronized` 语法简单、JVM 优化成熟，适合大多数互斥场景。`ReentrantLock` 提供可中断、超时、公平锁和条件队列，适合需要精细控制并发行为的复杂场景。\n\n可以按“原理 + 场景”这样答：\n\n1. `synchronized` 底层原理\n\n- JVM 内置监视器锁（Monitor）。  \n- 对象头里有 `Mark Word`，记录锁状态（无锁/偏向/轻量/重量）。  \n- 竞争低时走轻量路径（CAS + 自旋）；竞争高会膨胀成重量级 Monitor，线程阻塞/唤醒由 JVM/OS 协作完成。  \n- `monitorenter/monitorexit` 保证互斥和内存可见性（happens-before）。\n\n1. `ReentrantLock` 底层原理\n\n- 基于 JUC 的 AQS（AbstractQueuedSynchronizer）。  \n- 用 `state` 表示锁占用，CAS 抢锁。  \n- 抢不到就进入 CLH 变种等待队列`LockSupport.park/unpark` 挂起唤醒。  \n- 支持可重入、公平/非公平、可中断、超时、多 `Condition`。\n\n1. 生产场景怎么选\n\n`synchronized` 常见场景：  \n\n- 方法级/代码块级简单互斥。  \n- 业务内小临界区，逻辑简单，优先可读性和低心智负担。  \n- 框架里很多简单线程安全封装。\n\n`ReentrantLock` 常见场景：  \n\n- 需要 `tryLock(timeout)` 防止长时间阻塞。  \n- 需要 `lockInterruptibly()` 支持取消任务。  \n- 需要公平锁避免饥饿（少量场景）。  \n- 需要多个条件队列（生产者消费者多条件唤醒）。  \n- 需要结合 AQS 能力做更精细并发控制。\n\n一句话：  \n\n`synchronized` 是 JVM 原生监视器锁，适合“简单可靠”`ReentrantLock` 是 AQS 可编排锁，适合“复杂控制”。\n\n### 2. `volatile` 保证什么？\n\nvolatile 保证写入对其他线程可见，并通过内存屏障约束指令重排保证顺序性。它不保证复合操作原子性，所以 i++ 这类读改写仍需锁或原子类\n\n`可以把 volatile 记成两件事：**可见性 + 有序性**，不管原子性。`\n\n`\n\n1. 可见性`\n\n`一个线程写 volatile 变量后，其他线程能尽快看到最新值。`  \n\n`原因是写入会刷新到主内存，读取会从主内存重新取值，而不是长期用线程本地缓存。`\n\n`\n\n1. 有序性（禁止特定重排）`\n\n`volatile 通过内存屏障建立 happens-before：`  \n\n`- 对同一个 volatile 变量，线程 A 的写 happens-before 线程 B 的读。`  \n\n`- 在 volatile 写之前的普通写，不会被重排到它之后。`  \n\n`- 在 volatile 读之后的普通读，不会被重排到它之前。`  \n\n`所以常用于“发布标志位”。`\n\n`\n\n1. 不保证原子性`\n\n`\n\n1. 典型使用场景`\n\n`- 停止标志volatile boolean running。`  \n\n`- 双重检查单例里的 volatile instance（防止指令重排导致半初始化对象可见）。`  \n\n`- 状态位通知（一个线程写，多个线程读）。AQS中的state`\n\n`一句话：`  \n\n`volatile 让“看得见、顺序对”，但“改得准”还得靠锁或原子类。`\n\n### 3. 什么是 AQS？\n\nAQS 是 JUC 的同步器框架，核心是 state + CLH 等待队列 + CAS + park/unpark唤醒，把并发控制从‘每个锁自己造轮子’变成‘只实现状态规则，其余排队唤醒交给框架\n\n1. 它解决什么问题\n\n把“线程竞争资源、排队等待、被唤醒重试”这套通用流程封装起来，业务只要定义“资源怎么拿、怎么放”。\n\n1. 核心组成\n\n- `state`：一个 `int` 状态位，表示同步状态（例如锁是否被占用、剩余许可数）。  \n- 等待队列：CLH 变种双向链表，抢不到资源的线程排队。  \n- CAS：原子修改 `state`，减少锁竞争。  \n- `park/unpark`：挂起与唤醒线程`LockSupport`）。\n\n1. 工作流程（独占锁视角）\n2. 线程先 CAS 抢 `state`。\n3. 抢到就进入临界区。\n4. 抢不到就入队并 `park` 挂起。\n5. 持有线程释放资源后 `unpark` 队头线程。\n6. 被唤醒线程再尝试 CAS 抢锁。\n7. 你要实现 AQS 只需重写什么\n\n- `tryAcquire` / `tryRelease`（独占）  \n- `tryAcquireShared` / `tryReleaseShared`（共享）\n\nAQS 负责排队、阻塞、唤醒，你只定义规则。\n\n1. 基于 AQS 的常见组件\n\n- ReentrantLock（独占）\n  - 规则：同一时刻只允许一个线程持有锁，可重入。\n  - state：重入次数。\n  - 额外规则：公平/非公平、可中断、超时获取。\n- Semaphore（共享许可）\n  - 规则：最多 N 个线程同时通过。\n  - state：剩余许可数。\n  - 获取就是 state-1，释放就是 state+1。\n- CountDownLatch（一次性门闩）\n  - 规则：计数没到 0 前，等待线程都阻塞；到 0 一次性放开。\n  - state：剩余计数。\n  - 特点：一次性，不可重置（要重置用 CyclicBarrier/Phaser）。\n- ReentrantReadWriteLock（读写分离）\n  - 规则：读可并发，写独占；可重入。\n  - state：高低位分别编码读锁计数和写锁计数。\n  - 额外规则：读写互斥策略、公平性策略。\n\n### 4. 线程池关键参数？\n\n关键参数是 corePoolSize、maximumPoolSize、workQueue、keepAliveTime、rejectionHandler。调优要结合任务类型（CPU 密集/IO 密集）和 SLA，避免“队列过大掩盖问题”。\n\n1. 过程: 线程池初始时是没有线程的。首先任务过来会去判断当前线程池里面的线程数是否大于核心线程数，如果小于则新建线程执行任务。执行完任务后的核心线程线程会阻塞，等待任务队列中有任务到来。如果任务过来发现当前线程池里面的线程数等于核心线程数，就将任务放在任务队列中，等待有线程来处理。如果任务队列放满了，就去判断当前线程池里面的线程数是否小于最大线程数，如果小于就新建普通线程执行任务，执行完毕之后会等待空闲时间之后 , 会销毁普通线程；如果等于最大线程数(此时任务队列也放满了)，就执行拒绝策略 .\n2. 线程池的核心参数配置\n  1. core：核心worker数量，线程池会一直维持这个数量的worker，哪怕没有任务。\n  2. queue：如果core用完了会先将task放到queue中。\n  3. max：如果queue也满了才会再次创建新的worker直到这个max限值。\n  4. reject：如果max都满了，那就执行对应的拒绝策略了。\n  5. keepalive：超过core数量时，而queue又为空，这个时候多余的woker会等待空闲时间后就被回收掉。\n\n### 5. 为什么常用有界队列？\n\n无界队列看似平滑，实则在高峰会无限堆积任务，导致内存和时延失控。\n\n有界队列能把压力显式暴露出来，配合拒绝策略和降级更符合生产治理思路。\n\n### 6. 死锁如何排查？\n\n死锁排查核心是用 jstack 还原“谁持有什么锁、在等什么锁”的闭环；修复重点是统一锁顺序和减少锁内慢操作\n\n### 7. `CompletableFuture` 常见坑？\n\n常见问题是链路里混入阻塞操作（`join/get`）占满公共线程池，造成线程饥饿和级联超时。实践上要分离线程池、避免在回调中阻塞，并设置超时和异常兜底。\n\n### 8. 异步任务如何降级？\n\n1. 先做任务分级\n\n把异步任务分成三类：  \n\n- 核心必需（失败要影响主流程）  \n- 重要可降级（失败可用默认值）  \n- 非核心可丢弃（埋点、推荐补充信息）\n\n没有分级就谈不了降级策略。\n\n1. 每个分支必须有超时\n\n异步不等于无限等待。  \n\n给每个分支设置独立超时（如 100ms/300ms），超时立刻返回 fallback，避免拖慢主链路。  \n\n`completeOnTimeoutorTimeout` 都可以。\n\n1. 线程池隔离\n\n不同异步任务用不同线程池，防止一个慢依赖把全局异步池占满。  \n\n同时配置有界队列和拒绝策略（常用 `CallerRuns` 或快速失败），把压力显式化。\n\n1. 熔断 + 限流\n\n当某下游错误率/超时率升高时，快速熔断，短时间直接走降级结果；  \n\n并对高并发流量做限流，避免雪崩放大。\n\n1. 监控与验收\n\n必须监控：线程池队列长度、拒绝次数、熔断状态。  \n\n降级不是事故才开，而是平时就可灰度演练。\n\n面试一句话收口：  \n\n“异步降级的本质是把失败隔离在分支内，不让非核心能力反向拖垮主流程。关键手段是超时、隔离、熔断、限流和可用兜底。”\n\n### 9.CAS是什么\n\nCAS（Compare-And-Swap）是并发里的原子指令思想：\n\n1. 是什么\n\n给一个内存位置 `V`，预期旧值 `A`，新值 `B`：  \n\n- 如果 `V == A`，就把 `V` 改成 `B`（成功）  \n- 否则不改（失败）\n\n整个比较+写入是原子的，无需加锁。\n\n1. 在 Java 里的位置\n\n- `AtomicInteger/AtomicLong/AtomicReference` 底层核心就是 CAS。  \n- `AQS`、`ConcurrentHashMap`、线程池状态流转等大量用到 CAS。  \n- `synchronized` 是悲观锁思路，CAS 是乐观并发思路。\n\n1. 应用场景\n\n- 计数器（高并发自增）  \n- 无锁状态机（任务状态 INIT->RUNNING->DONE）  \n- 无锁数据结构（栈/队列部分实现）  \n- 减少锁竞争，提高吞吐\n\n1. 常见问题\n\n- ABA 问题：值 A->B->A，CAS 以为没变。  \n解决：`AtomicStampedReference`（带版本号）。  \n- 自旋开销：CAS 失败会重试，冲突高时 CPU 空转。  \n- 只保证单变量原子性，多变量一致性仍要锁或事务。\n\n一句话：  \nCAS 是 Java 并发里“无锁原子更新”的基础能力，适合高并发下做轻量同步，但高冲突和复杂一致性场景不能只靠它。\n\n<a id=\"toc-spring-boot\"><\/a>\n\n## 10. 补充原问：异步任务/视频生成任务如何排队、取消、重试、回调\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n按“状态机 + 消息队列 + 回调投递器”来设计。\n\n前端提交视频生成请求后，先落任务表，任务状态从 CREATED 进入 QUEUED，投递进入消息队列, 再由 Worker 消费执行，进入 RUNNING，最终收敛到 SUCCEEDED / FAILED / CANCELED / TIMEOUT。\n\n排队：入队时按幂等键来去重，按优先级 + create_time 排序，再根据租户做配额限制，避免大客户把全局资源打满。\n\n取消分两类：任务在排队中直接出队并置 CANCELED，任务已经在运行中走 CANCEL_REQUESTED，Worker 在阶段边界轮询取消标记，安全释放 GPU 和临时文件。\n\n重试只针对可重试错误，比如超时、网络抖动，采用指数退避加抖动，并限制最大次数，超过阈值进死信队列。不可重试错误如参数非法、内容违规，直接失败。\n\n回调采用“至少一次”投递，带签名和时间戳做鉴权，失败重试并入回调死信队列；回调接收方业务方按 `task_id/event_id` 做幂等消费。\n","title":"并发与异步任务核心问答"},"02_后端/05_缓存与一致性/01_核心问答.md":{"md":"# 缓存与一致性核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. 6. 缓存击穿如何处理？\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 6. 缓存击穿如何处理？\n\n击穿是热点 key 失效瞬间并发打到 DB, 治理核心是把“多线程重建”收敛成“单线程重建”，其余线程要么等、要么快速返回. 常用方案是互斥重建（分布式锁）:只有一个线程去查库并回填缓存，其他线程等待或快速失败重试、热点永不过期配合主动更新\n\n## 2. 7. 缓存穿透如何处理？\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 7. 缓存穿透如何处理？\n\n缓存穿透是指请求查询的数据本身不存在，导致每次都 miss 缓存并打到 DB，容易被恶意流量放大。\n\n可举个例子：\n查用户 user (line 99999999)，该 ID 不存在。若不处理，10000 并发会都打到 DB。加上三层后：非法 ID 先被拦，合法但不存在的 ID 多数被布隆挡住，少量漏过的请求查库后写入空值，后续直接命中空缓存，不再压 DB。\n\n治理一般做三层防线：\n  1.入口参数校验\n  先拦非法请求，比如负数 ID、超长字符串、明显异常格式。这层成本最低，能先挡掉一批无效流量。\n  2.布隆过滤器（Bloom Filter）把主键集合放进布隆过滤器。查询前先判定：若“肯定不存在”直接返回，不查 Redis/DB。布隆过滤器要跟随数据增量更新，避免“新数据刚写入却被误拦”.\n  3.空值缓存（Null Cache）当 DB 查不到时，把空结果也写入缓存，设置短 TTL（如 30s~120s）。防止同一个不存在 key 被反复打 DB。空值 TTL 要短，避免数据刚创建时被旧空缓存影响太久\n\n## 3. 8. 布隆过滤器是什么?\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 8. 布隆过滤器是什么?\n\n布隆过滤器可以理解为“省内存的存在性判断器”。生产里 Bloom 通常放在“昂贵查询之前做第一层粗筛”，核心价值是用很小内存挡掉大量确定不存在的请求，典型就是缓存穿透治理和海量去重场景。\n\n1. 它是什么\n\n- 用来判断元素“可能存在 / 一定不存在”。  \n- 结论特性：  \n- 返回不存在：一定不存在。  \n- 返回存在：可能存在（有误判）。\n\n1. 实现原理\n\n- 底层是一个位数组（bit array）+ 多个哈希函数。  \n- 插入元素时：用 `k` 个哈希函数算出 `k` 个位置，把这些 bit 置为 1。  \n- 查询元素时：再算这 `k` 个位置。  \n- 只要有一个位是 0 => 一定不存在。  \n- 全是 1 => 可能存在。\n\n1. 为什么会误判\n\n- 不同元素可能把同一批 bit 置为 1，导致“本不存在的元素查询时恰好全是 1”。\n\n1. 优缺点\n\n- 优点：极省内存，查询/写入都很快，适合海量 key 预过滤。  \n- 缺点：有误判；标准布隆不支持精确删除（可用 Counting Bloom 改进）。\n\n1. 常见场景\n\n- 缓存穿透防护（先判 key 是否可能存在）。  \n- 爬虫 URL 去重。  \n- 黑名单/白名单预判。\n\n## 4. 9. 缓存雪崩如何处理？\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 9. 缓存雪崩如何处理？\n\n缓存雪崩是“同一时刻大量缓存失效”或“Redis整体不可用”，导致请求集中回源 DB，引发级联故障。治理要分预防和止血两层。\n\n预防层（减少同一时刻失效）\n\n1. TTL 随机抖动：\n\n- 不要都设 30 分钟，改成 `30min + rand(0~5min)`。  \n- 作用：把失效时间打散，避免同秒回源峰值。\n\n1. 热点永不过期 + 主动更新：\n\n- 对核心 key 不设 TTL，由 MQ/配置变更主动刷新。  \n- 作用：把“被动过期”改成“主动可控更新”。\n\n1. 多级缓存：\n\n- Redis 前再加本地缓存（如 Caffeine），顶住短时流量尖峰。  \n- Redis 抖动时本地缓存可当缓冲层。\n\n止血层（雪崩发生时保护 DB）\n\n1. 限流与熔断：\n\n- 对回源接口做 QPS 限流，超过阈值快速失败或排队。  \n- DB/下游超时时触发熔断，避免线程池被打满。\n\n1. 降级兜底：\n\n- 返回默认值、旧值、本地快照，优先保证可用性。\n- 核心场景可做“只读降级”，暂时关闭非关键写操作。\n\n一句话：  \n雪崩处理不是单点技巧，而是“打散过期 + 多级缓存 + 限流熔断 + 降级兜底”组合拳。\n\n## 5. 12. 分布式锁如何安全释放？\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 12. 分布式锁如何安全释放？\n\nJava 推荐直接用 Redisson（可重入、续期、解锁安全、）.比手写 SET NX PX 更常用:\nRLock 支持可重入：同一线程可以重复加锁，不会自己把自己锁死。\n自动续期（Watchdog）：业务没执行完时自动延长过期时间，降低“锁提前失效”风险。\n解锁安全：内部用 Lua 校验锁持有者，避免误删别人的锁。\n等锁更高效：基于 Pub/Sub 通知，减少无脑轮询 Redis。\nAPI 完整：公平锁、读写锁、联锁、多锁等开箱即用。\n\n## 6. 13. 为什么不把所有查询都塞到 Redis？\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 13. 为什么不把所有查询都塞到 Redis？\n\nRedis 适合高频热点和低延迟读，不适合无限扩张成“全量数据库”。全塞进去会带来高内存成本、复杂一致性和失效治理问题，冷热分层和按访问特征选型更可持续。\n\n<a id=\"toc-mq-kafka\"><\/a>\n\n## 补充原文：Redis / ZooKeeper 分布式锁与高并发优化\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### Redis 最普通的分布式锁\n\n最常见的 Redis 分布式锁写法是：\n\n```redis\nSET key my_random_value NX PX 30000\n```\n\n含义：\n- `NX`：只有 key 不存在时才能设置成功；\n- `PX 30000`：设置 30 秒自动过期，防止死锁。\n\n释放锁时不能直接 `DEL key`，而是要比对 value 后再删，通常用 Lua 做原子校验：\n\n```lua\nif redis.call(\"get\",KEYS[1]) == ARGV[1] then\n    return redis.call(\"del\",KEYS[1])\nelse\n    return 0\nend\n```\n\n这里要用 `random_value` 的原因是：\n- 客户端 A 拿到锁后如果卡了很久，锁可能已经过期并被客户端 B 重新拿到；\n- 如果 A 醒来后直接删 key，就会把 B 的锁误删掉；\n- 所以必须用“值匹配 + Lua”保证只删除自己的锁。\n\n但这种最原始实现也有明显问题：\n- Redis 单实例会有单点风险；\n- 主从异步复制下，如果主节点挂了而锁还没同步到从节点，新主节点可能再次把锁发给别人，产生双持锁问题。\n\n### Redisson 的价值\n\nRedisson 在工程上更常用，因为它补齐了很多手写锁的坑：\n- 支持单机、哨兵、Cluster、主从等多种部署；\n- 加锁解锁逻辑封装在 Lua 里，天然原子；\n- 支持可重入；\n- 有 watchdog 自动续期，避免业务没执行完锁就先过期；\n- 提供更完整的锁模型和更成熟的工程实现。\n\n### ZooKeeper 分布式锁\n\nZooKeeper 的锁思路和 Redis 不一样，常见做法是基于**临时顺序节点**：\n1. 客户端在某个锁目录下创建临时顺序节点；\n2. 如果自己是最小节点，说明拿到锁；\n3. 如果不是最小节点，就监听排在自己前面的那个节点；\n4. 前驱节点删除后，再尝试拿锁。\n\n这种做法的优点：\n- 客户端挂掉后，临时节点会自动删除，锁自动释放；\n- 通过监听前驱节点而不是监听锁根节点，可以减少羊群效应；\n- 更容易实现公平锁语义。\n\n### Redis 锁 vs ZooKeeper 锁\n\n两者各有取舍：\n- Redis 锁性能高，实现轻，适合高频短锁，但底层复制一致性要格外注意；\n- ZooKeeper 锁一致性更强、自动释放更自然，但性能和复杂度成本更高；\n- 如果业务是高并发热点资源竞争，很多时候更好的方向不是“把锁做得更重”，而是先从业务上拆分资源、降低热点。\n\n### 分布式锁抗高并发\n\n如果一个热点资源每秒有上万请求去抢同一把锁，单把锁会成为瓶颈。常见优化思路是：\n- **分段加锁**：把一个大资源拆成多个小分段，每个分段独立加锁；\n- **合并扣减**：一个分段不够时，再去锁别的分段做组合扣减；\n- **实在极端高并发时，尽量往无锁化演进**：例如直接在 Redis / Tair 这类 KV 里原子扣减，再通过 MQ 异步回写关系型数据库，而不是让所有请求都先抢一把重锁。\n\n面试里可以一句话总结：\n**分布式锁是兜底手段，不是高并发系统的首选主路径；能拆热点、能异步、能原子扣减，就尽量不要把吞吐压在一把锁上。**\n","title":"缓存与一致性核心问答"},"02_后端/06_分库分表与架构治理/01_核心问答.md":{"md":"# 分库分表与数据治理核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. MySQL 里的分库分表、读写分离\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 12. MySQL的分库分表、读写分离\n\n**核心区别**\n1. `分库分表`：解决“单机存储/写入瓶颈”。  \n2. `读写分离`：解决“读取压力过大”。  \n3. 通常先做读写分离，再做分库分表。\n\n**分库分表**\n1. 垂直拆分：按业务域拆库（用户库、订单库）。  \n2. 水平拆分：同一表按分片键拆（如 `user_id % 64`）。  \n3. 关键点：分片键选得好不好决定热点和扩容难度。  \n4. 常见问题：跨分片 `join/count/page`、分布式事务、全局ID。  \n5. 工程做法：业务层聚合/冗余字段/汇总表，ID用雪花或号段。  \n6. 扩容迁移：双写 -> 回填 -> 校验 -> 灰度切流 -> 下线旧分片。\n\n**读写分离**\n1. 架构：主库写、从库读（通过中间件/代理路由）。  \n2. 风险：主从延迟导致“刚写就读不到”。  \n3. 兜底：写后短时间强制读主、延迟监控、超阈值切主读。  \n4. 还要做：从库负载均衡、故障自动切换、GTID/复制健康检查。\n\n\n\n\n<a id=\"toc-redis\"><\/a>\n\n## 2. 分库分表与数据治理高频题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 4. 分库分表与数据治理（6）\n\n### 1. 问：为什么要分库分表？什么时候不该做？\n\n答：当单库在容量、QPS、写锁竞争或维护窗口上到瓶颈时才做分库分表。若业务规模小、查询复杂且强事务多，过早拆分会显著增加复杂度。判断标准是“收益是否大于数据治理成本”。  \n追问：分库分表前你会先做哪三件低成本优化？\n\n### 2. 问：垂直拆分和水平拆分怎么选？\n\n答：垂直拆分按业务域解耦，解决的是职责和团队边界问题；水平拆分按数据量扩展，解决的是容量和吞吐问题。常见路径是先垂直再水平，避免把单体问题直接放大成分布式问题。  \n追问：仅做垂直拆分为什么往往解决不了热点写入问题？\n\n### 3. 问：分片键怎么选才能避免热点？\n\n答：分片键要兼顾写入均匀和查询命中。优先选择高基数、稳定且查询常带条件的字段；避免时间戳这类天然热点键。可用“业务键 + 随机扰动”降低热点，并结合热分片迁移机制。  \n追问：如果业务天然按商户聚集，热点商户怎么做专项治理？\n\n### 4. 问：跨分片 join、分页、排序、count 怎么处理？\n\n答：原则是尽量避免跨分片实时计算。常见做法是业务侧聚合、异步宽表、搜索引擎或OLAP承接复杂查询。分页走“先路由再聚合”，深分页用游标。count 用近实时汇总表，不做全量实时扫。  \n追问：跨分片查询延迟高时，先改 SQL 还是先改架构？\n\n### 5. 问：分库分表后全局 ID 怎么生成？\n\n答：常见方案是雪花算法、号段模式、数据库序列服务。雪花适合高并发且去中心化，号段适合稳定批量发号。要重点处理时钟回拨、重复ID、趋势递增和可观测性，避免主键冲突事故。  \n追问：雪花算法出现时钟回拨时有哪些可落地兜底方案？\n\n### 6. 问：不停机迁移到分库分表怎么做？\n\n答：通常走“双写 + 回填 + 校验 + 切流 + 回滚”五步。先建立新链路并双写，历史数据离线回填，做全量与增量校验后灰度切读切写，保留回滚开关。关键是可观测和幂等补偿链路完备。  \n追问：双写阶段如何避免主从数据长期漂移？\n\n高频连问路径：\n\n1. 拆分时机 -> 拆分方式 -> 成本评估\n2. 分片键 -> 热点治理 -> 扩容迁移\n3. 跨分片查询 -> 聚合策略 -> 数据一致性\n\n## 补充原文：Snowflake 时钟回拨怎么处理\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### Snowflake 时钟回拨问题\n\nSnowflake 这类趋势递增 ID 方案强依赖机器时钟。如果机器和时间服务器校时后发生时钟回拨，就可能出现：\n- 发号重复；\n- 或者服务为了避免重复而短时间不可用。\n\n一种工程化兜底思路是：\n- 在内存里维护过去一段时间内（例如 1 小时）每一毫秒、每台机器已经发出的最大 ID；\n- 如果检测到时钟回拨，就定位回拨到了之前的哪一毫秒；\n- 然后在那一毫秒对应的最大序列号基础上继续自增，而不是直接重新从 0 开始发。\n\n这样做的本质是：\n**把“时间倒退”问题，转化成“同一毫秒内继续用更大的序列号发号”，从而降低重复 ID 风险。**\n\n当然，工程上还可以结合：\n- 小幅回拨时短暂等待；\n- 大幅回拨时切换机器号 / 直接熔断告警；\n- 结合监控观察时钟漂移和发号失败率。\n","title":"分库分表与数据治理核心问答"},"02_后端/07_JVM与GC/01_核心问答.md":{"md":"# JVM与GC核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. JVM/GC 高频问题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## JVM/GC（8）\n\n### 1. G1 的核心思想？\n\n1. 堆结构变化\n\nG1 把整个堆切成很多等大小 `Region`（1MB~32MB），每个 Region 可在不同阶段扮演 Eden/Survivor/Old，不再是年轻代老年代的固定物理分区。  \n\n1. 回收核心思想（Garbage First）\n\n每次 GC 不一定全堆扫，而是优先选“垃圾占比高、回收收益大”的 Region。 尽量用更少的停顿拿到更多可用内存。\n\n1. 关键流程\n\n- `Young GC`：回收 Eden/Survivor，存活对象晋升或复制。  \n- `Concurrent Mark`：并发标记全堆存活对象，统计每个 Region 的存活率。  \n- `Mixed GC`：在年轻代回收时，顺带回收一部分“高收益 Old Region”。\n\n1. 如何做到“可预测停顿”\n\n你可以给 G1 一个目标`-XX:MaxGCPauseMillis=xxx`。  \n\nG1 会根据历史统计（每个 Region 回收成本、复制成本）估算本次能回收多少 Region，动态控制回收集合大小，让停顿尽量贴近目标，而不是无限追求吞吐。\n\n一句话收口：  \n\nG1 的本质是把 GC 从“整代粗粒度回收”变成“Region 粒度、收益驱动、带停顿预算的回收调度器”。\n\n### 2. JDK 8 升级到 JDK 21的变化\n\n1.语法糖爆炸（代码量直接砍掉 30-50%）, 可以替换掉了 lombok\n\n2.虚拟线程（Virtual Threads）—— 高并发编程的降维打击, 能轻松跑 百万级 并发, 高并发 I/O 场景下，不用堆很大线程池也能扛住\n\n3.JVM性能自动提升, G1 GC 默认 + ZGC/Shenandoah（亚毫秒暂停）, JIT 优化 + CDS 默认开启, 同样的 Tomcat/Spring Boot 项目，启动时间砍半，内存占用降低 30-50%，高峰期不卡顿.\n\n**总结: JDK 8 -> JDK 21 不只是 GC 变强，而是“语言表达力 + 并发模型 + 标准库 + 可运维性”整体代际升级。**\n\n### 3. JDK 21 相比 JDK 8，GC 变化\n\n我会从三点讲。\n\n第一，默认收集器从 Parallel GC变成 G1，目标从纯吞吐转向吞吐和停顿时间平衡；低延迟场景可以选 ZGC/Shenandoah，JDK 21 里这些方案成熟度更高；\n\n第二，G1 在 JDK 9 到 21 之间持续优化，比如并行 Full GC、回收策略和内存归还机制更完善，线上稳定性和停顿可预测性都更好。\n\n总结为：JDK 8 更偏吞吐优先，JDK 21 提供了更强的低延迟能力和更成熟的工程可用性。\n\n### 4. ZGC是什么?\n\nZGC 是 JDK 提供的低延迟垃圾回收器，核心目标是把 GC 停顿压到毫秒级甚至亚毫秒级，并且停顿时间对堆大小不敏感。它的关键思路是把大部分标记、重定位工作放到并发阶段，Stop-The-World 只保留很短的根扫描等必要步骤。  \n\n实现上，ZGC 用了着色指针（colored pointers）和读屏障（load barrier）：对象地址里带状态位，线程在读对象时通过屏障感知对象是否被移动并完成自愈跳转，这样对象迁移可以和业务线程并发进行。  \n\n**着色指针（Colored Pointers）**：在指针里带状态信息，GC 能快速判断对象状态。\n\n**读屏障（Load Barrier）**：线程读对象时，若对象已搬迁，屏障会把引用“修正到新地址”。\n\n所以它适合对延迟非常敏感的服务，比如交易链路、实时推荐、网关核心路径；代价是吞吐可能略低、CPU开销更高，调优和观测也更复杂。工程上通常是‘先 G1，延迟 SLA 很严再上 ZGC’。”  \n\n### 5. G1 触发 Full GC 的典型场景\n\n- to-space exhausted / evacuation failure：复制存活对象时没有足够可用 Region。\n- 老年代增长太快：并发标记还没完成就快打满（回收跟不上分配）。\n- Humongous 大对象（超过 Region 一半）申请失败或碎片严重。\n- 元空间（Metaspace）压力过大。\n\n排查与优化方向\n\n- 先看 Full GC 前后老年代占用曲线和分配速率，不只看停顿时间。\n- 增加堆或预留空间：-Xmx、-XX:G1ReservePercent。\n- 避免大对象/降低 Humongous 压力（必要时调 G1HeapRegionSize）。\n- 限制显式 GC：-XX:+DisableExplicitGC 或 -XX:+ExplicitGCInvokesConcurrent。\n- 检查是否有内存泄漏和晋升压力过高。\n\n### 6. GC 日志快速看什么？\n\n**先看这 5 个点（30 秒）**\n\n1. `GC类型`：Young / Mixed / Full\n2. `停顿时长`：是否超过SLA（如 >200ms）\n3. `回收效果before->after` 降了多少\n4. `触发原因`：Allocation Failure / Humongous / Metadata / System.gc\n5. `老年代趋势`：Old 是否持续上涨（有无晋升压力/泄漏风险）\n\n---\n\n**例子1：正常 Young GC（G1）**\n\n```text\n\n[12.345s][info][gc,start] GC(42) Pause Young (Normal) (G1 Evacuation Pause)\n\n[12.351s][info][gc,heap ] GC(42) Eden regions: 96->0(80)\n\n[12.351s][info][gc,heap ] GC(42) Survivor regions: 8->12(16)\n\n[12.351s][info][gc,heap ] GC(42) Old regions: 210->228\n\n[12.351s][info][gc      ] GC(42) Pause Young ... 1536M->1180M(4096M) 6.1ms\n\n```\n\n怎么读：\n\n- 类型：Young，正常短暂停顿  \n- 时长：6.1ms，通常可接受  \n- 回收：1536→1180，回收了356M  \n- 但 Old 210→228：有对象晋升，说明存活对象偏多，需持续观察\n\n---\n\n**例子2：故障信号（Full GC）**\n\n```text\n\n[180.200s][info][gc      ] GC(300) To-space exhausted\n\n[180.223s][info][gc      ] GC(301) Pause Full (G1 Compaction Pause) 7.8G->6.9G(8G) 1.42s\n\n```\n\n怎么读：\n\n- `To-space exhausted` 说明复制回收时没空间了  \n- 触发了 Full GC，且 1.42s 停顿很重  \n- 回收后还剩 6.9G/8G，空间依然紧，问题没根治  \n- 常见动作：加堆、提前并发标记、提高保留区、查大对象和内存泄漏\n\n---\n\n**面试可直接背的回答**\n\n“我看 GC 日志会先看类型和时长，再看回收前后堆占用和触发原因，最后看老年代趋势。比如 Young GC 若很短且回收明显通常健康；若出现 `To-space exhaustedEvacuation FailurePause Full`，就是高风险信号，要结合老年代曲线和分配速率定位是晋升压力、Humongous 对象还是泄漏问题。”\n\n### 7. 年轻代 GC 过频说明什么？\n\n通常说明对象分配速率高于回收能力，或年轻代设置偏小导致频繁 Minor GC。优化可从减少短命对象、调大年轻代、优化批量处理方式三方面入手。\n\n### 8. OOM 定位第一步？\n\n第一步确实是你写的那句：**先判 OOM 类型**。  \n\n因为不同类型，抓证据和排查工具完全不同。\n\n可以这样面试回答：\n\n1. 先看报错文本，快速分类\n\n- `Java heap space`：堆内存问题  \n- `GC overhead limit exceeded`：堆快满且回收效率极差  \n- `Metaspace`：类元数据区问题  \n- `Direct buffer memory`：堆外直接内存问题  \n- `unable to create new native thread`：线程数/系统资源问题\n\n1. 为什么这一步最关键\n\n如果把 `Direct buffer memory` 当成堆泄漏去看 Heap Dump，方向会跑偏，浪费时间。\n\n1. 分类型抓现场\n\n- 堆问题`HeapDump` + GC 日志（MAT 看 Dominator Tree、引用链）  \n- Metaspace：看类加载量、ClassLoader 统计（常见类加载器泄漏）  \n- Direct Memory：看 NMT/Netty buffer 使用`MaxDirectMemorySize`  \n- Native Thread：看线程数`jstack`、系统 `ulimit` 和 `-Xss`\n\n1. 再做根因归类\n\n最后归到三类之一：  \n\n- 泄漏（对象不释放）  \n- 突增（流量/任务峰值）  \n- 配置不合理（堆、元空间、线程栈、直接内存参数太小）\n\n一句话收口：  \n\n**OOM 定位不是先调参数，而是先“判类型”，再用对应证据链定位是泄漏、突增还是配置问题。**\n\n### 9. CMS 与 G1 快速对比？\n\nCMS 优点是并发回收、低停顿，但容易产生内存碎片，调优复杂。G1 在大堆场景停顿可预测性更好，且通过 Region 回收降低碎片问题，已成为更通用选择。\n\n### 10. STW 完全避免吗？\n\n不能。即使是低停顿收集器，也有根扫描、重标记等阶段需要短暂停顿。工程目标不是“零 STW”，而是把停顿压到业务可接受范围并保持可预测。\n\nG1 会有 STW，因为有些阶段必须“冻结世界”才能保证一致性和安全。\n\n核心原理：\n\n1. GC 不是全都能并发做\n\nG1 虽然大量工作并发（并发标记等），但以下关键步骤仍需 STW：\n\n- 根对象快照（Root Scan）  \n- Young/Mixed 回收中的对象复制（Evacuation Pause）  \n- 引用关系修正的关键切换点（remark/cleanup 的一部分）\n\n1. 为什么这些必须停\n\nGC 线程要搬对象、改引用；业务线程也在同时读写对象。  \n\n如果不停顿做关键切换，会出现“对象被搬走但引用还没统一修正”的不一致风险。  \n\nSTW 的作用就是在短时间内拿到一个安全、一致的内存视图。\n\n1. G1 的目标不是“无停顿”，而是“可控停顿”\n\n它通过 Region 粒度回收和回收集预测，把每次停顿控制在目标内（如 `MaxGCPauseMillis`），而不是像传统 Full GC 那样一次长暂停。\n\n一句话：  \n\n**G1 会 STW 是因为对象移动和引用一致性需要原子切换；它做的是“把必须停的阶段做短、做可预测”，而不是完全不暂停。**\n\n### 11. JVM 调优三角？\n\nJVM 调优本质是时延、吞吐、内存三角平衡，不可能同时最优。线上要先明确优先级（比如交易链路优先时延），再围绕目标做参数和代码层面的联合优化。\n\n<a id=\"toc-concurrency-juc\"><\/a>\n\n## 12. 补充原文：G1收集器\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n#### 2.3.1 G1收集器\n\nG1收集器 (`-XX:+UseG1GC`, 复制 + 标记-整理算法)\n- 将整个 Java 堆内存划分成多个大小相等的 Region\n- 年轻代和老年代不再物理隔离，不需要在 JVM 启动时就决定哪些 Region 属于年轻代，哪些属于老年代\n- Garbage First 收集器的特点\n- 并行和并发\n- 独立管理整个堆，分代收集\n- 空间整合（基于标记-整理算法，解决内存碎片问题）\n- 可预测的停顿（可以设置停顿时间不超过 m 毫秒）\n\n## 13. 补充原文：ZGC\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n#### 2.3.2 ZGC\n\nZGC（The Z Garbage Collector）是 JDK 11 中推出的一款低延迟垃圾回收器，它的设计目标包括：\n- 停顿时间不超过 10ms；\n- 停顿时间不会随着堆的大小，或者活跃对象的大小而增加；\n- 支持 8MB~4TB 级别的堆（未来支持 16TB）。\n\nZGC 几乎所有暂停都只依赖于 GC Roots 集合大小，停顿时间不会随着堆的大小或者活跃对象的大小而增加。与 ZGC 对比，G1 的转移阶段完全 STW 的，且停顿时间随存活对象的大小增加而增加。\n\nZGC 关键技术：ZGC 通过着色指针和读屏障技术，解决了转移过程中准确访问对象的问题，实现了并发转移。并发转移中“并发”意味着 GC 线程在转移对象的过程中，应用线程也在不停地访问对象。假设对象发生转移，但对象地址未及时更新，那么应用线程可能访问到旧地址，从而造成错误。而在 ZGC 中，应用线程访问对象将触发“读屏障”，如果发现对象被移动了，那么“读屏障”会把读出来的指针更新到对象的新地址上，这样应用线程始终访问的都是对象的新地址。JVM 判断对象是否被移动过，就是利用对象引用地址中的着色指针。\n","title":"JVM与GC核心问答"},"02_后端/08_Spring与SpringBoot/01_核心问答.md":{"md":"# Spring与Spring Boot核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. Spring / Spring Boot 高频问题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## Spring/Spring Boot（8）\n\n### 1. Bean 生命周期关键阶段？\n\n典型阶段是实例化、属性注入、`Aware` 回调、`BeanPostProcessor` 前后处理、初始化方法、容器销毁。理解这个顺序有助于定位初始化失败和增强逻辑失效问题。\n\n1. 实例化（new 对象）\n\nSpring 先通过构造器创建 Bean 实例，但这时依赖还没注入，功能还不完整。\n\n1. 属性注入（依赖注入）\n\n把 `@Autowired@Value` 等依赖和配置注入进来。  \n\n1. BeanPostProcessor 前置处理\n\n执行 `postProcessBeforeInitialization`。  \n\n常用于通用增强、校验、字段处理。\n\n1. 初始化阶段\n\n按顺序可能触发：  \n\n- `@PostConstruct`  \n- `InitializingBean.afterPropertiesSet()`  \n- 自定义 `init-method`\n\n这一步通常做资源初始化、参数校验、缓存预热。\n\n1. BeanPostProcessor 后置处理\n\n执行 `postProcessAfterInitialization`。  \n\nAOP 代理（事务、日志切面等）很多在这一步包装出来。  \n\n所以你拿到的 Bean 可能已经是代理对象。\n\n1. 运行期使用\n\nBean 正常参与业务调用。\n\n1. 容器关闭 -> 销毁阶段\n\n会触发：  \n\n- `@PreDestroy`  \n- `DisposableBean.destroy()`  \n- 自定义 `destroy-method`\n\n用于释放连接、线程池、文件句柄等资源。\n\n一句话收口：  \n\nBean 生命周期本质是“创建 -> 注入 -> 增强 -> 初始化 -> 使用 -> 销毁”，AOP 和很多框架能力都挂在这个链路上。\n\n### 2. 为什么用 BeanPostProcessor？\n\n**BeanPostProcessor（BPP）是 Spring 给“全局增强 Bean”的总入口。**\n\n它允许在 Bean 初始化前后织入通用逻辑，比如初始化之前做 统一参数校验、默认值填充, 初始化之后做 AOP、事务、自动注入扩展 都依赖该扩展点实现。\n\nBPP 把增强逻辑从业务类中抽离到容器层统一执行，框架能力才能做到无侵入、可复用、可治理。\n\n### 3. 事务传播常见用法？\n\n事务传播记成**方法 A 调方法 B 时，B 要不要共用 A 的事务**, `REQUIRED` 复用当前事务，是最常见默认选择, 常用作主业务链路(下单,扣库存, 写订单)；`REQUIRES_NEW` 会挂起外层事务并开启新事务，常用于审计日志、补偿记录等需独立提交场景。\n\n最常用两个：\n\n1. `REQUIRED`（默认）\n\n- 有事务就加入当前事务  \n- 没事务就新开一个\n\n含义：A 和 B 通常“一荣俱荣、一损俱损”，任一抛异常都可能一起回滚。  \n\n适合：主业务链路（下单、扣库存、写订单）。\n\n1. `REQUIRES_NEW`\n\n- 不管外层有没有事务，B 都新开事务  \n- 外层事务会被挂起，B 提交/回滚后再恢复外层\n\n含义：B 的提交结果与 A 解耦，A 后续失败也不影响 B 已提交。  \n\n适合：审计日志、操作留痕、补偿记录（必须落库）。\n\n你还要顺带记两个常见点：\n\n1. 为什么“写了 `@Transactional` 还不生效”\n\n同类内部自调用不会走代理，传播行为也不会生效。\n\n1. `REQUIRES_NEW` 不能滥用\n\n会增加事务数量、连接占用和锁竞争；只给“必须独立提交”的小操作用。\n\n面试一句话：  \n\n`REQUIRED` 保证主流程原子性`REQUIRES_NEW` 用来做与主事务解耦的独立落库；选型本质是‘一致回滚’还是‘独立留痕’。”\n\n### 4. 为什么自调用会让 `@Transactional` 失效？\n\nSpring 事务基于代理拦截，方法自调用走的是对象内部调用，不经过代理，所以事务注解不生效。常见解法是拆到独立 Bean、通过代理对象调用。\n\n### 5. Spring AOP 常见场景？\n\n**一、Spring AOP 常见场景**\n\n1. 日志与链路追踪\n\n统一记录接口入参、耗时、traceId，不污染业务代码。统计方法 RT、成功率、异常率，上报 Prometheus 等监控系统。\n\n1. 事务管理\n\n`@Transactional` 本质就是 AOP 在方法前后做事务开启/提交/回滚。\n\n1. 权限与鉴权\n\n在 Controller/Service 入口做统一权限校验，失败直接拦截。\n\n1. 审计与合规\n\n对敏感操作统一留痕（谁在什么时候做了什么）。\n\n**二、AOP 实现原理（面试重点）**\n\n1. 核心思想\n\nSpring 给目标对象“套代理”，调用先进入代理，再执行切面逻辑，最后再调用目标方法。\n\n1. 关键概念\n\n- `JoinPoint`：可被拦截的位置（Spring 里主要是方法执行）  \n- `Pointcut`：匹配哪些方法  \n- `Advice`：增强逻辑（Before/After/Around/AfterThrowing）\n\n1. 代理方式\n\n- 有接口：默认常用 JDK 动态代理（基于接口）  \n- 无接口：用 CGLIB 生成子类代理\n\n（Spring Boot 里很多场景会走 CGLIB）\n\n1. 执行链路（最常考）\n\n外部调用 -> 代理对象 -> 拦截器链（多个 Advice） -> 目标方法 -> 返回/异常处理。  \n\n`@Around` 可以决定是否继续执行目标方法`proceed()`）。\n\n一句话收口：  \n\nSpring AOP 是“代理 + 拦截器链”机制，把日志、事务、鉴权等横切能力从业务代码里抽出来统一治理。\n\n### 6. `ApplicationContext` 与 `BeanFactory` 区别？\n\n`\n\n1. 定位区别`\n\n`- BeanFactory：最底层 IOC 容器接口，核心是“注册、获取、管理 Bean”。`  \n\n`- ApplicationContext：在 BeanFactory 之上的完整企业容器，功能更全。`\n\n`\n\n1. 功能区别`\n\n`BeanFactory 主要有：`  \n\n`- 依赖注入`  \n\n`- Bean 生命周期管理`  \n\n`- 基础作用域支持`\n\n`ApplicationContext 额外提供：`  \n\n`- 国际化MessageSource）`  \n\n`- 事件发布/监听ApplicationEventPublisher）`  \n\n`- 资源加载ResourceLoader）`  \n\n`- 环境与配置体系Environment）`  \n\n`- 自动注册 BeanPostProcessor，更好集成 AOP、事务等`\n\n`\n\n1. Bean 加载时机（常考）`\n\n`- BeanFactory：偏延迟加载（getBean 时才创建）。`  \n\n`- ApplicationContext：默认容器启动时预实例化单例 Bean。`  \n\n`这使得 ApplicationContext 启动更“重”，但错误能更早暴露。`\n\n`\n\n1. 为什么生产几乎都用 ApplicationContext`\n\n`因为现代 Spring 应用要用到事件、配置、AOP、事务、自动装配等能力ApplicationContext 开箱即用，开发和治理成本更低。`\n\n`\n\n1. 一句话总结`\n\n`BeanFactory 是“能用的最小容器”ApplicationContext 是“企业级完整容器”；实际项目默认选 ApplicationContext。`\n\n### 7. 配置治理最佳实践？\n\n配置应按环境分层，敏感信息外置到密钥系统，避免硬编码进仓库。再通过配置中心做版本管理和灰度发布，并明确优先级与回滚策略，减少误配事故。\n\n### 8. Hashmap相关\n\nhashmap的底层数据结构: 数组+链表 / 数组+红黑树\n\n#### hash算法和寻址算法如何优化的\n\nhash算法优化(hash扰动): (h = key.hashCode()) ^ (h >>> 16);  \n先将原hash值右移16位 , 然后与原hash值做异或运算. 让原来hash的高低16位进行了异或 , 让新hash的低16位同时保持了老hash的高低16位的特征.  \n因为后序与(n-1)做&运算 , n-1一般不会太大,高16位都会是0 , 主要是低16位做运算 , 高16位没有参与到整个算法中. 所以新hash的低16位保留了高低16位的特征会避免一些hash冲突.\n\n寻址算法优化: hash & (n - 1) 代替 hash % n  \nhash值与n(数组长度) - 1 做与&运算 . 取模运算性能较差, 并且还要考虑对负数进行额外处理 , 当数组长度是2的n次方时 , hash&(n-1)与hash对n取模效果是等价的 , &运算二进制运算性能更高 .  \n在初始化时 , 如果数组的长度输入其他数字，它初始化的时候会调用一个roundUpToPowerOf2方法，就是把它调整为2的幂 .\n\n#### 为什么数组容量会是2的倍数，以及扩容为什么是扩成两倍\n\n可以减少碰撞几率，2的倍数 -1 得到值所有位都是1，和计算值相与后能保证结果单一，如果位上的0越多，碰撞概率越大 举个例子。。 比如容量是2的4次方 减1就是 1111. 那么计算值1110过来和他相与， 结果是1110，另一个计算值1111和他相与结果仍是1111 各自结果不一样 不会碰撞 如果容量不是2的4次方 比如15 减1就是1110. 那么计算值1110过来和他相与， 结果是1110，另一个计算值1111和他相与结果是1110 跟前一个一样 发生碰撞了.\n\n#### 如何解决hash碰撞问题\n\nHashMap在hash碰撞的时候会形成链表，当链表长度超过8，并且当前数组长度大于64的时候才会转化为红黑树结构。这样做的原因是红黑树的查询复杂度是log（n），而链表的复杂度是O(n)。而当HashMap的红黑树的元素小于6时重新转化为链表结构。\n\n并不是链表的长度超过了默认的阈值8时，就一定转树状结构，还要判断数组的长度是否已经经过了扩容。MIN_TREEIFY_CAPACITY的值是64，就是说如果你的数组没有经过扩容操作的情况下，如果链表长度已经超过8了， 此时不转树状结构，而是进行数组扩容，数组扩容时会重新散列，将链表的节点均匀的分布，查询效率对比转树状结构也要好.\n\n问题1：本节题目是：你知道HashMap是如何解决hash碰撞问题的吗？但是通篇好像没讲如何解决hash碰撞。个人理解，没有完美的方法完全解决hash碰撞，jdk是通过上节讲的key哈希值的高16与低16位的抑或的结果来降低hash碰撞的概率。\n\n问题2：jdk为什么要选择在链表长度大于8且数组长度大于64的时候转为红黑树，而在红黑树元素小于6时重新回归链表，这里面为什么时8和6呢？不是12，16等其他数字？\n\n长度为8时树化 长度为6时链表化；hash随机算法足够好(碰撞概率低)，就会遵从泊松分布，达到长度8的概率是 0.00000006 (百万分之六源码里的数据)；当节点的个数小于等于 6 时，红黑树会自动转化成链表，主要还是考虑红黑树的空间成本问题，当节点个数小于等于 6 时，遍历链表也很快，所以红黑树会重新变成链表\n\n问题3:为什么不直接用红黑树就可以了，还要转化为链表再转化成红黑树呢？\n\n红黑树得每次增加去除元素都比较复杂,伴随着整个树得左旋右旋还有元素得重新排列,因此,它得出现是为了针对某种特殊情况下得一种优雅得操作.是一种兜底得操作.理论上讲,链表长度超过8得情况发生得概率不超过百万分之六.小概率事件得发生意味着某种错误操作得出现,所以这种情况还会继续发生,为了应对以后要到来得这种恶劣得情况才会转化成红黑树,这个玩意儿其实并不好,理想情况下不发生哈希碰撞得才是最完美得.\n\n完全“避免”哈希碰撞做不到，只能**降低概率 + 优雅处理**。\n\n1. 降低碰撞概率\n  - 设计更好的哈希函数（分布均匀）\n  - 做哈希扰动（如 Java 的 h ^ (h >>> 16)）\n  - 合理扩容（保持低负载因子，默认 0.75）\n  - 桶长度用 2 的幂，配合 hash & (n-1) 均匀寻址\n2. 发生碰撞后的处理\n  - JDK8 HashMap：先链表，链表过长（>=8）且容量足够时树化为红黑树\n  - 这样最坏查找从链表 O(n) 改善到树 O(log n)\n\n#### HashMap如何进行扩容\n\n首先是扩容的时机：是在put的最后一步来判断要不要扩容的 , 扩容阈值是数组容量*负载因子 , 2倍扩容，0.75阈值 .\n扩容过程中涉及rehash操作:\n如果该桶单元只有一个数据 , 直接 e.hash & (newCap -1 ) 重新计算新桶的位置 .\n如果该桶单元是一个链表 , 每个元素 (e.hash & oldCap) == 0 判断在新桶中的位置是在原位置还是原位置+oldCap 链表的顺序不变 , 会分成两部分 , 一部分在新桶中的原位置 , 另一部分放在新桶中的原位置+oldCap , 可以看到这里并不是避免了定位的与运算 , 而是避免了链表数据进入新桶多次的hash冲突 ,\n如果桶单元是一个红黑树 , (e.hash & oldCap) == 0与桶单元是链表逻辑类似，判断在新桶中的位置是原位置，还是原位置+oldCap，红黑树顺序不变 , 同时将根节点放到桶单元中会判断树中数据长度，小于等于6转换成链表。与链表的原理一致，只是多了转换成链表的判断。\n\n#### HashMap扩容时的线程安全问题\n\njdk1.8之前 , 链表才有用头插思路(新增的节点放在头部 , 这么设计考虑新增的节点会有更大概率被用到) , 但是头插在hashmap扩容(扩容时机: hashmap中元素个数 >= 容量 * 扩容因子)的时候 , 高并发情况下 , 链表在transfer的时候会形成环 , 造成死循环 . jdk1.8之后链表采用尾插法 , 同时在扩容的时候 , 将通过 e.hash & oldCap == 0将链表分为两个部分 , 一分部留在原位置 , 另一部分整体迁移到原位置+oldCap , 这样保留了原来的顺序 , 避免了resize时候的hash碰撞 , 解决了死循环问题.\n\n### 9.如何排查cpu过高(80%,90%)？\n\ntop -c 查看所有的进程\n在1的基础上键入P让cpu从高到底排序\n选择2中cpu占比最高的pid进程\ntop -Hp pid 查看pid对应的线程对cpu的占比\n在4的页面键入P让当前pid的线程cpu占比从高到低排序\n获取第5步骤中的线程占比最高的线程id,由于linux打印的id是16进制的\n将第6的线程id十六进制转为10进制 print \"%xn\" tid\n打印指定pid下指定tid的jstack日志,jstack pid | grep tid -C 10 --color\n根据堆栈信息找到代码块\n\n### 10.Spring 解决 IOC 循环依赖?\n\nSpring 解决 IOC 循环依赖，核心是 **“三级缓存 + 提前暴露对象引用”**，但主要只对 **单例 + setter/字段注入** 生效。\n\n1. 三个缓存\n\n- `singletonObjects`：一级缓存，完整初始化好的单例。  \n- `earlySingletonObjects`：二级缓存，提前暴露的“早期对象”。  \n- `singletonFactories`：三级缓存，能生成早期引用的工厂（关键用于 AOP 代理）。\n\n1. 典型流程（A 依赖 B，B 依赖 A）\n\n- 创建 A（先实例化，还没注入）  \n- 把 A 的 `ObjectFactory` 放入三级缓存  \n- A 注入 B，触发创建 B  \n- B 注入 A 时，从三级缓存拿到 A 的早期引用（必要时是代理）  \n- B 完成初始化进一级缓存  \n- 回到 A，注入 B，A 完成初始化进一级缓存\n\n1. 为什么要三级缓存\n\n二级缓存只能放“对象”，三级缓存能“按需生成早期引用”，这样可以保证 AOP 场景下注入的是正确代理对象，而不是原始对象。\n\n1. 实战建议\n\n优先改设计解耦；必要时用 `@Lazy`、`ObjectProvider`、中间服务拆分来打断依赖环。\n\n<a id=\"toc-distributed-design\"><\/a>\n","title":"Spring与Spring Boot核心问答"},"02_后端/09_RPC与网关治理/01_核心问答.md":{"md":"# RPC与网关治理核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. RPC 与注册中心\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 1. RPC与注册中心（6）\n\n### 1. 问：Dubbo、Spring Cloud、gRPC、Thrift 怎么选？\n\n答：优先按“协议性能、生态成熟度、团队技术栈”选型。Java 内网高性能调用常见 Dubbo/gRPC；跨语言统一协议常用 gRPC/Thrift；若团队已重度 Spring 生态且治理组件齐全，Spring Cloud 落地成本最低。  \n追问：如果核心链路从 HTTP 改 gRPC，网关、监控和鉴权要改哪些点？\n\n### 2. 问：RPC 一次调用的完整链路是什么？\n\n答：调用方先通过代理拦截本地接口，序列化请求并做服务发现、负载均衡，再经网络传输到服务端；服务端反序列化后执行业务逻辑并返回结果，客户端再做反序列化、超时控制和重试决策。  \n追问：链路里最常见的性能瓶颈在哪三处，如何快速定位？\n\n### 3. 问：服务注册中心的核心职责是什么？\n\n答：核心是“服务实例元数据维护 + 健康检查 + 发现路由”。提供者注册并周期上报心跳，消费者订阅实例变更并更新本地路由表。注册中心本身要保障高可用、弱依赖和故障时可降级读本地缓存。  \n追问：注册中心短时不可用时，消费者如何避免全链路雪崩？\n\n### 4. 问：RPC 的超时、重试、熔断怎么配？\n\n答：先按下游 P99 延迟设超时，再设置有限次重试并加抖动退避，避免放大故障；对非幂等写请求默认不自动重试。熔断要按错误率和慢调用触发，并配合半开探测恢复，防止长期黑洞。  \n追问：为什么“重试次数越多越危险”，在高峰时如何止损？\n\n### 5. 问：序列化协议取舍看什么？\n\n答：看四点：性能、兼容、可调试、跨语言。Protobuf 体积小性能高且跨语言强；JSON 可读性好但体积大；Hessian/Java 原生序列化易用但版本兼容和安全风险要额外治理。生产上更偏 Protobuf。  \n追问：线上灰度升级时，如何做字段向前/向后兼容？\n\n### 6. 问：RPC 调用失败的排查顺序是什么？\n\n答：先看调用维度监控：超时率、错误码、重试率；再分层排查 DNS/注册发现、网络连接池、线程池和下游依赖。最后结合 TraceId 还原单次请求路径，区分“流量突增、代码回归、下游抖动”三类根因。  \n追问：同样是超时，如何快速判断是网络抖动还是线程池打满？\n\n高频连问路径：\n\n1. 选型对比 -> 链路细节 -> 瓶颈定位\n2. 注册发现 -> 心跳机制 -> 故障降级\n3. 超时重试 -> 重试风暴 -> 熔断恢复\n\n## 2. 网关与流量治理\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 2. 网关与流量治理（6）\n\n### 1. 问：网关的职责边界是什么？\n\n答：网关负责统一入口治理：鉴权、路由、限流、灰度、审计和协议转换；不应承载重业务逻辑。原则是“控制面集中、业务面下沉”，避免网关演化成超级单体，导致发布风险和性能瓶颈同时上升。  \n追问：哪些逻辑必须放网关，哪些必须下沉到业务服务？\n\n### 2. 问：动态路由一般怎么实现？\n\n答：常见做法是路由配置中心化存储，网关实例通过订阅推送或定时拉取刷新本地路由表，刷新过程走版本号与原子替换，避免半更新状态。路由规则要支持回滚，且变更全链路可审计。  \n追问：如何保证路由热更新时“无中断 + 不丢请求”？\n\n### 3. 问：网关如何扛住 10w QPS？\n\n答：核心是无状态横向扩容 + 轻量过滤链 + 连接池优化。数据面用 Nginx/Netty 低开销处理，热点校验本地缓存化；慢逻辑异步化。再配合 CPU 绑核、零拷贝、限流和熔断，保障高峰时延可控。  \n追问：在网关里做 JWT 鉴权时，如何降低验签 CPU 消耗？\n\n### 4. 问：网关鉴权与签名校验怎么设计？\n\n答：先做身份鉴别（JWT/OAuth2/API Key），再做权限判定（资源级 ACL/RBAC），最后校验重放防护（时间戳+nonce+签名）。敏感接口要有细粒度审计日志，确保“谁在何时访问了什么资源”可追踪。  \n追问：如果 token 被盗用，网关层有哪些快速止血手段？\n\n### 5. 问：限流、熔断、降级在网关怎么配合？\n\n答：限流负责入口削峰，熔断负责隔离故障下游，降级负责快速返回兜底结果。三者顺序通常是“先限流再转发，转发前后看熔断状态，失败后走降级”。治理指标要按租户、接口、区域三维拆分。  \n追问：如何避免把所有流量都打成 429 导致业务全面不可用？\n\n### 6. 问：灰度发布在网关层怎么落地？\n\n答：基于请求标签做流量分组，如用户ID、Header、地域或版本号，先小流量导入新版本并实时观测错误率和延迟。灰度策略必须可一键回切，且与配置变更解耦，防止发布与路由事故叠加。  \n追问：灰度过程中出现“部分用户会话漂移”如何解决？\n\n高频连问路径：\n\n1. 职责边界 -> 动态路由 -> 热更新一致性\n2. 高并发优化 -> 限流熔断 -> 降级策略\n3. 灰度发布 -> 监控阈值 -> 一键回滚\n\n## 3. Service Mesh 与 Istio\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 6. Service Mesh与Istio（6）\n\n### 1. 问：为什么需要 Service Mesh？\n\n答：Mesh 把重试、限流、熔断、可观测和 mTLS 等通用治理能力从业务代码中抽离，降低多语言系统治理成本。业务团队聚焦领域逻辑，平台团队统一治理策略，减少重复造轮子和实现不一致。  \n追问：在什么规模下引入 Mesh 才更划算？\n\n### 2. 问：Sidecar 模式的收益与代价是什么？\n\n答：收益是能力标准化、流量可编程、可观测统一；代价是资源开销增加、链路复杂度上升、排障层次变深。Sidecar 适合治理需求强且服务数量大的系统，小规模系统可能得不偿失。  \n追问：如何量化 Sidecar 带来的时延和成本增量？\n\n### 3. 问：Istio 的核心能力有哪些？\n\n答：核心是流量治理（路由、灰度、熔断）、安全（mTLS、身份认证、授权）和可观测（指标、日志、追踪）。控制面下发策略，数据面执行策略。实际落地要严格做版本治理和配置审计。  \n追问：为什么 Istio 配置错误会导致全局性故障？\n\n### 4. 问：Mesh 和网关的边界怎么划分？\n\n答：网关主要处理南北向流量（外部到内部），Mesh 主要处理东西向流量（服务间通信）。两者都可做流量治理，但职责不同：网关更偏入口安全与聚合，Mesh 更偏服务间治理一致性。  \n追问：同一条流量在网关和Mesh都限流会有什么问题？\n\n### 5. 问：引入 Mesh 后排障方式有什么变化？\n\n答：排障从“应用日志单点定位”升级为“应用 + Sidecar + 控制面”三层联动。要同时看业务指标、代理日志、配置下发状态和证书链路。很多问题不是代码 bug，而是治理配置或策略冲突。  \n追问：最常见的 Mesh 误配置导致故障有哪些？\n\n### 6. 问：哪些场景不建议上 Mesh？\n\n答：服务规模小、治理诉求弱、团队运维能力不足时不建议上 Mesh。因为它会引入额外复杂度与成本。若仅需少量治理能力，可先用 SDK/网关方案，等规模和多语言需求上来再演进。  \n追问：如果不引入 Mesh，如何先做“轻量治理”过渡？\n\n高频连问路径：\n\n1. 引入动机 -> 收益代价 -> 适用边界\n2. Istio能力 -> 配置治理 -> 故障案例\n3. 网关边界 -> 责任划分 -> 冲突消解\n\n## 补充原文：Dubbo 调用底层实现与服务治理\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### Dubbo调用底层实现\n\n消费者侧通常会经历这些层次：\n1. **动态代理**：调用方面向接口编程，底层通过代理对象拦截方法调用。\n2. **负载均衡**：从服务列表里选一台机器，例如 random、consistent hash 等策略。\n3. **协议层**：决定走 dubbo / rmi / hessian / http 等协议。\n4. **网络通信**：底层常基于 Netty / Mina 做 NIO 异步通信。\n5. **序列化**：把请求编码成二进制后发出去。\n\n服务端则做反序列化、协议解析、网络收包，再通过代理调到真正的本地服务实现。\n\nDubbo 常见集群容错策略：\n- `failover`：失败自动切换并重试，常用于读操作；\n- `failfast`：失败立刻返回，常用于非幂等写操作；\n- `failsafe`：失败忽略，适合日志这类非关键调用；\n- `failback`：失败后后台重发，适合消息通知类；\n- `forking`：并行调用多个 provider，一个成功就返回，换时延但更耗资源。\n\nDubbo 的 SPI 机制本质是：运行时按配置动态装配接口实现类。比如协议、序列化、代理、负载均衡这些扩展点，都可以通过 SPI 替换。\n\n服务治理重点：\n- 自动生成调用链路；\n- 统计访问量、时长、可用率；\n- 监控失败率并报警；\n- 做服务分层，避免循环依赖；\n- 配置超时、重试和降级策略。\n\n## 补充原文：注册中心与 RPC / Spring Cloud 对比\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 如何设计一个 RPC 框架\n\n最小闭环通常包括：\n1. **动态代理**：把本地接口调用代理成远程调用；\n2. **注册中心**：保存服务注册信息，并支持服务发现；\n3. **负载均衡**：从多个 provider 中选路；\n4. **协议与序列化**：定义请求格式和编解码；\n5. **网络通信框架**：通常用 Netty 实现高并发连接处理。\n\n### Dubbo 和 Spring Cloud 的差异\n\n- Dubbo 更偏 **高性能 RPC 框架**，基于 TCP，调用更轻量；\n- Spring Cloud 更偏 **整套分布式系统解决方案**，组件更全，和 Spring 生态结合更深；\n- 关键差异在于：一个偏“RPC 框架”，一个偏“治理生态 + HTTP 体系”。\n\n### 注册中心比较：Eureka / ZooKeeper\n\n1. **ZooKeeper**\n- 偏 `CP`，强调一致性；\n- 服务列表变更可通过 watcher 快速通知客户端；\n- 缺点是服务实例很多时，推送压力会很大。\n\n2. **Eureka**\n- 偏 `AP`，优先保证可用；\n- 节点间 peer 同步，消费者周期性拉取注册表；\n- 默认配置下变更感知偏慢，但可通过缩短缓存同步、心跳和拉取周期来优化。\n\n3. **大规模注册中心优化思路**\n- 服务注册表做分片存储；\n- 节点主从备份，保证高可用；\n- 消费者通过代理层按需拉取部分注册信息；\n- 避免所有节点保存全量数据导致同步风暴。\n\n## 补充原文：网关选型与职责\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 网关\n\n网关的职责通常包括：\n- 动态路由、负载均衡；\n- 灰度发布；\n- 统一鉴权；\n- 统一限流、熔断、降级；\n- 响应缓存；\n- 对外暴露统一入口。\n\n常见选型：\n- `Kong`：基于 Nginx / OpenResty，插件丰富，抗高并发强；\n- `Zuul`：Java 技术栈友好，但高并发能力一般；\n- `自研网关`：用 Java / Servlet / Netty 自己构建，灵活度最高，但成本也最高。\n\n动态路由常见做法：\n- 路由关系存配置中心或数据库；\n- 网关实例通过订阅或定时刷新加载本地路由表；\n- 发布配合灰度策略和回滚开关。\n\n如果面试官追问“网关如何扛 10w QPS”，可以继续强调：\n- 无状态水平扩容；\n- Nginx/Netty 低开销处理链；\n- 本地缓存热点鉴权数据；\n- 限流熔断前置；\n- 机器规格和前置 LVS/Nginx 负载均衡配合。\n\n## 补充原文：ZooKeeper / ZAB 与注册中心优化\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### ZooKeeper\n\nZooKeeper 是典型的分布式协调系统，常见用途包括：\n- 分布式锁；\n- 集群元数据存储；\n- Master 选举；\n- 分布式协调与通知。\n\n集群角色通常有三种：\n- `Leader`：负责写；\n- `Follower`：同步数据并提供读；\n- `Observer`：只读，不参与选举。\n\n客户端和 ZooKeeper 之间会建立 TCP 长连接，也就是一个 `session`。只要客户端在 `sessionTimeout` 内重新连回任一台 ZK 节点，就可以延续原来的 session；否则临时节点会失效。\n\nZK 的数据模型是 `znode` 树：\n- **持久节点**：适合放元数据；\n- **临时节点**：连接断开就消失，适合分布式锁、服务在线状态、协调通知。\n\nWatcher 是 ZK 非常核心的能力：客户端可以对 znode 注册监听，节点变化时收到回调通知。\n\n### ZAB 协议\n\nZAB（ZooKeeper Atomic Broadcast）可以理解成“带顺序保证的主从同步协议”：\n- Leader 收到事务请求后，先写本地日志；\n- 再把事务 proposal 按顺序同步给 follower；\n- follower 先写磁盘日志，再返回 ack；\n- Leader 收到过半 ack 后发出 commit；\n- follower 收到 commit 后才真正让新数据可见。\n\n这里的关键点：\n- proposal 会带全局递增的 `zxid`，保证顺序；\n- 采用过半写机制；\n- Leader 崩溃后，只要超过半数节点存活，就能重新选主并恢复服务。\n\n从一致性角度看，ZooKeeper 不是“严格强一致”，更准确地说是**顺序一致性优先、最终收敛**。如果业务强依赖强一致读，可以主动调用 `sync()`。\n\n### 注册中心选型与优化\n\n1. **ZooKeeper vs Eureka**\n- ZK 偏 `CP`，一致性更强、变更感知快；\n- Eureka 偏 `AP`，可用性更强，但默认感知较慢；\n- Eureka 可以通过缩短缓存同步、心跳、拉取周期来把感知延迟从几十秒压到几秒。\n\n2. **大规模注册中心优化**\n当服务实例规模上万时，常见优化思路是：\n- 注册表做分片存储，不让每台机器存全集；\n- 每个分片再做主从备份保证高可用；\n- 消费者通过代理层按需拉取局部注册信息；\n- 避免每次变更都在全集上广播和同步。\n\n3. **Redis 能不能当注册中心**\n可以，但更像工程折中方案：\n- Provider 把实例信息写到 Redis Hash，并设置 TTL；\n- 周期性刷新过期时间作为心跳；\n- Consumer 周期性扫描服务前缀拉取列表；\n- 多集群部署时再通过路由逻辑分摊写入和读取压力。\n\n适合轻量级、内部可控场景；如果要求强一致注册发现和丰富 watcher 语义，ZooKeeper / etcd 仍然更标准。\n","title":"RPC与网关治理核心问答"},"02_后端/10_网络I_O与发布治理/01_核心问答.md":{"md":"# 网络I/O与发布治理核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. 网络 I/O 与 Netty\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 5. 网络I/O与Netty（6）\n\n### 1. 问：BIO、NIO、AIO 的核心区别是什么？\n\n答：BIO 是同步阻塞，一连接一线程；NIO 是同步非阻塞，基于事件轮询处理多连接；AIO 是异步非阻塞，由系统完成 I/O 后回调。高并发网络服务通常采用 NIO/Netty，平衡性能与工程复杂度。  \n追问：Java 生态里为什么 AIO 在业务系统里不如 NIO 常见？\n\n### 2. 问：I/O 多路复用原理怎么讲？\n\n答：多路复用通过一个线程监听多个连接的就绪事件（读/写/异常），只在事件到达时分发处理，避免线程被阻塞空耗。Linux 常见实现是 select/poll/epoll，其中 epoll 在高并发连接下更高效。  \n追问：epoll 相比 select 的核心优化点是什么？\n\n### 3. 问：Netty 如何体现 Reactor 模型？\n\n答：Netty 通常采用主从 Reactor：Boss 线程负责 accept，新连接分配给 Worker 线程处理读写事件。业务处理可再下沉到业务线程池，避免 I/O 线程被阻塞。这样实现了连接管理和业务计算解耦。  \n追问：如果在 I/O 线程里做重计算，会出现什么线上表现？\n\n### 4. 问：粘包/半包问题如何处理？\n\n答：TCP 是字节流，不保留消息边界，可能出现粘包半包。解决方式是自定义协议边界：固定长度、分隔符、长度字段。Netty 常配合 LengthFieldBasedFrameDecoder 等解码器确保消息按帧还原。  \n追问：长度字段被恶意构造时，如何防止内存攻击？\n\n### 5. 问：零拷贝和 mmap 有什么价值？\n\n答：核心是减少用户态与内核态之间的数据拷贝和上下文切换。sendfile/mmap 能显著提升大文件传输和高吞吐场景性能。Kafka、Nginx 等都依赖这些能力，但要注意页缓存行为和内存占用。  \n追问：零拷贝能否完全避免 CPU 参与，为什么？\n\n### 6. 问：Netty 堆外内存泄漏怎么排查？\n\n答：先看 direct memory 指标和 Full GC 行为，再启用泄漏检测（ResourceLeakDetector）定位未释放 ByteBuf。排查重点是引用计数对象是否成对 release，以及异常分支是否遗漏释放逻辑。  \n追问：线上开启最高级泄漏检测的代价是什么？\n\n高频连问路径：\n\n1. BIO/NIO/AIO -> 多路复用 -> Reactor\n2. TCP字节流 -> 粘包半包 -> 编解码\n3. 零拷贝 -> 堆外内存 -> 泄漏排查\n\n## 2. OS 网络排障与发布治理\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 8. OS网络排障与发布治理（6）\n\n### 1. 问：线上 CPU 飙高怎么排查？\n\n答：先用 top 定位高负载进程，再用 top -Hp 定位热点线程，线程ID转16进制后用 jstack 对应堆栈，确认是死循环、锁竞争还是频繁GC。最后结合发布记录和流量变化判断是代码回归还是流量异常。  \n追问：如果热点线程都在 WAITING，CPU 为什么还可能高？\n\n### 2. 问：内存与 GC 现场怎么快速定位？\n\n答：先看 GC 日志和 jstat 判断是频繁 Young GC 还是 Full GC，再用 jmap/jcmd 导出堆信息分析大对象和泄漏链。区分是堆内、元空间还是堆外内存问题，定位后再做参数和代码双向修复。  \n追问：什么时候该优先抓 heap dump，什么时候先看 NMT？\n\n### 3. 问：网络基础高频题如何简洁回答？\n\n答：三次握手是为确认双方收发能力，四次挥手是全双工独立关闭；HTTP/1.1 解决长连接，HTTP/2 引入多路复用与头压缩，HTTP/3 基于 QUIC 减少队头阻塞。回答要围绕“为什么比上一代更好”。  \n追问：为什么 HTTP/2 多路复用下仍可能出现延迟抖动？\n\n### 4. 问：蓝绿、金丝雀、Beta 有什么区别？\n\n答：蓝绿是两套完整环境切换，回滚快但成本高；金丝雀是小流量逐步放量，风险最可控；Beta偏目标人群试用验证。生产上常用“金丝雀 + 指标门禁 + 自动回滚”组合，而不是单一策略。  \n追问：大促期间为什么不建议做大比例金丝雀？\n\n### 5. 问：灰度发布的风险控制关键点是什么？\n\n答：关键是“分批、观测、门禁、回滚”。先按用户/区域分批放量，监控错误率、RT、资源和业务指标；设置自动暂停阈值；异常时一键回切。灰度策略必须和配置版本绑定，避免策略漂移。  \n追问：灰度看板里你最看重哪3个核心指标？\n\n### 6. 问：变更三板斧怎么落地到工程体系？\n\n答：可灰度是分批放量策略，可监控是发布窗口指标守护，可回滚是快速恢复能力。三者需要统一变更流水线承载，做到“发布前有准入、发布中有门禁、发布后有复盘”，形成闭环治理。  \n追问：如果监控阈值设太保守，会造成什么工程副作用？\n\n高频连问路径：\n\n1. CPU高 -> 线程热点 -> 堆栈定位\n2. GC异常 -> 内存分类 -> 现场抓取\n3. 发布策略 -> 灰度门禁 -> 自动回滚\n\n## 补充原文：Netty、堆外内存与零拷贝\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### Netty 与 Reactor\n\nReactor 模型本质是事件驱动分发：\n- Reactor 线程负责监听和分发 I/O 事件；\n- Handler 负责真正处理读写逻辑。\n\nNetty 常见是主从 Reactor：\n- `Boss/MainReactor` 负责接收连接；\n- `Worker/SubReactor` 负责连接上的读写事件；\n- 非 I/O 的业务逻辑再交给业务线程池，避免 I/O 线程阻塞。\n\n### 堆外内存（off-heap）\n\n使用 `ByteBuffer.allocateDirect()` 可以申请堆外内存。优势是：\n- 网络 I/O 或文件 I/O 时，数据本来就会进入堆外区域；\n- 如果直接使用堆外内存，就可以减少一次从堆内到堆外的拷贝。\n\n回收要点：\n- 可通过 `-XX:MaxDirectMemorySize` 限制最大堆外内存；\n- DirectByteBuffer 对象失去引用后，在 GC 时可能回收并释放堆外内存；\n- 堆外内存如果持续泄漏，也会触发 OOM。\n\n### mmap 与 sendfile / 零拷贝\n\n普通 I/O 读取磁盘文件再发网络，通常涉及：\n- 用户态/内核态多次切换；\n- 内核缓冲区 -> 用户缓冲区 -> Socket 缓冲区的多次拷贝。\n\n`mmap` 的核心是把内核缓冲区和用户缓冲区建立映射，减少一次数据拷贝。\n\n`sendfile` 的核心是：\n- 数据从磁盘到内核缓冲区；\n- 再直接从内核缓冲区交给网卡发送；\n- 省掉“先拷到用户态再写回内核”的过程。\n\n所以 Kafka、Tomcat 这类高吞吐系统会大量利用零拷贝来降低上下文切换和 CPU 拷贝成本。\n","title":"网络I/O与发布治理核心问答"},"02_后端/11_分布式事务与高可用/01_核心问答.md":{"md":"# 分布式事务与高可用核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类后端问题，尽量保留原题库原文。\n- 同一个主题只保留一个主文件，方便连续复习。\n- 每段内容都保留来源，方便你回查到旧资料。\n\n## 1. 分布式设计通用问题\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 分布式设计（8）\n\n### 1. CAP 在后端怎么落地理解？\n\n你这句总结很对。CAP 真正在后端落地时，要抓住一个关键点：\n\n1. CAP只在“发生网络分区(P)”时才要求取舍  \n\n平时网络正常时，很多系统既能高可用也能强一致。  \n\n一旦分区发生，你必须选：  \n\n- 要 `C`：宁可拒绝部分请求，也不返回旧数据  \n\n- 要 `A`：宁可先返回，后续再收敛一致\n\n2. 后端落地不是“系统级二选一”，而是“业务分级”  \n\n同一个公司里通常同时有 CP 和 AP 服务。  \n\n- 交易/资金/库存扣减：偏 `CP`（错一笔代价太高）  \n\n- 内容流/推荐/点赞计数：偏 `AP`（允许短暂不一致）  \n\n- 用户资料展示：常做折中（读AP、关键写CP）\n\n\n\n### 2. 最终一致性常见模式？\n\n1. Outbox 事件模式  \n本地业务数据和“待发送事件”写在同一个数据库事务里。  \n比如订单服务创建订单时，同时写一条 order_created 到 outbox 表。事务提交后，后台任务再把这条事件投递到 MQ。  \n这样能解决“订单写成功了，但消息没发出去”的问题。  \n它的关键价值是：把“数据库写入”和“事件产生”绑在一个本地事务里。\n2. 可靠重试  \n消费者收到消息后处理失败，不是直接放弃，而是按规则重试。  \n常见做法是：固定重试、指数退避、延迟队列、最大重试次数、失败后进死信队列。  \n这适合处理临时性故障，比如网络抖动、下游超时、锁冲突。  \n前提是消费逻辑必须幂等，否则重试会把业务做重。\n3. 补偿事务  \n如果某一步已经成功、后续步骤失败，就执行“反向操作”把系统拉回合理状态。  \n比如订单已创建，但库存扣减失败，那就把订单状态改成取消；  \n或者支付成功后发券失败，就补发券，实在不行就退款。  \n补偿事务不是回滚数据库，而是用业务语义“纠偏”。\n4. 定时对账 / 巡检修复  \n这是最终兜底。  \n即使 MQ 丢了、重试漏了、补偿没跑到，也可以通过定时任务扫描异常状态，把脏数据补回来。  \n比如每天扫“已支付但订单未完成”的记录，重新触发履约；  \n或者扫“outbox 未投递成功”的事件，重新发送。  \n它保证系统不是“出错就永远错下去”。  \n\n\n如果面试官继续追问，你再补一句：  \n“像积分、通知、履约这类链路我会优先用最终一致；资金扣减这类强一致要求高的场景，会更谨慎，尽量缩小异步范围。”\n\n### 3. 为什么幂等是刚需？\n\n网络抖动、超时重试、消息重复投递在分布式系统里是常态，不是异常。没有幂等就会出现重复扣款、重复发券等严重事故，所以必须在业务层做幂等保护。\n\n### 4. 限流该放哪？\n\n网关层适合做全局流量闸门和租户级限流，保护系统入口；\n\n服务内限流用于热点接口、下游依赖和关键资源池。\n\n两层结合才能既保系统又保核心业务。\n\n### 5. 熔断价值是什么？\n\n熔断的核心是“快速失败”，在下游异常时及时切断调用，避免调用方线程和连接被耗尽。\n\n它能把局部故障隔离在边界内，为核心链路争取恢复窗口。\n\n### 6. 隔离舱模式有什么用？\n\n隔离舱是把不同业务或依赖放入独立线程池、连接池、队列，避免互相拖垮。这样某个非核心模块雪崩时，不会占满全局资源影响主交易链路。\n\n### 7. 最小可观测性集合？\n\n最小集合是指标（Metrics）、日志（Logs）、链路追踪（Traces）三件套，并统一请求 ID 贯穿上下游。没有关联 ID，排障和回放基本无法高效完成。\n\nMetrics 负责回答‘系统现在健不健康’，比如 QPS、RT、错误率、CPU、线程池、MQ 堆积；  \nLogs 负责回答‘某次请求到底发生了什么’，记录关键业务字段、错误堆栈和上下文；  \nTraces 负责回答‘这次请求经过了哪些服务、卡在哪一跳’，适合看跨服务调用链。\n\n工程上通常是 Prometheus/Grafana 做 Metrics，ELK 或 Loki 做 Logs，Jaeger/SkyWalking/Zipkin 做 Traces，核心不是工具名，而是三者通过同一个 requestId 串起来。\n\n### 8. 面试中如何讲取舍？\n\n先讲清约束条件（流量、时延、成本、稳定性），再给出候选方案和评估维度。最后说明为什么选当前方案、放弃了什么、如何兜底，这样最体现工程判断力。\n\n## 2. 分布式事务与秒杀\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n## 7. 分布式事务与秒杀（6）\n\n### 1. 问：2PC、3PC、TCC、Saga 怎么选？\n\n答：2PC一致性强但锁持有长、性能差；3PC改进阻塞但实现复杂；TCC业务侵入高、适合资金等强一致；Saga适合长流程最终一致。选型看一致性等级、延迟目标、研发成本和可补偿能力。  \n追问：为什么很多互联网业务最终选 Saga/Outbox 而不是 2PC？\n\n### 2. 问：最终一致性的常见工程解法有哪些？\n\n答：最常见是 Outbox + MQ + 幂等消费 + 定时对账补偿。核心思想是把跨服务事务拆成可重试、可追踪、可回放的本地事务链，避免分布式全局锁。要保障消息可靠投递和重复消费安全。  \n追问：Outbox 表积压后会带来什么风险，如何治理？\n\n### 3. 问：秒杀系统核心链路怎么设计？\n\n答：入口先限流防刷，库存预热到缓存，扣减库存走 Redis+Lua 原子化，成功后异步下单到 MQ，订单服务再落库。主链路追求“快速失败 + 快速返回”，非核心动作全部异步化，避免阻塞。  \n追问：秒杀下单成功后支付失败，库存和订单如何补偿？\n\n### 4. 问：防超卖策略通常怎么做？\n\n答：缓存层先做预扣库存，数据库层做最终校验与幂等兜底。库存扣减必须原子，常用 Lua 脚本。对超卖敏感业务可加排队令牌和乐观锁版本控制。核心是“多层防线”，不能只信单层缓存。  \n追问：只在 Redis 扣库存不回写 DB 会有什么后果？\n\n### 5. 问：削峰填谷为什么离不开 MQ？\n\n答：MQ 把突发请求转成可控消费速率，隔离前台高峰和后台处理能力差异。生产端快速写入，消费端按能力平滑处理，并可通过优先级队列保障核心业务先执行，防止链路被低价值流量挤占。  \n追问：积压严重时，优先扩消费者还是先降级，判断依据是什么？\n\n### 6. 问：高峰故障时如何做限流、降级、回滚？\n\n答：先入口限流和熔断止损，再关闭非核心功能，保主链路可用；对异常版本一键回滚，结合灰度分批恢复。全过程要有实时监控和开关中心，保障“可观测、可操作、可恢复”。  \n追问：回滚后为何还可能持续报错，下一步怎么排查？\n\n高频连问路径：\n\n1. 事务选型 -> 一致性等级 -> 补偿策略\n2. 秒杀链路 -> 防超卖 -> 异步下单\n3. 高峰止损 -> 降级回滚 -> 复盘优化\n\n## 补充原文：分布式事务方案细化\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 分布式事务常见方案\n\n1. **XA / 两阶段提交（2PC）**\n- 事务管理器先询问每个参与方能否执行；\n- 第一阶段预留资源，第二阶段统一提交或回滚；\n- 一致性强，但严重依赖数据库层面的锁和协调，不适合高并发场景。\n\n2. **TCC（Try / Confirm / Cancel）**\n- Try：检测资源并预留；\n- Confirm：真正执行业务；\n- Cancel：失败时执行补偿回滚。\n- 优点是可实现较强一致；缺点是业务侵入大、补偿逻辑复杂。\n- 更适合资金类、对一致性要求很高、且每个环节执行时间较短的场景。\n\n3. **本地消息表**\n- A 系统在本地事务里同时写业务数据和消息表；\n- 后台线程轮询消息表，再调用 B 系统；\n- B 系统必须幂等。\n- 缺点是高并发下消息表本身会成为数据库压力点。\n\n4. **可靠消息最终一致性**\n- A 先向 MQ 发送 prepared / half message；\n- 本地事务成功后再发 confirm / commit；\n- 如果 confirm 丢了，MQ 通过回查机制再次确认本地事务状态；\n- B 消费消息时需要幂等、失败重试和补偿。\n- 这种方案更适合订单、库存、履约这类允许最终一致的链路。\n\n### 订单场景里的可靠消息最终一致性\n\n典型流程：\n1. 先发 half message；\n2. MQ 落盘成功后再走核心订单链路；\n3. 核心链路成功则发 commit，失败则发 rollback；\n4. MQ 在等待期间可通过回查机制确认事务状态；\n5. 消费者收到消息后执行下游逻辑，失败则重试或进入补偿。\n\n### Seata / TCC 框架理解\n\nSeata 的角色通常分为：\n- `TC`：协调器，维护全局事务状态；\n- `TM`：事务发起者，负责开始/提交/回滚全局事务；\n- `RM`：资源管理器，管理各分支事务并向 TC 汇报。\n\n它的核心流程是：\n- TM 向 TC 申请一个全局事务 ID；\n- 各分支事务把自己注册到这个全局事务里；\n- 成功则统一提交，失败则由 TC 驱动各分支回滚。\n\n面试里可以补一句：\n- 强一致核心链路更适合 TCC；\n- 大部分互联网业务更常用“可靠消息 + 幂等 + 补偿 + 对账”这套最终一致方案。\n\n## 补充原文：接口幂等怎么设计\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 接口幂等性\n\n接口幂等的核心目的，是防止因为重试、超时、网络抖动等原因导致“同一业务请求被执行多次”，出现重复下单、重复扣费、重复发券。\n\n常见做法要分场景：\n\n1. **插入型请求**\n- 最直接的方法是数据库唯一键；\n- 例如用订单号、业务流水号、用户+业务主键作为唯一约束；\n- 如果重复插入，直接被数据库挡住。\n- 也可以在 Redis 里用“接口 + 请求参数”拼一个唯一 key，先判断是否处理过。\n\n2. **更新型请求**\n- 更新比插入更复杂，因为不只是“有没有处理过”，还要区分“正在处理”还是“已经处理完成”。\n- 一种可讲的思路是把请求处理拆成多个阶段，在每个阶段配状态位：\n  - 执行前检查 Redis 幂等 key；\n  - 如果值是 `1`，说明已经成功执行，直接返回；\n  - 如果值是 `0`，说明有同请求正在执行，可以等待或快速失败；\n  - 执行过程中如果异常，不修改成功标记；\n  - 执行成功后再把 key 改为完成态。\n- 对一些强一致更新，也可以配合数据库独占锁，例如 `select ... for update nowait`，确保同一条数据同时只被一个请求修改。\n\n3. **工程化设计**\n- 幂等键要有明确生成规则；\n- 幂等状态要设置合理 TTL，避免永久脏状态；\n- 日志里要能区分“首次执行、重复命中、处理中重试”；\n- 高风险写操作要把幂等设计成平台能力，而不是每个接口各自手写。\n\n面试里可以总结成一句：\n**幂等不是简单“查一下有没有”，而是要区分“未执行、执行中、已完成”三种状态，并根据插入型、更新型请求分别设计。**\n","title":"分布式事务与高可用核心问答"},"02_后端/README.md":{"md":"# 02_后端\n\n## 主题索引\n\n- [01_MySQL](01_MySQL/01_核心问答.md)\n- [02_Redis](02_Redis/01_核心问答.md)\n- [03_Kafka](03_Kafka/01_核心问答.md)\n- [04_并发与异步任务](04_并发与异步任务/01_核心问答.md)\n- [05_缓存与一致性](05_缓存与一致性/01_核心问答.md)\n- [06_分库分表与架构治理](06_分库分表与架构治理/01_核心问答.md)\n- [07_JVM与GC](07_JVM与GC/01_核心问答.md)\n- [08_Spring与SpringBoot](08_Spring与SpringBoot/01_核心问答.md)\n- [09_RPC与网关治理](09_RPC与网关治理/01_核心问答.md)\n- [10_网络I_O与发布治理](10_网络I_O与发布治理/01_核心问答.md)\n- [11_分布式事务与高可用](11_分布式事务与高可用/01_核心问答.md)\n\n## 说明\n\n1. 后端板块不再只按“数据库/缓存”划分，而是补齐 JVM、Spring、RPC、Netty、分布式事务等高频面试主题。\n2. 所有内容都来自现有题库原文，尽量减少再创作，方便后续继续补充。\n3. 如果某个主题后续过长，再在主题内部拆分，不新增多份并列用途文件。\n","title":"02_后端"},"03_系统设计/00_方法论与估算/01_核心问答.md":{"md":"# 00_方法论与估算核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 方法论与估算\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：系统设计答题框架、容量估算、从 0 到 1 扩展路径\n- 参考主题：\n  - 容量估算（Back-of-the-envelope Estimation）\n  - 系统设计面试答题框架（A Framework for System Design Interviews）\n  - 系统设计方法论\n- 练习建议：\n  - 1 份“面试开题模板”（5-8 句）\n  - 1 次 10 分钟口述（任意业务场景）\n","title":"00_方法论与估算核心问答"},"03_系统设计/01_高并发系统/01_核心问答.md":{"md":"# 01_高并发系统核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 限流与负载均衡\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：限流策略、网关层防护、负载均衡取舍\n- 参考主题：\n  - 限流系统设计（Design a Rate Limiter）\n  - API 限流\n  - 负载均衡\n- 练习建议：\n  - 口述“令牌桶 vs 漏桶 vs 滑动窗口”\n  - 追问准备：“分布式限流怎么做一致性？”\n- 答案:\n\n**Sentinel（阿里开源）** 这条体系。  \n\n它的本质是：**控制面下发规则，数据面本地快速判定**。\n\n**大致原理**\n\n1. **控制面**：规则配置与治理\n\n- 在控制台配置限流/熔断/系统保护规则。  \n- 规则存到配置中心（如 Nacos），动态推送到各实例。\n\n1. **数据面**：请求经过本地拦截链\n\n- 业务代码在资源点埋点（接口、方法、下游调用）。  \n- 每次请求进来走 Sentinel 的 slot chain（统计、限流、熔断等）。  \n- 本地内存计数 + 滑动时间窗，判断当前 QPS/RT/异常率是否超阈值。  \n- 超阈值就执行策略：快速拒绝、排队等待、预热放量等。\n\n1. **为什么快**\n\n- 判定在本机完成，不走远程 RPC；  \n- 规则热更新，生效快；  \n- 指标异步上报控制台做可视化和告警。\n\n面试可一句话总结：  \n\n“Sentinel 类方案是控制面统一治理、数据面本地判定的架构，通过滑动窗口统计+规则引擎在毫秒级完成限流/熔断决策，兼顾性能和可运维性。”\n\n- 分布式限流怎么做一致性？\n\n集群流控模式（Cluster Flow）Sentinel 用 Token Server + Token Client。\n\n- Client 收到请求先向 Token Server 申请令牌。\n- Server 按规则（QPS、匀速排队、预热等）统一判定是否放行。\n- 这样能把多个实例的流量收敛到一个“全局配额视角”，一致性明显比本地模式好。\n\n“Sentinel 默认是单机限流；要做分布式一致限流要开集群流控，用 token server 统一发令牌。它在性能和一致性之间做工程折中，适合互联网场景。”\n\n## 补充原文：如何设计一个高并发系统\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 如何设计一个高并发系统\n\n常见回答框架可以按“拆、缓存、削峰、分治、兜底”来讲：\n\n1. **系统拆分**：把大系统拆成多个子系统，单机单库变成分布式架构，让每个子系统只承接一部分压力。\n2. **缓存**：高并发大多是读多写少，优先把热点数据放缓存，让大部分请求不落数据库。\n3. **MQ 削峰**：大量写请求先灌入 MQ 排队，后端按自己承载能力慢慢消费，避免把数据库直接打死。\n4. **分库分表**：当单库单表已经成为瓶颈时，通过水平拆分摊平写入和存储压力。\n5. **读写分离**：主库负责写，从库负责读，读流量大时继续扩从库。\n6. **ES / 检索引擎承接查询**：全文检索、复杂搜索、部分统计类查询迁到 ES，减轻主库压力。\n7. **工程兜底**：限流、防刷、CDN、静态化、异步化、小事务、锁粒度优化、JVM/SQL 优化、灰度扩容。\n\n如果是秒杀/大促场景，还要强调：\n- 秒杀前不要暴露真实秒杀地址；\n- 前端尽量静态化；\n- 网关和 Redis 做防刷限流；\n- 库存预热到 Redis，用 Lua 做原子扣减；\n- 能异步的都异步，比如短信、积分、优惠券等；\n- 事务尽量小，不要把写日志、调接口这些操作包进大事务；\n- 乐观锁、悲观锁、间隙锁、快照读、当前读、MVCC 这些并发控制细节必须清楚，否则数据库高峰期很容易被锁竞争拖垮。\n\n## 补充原文：分布式请求顺序性如何保证\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 分布式服务接口请求的顺序性如何保证？\n\n首先，工程上更推荐的思路是：**尽量从业务设计上避免强顺序依赖**。因为一旦引入严格顺序保证，通常会带来：\n- 系统复杂度上升；\n- 吞吐下降；\n- 热点 key 压力变大；\n- 排障和恢复都更麻烦。\n\n如果业务确实要求顺序性，常见解法有三类：\n\n1. **Hash 分发到同一机器**\n- 比如按订单 ID 做一致性 hash，把同一业务对象的请求路由到同一台机器；\n- 到了该机器内部，再把同一 key 的请求扔到内存队列里串行处理；\n- 这样能做到“同一 key 有序，不同 key 并行”。\n\n2. **MQ / 内存队列串行化**\n- 生产端按业务 key 发到同一个 partition 或同一条队列；\n- 消费端再对 key 做 hash，落到固定线程或固定内存队列里顺序消费。\n\n3. **锁与序列号控制**\n- 可以通过分布式锁、数据库行锁，或者请求携带版本号 / 序列号来控制乱序更新；\n- 但这种做法更重，吞吐和热点问题会更明显。\n\n如果是更新型请求，还可以在各阶段加幂等保护，比如：\n- 执行前先检查 redis 幂等 key；\n- 执行过程中对异常做回滚和恢复；\n- 成功后再修改状态位，避免重复执行。\n\n面试里可以总结成一句：\n**顺序性不是白拿的，核心思路是“同一 key 聚合到同一路径上串行处理”，常见手段是 hash 路由 + 队列串行 + 幂等兜底。**\n","title":"01_高并发系统核心问答"},"03_系统设计/02_缓存与KV系统/01_核心问答.md":{"md":"# 02_缓存与KV系统核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 一致性哈希与 KV 存储\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n主题：分片、重平衡、读写路径、复制与故障恢复\n\n**1. 一致性哈希与虚拟节点（先讲分片）**\n\n1. 把哈希空间看成一个环（0 到 2^32-1）。\n2. 节点（机器）和 key 都映射到环上。\n3. key 顺时针找到第一个节点作为归属节点。\n4. 扩容/缩容时，只迁移受影响区间的数据，不会全量搬迁。\n5. 虚拟节点（vnodes）做法：每台物理机映射多个点到环上。\n6. 价值：数据更均匀、热点更少、节点增减更平滑。\n7. 进一步可加“加权虚拟节点”：高配机器分配更多 vnode。\n\n**2. 高可用 KV（再讲写入、复制、读取）**\n\n1. 数据模型`key -> value + version + timestamp`。\n2. 分区：用一致性哈希决定 key 所在分区。\n3. 复制：每个 key 写到 N 个副本（比如主副本+后续副本）。\n4. 写路径：客户端到协调节点，协调节点并行写 N 副本，达到 W 个成功即返回。\n5. 读路径：协调节点读 N 副本中的 R 个，做版本合并后返回最新值。\n6. 常见条件`R + W > N` 可提高读写一致性概率。\n7. 故障处理：副本宕机时先写可用副本（hinted handoff），恢复后补数据。\n8. 后台修复：anti-entropy（如 Merkle tree）+ read repair。\n\n**3. 可用性与一致性取舍（追问高频）**\n\n1. 追求强一致（偏 CP）：写入要多数派确认，网络分区时宁可拒写，保证不读脏数据。\n2. 追求高可用（偏 AP）：优先接受读写请求，允许短暂不一致，后续异步收敛。\n3. 场景决策：\n\n- 交易、余额、库存扣减：优先一致性。  \n- 缓存、Feed、推荐、计数：优先可用性和低延迟。\n\n**4. 你可以直接背的面试口述（90秒）**\n\n“我会先用一致性哈希做分片，节点和 key 都映射到环上，key 顺时针落到第一个节点。为避免数据倾斜，每台机器配置多个虚拟节点。这样扩缩容时只迁移局部区间。  \n\n在 KV 高可用上，我采用 N 副本复制，写入走协调节点并行写副本，达到 W 个确认返回；读取拉 R 个副本并做版本合并，结合 read repair 保证收敛。  \n\n一致性和可用性的取舍上，我按业务分级：交易链路用更强一致策略，内容链路用最终一致换低延迟和高可用。核心是把取舍显式化，并用监控和修复机制兜底。”\n","title":"02_缓存与KV系统核心问答"},"03_系统设计/03_消息队列与监控告警/01_核心问答.md":{"md":"# 03_消息队列与监控告警核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 通知、消息队列与监控告警\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：异步解耦、重试幂等、监控指标与告警体系\n\n1. 先定范围\n\n支持 `iOS/Android Push + SMS + Email`，软实时，支持用户退订，量级示例是日千万级推送。\n\n1. 高层架构从“单机”到“解耦”\n\n初版有单点和性能瓶颈，改进版引入 `多通知服务器 + 缓存/DB拆分 + 按渠道队列 + workers + 第三方通道`。\n\n1. 核心链路\n\n业务服务调通知 API → 通知服务做校验和模板渲染 → 写队列 → worker 消费 → 调 APNS/FCM/Twilio/SendGrid。\n\n1. 可靠性设计\n\n通知数据持久化（日志表），失败重试，去重（事件ID），接受“至少一次”而非幻想“绝对恰好一次”。\n\n1. 运营能力\n\n模板、用户通知偏好、速率限制、认证安全、队列监控、打开/点击事件追踪。\n\n**面试怎么回答（结构）**\n\n1. 先讲目标\n\n“这是多渠道异步通知平台，目标是高可用、可扩展、可观测，不丢通知。”\n\n1. 讲架构主干\n\n“API层、通知编排层、分渠道消息队列、worker层、第三方通道层。”\n\n1. 讲关键取舍\n\n“采用 MQ 做削峰解耦；语义上至少一次投递，靠幂等去重；按渠道隔离，避免单通道故障扩散。”\n\n1. 讲治理闭环\n\n“用户偏好检查、限频、失败重试告警、事件追踪和队列积压监控。”\n\n**你可以直接背的 60-90 秒版本**\n\n“我会把通知系统设计成多渠道异步平台，支持 Push、短信和邮件。入口由通知 API 接收请求，做参数校验、用户偏好判断和模板渲染后，把通知事件写入按渠道拆分的消息队列。各渠道 worker 独立消费并调用第三方通道，例如 APNS、FCM、短信和邮件服务。这样做的核心价值是解耦和隔离，某个渠道故障不会拖垮全链路。可靠性上采用通知日志持久化、失败重试和事件ID去重，语义上接受至少一次并通过幂等控制重复。治理上补充限频、认证、队列积压监控和打开点击追踪，形成可观测可运营的闭环。”\n\n如果你要，我可以再给你一版“面试官追问10题10答（通知系统版）”。\n\n## 补充原文：分布式系统链路监控\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 分布式系统链路监控\n\n链路监控的核心目标是三件事：\n- 调用链路可视化；\n- 链路性能监控；\n- 链路故障排查。\n\n常见实现思路是做一个统一的链路采集框架，让每一次服务调用都经过这个框架：\n- 采集调用的起点、终点、耗时、异常信息；\n- 把这些数据持久化；\n- 再通过可视化界面展示整条调用链路、各节点耗时和异常点。\n\n常见链路追踪体系包括：\n- Google `Dapper`\n- 阿里 `鹰眼`\n- 大众点评 `CAT`\n- Twitter `Zipkin`\n- `SkyWalking`\n\n面试里可以补一句：\n**链路监控不是单纯记日志，而是要能把一次跨服务请求完整串起来，回答“这次请求经过了哪些服务、卡在了哪一跳、为什么失败”。**\n","title":"03_消息队列与监控告警核心问答"},"03_系统设计/04_搜索推荐与聊天/01_核心问答.md":{"md":"# 04_搜索推荐与聊天核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 爬虫与搜索\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：抓取调度、去重、索引、自动补全与搜索链路\n- 参考主题：\n  - 爬虫系统设计（Design a Web Crawler）\n  - 搜索自动补全系统（Design a Search Autocomplete System）\n  - 爬虫系统\n  - 搜索引擎\n- 练习建议：\n  - 10 分钟主讲：搜索自动补全系统\n  - 追问准备：“倒排、分词、召回、排序如何拆层？”\n  - \n- 爬虫系统: \n  - 爬虫系统的本质，是一个带调度能力的数据采集系统\n  - 核心链路是 Seed URL 进入 Frontier调度队列，Downloader 拉取页面，Parser 解析内容和新链接，再经过 URL/内容去重、过滤，回到
