<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Offer · 面试复习资料可视化</title>
<script>
  // 尽早确定主题，避免首屏闪烁
  (function () {
    var t = null;
    try { t = JSON.parse(localStorage.getItem('agent-offer:theme')); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
:root {
  color-scheme: light;
  --bg: #f5f5f2; --surface: #fcfcfb; --panel: #ffffff; --panel-2: #f0efec;
  --text: #0b0b0b; --text-2: #52514e; --muted: #85847e; --border: #e4e3dd;
  --accent: #2a78d6; --accent-soft: #e3eefb;
  /* 5 个方向的分类色：参考调色板前 5 槽，固定顺序 */
  --d1: #2a78d6; --d2: #eb6834; --d3: #1baf7a; --d4: #eda100; --d5: #e87ba4;
  --mono: "JetBrains Mono", "Cascadia Code", Consolas, "SFMono-Regular", monospace;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --panel: #1a1a19; --panel-2: #262624;
  --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86; --border: #31312e;
  --accent: #3987e5; --accent-soft: #1b2a3d;
  --d1: #3987e5; --d2: #d95926; --d3: #199e70; --d4: #c98500; --d5: #d55181;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html { scroll-padding-top: 72px; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.75 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd { font: 11px/1 var(--mono); padding: 2px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; background: var(--panel-2); color: var(--text-2); }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

#progress { position: fixed; top: 0; left: 0; height: 2px; width: 0; background: var(--accent); z-index: 50; }

/* ---------- 顶栏 ---------- */
.topbar { position: sticky; top: 0; z-index: 40; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand-mark { width: 24px; height: 24px; border-radius: 7px; background: conic-gradient(var(--d1) 0 20%, var(--d2) 0 40%, var(--d3) 0 60%, var(--d4) 0 80%, var(--d5) 0); }
.topnav { display: flex; gap: 2px; margin-left: 8px; }
.topnav a { padding: 6px 12px; border-radius: 8px; color: var(--text-2); font-size: 14px; }
.topnav a:hover, .topnav a.active { background: var(--panel-2); color: var(--text); text-decoration: none; }
.top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.search-btn { display: flex; align-items: center; gap: 10px; min-width: 230px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--muted); font-size: 14px; }
.search-btn .label { flex: 1; text-align: left; }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); font-size: 16px; }
.menu-btn { display: none; }

/* ---------- 布局 / 侧栏 ---------- */
.layout { display: grid; grid-template-columns: 272px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.sidebar { position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; padding: 14px 10px 24px; border-right: 1px solid var(--border); background: var(--panel); font-size: 14px; }
.side-filter { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none; font: inherit; }
.side-filter:focus { border-color: var(--accent); }
.side-section { margin-top: 14px; }
.side-title { padding: 2px 10px 4px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.side-link { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 7px; color: var(--text-2); line-height: 1.5; }
.side-link:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
.side-link.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.side-dir { display: flex; align-items: center; }
.caret { width: 22px; height: 26px; flex: none; border: 0; background: none; color: var(--muted); font-size: 9px; transition: transform .15s; }
.side-group.open .caret, .side-group.filtering .caret { transform: rotate(90deg); }
.side-dir .side-link { flex: 1; font-weight: 600; color: var(--text); padding-left: 4px; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dc, var(--accent)); flex: none; }
.dot.lg { width: 12px; height: 12px; }
.count { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
.side-group ul { list-style: none; margin: 0 0 6px; padding: 0 0 0 22px; display: none; }
.side-group.open ul, .side-group.filtering ul { display: block; }
.side-group li .side-link { padding: 4px 10px; }
.side-group li .side-link span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { margin-left: auto; width: 28px; height: 3px; border-radius: 2px; background: var(--panel-2); overflow: hidden; flex: none; }
.mini b { display: block; height: 100%; background: var(--dc, var(--accent)); }
.side-foot { margin-top: 22px; padding: 12px 10px 0; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); line-height: 1.9; }
.side-foot a { color: var(--text-2); }

main { min-width: 0; padding: 32px 40px 96px; }
.page { max-width: 1180px; margin: 0 auto; }
.section { margin-top: 40px; }
.section-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 14px; }
.section-head h2 { margin: 0; font-size: 20px; }
.section-head p { margin: 0; color: var(--text-2); font-size: 13.5px; }
.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow); }
.panel-title { margin: 0 0 12px; font-size: 14px; font-weight: 600; }

/* ---------- 按钮 / 小组件 ---------- */
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font-size: 14px; line-height: 1.4; white-space: nowrap; }
.btn:hover { text-decoration: none; border-color: var(--text-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn.on { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; padding: 2px; background: var(--bg); }
.seg button { border: 0; background: none; padding: 4px 12px; border-radius: 7px; font-size: 13px; color: var(--text-2); }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.1); font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 12.5px; margin: 2px 4px 2px 0; line-height: 1.7; }
a.chip:hover { border-color: var(--dc, var(--accent)); text-decoration: none; }
.chip.plain { color: var(--text-2); }
.bar { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }
.bar b { display: block; height: 100%; background: var(--dc, var(--accent)); border-radius: 0 4px 4px 0; transition: width .3s; }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--dc); flex: none; }

/* ---------- 首页 ---------- */
.hero { position: relative; overflow: hidden; padding: 30px 30px 24px; border-radius: 18px; background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); }
.hero-strip { position: absolute; left: 0; right: 0; top: 0; height: 4px; display: flex; gap: 2px; }
.hero-strip i { flex: 1; background: var(--dc); }
.hero h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: -.01em; }
.hero p { margin: 0; color: var(--text-2); }
.hero-actions { margin-top: 18px; display: flex; gap: 10px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 22px; }
.tile { padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.tile b { display: block; font-size: 26px; line-height: 1.25; font-variant-numeric: tabular-nums; }
.tile b small { font-size: 14px; font-weight: 500; color: var(--muted); }
.tile span { font-size: 13px; color: var(--text-2); }

.map-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
.map { padding: 10px; }
.map svg { display: block; width: 100%; height: auto; max-width: 780px; margin: 0 auto; }
.map .lk { fill: none; stroke-width: 1.5; opacity: .5; transition: opacity .15s; }
.map .hit { fill: transparent; }
.map .pt { stroke: var(--panel); stroke-width: 2; }
.map text { font-size: 12px; fill: var(--text-2); }
.map .leaf, .map .dir-node { transition: opacity .15s; }
.map .leaf:hover text, .map .leaf:focus text { fill: var(--text); font-weight: 600; }
.map .dir-node rect { fill: var(--panel); stroke-width: 2; }
.map .dir-node text { font-size: 14px; font-weight: 600; fill: var(--text); }
.map .root circle { fill: var(--panel-2); stroke: var(--border); }
.map .root text { font-size: 13px; font-weight: 700; fill: var(--text); }
.map.dim .lk:not(.hl) { opacity: .08; }
.map.dim .leaf:not(.hl), .map.dim .dir-node:not(.hl) { opacity: .3; }
.map .lk.hl { opacity: .95; stroke-width: 2.2; }

.share { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; }
.share i { display: block; min-width: 2px; background: var(--dc); }
.legend { display: flex; flex-direction: column; gap: 2px; margin-top: 12px; }
.legend-row { display: grid; grid-template-columns: 10px 1fr auto 44px; gap: 10px; align-items: center; font-size: 14px; color: var(--text); padding: 4px 6px; border-radius: 7px; }
.legend-row:hover { background: var(--panel-2); text-decoration: none; }
.legend-row .muted { font-size: 12.5px; }
.legend-row b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.rank { margin: 0; padding: 0; list-style: none; counter-reset: r; }
.rank li { counter-increment: r; }
.rank a { display: grid; grid-template-columns: 18px 8px 1fr auto; gap: 10px; align-items: center; padding: 4px 6px; border-radius: 7px; color: var(--text); font-size: 14px; }
.rank a::before { content: counter(r); color: var(--muted); font-size: 12px; text-align: right; }
.rank a:hover { background: var(--panel-2); text-decoration: none; }
.rank b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text-2); }

.bc-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.legend-inline { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; font-size: 13px; color: var(--text-2); }
.legend-inline span { display: inline-flex; align-items: center; gap: 6px; }
.bc-cols { columns: 2 440px; column-gap: 32px; }
.bc-group { break-inside: avoid; margin-bottom: 14px; }
.bc-dir { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; padding: 2px 6px 4px; }
.bc-dir span { color: var(--muted); font-weight: 400; margin-left: auto; font-variant-numeric: tabular-nums; }
.bc-row { display: grid; grid-template-columns: 136px minmax(0, 1fr) 58px; align-items: center; gap: 10px; height: 26px; padding: 0 6px; border-radius: 6px; color: var(--text-2); font-size: 13px; }
.bc-row:hover, .bc-row:focus { background: var(--panel-2); color: var(--text); text-decoration: none; }
.bc-label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bc-track { height: 12px; }
.bc-bar { display: block; height: 100%; background: var(--dc); border-radius: 0 4px 4px 0; transition: width .35s; }
.bc-val { text-align: right; font-variant-numeric: tabular-nums; }
.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data-table th, .data-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); text-align: left; }
.data-table th { color: var(--text-2); font-weight: 600; background: var(--panel-2); }
.data-table td.num, .data-table th.num { text-align: right; font-variant-numeric: tabular-nums; }

.roadmap { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.stage { padding: 16px 16px 12px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); }
.stage h3 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.stage h3 small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
.stage-no { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 13px; flex: none; }
.stage ol { margin: 0; padding-left: 20px; color: var(--muted); font-size: 12px; }
.stage li { margin: 4px 0; }
.routes { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.route h3 { margin: 0 0 12px; font-size: 15px; }
.route h3 small { color: var(--muted); font-weight: 400; margin-right: 6px; }
.flow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.flow .arrow { color: var(--muted); margin-right: 4px; }
.prog-row { display: grid; grid-template-columns: 100px minmax(0, 1fr) 150px auto; gap: 14px; align-items: center; padding: 7px 0; font-size: 14px; }
.prog-row > span:first-child { display: flex; align-items: center; gap: 8px; }
.prog-row .muted { font-size: 13px; font-variant-numeric: tabular-nums; }
.prog-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); }

/* ---------- 方向页 ---------- */
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.crumbs a { color: var(--text-2); }
.dir-hero { padding: 24px 28px; border-radius: 16px; border: 1px solid var(--border); border-top: 4px solid var(--dc); background: var(--panel); box-shadow: var(--shadow); }
.dir-hero h1 { margin: 0 0 6px; font-size: 26px; display: flex; align-items: center; gap: 10px; }
.dir-hero p { margin: 0; color: var(--text-2); }
.topic-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 14px; margin-top: 20px; }
.topic-card { display: flex; flex-direction: column; gap: 8px; padding: 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); box-shadow: var(--shadow); transition: border-color .15s, transform .15s; }
.topic-card:hover { border-color: var(--dc); text-decoration: none; transform: translateY(-1px); }
.topic-card h3 { margin: 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.topic-card .stats { font-size: 12.5px; color: var(--muted); }
.topic-card .bar { height: 4px; }
.topic-card ul { margin: 2px 0 0; padding-left: 16px; font-size: 13px; color: var(--text-2); }
.topic-card li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 文档页 ---------- */
.doc-wrap { display: grid; grid-template-columns: minmax(0, 860px) 236px; gap: 48px; justify-content: center; }
.doc-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 0 0 8px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); }
.meta-item { font-size: 13px; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
.meta-item b { color: var(--text); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.toc { position: sticky; top: 80px; align-self: start; max-height: calc(100vh - 100px); overflow: auto; font-size: 13px; padding-left: 12px; border-left: 1px solid var(--border); }
.toc-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.toc a { display: block; padding: 3px 8px; margin-left: -13px; border-left: 2px solid transparent; color: var(--text-2); line-height: 1.5; border-radius: 0 6px 6px 0; }
.toc a:hover { color: var(--text); text-decoration: none; background: var(--panel-2); }
.toc a.l3 { padding-left: 20px; font-size: 12.5px; }
.toc a.active { color: var(--text); border-left-color: var(--dc, var(--accent)); background: var(--panel-2); }
.pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; }
.pn a { display: block; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); color: var(--text); }
.pn a:hover { border-color: var(--dc, var(--accent)); text-decoration: none; }
.pn a small { display: block; color: var(--muted); font-size: 12px; }
.pn a.next { text-align: right; grid-column: 2; }

/* ---------- Markdown 正文 ---------- */
.md { font-size: 15.5px; line-height: 1.85; color: var(--text); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md h1 { font-size: 28px; line-height: 1.35; margin: 18px 0; }
.md h1:not(:first-child) { font-size: 22px; margin-top: 44px; padding-top: 22px; border-top: 1px dashed var(--border); }
.md h2 { font-size: 21px; line-height: 1.45; margin: 46px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
.md h3 { font-size: 17px; line-height: 1.55; margin: 30px 0 10px; padding: 8px 12px; border-left: 3px solid var(--dc, var(--accent)); background: var(--panel); border-radius: 0 8px 8px 0; }
.md h4, .md h5, .md h6 { font-size: 15.5px; margin: 22px 0 8px; }
.md p { margin: 10px 0; }
.md ul, .md ol { padding-left: 1.6em; margin: 8px 0; }
.md li { margin: 4px 0; }
.md li > p { margin: 4px 0; }
.md strong { font-weight: 650; }
.md code { font-family: var(--mono); font-size: .87em; padding: 1px 5px; border-radius: 5px; background: var(--panel-2); border: 1px solid var(--border); }
.md blockquote { margin: 14px 0; padding: 4px 16px; border-left: 3px solid var(--border); color: var(--text-2); background: var(--panel); border-radius: 0 8px 8px 0; }
.md hr { border: 0; border-top: 1px solid var(--border); margin: 28px 0; }
.md img { max-width: 100%; }
.md .table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; }
.md table { border-collapse: collapse; width: 100%; font-size: 14px; }
.md th, .md td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; }
.md th { background: var(--panel-2); font-weight: 600; }
.md tr:last-child td { border-bottom: 0; }
.code { margin: 14px 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--panel); }
.code-bar { display: flex; justify-content: space-between; align-items: center; padding: 3px 10px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); background: var(--panel-2); }
.copy { border: 0; background: none; color: var(--text-2); font-size: 12px; padding: 2px 6px; border-radius: 5px; }
.copy:hover { background: var(--panel); }
.code pre { margin: 0; padding: 12px 14px; overflow: auto; font: 13px/1.6 var(--mono); }
.code pre code { border: 0; padding: 0; background: none; font-size: inherit; }
.dead-link { text-decoration: underline dotted; text-underline-offset: 3px; }
mark { background: #ffe58a; color: #0b0b0b; border-radius: 3px; padding: 0 1px; }
:root[data-theme="dark"] mark { background: #8a6d00; color: #fff; }
.flash { animation: flash 1.8s ease; }
@keyframes flash { 0%, 45% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.md ul.problems { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
.md li.problem { margin: 0; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); display: flex; gap: 8px; align-items: center; line-height: 1.5; }
.md li.problem .lc { margin-left: auto; font-size: 12px; white-space: nowrap; }

/* ---------- 卡片练习 ---------- */
.cards-page { max-width: 880px; margin: 0 auto; }
.cards-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cards-head h1 { margin: 0 10px 0 0; font-size: 24px; }
.select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--panel); color: var(--text); max-width: 300px; font: inherit; font-size: 14px; }
.cards-status { display: flex; gap: 16px; align-items: center; margin: 18px 0 12px; font-size: 13px; color: var(--text-2); }

层\n   例如 AI、后端、系统设计、算法、项目表达\n2. 每个方向下再按主题拆分\n   例如 RAG、Redis、Kafka、交易风控、邀请码系统\n3. 每个主题主要只维护一个主文件\n   即 `01_核心问答.md`\n\n这样做的目的，是让你在复习时减少来回跳文件的成本。\n\n## 什么时候看哪份文件\n\n- **只想看目录结构**：看 [总索引](总索引.md)\n- **只想找复习顺序**：看 [复习路线图](复习路线图.md)\n- **准备正式开始复习**：回到 [资料总入口](../README.md)\n\n## 一句话总结\n\n如果 `docs/interview_prep/README.md` 是资料库首页，\n那这里就是“怎么进入、按什么顺序看、怎么找到自己想看的那一块”的导航控制台。\n","title":"00_导航"},"00_导航/复习路线图.md":{"md":"# 复习路线图\n\n## 第一阶段：AI 主干\n\n1. Agent基础\n2. Workflow与多Agent\n3. RAG\n4. 上下文工程与记忆\n5. 模型调优与微调\n6. 评测与监控\n7. 安全与风控\n8. 框架协议与工程化\n\n## 第二阶段：后端与系统设计\n\n1. MySQL / Redis / Kafka\n2. 并发与异步任务\n3. 缓存一致性与分库分表\n4. 高并发 / 消息队列 / 搜索推荐 / 交易风控 / 增长系统\n\n## 第三阶段：项目表达\n\n1. 项目口述\n2. 项目追问\n3. 指标与亮点表达\n\n## 第四阶段：公司专项冲刺\n\n1. 某AI应用平台 / 某交易平台 / 某垂直写作平台\n2. 某出行与搜索平台 / 某大模型应用平台 / 某AIGC内容平台\n3. 综合场景题与反问准备\n\n## 第五阶段：算法补齐\n\n1. 数组双指针 / 滑动窗口 / 链表 / 二叉树\n2. 动态规划 / 回溯搜索 / 堆栈队列二分\n3. 题型口述与手写代码训练\n\n## 第六阶段：临场模拟与查漏补缺\n\n1. 模拟面试回放\n2. 公司专项题\n3. 薄弱主题二刷\n","title":"复习路线图"},"00_导航/总索引.md":{"md":"# 总索引\n\n## 01_AI\n\n- [01_Agent基础](../01_AI/01_Agent基础/01_核心问答.md)\n- [02_Workflow与多Agent](../01_AI/02_Workflow与多Agent/01_核心问答.md)\n- [03_RAG](../01_AI/03_RAG/01_核心问答.md)\n- [04_上下文工程与记忆](../01_AI/04_上下文工程与记忆/01_核心问答.md)\n- [05_模型调优与微调](../01_AI/05_模型调优与微调/01_核心问答.md)\n- [06_评测与监控](../01_AI/06_评测与监控/01_核心问答.md)\n- [07_安全与风控](../01_AI/07_安全与风控/01_核心问答.md)\n- [08_框架协议与工程化](../01_AI/08_框架协议与工程化/01_核心问答.md)\n- [09_追加补充](../01_AI/09_追加补充/01_核心问答.md)\n\n## 02_后端\n\n- [后端总索引](../02_后端/README.md)\n- MySQL / Redis / Kafka / 并发与异步 / 缓存与一致性\n- 分库分表 / JVM / Spring / RPC与网关 / 网络I_O / 分布式事务\n\n## 03_系统设计\n\n- [系统设计总索引](../03_系统设计/README.md)\n- 方法论估算 / 高并发 / 缓存与KV / 消息队列与监控告警\n- 搜索推荐与聊天 / 交易风控 / 增长邀请码 / 地图存储 / 分布式补强\n\n## 04_算法\n\n- [算法总索引](../04_算法/README.md)\n- 数组双指针 / 滑动窗口 / 链表 / 二叉树\n- 动态规划 / 回溯搜索 / 堆栈队列二分\n\n## 05_项目表达\n\n- [项目表达总索引](../05_项目表达/README.md)\n- AI应用平台 / 交易Agent与风控平台 / 垂直写作与审阅平台\n- 搜索推荐平台 / 大模型应用平台 / AIGC内容平台 / 综合场景题\n","title":"总索引"},"01_AI/01_Agent基础/01_核心问答.md":{"md":"# 01_Agent基础核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：什么是基于 LLM 的 Agent，它和普通大模型有什么区别？\n\n### 1. 子问题：Agent定义与核心组件（含具身差异）\n主问题：你如何定义基于 LLM 的 Agent？核心组件有哪些？软件 Agent 与具身 Agent 有何不同？\n\n口述答案：\n我会把 Agent 定义为“以 LLM 为决策中枢、可在环境中闭环执行任务的系统”。它通常由四层构成：规划层、记忆层、工具层和执行控制层。和普通对话模型相比，关键差异是它能持续感知、决策、行动并根据反馈修正。若从软件 Agent 走向具身或仿真 Agent，难点会从“文本理解”升级到“高噪声感知 + 连续动作控制 + 安全约束”，系统设计重点也会从回答质量转为“安全、稳定、可恢复”。\n\n常见追问：\n\n1. Agent 与 Workflow 最大差别是什么？\n2. 为什么说“可观测性”比“会答题”更重要？\n3. 具身场景为什么更强调实时性与安全兜底？\n\n### 2. 子问题：你如何定义一个基于 LLM 的智能体（Agent）？它通常由哪些核心组件构成？\n答：\n我会把 Agent 定义为“以 LLM 为决策大脑、能在环境中持续闭环执行任务的系统”。与普通问答不同，它具备自主性和循环性。核心组件可讲四层：规划模块、记忆模块、工具模块，再加上底层 LLM 本身。面试时建议强调：真正拉开差距的是工程控制面，比如状态管理、异常恢复和可观测性。\n\n### 3. 子问题：当一个 Agent 需要在真实或模拟环境中（如机器人、游戏）执行任务时，它与纯粹基于软件工具的 Agent 有什么本质区别？\n答：\n当Agent从纯粹的软件环境（调用API、读写文件）进入到真实或模拟的物理环境（如机器人、游戏）时，我们称之为**具身智能体（Embodied Agent）**。这种转变引入了几个本质的区别，极大地增加了任务的复杂性。\n\n核心区别是“感知与行动的不确定性”。软件 Agent 处理的是结构化、可控接口；具身或仿真 Agent 面对的是高维噪声输入、部分可观测状态和连续动作误差，且需要实时闭环。更关键的是安全后果：软件错误多数可回滚，物理动作可能不可逆。因此评估标准会从“答对”升级为“安全、稳定、可恢复”。\n\n## 2. 主干问题：ReAct 是什么，Agent 的规划能力怎么设计？\n\n### 1. 子问题：ReAct与规划能力（CoT/ToT/GoT）\n主问题：ReAct 是什么？如何给 Agent 规划能力？\n\n口述答案：\nReAct 是 Thought-Action-Observation 循环：先思考、再调用工具、再根据观察结果迭代。它比单次 CoT 更适合信息不完整任务，因为它能边查边改。规划方法上，CoT 是单路径分解，成本低但容错弱；ToT 用树状分支提高成功率但更贵；GoT 进一步支持图结构合并与回溯，适合复杂依赖。工程上建议把“规划”和“执行”解耦：Planner 负责拆解，Executor 负责落地，减少模型一步到位失败。\n\n常见追问：\n\n1. 什么时候不该用复杂规划而该用固定流程？\n2. 规划深度如何控制成本？\n3. 如何避免“想太多、做太少”？\n\n### 2. 子问题：请详细解释 ReAct 框架。它是如何将思维链和行动结合起来，以完成复杂任务的？\n答：\nReAct 的本质是把“推理”和“行动”交替执行，形成 Thought-Action-Observation 的循环。模型先思考下一步，再调用工具，再根据返回结果调整策略，直到任务完成。它相比静态 CoT 的优势是可交互、可纠错、可解释，适合信息不完整或环境会变化的任务；代价是链路更长，线上要控制步数、超时和成本。\n\n### 3. 子问题：在 Agent 的设计中，“规划能力”至重要。请谈谈目前有哪些主流方法可以赋予 LLM 规划能力？（例如 CoT, ToT, GoT等）\n答：\n\n可按“线性到搜索”来讲：CoT 是单路径分步推理，成本低但容错弱；ToT 树状思考链路引入多分支探索和回溯，成功率更高但算力开销大；GoT 图结构进一步允许分支合并和循环优化，适合复杂依赖问题。\n\n以及工程里常见多角色agent划分, 如: Planner-Executor 拆分，让规划与执行解耦成两个agent。总结可背：规划能力本质是用更多搜索换更高成功率。\n\n## 3. 补充原问：AI Agent 的基本实现路径是什么？\n\n### 1. 子问题：ai agent是怎么实现的，如何通过调大模型的api、调rag、调mcp组合实现这个agent的\n**口述答案（约300字）**：\n我会把这题回答成“控制面+数据面”。控制面是状态机/图编排：定义节点、路由条件、重试策略和结束条件；数据面是每个节点具体怎么跑。大模型API负责推理与决策，RAG负责提供外部知识，MCP负责标准化工具调用。一个典型回路是：先由模型判断当前任务是否需要知识检索或调用工具；若需要，就先走RAG拿上下文，再走MCP调用外部能力，比如搜索、数据库查询、系统操作；工具结果回填到状态，再交给模型继续推理，直到满足结束条件。关键是“节点输入输出契约”要清晰，比如每个节点只读必要状态，只写自己产物，避免上下文污染。为了线上稳定，我会加步数上限、超时、幂等键和降级策略；为了可运维，我会打全链路trace，区分是Prompt问题、检索问题还是工具问题。\n**来源**：公开社区资料\n\n## 4. 补充原问：Agent 当前的局限是什么？\n\n### 1. 子问题：你觉得agent这个东西有什么缺点吗，因为目前人们普遍觉得agent好像也没有做出什么特别亮眼的产品或者功能\n**口述答案（约300字）**：\n我认为Agent当前的短板主要是“稳定性、可控性、成本”三件事。第一，稳定性：任务链路长、依赖外部工具多，任何一环抖动都会影响成功率。第二，可控性：模型是概率系统，复杂场景下会出现误判、过度调用工具甚至越权风险。第三，成本：多轮推理+检索+工具调用叠加，token和外部API成本上升很快。为什么看起来“没爆款”，本质是很多场景还没跨过“可用到可靠”的工程门槛。我的看法是Agent更适合流程明确、容错可设计、收益可量化的场景，比如内容生产、客服分流、内部效率工具。要做出亮点，关键不是堆模型，而是做强编排、评测和治理，把失败率和成本打下来。\n**来源**：公开社区资料\n\n## 5. 补充原问：如果设计一个 Agent 产品，你会从什么方向切入？\n\n### 1. 子问题：如果让你设计一个agent的产品或者功能，你会考虑什么方向的功能\n**口述答案（约300字）**：\n我会优先选“高频、可量化、可回滚”的业务场景，比如企业知识问答+任务执行助手。设计思路是先确定目标指标，再反推功能。第一步定义北极星指标，如任务完成率、人工介入率、平均处理时长、单位任务成本。第二步做能力拆分：意图识别、检索增强、工具执行、结果审校、异常兜底。第三步做安全和治理：最小权限、敏感操作二次确认、全链路审计。第四步做上线策略：小流量灰度、在线AB、失败快速回滚。我的经验是先做“半自动”而不是“全自动”，把高风险动作放人工审批，先把稳定性和信任建立起来，再逐步放开自治程度。这样产品落地速度更快，业务方也更愿意采用。\n**来源**：公开社区资料\n","title":"01_Agent基础核心问答"},"01_AI/02_Workflow与多Agent/01_核心问答.md":{"md":"# 02_Workflow与多Agent核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：什么时候用单 Agent、多 Agent、Autonomous Agent？\n\n### 1. 子问题：单Agent、多Agent、Autonomous与协作编排\n主问题：什么时候用单 Agent，什么时候用多 Agent，什么时候要降级半自动？\n\n口述答案：\n单 Agent 适合流程短、目标清晰、风险可控场景；多 Agent 适合复杂任务拆解与并行协作，比如 Planner/Executor/Critic 分工；Autonomous Agent 强调长链路自主闭环，但需要更强安全边界。多 Agent 的优势是上限高，但复杂度集中在通信协议、状态一致性和路由收敛。若涉及高风险动作、成功率持续下滑或链路不可解释，应降级到半自动工作流，让人工接管关键决策。\n\n常见追问：\n\n1. 多 Agent 最容易坏在哪一层？\n2. A2A 协议与普通框架差异是什么？\n3. 如何定义“该降级”的阈值？\n\n### 2. 子问题：在构建一个复杂的 Agent 时，你认为最主要的挑战是什么？\n答：\n难点不止模型能力，而是端到端系统可靠性。通常集中在四类：规划鲁棒性不足导致循环或跑偏、评估难复现导致难迭代、成本时延高导致无法规模化、安全可控不足导致高风险动作不可上线。面试可强调“先做可控再做聪明”：加步数上限、权限边界、故障回退和全链路日志，优先保底稳定性。\n\n- **参考答案：** 构建一个复杂的Agent（例如，需要多步规划、多工具交互、长期记忆的Agent）时，会遇到一系列从理论到工程的挑战。我认为最主要的挑战可以归结为以下几点：\n  1. **规划与推理的鲁棒性 (Robustness of Planning and Reasoning):**\n    - **具体表现：** Agent卡在重复的“思考-行动”循环中；对工具的失败没有备用方案；过早地认为任务已完成。\n  2. **可靠且可复现的评估 (Reliable and Reproducible Evaluation):**\n    - **挑战描述：** 如何科学地评估一个Agent的性能极其困难。对于一个复杂的、开放式的任务（如“帮我规划一次为期一周的新加坡旅游”），没有唯一的正确答案。\n    - **具体表现：**\n      - **评估指标难以定义：** 仅看最终结果是否“好”是主观的。需要评估过程的效率（调用了多少次工具）、成本（花费了多少token）、鲁棒性（在不同干扰下的表现）等。\n      - **环境不可复现：** 如果Agent使用了搜索引擎等动态工具，两次执行的结果可能完全不同，导致评估无法复现。\n      - **评估成本高：** 目前最可靠的评估方式仍然是人工评估，但成本高昂且难以规模化。\n  3. **成本、延迟与可扩展性 (Cost, Latency, and Scalability):**\n    - **挑战描述：** 一个复杂的任务可能需要Agent进行数十次甚至上百次的LLM调用（每次思考、每次总结、每次决策都需要一次调用）。\n    - **具体表现：**\n      - **高昂的API费用：** 使用GPT-4等强大模型作为Agent大脑，一次复杂任务的成本可能高达数美元。\n      - **服务扩展性差：** 高成本和高延迟使得将这类复杂Agent大规模部署给海量用户变得不切实际。\n  4. **安全与可控性 (Safety and Controllability):**\n    - **具体表现：**\n      - **权限管理困难：** 如何精确控制Agent的权限，防止它执行危险操作（如删除文件、发送恶意邮件）？\n      - **提示注入攻击（Prompt Injection）：** 恶意用户或被Agent处理的外部数据（如网页内容）可能包含恶意指令，劫持Agent去执行非预期的任务。\n      - **不可预测性：** Agent的自主性使其行为难以被完全预测，可能会产生意料之外的负面后果。\n\n### 3. 子问题：什么是多智能体系统？让多个 LLM Agent 协同工作相比于单个 Agent 有什么优势？又会引入哪些新的复杂性？\n答：\n多智能体系统就是把一个复杂目标拆成多个角色协同完成，例如规划、执行、审校分工。从而提高复杂任务成功率.\n\n优势是:\n\n 1.专业化:可以为每个Agent设定不同的角色和专长。例如，在一个软件开发团队中，可以有一个“产品经理Agent”负责需求分析，一个“程序员Agent”负责编写代码，一个“测试工程师Agent”负责编写测试用例。每个Agent都可以基于专门的知识和工具进行微调，从而在各自领域达到更高的专业水平。\n\n2.并行化:复杂任务可以被分解成多个子任务，并分配给不同的Agent同时处理，这大大缩短了解决问题的总时间\n\n新增复杂性:\n\n1.通信协议: Agent之间如何有效沟通？需要设计一套标准化的通信协议和消息格式，确保它们能够相互理解意图、状态和知识\n\n2.任务协调、状态一致性：谁负责、谁失败、谁回滚都要定义清楚。没有明确编排规则时，多 Agent 反而会比单 Agent 更不稳定。\n\n多agent的框架: LangGraph, OpenAI Agents SDK, AutoGen, CrewAI, claude agent sdk 的agent team.\n\n### 4. 子问题：了解 A2A 框架吗？它和普通 Agent 框架的区别在哪，挑一个最关键的不同点说明。\n答：\nA2A（Agent-to-Agent）最关键在“协议层”, A2A是一个通讯协议，类似于HTTP那样的底层协议，它关注的是**多个异构Agent之间的通信和协作**。它试图定义一套**通用的标准、协议和语言**，使得由不同开发者、使用不同技术栈、为了不同目标而构建的Agent们，能够相互发现、理解和协作。\n\n 一句话总结：前者解决“群体协作标准”，后者解决“个体执行能力”。多团队、多技术栈协作时，A2A 的价值会明显放大。\n\n### 5. 子问题：Multi-Agent 实际项目怎么设计？\n答：\n“角色分工 + 状态编排 + 失败恢复”三部分:\n\n角色分工: 典型角色是 Planner（规划）、Executor（执行）、Critic（审校）、Tool Agent（外部能力）。\n\n状态编排: 状态层用图或状态机管理节点流转，\n\n失败恢复: 每个节点配超时、重试、步数上限、防循环, 高风险任务接人工接管（human-in-the-loop）。\n\n每个 Agent 有明确输入输出契约，避免互相污染上下文。\n\n上线后通过 trace 做全链路观测，重点看任务成功率、时延、成本和重试率。\n\n核心思想是让 Agent 像微服务一样可组合、可回放、可治理。\n\n追问：多 Agent 协作里最容易出问题的是哪一层？\n\n最容易出问题的是**状态编排层（Orchestration）**，不是单个模型. 多 Agent 的失败大多发生在“交接”.\n\nLangGraph 能显著降低这类问题, 它的价值是把“多 Agent 协作”从隐式流程变成显式状态机，最容易出问题的编排层就更可控了。它主要帮你做这几件事：\n\n1. 明确状态与节点边界：每个节点读写同一份状态，减少上下文串台。\n2. 条件路由可控：用条件边和结束节点，避免无意回环。\n3. 可恢复：checkpointer 支持中断后续跑，不用整条链重来。\n4. 可插人工：关键节点可 interrupt 做人工审核。\n5. 可观测：每步输入/输出可追踪，方便定位哪一层坏了。\n\n但这些坑仍然会发生（框架不会替你解决）：\n\n- I/O 契约没定义清楚\n- 工具调用非幂等（重试导致重复副作用）\n- 没有超时、最大步数、重试上限\n- 状态字段设计混乱\n\n### 6. 子问题：Multi-Agent 系统与 Autonomous Agent 的区别是什么？\n答：\n\nAutonomous Agent 强调单体自主闭环，适合流程清晰、低风险、成本敏感的任务；\n\nMulti-Agent 强调多角色分工协作，适合复杂任务拆解、并行处理和交叉审校。\n\n把agent想象成组织中的员工, 要看具体做的事情的大小和复杂度.\n\n工程上两者最大差异在编排复杂度和故障域：单体方案简单但一旦决策偏差影响全链路；多 Agent 方案治理更复杂，但可以局部隔离和重试，整体上限更高。\n\n追问：什么场景下你会从 Autonomous Agent 降级到半自动工作流？\n\n当任务风险高、动作不可逆或系统指标恶化时，我会把 Autonomous Agent 降级为半自动：保留其检索和生成能力，但把最终执行权交给人工审批，先保正确性和可追责。\n\n### 7. 子问题：Chain、Agent、Workflow 三者怎么区分？\n答：\nChain 是固定顺序管道，适合确定性流程；Agent 是模型驱动决策，适合开放任务；Workflow（特别是 LangGraph）是显式状态机，适合把 Agent 决策放进可控节点里。我的实践是“固定流程优先 Chain，复杂闭环用 LangGraph Workflow 托管 Agent”。\n\n追问：你会如何限制 Agent 的自由度，避免乱调用工具？\n\n对，首先是工具白名单和最少最小权限的放行。然后还有是限制最大部署、最大调用次数、超时和成本，以及超阈值的容量降低降级。就是写作操作加密等件，以及高风险动作必须人工来审批。再配合全链路的监控和日常告警，可以做到可追溯、可回滚、可治理。\n\n### 8. 子问题：多 Agent 在 LangGraph 里怎么编排更稳？\n答：\n用 LangGraph 的主控图+专家节点模式：Planner 只拆解任务，Dispatcher 负责路由，Executor 只执行，Critic 只审校。核心是契约化通信和图层守卫。\n\n全局状态只放最小字段，大文本走引用，避免上下文污染。\n\n图上配置最大步数、重试上限、超时和预算.\n\n写操作加幂等键并在做 checkpoint。这样即使失败也能从节点恢复，不会重复副作用。\n\n上线后按任务成功率、改写率、时延和成本做节点级观测，持续收敛流程稳定性。\n\n追问：多 Agent 最容易坏在哪一层？你如何监控？\n\n多 Agent 先坏编排层，我会把监控重点放在路由收敛、重试行为和契约有效性上；一旦 loop 或 retry 异常，先熔断入口再排查节点\n\n## 2. 补充材料：多步骤研究型工作流的产品化思路\n\n### 2) Introducing Wide Research\n\n- 原文链接：\n  - [https://manus.im/blog/introducing-wide-research](https://manus.im/blog/introducing-wide-research)\n- 核心思想：\n  - 提出 Wide Research 作为复杂研究任务的产品能力，目标是让 Agent 处理更宽、更深的任务。\n  - 本质是把任务拆解与多源信息整合能力产品化，而不是只做一次性问答。\n  - 强调在真实业务任务中，任务编排和可恢复执行比单次回答“聪明”更重要。\n- 文章概述（约500~1000字）：\n  - 这篇“Introducing Wide Research”本质是在回答一个问题：为什么传统对话式 AI 在真实研究任务里常常“看起来聪明、做起来不稳”。文章提出的解决方向不是再堆一个更长回复，而是把研究任务拆成可管理的多阶段流程。所谓“Wide”，一是信息覆盖面要广，能够跨来源、跨类型收集证据；二是分析深度要够，能从线索继续下钻，而不是停在表面总结。文章强调，研究型任务通常不是一次检索+一次生成就结束，而是“计划-执行-复核-修正”的循环，因此系统必须支持阶段状态、断点恢复和可追踪过程。Manus 在产品上把这些能力显式化：先给出任务框架，再并行收集材料，然后做证据整合与结论生成，最后输出可交付结果。文章传达的核心不是“回答更长”，而是“流程更完整、过程更可靠”。从面试视角，你可以把它作为“Agent 从问答走向工作流”的案例：关注的指标从文本质量转向任务成功率、可解释性、时延和成本；关注的风险从“答错一句话”转向“流程中断、证据遗漏、结论失真”。因此它更像一个研究任务操作系统，而不只是一个会写字的模型壳。\n- 面试可能问的点：\n  - 问：多步骤研究型 Agent 的核心链路怎么设计？\n  答：我会设计成“规划-并行采集-证据归并-结论校验-交付输出”五段。先把问题拆成子任务，再并行拉取多源信息，做去重和可信度排序，最后生成可追溯结论。每段都有输入输出契约和失败恢复点，避免长链路一步错全盘错。\n  - 问：为什么复杂任务更依赖“编排能力”而非“单次模型能力”？\n  答：复杂任务失败通常不在“某一句答错”，而在流程失控：顺序不对、依赖缺失、证据冲突没处理。编排能力决定任务能否按阶段收敛、能否回滚重试、能否追踪责任。模型再强，如果没有稳定编排，也很难在生产场景持续交付。\n  - 问：Wide Research 和普通 RAG 问答的工程差异是什么？\n  答：普通 RAG 更像单跳检索增强，目标是回答一个问题；Wide Research 是任务型流程系统，要支持多轮规划、并行采集、阶段归纳和动态重规划。前者强调召回与生成质量，后者还要强调任务成功率、过程可解释性、执行可靠性与恢复能力。\n\n---\n\n## 3. 补充材料：浏览器操作型 Agent 的工作流启发\n\n### 5) Introducing Manus Browser Operator\n\n- 原文链接：\n  - [https://manus.im/blog/manus-browser-operator](https://manus.im/blog/manus-browser-operator)\n- 核心思想：\n  - 把浏览器操作能力产品化，Agent 不只“会回答”，还能“会执行网页任务”。\n  - 重点在可靠执行：步骤化操作、状态感知、失败重试，而不是一次性脚本。\n  - 说明 Agent 能力从文本生成走向行动执行，工程复杂度显著上升。\n- 文章概述（约500~1000字）：\n  - 这篇文章讲的是 Agent 能力边界的一次升级：从“文本问答”走向“网页行动执行”。它的核心不在于会不会点按钮，而在于是否能稳定完成一条可验证的任务链路。Browser Operator 的价值是把网页操作流程化：先识别目标状态，再规划动作序列，执行后验证页面反馈，不满足预期则触发重试或改路径。相比脚本自动化，这种方式更依赖状态感知和错误恢复，因为真实网页环境有动态加载、弹窗、跳转、权限、会话失效等大量不确定性。文章隐含的工程重点是“动作闭环”：每一步都要有前置条件、执行动作和后置校验，否则系统看似在运行，实际可能已经偏离目标。它还提示了人机协同的必要性：当任务触发验证码、敏感确认或权限边界时，需要人工接管节点，而不是让 Agent 盲目继续。对面试来说，这篇文章可以帮助你回答“Browser Agent 为什么难上线”：难点在可靠性、可观测性和风险控制，而不是点击能力本身。你可以用一句话收尾：浏览器 Agent 是把 LLM 从“生成器”变成“执行器”，也把问题从“会不会答”升级成“能不能稳、能不能控”。\n- 面试可能问的点：\n  - 问：Browser Agent 的关键失败点有哪些？如何做重试和回滚？\n  答：高频失败点包括 DOM 变化、元素不可见、会话过期、跳转异常和限流。我的做法是“动作前置校验+失败分类重试”：可重试错误做指数退避，不可重试立即降级；关键写操作加幂等键，失败后按检查点回滚到上一步，不从头盲跑。\n  - 问：网页自动化中如何处理动态页面、登录态和反爬限制？\n  答：动态页面用显式等待和稳定锚点，不依赖脆弱选择器；登录态通过安全会话托管和失效检测自动刷新；遇到反爬或验证码时切人工节点，不强行绕过。目标不是“百分百自动化”，而是在合规前提下保证任务完成率和可控性。\n  - 问：为什么“可观测性”对 Browser Agent 特别重要？\n  答：因为浏览器任务是长链路状态机，失败常发生在中间节点。如果没有步骤级日志、截图、DOM快照和耗时指标，你无法判断是页面变化、网络抖动还是策略错误。可观测性直接决定排障速度、回归效率和线上稳定性，是生产化必备能力。\n\n---\n\n## 4. 补充材料：协作场景中的 Agent 接入方式\n\n### 7) Introducing Manus for Slack : Collaborate smarter\n\n- 原文链接：\n  - [https://manus.im/blog/introducing-manus-for-slack-collaborate-smarter](https://manus.im/blog/introducing-manus-for-slack-collaborate-smarter)\n- 核心思想：\n  - 把 Agent 接入团队协作平台（Slack），重点是线程级上下文和团队协作效率。\n  - 相比单人会话，团队场景更依赖权限控制、上下文隔离与可追踪交互。\n  - 文章展示了 Agent 从个人助手走向组织协作助手的落地方式。\n- 文章概述（约500~1000字）：\n  - 这篇文章展示的是 Agent 从个人工具走向团队生产力系统的关键一步：接入 Slack 等协作平台。看起来是“多一个入口”，本质上是上下文和权限模型都发生了变化。单人会话里，问题通常是连续且目标单一；团队协作里，一个频道可能并行多个任务、多个角色、多个优先级，如果没有线程级上下文隔离，很容易出现信息串台和指令污染。文章强调以 thread 作为上下文边界，把任务状态绑定到对话线程，并结合成员身份做权限映射，确保谁能触发什么动作、谁能看到什么结果都有明确规则。它还体现了协作场景的两个工程要求：一是可追踪，决策链和执行记录要可回放；二是可中断，关键节点允许人工介入确认，避免自动化操作越权。对面试来说，这篇文章能帮助你回答“企业里 Agent 为什么比个人场景难”：难在组织协作带来的权限、审计和责任边界，而不只是模型能力。你可以概括为：协作平台中的 Agent，本质是“流程参与者”，必须遵守团队的治理规则，才能真正被业务接受和长期使用。\n- 面试可能问的点：\n  - 问：团队协作场景下如何做会话隔离与权限控制？\n  答：我会把上下文主键设计为“workspace/channel/thread/user”，线程内共享任务状态，线程间严格隔离。权限采用角色映射到动作级策略，例如谁可触发外部调用、谁可审批敏感动作。这样既能协同，又能避免跨任务串台和越权执行。\n  - 问：群聊中的上下文污染如何治理？\n  答：先限制上下文来源：默认只读当前线程和被@消息；再做消息分级，低价值闲聊不进入任务记忆；关键事实落结构化状态而非自然语言堆叠。发生冲突时以最近确认状态为准，并保留证据引用，避免模型被噪声对话带偏。\n  - 问：为什么协作平台接入后，审计与追踪要求会更高？\n  答：因为协作平台涉及多人协同和组织责任，任何自动动作都可能影响业务结果与合规边界。必须回答清楚“谁发起、谁审批、执行了什么、影响了什么”，并支持回放复盘。审计链完整，才能在事故、争议和监管场景下可追责、可证明。\n\n---\n\n## 5. 补充原问：工具调用的业务流程如何串起来？\n\n### 1. 子问题：Agent 工具调用的完整业务流程是怎样的？\n**口述答案（约300字）**：\n完整流程我会按“判定-执行-回填-收敛”来讲。先由模型基于当前状态判定是否需要工具，并产出结构化调用计划；然后执行层做参数校验、权限校验和幂等校验，通过后调用工具；执行结果统一封装为成功/失败事件回填到状态；最后由模型吸收结果决定下一步，是继续调用、换工具、降级还是结束。每一步都要可观测：调用前后都打trace，记录入参摘要、耗时、错误码和重试次数。线上稳定依赖三件套：超时与重试策略、熔断与降级策略、人工接管开关。这样遇到外部依赖抖动时，系统能先止损再恢复，而不是把失败直接暴露给用户。\n**来源**：公开社区资料\n\n## 6. 补充原问：节点失败或意图识别错误如何处理？\n\n### 32.agent项目如果某个节点失败会怎么样，意图识别错了会怎么样\n\n如果某个节点失败会怎么样\n每个节点都有超时 + 最大次数，超过就走失败分支/降级路径/人工介入节点。\n做错误分级：可重试（超时、429、临时网络）和不可重试（参数错、权限错、业务校验失败）。\n用 checkpoint + 幂等键 保证断点恢复时不重复副作用（不重复下单/发消息）。\n\n如果意图识别错了会怎么样\n意图识别完之后，会先走一层校验层，或者说风险控制层。如果是高风险的意图，必须二次确认。然后在执行过程中可以做一致性校验。如果检索后工具返回的与意图不一致，要触发路由，要触发进行反思。\n\n## 7. 补充原问：OpenClaw/龙虾这类项目对 Agent 工作流的启发是什么？\n\n### 39.openclaw龙虾对agent技术的启发\n\n第一，Gateway统一网关入口，跨渠道消息先标准化，再路由，避免每个渠道各写一套逻辑。\n第二，会话隔离不串台：sessionKey、dmScope、每会话串行执行和队列并发上限，核心是防串台、防并发写冲突。\n第三，三层记忆系统: “文件化+可检索”的，MEMORY.md 做长期记忆，memory/*.md 做日记忆，配 memory_search，可追溯、可审计。\n第四，可托管运行：有心跳机制，保证龙虾会主动的思考工作。以及有定时任务块机制，确保周期任务统一调度。\n","title":"02_Workflow与多Agent核心问答"},"01_AI/03_RAG/01_核心问答.md":{"md":"# 03_RAG核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：RAG 从数据到生成的完整链路如何设计？\n\n### 1. 子问题：RAG全链路搭建（数据→切块→嵌入→索引→生成）\n主问题：如何从零搭建一个可用的 RAG 系统？\n\n口述答案：\nRAG 标准链路是：数据采集清洗、切块、嵌入、索引构建、在线检索、上下文组装、生成回答。关键不在“跑通”，在“可治理”：切块要兼顾语义完整与召回粒度，嵌入模型要看领域适配和检索指标，索引要支持增量更新和版本回切。上线时要保留数据版本、embedding 版本和索引版本，保证问题可复现、可回放。\n\n常见追问：\n\n1. 切块大小与重叠长度怎么定？\n2. 嵌入模型怎么评估与替换？\n3. 索引全量重建成本高时怎么办？\n  1. **增量索引，不重建全量**\n    档做 chunk_id + content_hash，只对“新增/变更/删除”的分片重算 embedding 并更新索引。\n  2. **双索引版本化（蓝绿）**\n    构建新版本索引，线上继续读旧版本；新索引验收通过后原子切换，失败可一键回滚到旧版本。\n  3. **热冷分层**\n    据（最近变更）走实时小索引，冷数据保留大基线索引；查询时做融合，夜间再异步合并，降低白天重建压力。\n  4. **元数据与向量解耦**\n    期、作者这类过滤条件变化，不要重建向量索引；单独维护元数据倒排/数据库过滤层即可。\n\n### 2. 子问题：请解释 RAG 的工作原理。与直接对 LLM 进行微调相比，RAG 主要解决了什么问题？有哪些优势？\n答：\nRAG 是“先检索、后生成”的模式：先从外部知识库召回相关片段，再把片段和问题一起喂给模型作答。它主要解决三件事：知识过时、领域私有知识缺失、幻觉不可控。相比微调，RAG 的优势是更新快、成本低、可追溯性强，业务文档变更时通常只需更新索引，不必重新训练大模型。\n\n**RAG (Retrieval-Augmented Generation)** 的工作原理是一种“**先检索，后生成**”的模式，它将信息检索（Information Retrieval）与文本生成（Text Generation）相结合，来增强大型语言模型（LLM）的能力。\n\n**工作流程如下：**\n\n1. **检索（Retrieve）：** 当用户提出一个问题时，RAG系统首先不会直接将问题发送给LLM。相反，它会把用户的问题作为一个查询（Query），在一个外部的知识库（通常是向量数据库）中进行搜索，找出与问题最相关的几段信息（documents/chunks）。\n2. **增强（Augment）：** 系统会将检索到的这些相关信息与用户的原始问题**拼接**在一起，形成一个内容更丰富、信息量更大的**增强提示（Augmented Prompt）**。\n3. **生成（Generate）：** 最后，将这个增强后的提示喂给LLM。LLM会基于其自身的知识和我们提供的上下文信息，生成一个更准确、更具事实性的回答。\n\n**RAG主要解决了LLM的以下核心问题：**\n\n1. **知识的静态性与过时性：** LLM的知识被“冻结”在其训练数据截止的那个时间点。RAG通过连接一个可以随时更新的外部知识库，使得LLM能够获取和利用最新的信息，解决了知识过时的问题。\n2. **幻觉（Hallucination）：** LLM在回答其知识范围外或不确定的问题时，倾向于捏造事实。RAG通过提供具体的、相关的上下文，将LLM的回答“锚定”在这些事实依据上，显著降低了幻觉的产生。\n3. **缺乏专业领域知识与私有知识：** 对LLM进行微调来注入特定领域的知识成本高昂且效果有限。RAG可以轻松地将模型与任何私有数据集（如公司内部文档、个人笔记）连接起来，使其成为一个领域专家。\n\n**与微调（Fine-tuning）相比，RAG的优势：**\n\n- **知识更新成本低：** 更新知识只需在数据库中添加或修改文档，无需重新训练昂贵的LLM。而微调则需要重新进行训练。\n- **可追溯性与可解释性：** RAG可以清晰地展示出答案是基于哪些源文档生成的，用户可以点击查看来源进行事实核查。微调则像一个“黑盒”，无法知道知识的具体来源。\n- **降低幻觉：** RAG通过提供事实依据，让回答有据可循。微调虽然能注入知识，但模型仍可能在不确定时产生幻觉。\n- **个性化：** 可以为每个用户或每个请求动态地接入不同的知识源，实现高度的个性化服务\n\n### 3. 子问题：一个完整的 RAG 流水线包含哪些关键步骤？请从数据准备到最终生成，详细描述整个过程。\n答：\n完整链路分离线和在线两段。离线阶段做数据加载、清洗切块、向量化、建索引；在线阶段做查询改写、向量检索、重排、上下文组装、生成回答。面试建议强调“检索前处理”和“检索后重排”这两个提升点，线上还要有评估回流和索引更新机制，否则质量会逐步衰减。\n\n- 一个完整的RAG流水线可以分为两个主要阶段：**离线的数据准备（索引）阶段** 和 **在线的查询（推理）阶段**。\n**阶段一：数据准备 / 索引流水线 (Offline / Indexing Pipeline)** 这个阶段的目标是构建一个可供检索的知识库，它通常是一次性或周期性执行的。\n  1. **数据加载（Load）：** 从各种数据源加载原始文档。数据源可以是PDF文件、Word文档、网页、Notion数据库、Confluence页面、数据库表格等。\n  2. **文本切块（Split / Chunk）：** 将加载进来的长文档切割成更小的、语义完整的文本块（chunks）。这一步至关重要，因为后续的检索和生成都是以这些小块为单位的。\n  3. **嵌入（Embed）：** 使用一个预训练的文本嵌入模型（Embedding Model，如BERT, BGE, M3E等），将每一个文本块转换成一个高维的数字向量（vector）。这个向量捕捉了文本块的语义信息。\n  4. **存储（Store）：** 将每个文本块的内容及其对应的嵌入向量存储到一个专门的数据库中，最常见的就是**向量数据库（Vector Database）**，如FAISS, ChromaDB, Pinecone等。数据库会为这些向量建立索引，以便进行高效的相似度搜索。\n  **阶段二：查询 / 推理流水线 (Online / Inference Pipeline)** 这个阶段是当用户提出问题时实时执行的。\n  1. **用户提问（User Query）：** 系统接收用户输入的自然语言问题。\n  2. **查询嵌入（Embed Query）：** 使用与**步骤三中完全相同**的嵌入模型，将用户的提问也转换成一个查询向量。\n  3. **向量检索（Retrieve）：** 将这个查询向量与向量数据库中存储的所有文本块向量进行相似度计算（通常是余弦相似度或点积）。系统会找出与查询向量最相似的Top-K个文本块向量，并将它们对应的原始文本块内容检索出来。\n  4. **（可选）重排序（Re-rank）：** 为了进一步提升检索质量，可以引入一个重排序模型。它会对初步检索出的Top-K个文本块进行更精细的打分和排序，选出与问题真正最相关的Top-N个（N < K）。\n  5. **增强与生成（Augment & Generate）：**\n    - 将重排序后最优的N个文本块内容，与用户的原始问题一起，按照一个预设的模板（Prompt Template）组合成一个增强提示。\n    - 将这个增强提示发送给LLM，由LLM基于提供的上下文和自身知识，生成最终的、流畅的、有根据的回答。\n\n### 4. 子问题：在构建知识库时，文本切块策略至关重要。你会如何选择合适的切块大小和重叠长度？这背后有什么权衡？\n答：\n切块没有固定最优值，核心是语义完整性与检索精度的平衡。块太大，上下文噪声高、成本高；块太小，语义断裂、回答不完整。重叠用于减少边界信息损失，常从 10%-20% 起步。实践里我会按文档类型分策略：说明书偏结构切块，FAQ偏短块，然后用 Recall@K 和人工抽检迭代参数。\n\n文本切块（Chunking）是RAG流程中最关键且最需要经验的步骤之一，它直接影响检索的召回率和精确度，进而影响最终生成答案的质量。选择合适的切块大小（Chunk Size）和重叠长度（Overlap）需要在多个因素之间进行权衡。\n\n**如何选择合适的切块大小（Chunk Size）？**\n\n1. **依据嵌入模型的能力：** 很多嵌入模型在处理中等长度（如256-512个token）的文本时效果最好，过长或过短都可能导致语义表征质量下降。\n2. **依据数据的类型和结构：**\n  - 对于**结构化的、段落分明的**文档（如论文、报告），可以采用**语义切块**，即按段落、标题或句子来切分，这样能最大程度地保留语义完整性。\n  - 对于**非结构化的长文本**，则更多地依赖固定长度切块。\n  - 对于**代码**，应该按函数或类来切块，而不是简单地按行数。\n3. **依据预期的查询类型：** 如果用户的问题通常很具体，需要精确定位到某一句话，那么较小的切块（如句子级别）可能更有效。如果用户的问题很宽泛，需要综合多个段落的信息，那么较大的切块会更好。\n\n**如何选择合适的重叠长度（Overlap）？**\n\n重叠长度的作用是**防止语义信息在切块边界被硬生生地切断**。例如，一个重要的概念可能在一句话的结尾被提出，而在下一句话的开头进行解释。如果没有重叠，这句话就会被分割到两个独立的块中，破坏其完整性。\n\n- 一个常见的经验法则是设置重叠长度为**切块大小的10%-20%**。例如，对于1024个token的切块，可以设置128或256个token的重叠。\n- 重叠并非越大越好，过大的重叠会增加数据冗余和存储成本。\n\n**背后的权衡（Trade-offs）：**\n\n- **大块（Large Chunks） vs. 小块（Small Chunks）：**\n  - **大块的优点：** 包含更丰富的上下文，有助于回答需要广泛背景知识的复杂问题。\n  - **大块的缺点：**\n    1. **噪声增加：** 可能会包含大量与用户查询不直接相关的信息，稀释了关键信息的“信噪比”。\n    2. **检索精度下降：** 嵌入向量代表的是整个大块的平均语义，可能无法精确匹配非常具体的问题。\n    3. **成本更高：** 送入LLM的上下文更长，API调用成本更高。\n    4. **“大海捞针”问题：** 容易触发LLM的“Lost in the Middle”问题。\n  - **小块的优点：** 信息密度高，与具体问题的相关性强，检索更精确。\n  - **小块的缺点：**\n    1. **上下文不足：** 单个小块可能不包含回答问题所需的全部信息，需要检索并拼接多个小块才能形成完整答案。\n    2. **语义割裂：** 容易将原本连续的上下文信息切断。\n\n**总结：** 切块策略没有唯一的“最佳”方案。实践中，通常会从一个合理的基线（如`chunk_size=512`, `overlap=64`）开始，然后通过评估检索质量，针对具体的文档类型和查询场景进行迭代优化。有时甚至会采用**多尺度切块**的策略，即同时索引不同大小的块，以应对不同粒度的查询。\n\n### 5. 子问题：如何选择一个合适的嵌入模型？评估一个 Embedding 模型的好坏有哪些指标？\n答：\n选 Embedding 先看场景匹配：语言、领域、时延预算和部署方式，再看公开基准如 MTEB/C-MTEB。评估时重点看检索相关指标：Recall@K、MRR、nDCG，同时结合线上延迟和成本。离线分数高不等于线上最优，必须做业务数据集验证，尤其是长尾 query 与专业术语场景。\n\n选择合适的嵌入模型（Embedding Model）是决定RAG系统检索效果的基石。一个好的嵌入模型应该能够将语义相近的文本映射到向量空间中相近的位置。\n\n**如何选择合适的嵌入模型？**\n\n1. **参考公开排行榜（Leaderboards）：**\n  - **MTEB (Massive Text Embedding Benchmark)** 是目前最权威、最全面的嵌入模型评测基准。它涵盖了多种任务和语言，是选择模型的首要参考。可以直接查看MTEB排行榜，选择在 **检索（Retrieval）** 任务上得分高的模型。\n  - C-MTEB是专门针对中文的排行榜。\n2. **考虑具体应用场景：**\n  - **领域特异性：** 如果你的知识库是某个专业领域（如医疗、法律、金融），可以考虑使用在该领域数据上预训练或微调过的嵌入模型，它们通常比通用模型表现更好。\n  - **语言支持：** 确保模型支持你的业务所涉及的语言，特别是对于多语言场景。\n  - **模型大小与速度：** 模型越大通常效果越好，但推理速度也越慢，成本越高。需要在效果和性能之间做出权衡。对于需要低延迟的实时应用，可能需要选择一个更小的模型。\n3. **私有模型 vs. 开源模型：**\n  - **私有模型（如OpenAI的Ada系列）：** 优点是性能强大，使用方便。缺点是数据需要通过API传输，存在隐私风险，且成本较高。\n  - **开源模型（如BGE, M3E, Jina-embeddings等）：** 优点是可本地部署，数据安全可控，成本低，且有大量高质量模型可供选择。缺点是需要自己进行部署和维护。\n\n**评估Embedding模型好坏的指标：** 评估指标主要来自MTEB基准，可以分为几大类：\n\n1. **检索（Retrieval）：** 这是对RAG最重要的评估任务。\n  - **nDCG@k (Normalized Discounted Cumulative Gain):** 综合衡量了检索结果的**相关性**和**排名**。是检索任务中最核心和最全面的指标。\n  - **Recall@k:** 衡量在前k个结果中，召回了多少比例的相关文档。\n  - **MRR (Mean Reciprocal Rank):** 衡量第一个相关文档出现在第几位。适用于那些只需要找到一个正确答案的场景。\n2. **语义文本相似度（Semantic Textual Similarity, STS）：**\n  - **指标：** Spearman或Pearson相关系数。\n  - **评估方式：** 衡量模型计算出的向量余弦相似度，与人类判断的两句话的语义相似度分数之间的相关性。一个好的模型，其相似度计算结果应该与人类的直觉高度一致。\n3. **分类（Classification）：**\n  - **指标：** 准确率（Accuracy）。\n  - **评估方式：** 将文本嵌入向量作为特征，训练一个简单的逻辑回归分类器，看其在文本分类任务上的表现。这衡量了嵌入向量作为“特征”的质量。\n4. **聚类（Clustering）：**\n  - **指标：** V-measure。\n  - **评估方式：** 看模型生成的嵌入向量能否在无监督的情况下，将语义相似的文本自然地聚集在一起。\n\n## 2. 主干问题：如何优化 RAG 的检索质量与高级能力？\n\n### 1. 子问题：RAG检索优化与高级范式（重排/图谱/自适应检索/向量库）\n主问题：如何持续提升 RAG 的召回质量与问答效果？\n\n口述答案：\n优化路径通常是“召回更准 + 排序更稳 + 上下文更干净”。可用混合检索（向量+关键词）、重排模型、多查询改写、HyDE、元数据过滤、知识图谱增强等手段。遇到 Lost in the Middle，要做上下文重排和压缩。向量库选型上，FAISS 适合单机实验，pgvector 适合和关系数据强耦合，Milvus 适合大规模服务化。\n\n常见追问：\n\n1. 何时引入图数据库而不是纯向量库？\n2. 检索“慢和贵”怎么优化？\n3. 向量库上线后看哪些核心指标？\n\n### 2. 子问题：除了基础的向量检索，你还知道哪些可以提升 RAG 检索质量的技术？\n答：\n\n主要可以分为**增强检索器**和**优化查询**, 优化索引结构三块。\n\n**一、 增强检索器（Improving the Retriever）**\n\n1. **混合搜索（Hybrid Search）：**\n  - **技术：** 将 **稀疏检索（Sparse Retrieval）** 和 **密集检索（Dense Retrieval）** 相结合。\n    - **稀疏检索（如BM25 ）：** 基于关键词匹配，对于包含特定术语、缩写、ID的查询非常有效。BM25 是基于词频、逆文档频率和长度归一化的打分函数，本质是更工程化的 TF-IDF，特别适合关键词和实体词检索场景\n    - **密集检索（向量搜索）：** 基于语义相似度，擅长理解长尾、口语化的查询。\n  - **优势：** 兼顾了关键词精确匹配和语义模糊匹配的能力，效果通常远超单一检索方法。\n2. **重排序（Re-ranking）：**\n  - **技术：** 采用一个 **两阶段（two-stage）** 的检索流程。\n  1. **召回（Recall）：** 先用一个快速但相对粗糙的方法（如向量搜索或混合搜索）从海量文档中召回一个较大的候选集（例如Top 50）。\n  2. **重排（Re-rank）：** 再使用一个更强大、更复杂的模型（通常是**Cross-Encoder**）对这个小候选集进行精细化的重排序，选出最终的Top-N（例如Top 5）作为上下文。\n    优势：** Cross-Encoder可以直接比较查询和文档的文本，捕捉更细粒度的相关性，精度远高于单纯的向量相似度，极大地提升了最终上下文的质量。\n\n**二、 优化查询（Improving the Query）**\n\n1. **query扩展与转换（Query Expansion & Transformation）：**\n  - **技术：** 不直接使用用户的原始查询进行检索，而是先用LLM对查询进行“加工”。\n  - **方法：**\n    - **多查询检索（Multi-Query Retrieval）：** 让LLM针对原始问题，从不同角度生成多个不同的查询，然后对所有查询的检索结果进行合并。\n    - **HyDE（Hypothetical Document Embeddings）：** 让LLM先针对问题生成一个“假设性”的答案，然后用这个假设性答案的嵌入去检索，因为答案的文本和目标文档的文本在形式上更相似。\n    - **子问题查询（Sub-Querying）：** 对于复杂问题，先将其分解成多个简单的子问题，分别检索，再汇总结果。\n\n**三、 优化索引结构（Improving the Index）**\n\n1. **小块引用大块（Small-to-Large Chunking）：**\n  - **技术：** 在索引时，将文档切成小的、用于检索的“摘要块”（Summary Chunks），但每个小块都保留对它所属的、更大的“父块”（Parent Chunk）的引用。\n  - **流程：** 检索时，用查询匹配小块以获得高精度，但最终送给LLM的是包含更丰富上下文的父块。\n  - **优势：** 兼顾了小块检索的精确性和大块上下文的完整性。\n2. **图索引（Graph Indexing）：**\n  - **技术：** 除了向量索引，还用LLM提取文档中的实体和关系，构建一个知识图谱。\n  - **流程：** 检索时，可以先在图谱中进行结构化查询，找到相关的实体和子图，再结合向量检索进行补充。\n  - **优势：** 对于需要进行多跳推理、理解实体关系的查询非常有效。\n\n### 3. 子问题：请解释“Lost in the Middle”问题。它描述了 RAG 中的什么现象？有什么方法可以缓解这个问题？\n答：\n它指模型在长上下文中更容易关注开头和结尾，忽略中间证据，导致RAG终关键片段明明检索到了却没被用上。\n\n缓解思路有四类：\n\n- 文档重排把高价值证据放首尾. 将**最相关**的文档放置在上下文的**开头**和**结尾**，而将次要相关的文档放在中间。\n- 减少 TopK 降噪. 严格控制Top-K中的K值，例如只取Top-3或Top-5。这需要前端的检索和重排序步骤有更高的精度，确保召回的文档质量足够高。\n- 在提示词中明确“需基于全部证据回答”.\n- 必要时做长上下文微调. 通过这种方式，可以“强迫”模型学会不忽略中间内容。这是最根本但成本也最高的解决方案。\n\n### 4. 子问题：在什么场景下，你会选择使用图数据库或知识图谱来增强或替代传统的向量数据库检索？\n答：\n当问题依赖实体关系和多跳推理时，图谱明显优于纯向量检索，比如“金融领域的公司股权结构; 医疗领域的药物-基因-疾病关系网络; 供应链管理”。图结构还能给出可解释证据链，适合合规审计和风控。多数业务不是替代关系，而是互补：先图谱定位实体与关系，再构建更精确的查询, 去向量查询补充非结构化上下文，最后交给模型综合生成。\n\n主要是在处理**高度关联、结构化的数据**以及需要进行**复杂关系推理**的场景下。\n\n向量数据库擅长的是**语义相似度**的模糊匹配，而知识图谱擅长的是**实体与关系**的精确查询。\n\n**核心应用场景：**\n\n1. **需要多跳推理（Multi-hop Reasoning）的复杂问题：**\n  - **场景描述：** 当用户的问题无法通过单个文档或事实来回答，而需要沿着实体之间的关系链进行多次“跳转”才能找到答案时。\n  - **举例：**\n    - “`Llama 2` 的作者所在的公司的CEO是谁？”\n      - 这是一个三跳查询：`Llama 2` -> `作者` -> `Meta` -> `CEO`\n    - “和我正在处理的这个客户（A公司）在同一个行业、并且使用了我们产品B的成功案例有哪些？”\n      - `A公司` -> `所属行业` -> `同行业的其他公司` -> `使用了产品B的公司`\n  - **为什么用KG：** 这类问题用向量检索几乎无法完成，但对于知识图谱来说，就是几次简单的图遍历查询。\n2. **当数据本身具有强结构和关联性时：**\n  - **场景描述：** 数据中包含大量的实体（人、公司、产品、地点）和它们之间明确的关系（雇佣、投资、拥有、位于）。\n  - **举例：** 金融领域的公司股权结构、医疗领域的药物-基因-疾病关系网络、供应链管理。\n  - **为什么用KG：** 将这些数据建成知识图谱，可以最大化地利用其结构信息。例如，可以快速找到一个公司的所有子公司，或者发现两个看似无关的人之间的隐藏联系。\n3. **需要提供高度可解释性的答案时：**\n  - **场景描述：** 在一些严肃的应用（如金融风控、医疗诊断）中，不仅需要给出答案，还需要清晰地解释答案是如何得出的。\n  - **举例：** “为什么将这个交易标记为高风险？” -> “因为交易方A是B公司的子公司，而B公司在一个月前被列入了制裁名单。”\n  - **为什么用KG：** 知识图谱的查询路径本身就是一种非常直观、可解释的证据链。\n\n**增强或替代？** 在大多数情况下，知识图谱和向量数据库是**互补增强**的关系，而非完全替代。一个常见的先进RAG模式是：\n\n1. **混合检索：** 首先用LLM分析用户问题。\n2. 如果问题涉及复杂关系，则先**查询知识图谱**，找到核心的实体和事实。\n3. 然后，将这些从图谱中检索到的结构化信息，作为上下文，或者用来**构建更精确的查询**，再去**向量数据库**中检索相关的非结构化文本，以获得更详细的解释和背景。\n4. 最后，将两方面的信息汇总给LLM生成答案。\n\n### 5. 子问题：传统的 RAG 流程是“先检索后生成”，你是否了解一些更复杂的 RAG 范式，比如在生成过程中进行多次检索或自适应检索？\n答：\n有，典型是迭代检索和自适应检索。迭代检索会在初答后做反思，再发起二次检索补证据；自适应检索是在生成过程中遇到不确定点时动态触发检索。还有多源 Agentic RAG，会同时调用向量库、图谱、SQL 或搜索 API。它们共同目标是提升复杂问题准确率，但会增加流程复杂度和时延。\n\n传统的“先检索后生成”（Retrieve-then-Read）范式虽然经典，但比较刻板。为了应对更复杂的问题和提升答案质量，研究界已经提出了多种更动态、更智能的RAG范式。\n\n**1. 迭代式检索 (Iterative Retrieval) - 例如 Self-RAG, Corrective-RAG**\n\n- **核心思想：** 将RAG从一个单向的流水线，变成一个**循环、自我修正**的过程。\n- **工作流程：**\n  1. **首次检索与生成：** 像传统RAG一样，进行检索并生成一个初步的答案。\n  2. **反思与评估（Reflection）：** LLM会对初步生成的答案和检索到的上下文进行“反思”。它会评估：当前的信息是否足够支撑答案？答案是否还有不确定或缺失的部分？\n  3. **二次检索：** 如果认为信息不足，LLM会**主动生成一个新的、更具针对性的查询**，进行新一轮的检索。例如，如果初步答案是“A公司的CEO是张三”，模型可能会反思“这个信息是否最新？”，然后生成一个新的查询“A公司2025年的CEO是谁？”\n  4. **整合与精炼：** LLM会整合新旧检索到的所有信息，生成一个更完善、更准确的最终答案。\n\n**2. 自适应检索 (Adaptive Retrieval) - 例如 FLARE, Self-Ask**\n\n- **核心思想：** 不在生成前一次性检索所有信息，而是在**生成过程中“按需”检索**，实现“即时”（just-in-time）的信息获取。\n- **工作流程：**\n  1. **开始生成：** LLM根据问题开始直接生成答案。\n  2. **预测不确定性：** 它会一边生成，一边预测接下来的内容。当它预测到即将生成一个事实性信息（如人名、日期、地点），但对此**不确定**（表现为下一个词的概率分布很平坦）时，它会**暂停**生成。\n  3. **主动提问与检索：** 在暂停处，LLM会插入一个特殊的占位符（如 `[SEARCH]`），并主动提出一个需要查询的问题（例如，“法国的首都是哪里？”）。\n  4. **获取信息并继续：** 系统执行这个查询，将检索到的答案（“巴黎”）填入，然后LLM基于这个新信息继续向下生成。\n- **优势：** 这种方法非常高效，只在需要时才进行检索，避免了预先检索大量无关信息。\n\n**3. 多源数据RAG (Multi-Source RAG)**\n\n- **核心思想：** 让Agent能够智能地从**多种不同类型的数据源**中进行检索和整合。\n- **工作流程：** Agent首先对问题进行分解，判断回答这个问题需要哪些信息。然后，它可能会决定：\n  - 从**向量数据库**中检索相关的非结构化文档。\n  - 从**知识图谱**中查询结构化的实体关系。\n  - 调用**SQL数据库**来获取精确的统计数据。\n  - 甚至调用**搜索引擎API**来获取实时信息。\n- 最后，Agent会将从不同来源获取的所有信息进行综合，生成一个全面的答案。这本质上是一种**Agent驱动的RAG**。\n\n### 6. 子问题：了解搜索系统吗？和 RAG 有什么区别？\n答：\n\n搜索系统的目标是“找文档”，输出是候选结果列表；\n\nRAG 的目标是“给答案”，输出是基于证据融合后的自然语言结果。\n\n两者不是替代关系，RAG 本质上是在搜索之上叠加了LLM的生成层。\n\n工程上常见组合是先检索再生成，并保留引用来源，让用户既能快速拿答案，也能回查证据。\n\n### 7. 子问题：向量检索（Milvus / FAISS / PGVector）怎么选型？\n答：\n\npgvector 适合向量检索和关系数据强耦合场景，能直接用 SQL 做联查和事务，接入成本最低\n\nMilvus 适合大规模在线检索和高并发服务化，扩展性最好，但运维复杂度也最高。\n\nFAISS 是库级方案，适合单机高性能和快速实验，但持久化、过滤、服务治理要自己补。\n\n我的策略通常是先用 pgvector 快速落地，规模和 QPS 上来后再迁到 Milvus，FAISS 更多用于算法实验或内部检索模块。\n\n追问：向量库上线后你会盯哪些核心指标？\n\n1. **检索质量:** 看“检索命中率、答案可溯源率、幻觉率变化”\n2. **时延与吞吐:** `p50/p95/p99` 查询时延（ANN检索时延 + 端到端时延）\n3. **可用性与稳定性:** 错误率、可用性（SLA）、CPU、内存、磁盘\n4. **数据新鲜度与索引健康:** 数据入库延迟、索引构建/更新延迟\n\n## 3. 主干问题：RAG 上线后如何治理慢、贵、幻觉与回归问题？\n\n### 1. 子问题：RAG上线挑战与工程治理\n主问题：RAG 在生产环境最常见的坑和治理策略是什么？\n\n口述答案：\n生产挑战主要是三类：数据新鲜度、稳定性、可解释性。文档更新后索引滞后会导致“答旧不答新”；检索链路抖动会造成时延和空召回；回答不可追溯会影响业务信任。治理上要做增量更新、索引版本化、灰度发布、回滚开关、失败补偿和可观测看板。\n\n常见追问：\n\n1. 增量更新如何保证排序与质量不崩？\n2. 没有索引快照时如何止损？\n3. 如何做检索质量回归测试？\n\n### 2. 子问题：如何全面地评估一个 RAG 系统的性能？请分别从检索和生成两个阶段提出评估指标。\n答：\n\n- 将其拆分为**检索阶段**和**生成阶段**两个独立但又相互关联的部分进行评估，因为最终答案的质量是这两个阶段共同作用的结果。一个好的评估框架应该同时包含**客观的、自动化的指标**和**主观的、人工的评估**。\n\n**第一阶段：检索性能评估 (Retrieval Evaluation)** 这个阶段的目标是评估我们的检索器（Retriever）能否“**找得对、找得全**”。评估需要一个包含（问题，相关文档ID）的标注数据集。\n\n- **核心指标：**\n  1. **上下文精确率 (Context Precision):** 衡量检索到的文档中有多少是真正与问题相关的。它反映了**检索结果的信噪比**。\n  2. **上下文召回率 (Context Recall):** 衡量所有相关的文档中，有多少被我们的检索器成功找回来了。它反映了**信息查找的全面性**。\n- **其他常用排名指标：** 3. **Hit Rate:** 检索到的文档中是否至少包含一个相关文档。这是一个基础的“及格线”指标。 4. **MRR (Mean Reciprocal Rank):** 第一个相关文档排名的倒数的平均值。它衡量找到第一个正确答案的速度。 5. **nDCG@k (Normalized Discounted Cumulative Gain):** 最全面和常用的指标之一，它同时考虑了检索结果的**相关性等级**和它们在结果列表中的**排名**。\n**第二阶段：生成性能评估 (Generation Evaluation)** 这个阶段的目标是评估LLM在给定上下文后，能否生成“**忠实、准确、有用**”的答案。\n- **核心指标（通常需要LLM-as-a-Judge或人工评估）：**\n  1. **可溯源性/zhong'cheng'd (Faithfulness / Groundedness):**\n    - **评估问题：** 生成的答案是否完全基于所提供的上下文？是否存在捏造或幻觉？\n  2. **答案相关性 (Answer Relevancy):**\n    - **评估问题：** 生成的答案是否直接、清晰地回答了用户的原始问题？\n  3. **答案正确性 (Answer Correctness):**\n    - **评估问题：** 答案中的信息是否事实准确？（这是一个更严格的指标，因为有时即使忠于原文，原文也可能是错的）\n- **自动化评估框架：**\n  - 像 **RAGAS**, **ARES**, **TruLens** 这样的开源框架，它们使用LLM-as-a-Judge的思想，将上述的Faithfulness, Relevancy等指标自动化计算出来，极大地提高了评估效率。例如，RAGAS会生成问题、答案，并自动检查答案是否忠实于上下文。\n\n### 3. 子问题：RAG 系统在实际部署中可能面临哪些挑战？\n答：\n\n1. **数据维护(Data Pipeline Complexity):**\n  - **分块策略的泛化性：** 一个在PDF上效果很好的分块策略，可能在处理HTML或JSON数据时效果很差。为异构数据源设计和维护一套鲁棒的分块策略非常困难。\n  - **知识库的实时更新：** 如何高效地保持向量索引与源数据的同步？当源文档被修改或删除时，需要有可靠的机制来更新或废弃对应的向量，这涉及到复杂的ETL（Extract, Transform, Load）流程。\n2. **延迟与成本 (Performance Bottlenecks: Latency & Cost):**\n  - **延迟：** RAG的“检索+生成”两步天然比直接调用LLM要慢。在实时交互场景下，检索和LLM生成的延迟都必须被极致优化。\n  - **成本：**\n    - **计算成本：** 大规模文档的嵌入、向量数据库的运行、LLM的API调用，都是持续的成本支出。\n    - **存储成本：** 向量索引本身会占用大量的存储空间，尤其是高维度的嵌入。\n3. **安全隐私 (Security & Privacy):**\n  - **访问控制：** 在企业环境中，不同的用户对不同的文档有不同的访问权限。RAG系统必须能够集成这套权限体系，确保用户只能检索到他们有权查看的文档内容。\n  - **提示注入：** 恶意用户可能会在查询中嵌入恶意指令，或者被索引的文档本身可能包含恶意内容，这些都可能用来攻击或操纵RAG系统。\n\n## 4. 补充原问：RAG 流程和原理\n\n### 1. 子问题：详细介绍rag的流程（包括解释一些实现的原理）\n**口述答案（约300字）**：\nRAG我一般分离线和在线两段讲。离线阶段先做数据接入和清洗，把PDF、Word、网页等转成统一文本；然后分块，通常按语义边界加重叠窗口，避免信息断裂；接着做Embedding写入向量库，并建立元数据索引。在线阶段是：用户问题先规范化，再做检索召回，拿到TopK候选后做重排，最后把“问题+高相关上下文+输出约束”拼成增强Prompt给大模型。核心原理是用向量相似度补充模型参数外知识，降低幻觉。工程上关键点有三类：第一是召回质量，靠分块策略、Embedding模型和重排一起保障；第二是时延，靠缓存、并行检索和限流；第三是可解释性，要求输出引用片段与来源。我的经验是先把召回率做上来，再调重排和Prompt，不然模型再强也会“无米下锅”。\n**来源**：公开社区资料\n\n## 5. 补充原问：RAG 主要解决什么问题？\n\n### 1. 子问题：谈谈对 RAG的理解，你认为它主要解决了哪些问题？\n**口述答案（约300字）**：\n我理解RAG是“检索增强生成”，核心价值是把外部知识在推理时注入模型，解决模型知识时效性差、专业领域覆盖不足和事实幻觉问题。它主要解决三类问题：第一，知识更新问题，不需要重新训练就能接入新资料；第二，可解释性问题，回答可附引用来源；第三，成本问题，相比全量微调，RAG迭代更快更便宜。它的边界也要讲清：RAG不能替代推理能力，召回不准时输出也会差，所以要重视分块、召回、重排和Prompt约束。我的实践原则是“先保障召回，再优化生成”，并用线上bad case持续回流，形成检索与提示词的双闭环优化。\n**来源**：公开社区资料\n\n## 6. 补充原问：知识库文档和切块\n\n### 1. 子问题：知识库搭建都用了什么形式的文档？如何分块的？\n**口述答案（约300字）**：\n知识库文档我会按来源分层：产品文档、FAQ、SOP、历史工单、结构化表数据和网页内容。接入时先做统一抽取和清洗，去掉模板噪声、导航文本和重复段。分块策略我通常用“语义分块+重叠窗口”：以标题、段落、列表为边界，每块控制在模型友好的token范围，并保留10%~20%重叠以防信息断裂。对代码、配置、表格等特殊内容会用专门切分器，避免语义破坏。每个chunk会带元数据，比如来源、更新时间、主题标签、权限级别，便于检索过滤和审计。实践里分块不是一次定死，会通过召回质量和答案引用质量持续调整大小、重叠和索引策略。\n**来源**：公开社区资料\n\n## 7. 补充原问：Query Rewrite 设计\n\n### 1. 子问题：问题改写如何设计的？单轮改写还是多轮改写？\n**口述答案（约300字）**：\n问题改写目标是提升检索召回，不是把问题“写得更漂亮”。我一般采用“单轮为主，多轮兜底”。单轮改写会做三件事：补全上下文指代、规范术语、拆分复合问题。对于低置信度或召回差的case，再进入多轮改写：先生成若干等价query，再并行检索，最后融合去重。为了避免改写偏题，我会加约束：不改变用户意图、不引入新事实、保留关键实体词。效果评估看三项：召回命中率提升、相关性提升、端到端成功率变化。若多轮改写提升有限但成本明显增加，就回退到单轮。核心原则是“改写为检索服务”，而不是让模型自由发挥。\n**来源**：公开社区资料\n\n## 8. 补充原问：Rerank 和 TopK 设置\n\n### 1. 子问题：rerank是如何使用的？topk如何设置的？\n**口述答案（约300字）**：\nRerank我会放在“初召回之后、喂模型之前”。先用向量检索召回较大候选集合，比如Top50或Top100，再用重排模型按query相关性重新打分，截断成最终TopK给大模型。这样做的价值是降低噪声上下文，提升答案稳定性。TopK不是固定拍板，我会按任务类型设区间：事实问答通常K小一点，复杂推理K稍大；然后通过离线评测和线上AB找最优点。常见方法是观察“正确率-时延-成本”三条曲线的拐点。若K过小会漏信息，K过大又会稀释注意力并拉高token成本。我的实践是先保证召回，再通过重排把信息密度做上来，最后再调K而不是反过来。\n**来源**：公开社区资料\n\n## 9. 补充原问：向量库选型\n\n### 1. 子问题：项目为什么选择用 PGVector 而不是 ES 来做向量数据库？ES 可以吗？\n**口述答案（约300字）**：\nES可以做向量检索，但我选PGVector是因为我们的场景需要“向量检索和关系数据一体化”以及更低接入成本。第一，数据原本就在PostgreSQL体系，使用PGVector可以减少异构系统同步和一致性治理成本。第二，我们的规模和QPS在PGVector可承受范围内，优先工程简洁和可维护。第三，很多业务查询是“结构化过滤+向量相似度”组合，放在同库更顺滑。ES的优势在于大规模检索和复杂搜索生态，如果后续数据量上升到更高量级，ES或专用向量库会是候选。面试里我会强调：选型不是绝对优劣，而是“业务规模、团队运维能力、数据一致性成本”的综合权衡。\n**来源**：公开社区资料\n\n## 10. 补充原文：向量检索算法概览\n\n### 2.4 向量检索\n\n向量检索：随着深度学习算法发展，原本文本层面并不相似的数据，在高维向量空间中可能变得更加相关。将文本或图片转成向量后，在给定向量集合中，按某种度量方式检索出与查询向量最接近的 K 个向量。\n\n向量检索算法概览：\n- 暴力计算（brute-force）\n  - 全量比较，找到与 query 向量最接近的 K 个结果。\n  - 优点：结果准确，不存在误差。\n  - 缺点：只适合小规模数据，无法支撑大规模在线检索。\n- 基于哈希的方法：局部敏感哈希（LSH）\n  - 利用哈希碰撞，把相似向量映射到同一个桶中。\n  - 优点：避免和所有向量逐一比较，提升检索效率。\n  - 缺点：数据量很大时，为了保证准确率，往往需要更多哈希函数。\n- 基于倒排的方法：PQ / IVFPQ\n  - 核心是对向量做压缩，把原始高维向量切分成多个子向量，对每段做量化编码。\n  - 优点：显著降低内存占用，适合大规模向量库。\n  - 缺点：量化会引入精度损失，召回率受聚类和编码参数影响。\n- 基于图的方法：HNSW\n  - 通过多层图结构建立“高速查询通道”，查询时像在图里做近邻跳转。\n  - 优点：检索速度快、召回率高。\n  - 缺点：内存占用大、建索引慢、删除节点不友好。\n","title":"03_RAG核心问答"},"01_AI/04_上下文工程与记忆/01_核心问答.md":{"md":"# 04_上下文工程与记忆核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：短期记忆、长期记忆和状态怎么设计？\n\n### 1. 子问题：记忆系统与状态设计（短期/长期/State）\n主问题：如何设计 Agent 的短期记忆、长期记忆和运行状态？\n\n口述答案：\n短期记忆承载当前任务上下文、中间结果和工具返回，保证这次任务连贯；长期记忆承载跨会话偏好、稳定事实和历史经验。实现上一般是“短期窗口/摘要 + 长期向量库/结构化库”组合。State 设计要遵循最小化原则：只放决策必需字段，长文本放外部存储并在状态里保留引用 ID。再把状态拆成业务数据、过程数据、观测数据三层，防止节点互相污染与 token 爆炸。\n\n常见追问：\n\n1. 如何做记忆写入策略，避免“写入噪声”？\n  1. **分级写入，不直接入长期库**\n    候选区，只有“高频出现 + 高置信 + 可复用”的信息才转正。\n  2. **写前去重合并**\n    语义相似度 + 关键字段”去重，已有就更新，不重复新增，防记忆膨胀和冲突。\n  3. **记忆有生命周期**\n    来源/时间/版本/TTL，长期不命中自动降权或清理，避免旧噪声长期污染。\n2. 状态变大后如何控 token 成本？\n  1. 第一是最小状态，状态只放决策必需信息，长文本走外部存储引用；第二是分层压缩，把历史和中间过程变成结构化摘要，避免上下文无限增长；第三是加预算硬阈值，超过 token 或步数就自动降级，比如缩小检索 topK 或关闭次要节点。这样能把成本和时延稳定在可控范围内。\n3. 长期记忆如何做过期与纠错？\n  1. **生命周期管理（过期）**\n    长期记忆都带 TTL + 最后命中时间 + 重要度，长期不命中自动降权，超期归档/清理。\n  2. **冲突检测与版本化（纠错）**\n    事实写入时先做冲突检测（如“用户偏好A/B冲突”），不直接覆盖，走版本化：保留旧版、标记新版、可回滚。\n  3. **验证闭环（纠错）**\n    险记忆必须二次验证（多次出现、可信来源、用户确认），并提供“用户纠正入口”，纠正后优先覆盖旧结论。\n\n### 2. 子问题：Memory 是 Agent 的一个关键模块。请问如何为 Agent 设计短期记忆和长期记忆系统？可以借助哪些外部工具或技术？\n答：\n短期记忆主要承载当前会话上下文窗口信息、工具返回和中间推理轨迹，保障任务连贯；长期记忆用于存用户偏好、历史经验和领域知识，支撑跨会话能力。落地上短期常用窗口/摘要机制，长期常用向量库做相似检索, 如RAG范式，也可结合 SQL 或知识图谱存结构化(NeoJ)事实。关键点是“写入策略+检索策略+淘汰策略”三者要同时设计。\n\n- **工作流程：**\n  1. **存储（Storing/Writing）：** 当Agent获得一个有价值的信息（如用户明确给出的偏好、一个成功解决问题的完整流程）时，它会使用一个**嵌入模型（Embedding Model）**将这段文本信息转换成一个高维向量。然后，将这个向量及其原始文本存入向量数据库。\n  2. **检索（Retrieving/Reading）：** 在Agent进行规划或决策时，它会把当前的任务或问题也转换成一个查询向量。然后，用这个查询向量去向量数据库中进行**相似度搜索**，找出与当前情况最相关的历史记忆。\n  3. **使用（Using）：** 检索到的记忆（原始文本）会被插入到LLM的Prompt中，作为额外的上下文，来指导LLM做出更明智的决策。\n\n### 3. 子问题：LangGraph 里状态（State）怎么设计？\n答：\n\n1. State 只放“决策必需信息”，不放大段冗余文本。字段包括任务目标、中间结果、证据、错误码、重试计数、下一步动作。\n2. 分层：业务数据、过程数据、观测数据分开。\n3. 节点只读必要字段、只写自己负责字段，避免相互污染。\n4. 大对象放外部存储（DB/向量库），State里放引用ID。\n\n追问：如果状态越来越大导致 token 成本上升，如何治理？\n\n1. **状态分层**\n\n把状态拆成`运行态（短期）/ 记忆态（长期）/ 证据态（可重取）`，只把运行态放进上下文。\n\n1. **摘要替代原文**\n\n对历史对话和中间结果做结构化摘要（结论、待办、风险），而不是全量拼接。\n\n1. **外部化存储**\n\n长文本、检索结果、工具原始返回存数据库/向量库，prompt里只放引用和top-k片段。\n\n1. **成本守门与告警**\n\n设 token budget（输入/输出上限），监控 `avg/p95 token`、单请求成本、摘要命中率，超阈值自动降级（更短上下文或低成本模型）。\n\n## 2. 主干问题：Prompt 工程和其他调优手段如何协同？\n\n### 1. 子问题：调优分层与Prompt工程协同\n主问题：LLM 效果不好时，如何分层调优并协同 Prompt/RAG/模型？\n\n口述答案：\n我采用“三层法”：先 Prompt 与上下文工程，再检索/工具链路，再模型微调。原则是先改低成本高收益环节，再动模型参数。Prompt 要版本化、可测试、可回滚；核心指标是任务成功率、格式通过率、幻觉率、时延和成本。Prompt 与微调不是替代关系：前者负责快速可控，后者负责长期稳定。\n\n常见追问：\n\n1. 如何避免 Prompt 越写越长、成本失控？\n2. 什么时候必须进入微调阶段？\n3. 如何做 A/B 与灰度验证？\n\n### 2. 子问题：LLM 调优（训练调优 + Prompt 调优）怎么分层做？\n答：\n调优要分层：第一层 Prompt 调优（成本最低，迭代最快）；第二层检索和工具链路/上下文工程优化（提升事实性与可执行性）；第三层模型微调（提升领域表达和行为稳定性）。经验是“先提示词和工具链路，后动模型参数”。很多线上问题其实来自上下文构造和评估缺失，不是模型本身不够强。\n\n**L1 Prompt 调优（先做）**\n\n1. 定义执行协议: 明确角色、边界、输出格式、拒答策略。\n2. 做结构化输出：JSON Schema/函数调用，减少自由发挥。\n3. 少量高质量 few-shot：给正例和反例，控制风格和步骤。\n4. 做上下文工程：信息按 Gather-Select-Structure-Compress 组织，避免噪声。\n5. 建评测集：准备 50-200 条真实样本，按准确率、格式通过率、幻觉率评估。\n6. 提示词版本化：A/B 对比、灰度发布、可回滚。\n\n**L2 检索与工具链路调优（第二层）**\n\n1. RAG 数据治理：清洗、去重、切块策略、元数据标签。\n2. 检索策略优化：向量检索 + 关键词检索 + 重排（hybrid + rerank）。\n3. 查询改写：multi-query、HyDE、同义词扩展，提升召回。\n4. 工具编排：路由器决定“直接答/检索/调工具”，设置信心阈值和兜底。\n5. 结果校验：工具返回做 schema 校验、规则校验，失败自动重试或降级。\n6. 观测闭环：看 检索命中率、工具成功率、端到端任务成功率、时延、成本。\n\n**L3 训练调优（最后做）**\n\n1. 触发条件：Prompt+RAG 已到瓶颈，仍有稳定性/领域表达问题。\n2. 先做 SFT：用真实任务轨迹数据（输入、目标输出、工具轨迹）微调。\n3. 参数高效微调：优先 LoRA/QLoRA，成本低、迭代快。\n4. 再做偏好优化：DPO/RLHF 提升“答案质量与行为一致性”。\n5. 训练数据重点：覆盖高频失败样本、难例、边界例；严格去重和标注规范。\n6. 上线策略：影子流量 + 小流量灰度 + 回归评测，避免“微调后退化”。\n\n### 3. 子问题：Prompt Engineering 及 Prompt 优化策略有哪些？\n答：\n\n“我会把 Prompt 当成预算管理问题来做，核心是**高信号、低冗余**。具体有五个手段：\n\n1. **分层提示**：把稳定不变的规则放 system，任务相关信息放 user，避免每次重复拼接大段固定文本。\n2. **最小必要上下文**：只传当前任务必需信息，历史对话做摘要而不是全量回放。\n3. **检索按需注入**：RAG 只注入 top-k 片段，并设置 token 上限，不把整篇文档塞进去。\n4. **结构替代长文本**：用 schema、枚举、字段约束替代长篇文字说明，减少 token 同时提升可控性。\n5. **监测与A/B实验**：监控首 token 时延、总 token、成功率和成本，按指标裁剪 Prompt\n\n### 4. 子问题：Prompt Engineering 和微调策略如何协同？\n答：\n两者不是替代关系。Prompt 负责一次交互的快速约束行为和流程编排，微调负责模型长期固化能力与风格稳定。常见策略是“Prompt 先行、微调收口”：先用 Prompt 把问题定义清楚并沉淀失败样本，再用微调提升一致性和吞吐效率。\n\n追问：如果微调后效果变差，你会按什么顺序回滚和排查？\n\n微调劣化我会先回滚模型流量止损，优先卸载新 LoRA adapter；再按数据、训练、评测、服务四层做对照排查，最后用小流量灰度和自动回切机制重放上线。\n\n- **数据层**：标注噪声、分布漂移、重复/污染、样本冲突。\n- **训练层**：学习率过大、epoch 过多、过拟合、LoRA rank/alpha 不合理。\n- **评测层**：离线集不代表线上，评测泄漏或口径错误。\n- **系统层**：其实是 RAG/工具链路变了，不是微调本身问题。\n\n### 八、LangChain / LangGraph 高频面试题（10）\n\n## 3. 补充材料：Context Engineering 的系统化做法\n\n### 1) Context Engineering for AI Agents: Lessons from Building Manus\n\n- 原文链接：\n  - [https://manus.im/blog/context-engineering-for-ai-agents-lessons-from-building-manus](https://manus.im/blog/context-engineering-for-ai-agents-lessons-from-building-manus)\n- 核心思想：\n  - 上下文窗口不是“越大越好”，核心是**上下文工程**：如何挑选、组织、压缩、更新上下文。\n  - 文章强调把 Agent 记忆分层管理，而不是把历史对话全量塞给模型。\n  - 提到需要控制无关噪声进入上下文，否则会直接拉低推理稳定性与工具调用质量。\n- 文章概述（约500~1000字）：\n  - 这篇文章最重要的观点是：当我们从“聊天机器人”走向“可执行任务的 Agent”时，Prompt Engineering 已经不够用了，必须升级为 Context Engineering。原因在于 Agent 的上下文不再只是用户一句提问，而是一个持续演化的状态系统，里面包括工具调用结果、网页观察、代码执行反馈、阶段结论、失败重试历史以及长期记忆。文章把问题讲得很直接：很多团队不是模型不够强，而是把无关信息不断塞进上下文，导致注意力被稀释、推理漂移、成本失控、时延上升。Manus 的经验是把上下文当成“生命周期工程”来做：进入系统前先筛选，执行过程中持续重写和压缩，关键事实写入可检索记忆，低价值内容及时淘汰；并通过任务阶段切换控制上下文粒度，避免单一大上下文拖垮全链路。文章还强调“状态优先于文本”：模型每一步都应读到可执行状态，而不是冗长叙述。对面试最有价值的启发是，你可以把 Context Engineering 分解成四件事来回答：上下文采集、上下文选择、上下文压缩、上下文治理（预算/监控/回滚）。\n- 面试可能问的点：\n  - 问：你如何定义“上下文工程”？和 Prompt Engineering 的边界是什么？\n  答：我会把 Prompt Engineering 定义为“单轮输出控制”，重点是角色、格式、约束；Context Engineering 是“多轮状态治理”，重点是信息进入、保留、淘汰和回取。前者解决“怎么说”，后者解决“基于什么说”，两者在 Agent 项目里必须同时做。\n  - 问：长任务中如何做上下文裁剪、摘要和分层记忆？\n  答：我一般用三层：运行态只保留当前决策必需字段；历史过程做阶段摘要；原始证据外部化到文件或向量库按需回取。每个阶段结束都产出结构化中间结果，避免把完整聊天记录持续塞给模型，既降噪又控成本。\n  - 问：上下文变大后，如何平衡准确率、时延和成本？\n  答：先设 token 预算和 SLO，再做“高价值优先注入”：固定规则放 system，动态证据 top-k 注入，低价值历史改摘要。并监控首 token 延迟、总 token、任务成功率和幻觉率，若成本上升但收益不显著，及时收缩上下文或切换小模型执行子步骤。\n\n---\n\n## 4. 补充材料：如何突破上下文窗口限制\n\n### 3) Wide Research: Beyond the Context Window\n\n- 原文链接：\n  - [https://manus.im/blog/manus-wide-research-solve-context-problem](https://manus.im/blog/manus-wide-research-solve-context-problem)\n- 核心思想：\n  - 直指长任务痛点：上下文窗口有限导致信息遗忘、证据断裂和推理漂移。\n  - 文章核心不是“盲目加大窗口”，而是通过任务分解、外部记忆、阶段性归纳来突破限制。\n  - 强调上下文问题是系统工程问题，不是单模型参数问题。\n- 文章概述（约500~1000字）：\n  - 这篇文章把“上下文窗口”问题讲得很实用：真正的瓶颈不是模型一次能读多少 token，而是长链路任务中信息会不断累积，模型注意力会被噪声占据，最终出现“早期信息遗忘、证据链断裂、结论自相矛盾”。文章提出的解决思路是“超越窗口”，不是简单加长上下文，而是把上下文从“单个大文本”改造成“分层、分阶段、可检索的外部系统”。具体逻辑是：任务先拆分成若干子目标，每个阶段只携带当前决策必需信息；历史过程通过摘要和结构化记录沉淀到外部记忆；需要时按证据索引回取，而不是全量回灌。这样可以显著降低噪声占比，提高有效注意力利用率。文章还强调研究任务需要动态重规划：当新证据出现时，系统应能更新任务树和优先级，而不是在旧上下文里硬推理。对面试来说，这篇文章最容易转化成一套回答框架：长任务治理=任务分解+状态机编排+外部记忆+证据回取+阶段摘要+关键阶段的结论。你再补一句“窗口是资源约束，上下文工程是资源调度”，会显得非常专业。它本质上告诉我们，Agent 的稳定性来自工程设计，而不是模型参数单点突破。\n- 面试可能问的点：\n  - 问：“上下文窗口不够”在工程里通常怎么解决？\n  答：不会只靠“更大窗口”，而是做任务分解和阶段上下文。每一阶段只带当前目标所需信息，历史通过摘要和索引保留；需要细节时再检索回填。配合重排和证据引用，能在有限窗口内维持高信噪比，明显优于全量拼接。\n  - 问：为什么要把记忆外部化（文件、数据库、向量库）？\n  答：外部化的价值是把“存储”和“推理”分离：模型负责当前决策，记忆系统负责长期留存和按需回取。这样可以降低 token 成本、减少上下文噪声，并且让历史证据可审计、可复用、可跨会话继承，特别适合长任务和团队协作。\n  - 问：长链路任务如何避免中途遗忘和结论前后矛盾？\n  答：关键是阶段性收口：每个阶段产出结构化结论、证据引用和未决问题清单，下一阶段先读“摘要状态”再行动。同时做一致性检查（关键实体、数字、时间线）和冲突告警，必要时触发回溯检索，避免后续推理覆盖早期事实。\n\n---\n\n## 5. 补充原问：RAG 与 Agent Prompt 的区别\n\n### 1. 子问题：rag和agent的prompt有什么区别，分为哪些部分，如何和ai交流的\n**口述答案（约300字）**：\nRAG Prompt和Agent Prompt的目标不一样。RAG Prompt核心是“基于给定证据回答”，强调引用、边界和事实一致性；Agent Prompt核心是“驱动任务执行”，强调计划、工具选择、状态推进和失败处理。结构上我常用六段式：角色、任务、上下文、约束、示例、输出格式。RAG里上下文段最重，通常要求“仅依据检索片段回答，缺失就明确说不知道”；Agent里工具规范最重，要明确何时调用工具、入参格式、异常分支和停止条件。和模型交流时我会坚持两点：第一，结构化输入输出，比如JSON schema，减少歧义；第二，把策略写成可观测规则，比如“最多重试2次，超过则降级”。这样能把“提示词”从文案变成“可执行协议”，便于调试和复盘。\n**来源**：公开社区资料\n\n## 6. 补充原问：长期/短期记忆差异\n\n### 1. 子问题：长期记忆和短期记忆在设计上有什么区别？本质上有什么区别？\n**口述答案（约300字）**：\n短期记忆关注“当前任务上下文”，生命周期短，通常跟会话或任务绑定，强调时效和低延迟；长期记忆关注“跨会话稳定偏好与事实”，生命周期长，强调可检索、可更新和一致性。设计上短期记忆适合放在缓存或状态存储，支持快速读写和过期清理；长期记忆更像知识资产，通常用向量库+结构化库组合，配版本和来源管理。本质区别是：短期记忆服务“当前决策”，长期记忆服务“持续个性化与累积学习”。实践里要防两类问题：一是短期噪声污染长期记忆，二是长期记忆陈旧导致误导。我的做法是设置写入门槛、摘要压缩和周期回收，并给长期记忆增加置信度与更新时间字段。\n**来源**：公开社区资料\n\n## 7. 补充原问：超长上下文如何治理\n\n### 34.性能优化:当智能体处理超长文本(如整本代码库)时,除了分块,还有哪些技术\n\n核心思路是：不把整库塞进上下文，而是“索引化 + 检索化 + 压缩化 + 增量化”。\n\n除了分块，还可以用这些技术：\n\n代码图索引：用 AST、依赖图、调用图做“代码图检索”，比纯文本更准。\n混合检索：BM25（关键词）+ 向量检索（语义）+ 图检索（关系）联合召回。\n重排与预算控制：召回后 rerank，只保留最相关片段；按 token 预算动态调 TopK。\n层级摘要：文件摘要、模块摘要、仓库摘要三级压缩；先读摘要再按需下钻原文。\n增量更新：只重建变更文件（基于 git diff），避免每次全量 embedding。\n\n处理超长代码库，我会做“代码图索引 + 混合检索 + 分层摘要 + 增量更新 ”\n","title":"04_上下文工程与记忆核心问答"},"01_AI/05_模型调优与微调/01_核心问答.md":{"md":"# 05_模型调优与微调核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：SFT、RLHF、DPO 等后训练体系如何理解？\n\n### 1. 子问题：LLM基础原理与后训练体系（SFT/RLHF/DPO）\n主问题：如何向面试官讲清 LLM 基础原理和后训练流程？\n\n口述答案：\n我会用三段讲：第一，预训练让模型学“语言与知识分布”；第二，SFT 让模型学“按指令回答”；第三，偏好对齐（RLHF/DPO）让模型更符合人类偏好与安全要求。RLHF 经典链路是 SFT -> 奖励模型 -> PPO；DPO 去掉了显式 RL 环节，训练更稳更轻。面试里关键是讲清“各阶段解决的问题不同”，而不是只背名词。\n\n常见追问：\n\n1. PPO 为什么难、DPO 为什么流行？\n2. 后训练和微调是什么关系？\n3. 没做过 RLHF，怎么讲不露怯？\n\n### 2. 子问题：了解 LLM 的基本原理与使用方式\n答：\n\n它本质上是一个基于 Transformer 架构训练出来的大规模语言模型，Transformer 架构单encode是bert模型主要做相关性和意图识别, 单decode就是大语言生成模型. 核心能力是根据已有上下文去预测下一个 token。因为它在海量语料上做过预训练，所以不只是会语法和表达，还学到了一定的知识、模式和推理能力。\n\n如果从训练过程看，一般分三步。第一步是预训练，用大规模文本做 next-token prediction，获得通用语言能力；第二步是指令微调，让模型更适合问答、总结、抽取这类任务；第三步是后训练，比如 RLHF 或 DPO，让模型输出更符合人类偏好，也更安全、更稳定。\n\n它的优势是泛化能力强，很多任务不需要单独训练模型，通过 prompt 就能先跑起来；但它的局限也很明显，比如会幻觉、可控性有限、成本和延迟都比较高。所以真正上线时，通常要配合 Prompt 约束、RAG、工具调用、评估和监控一起用\n\n追问：为什么同一个模型在不同系统提示词下表现差异会很大？\n\n**LLM 不是执行固定代码，而是“在当前上下文条件下做下一个 token 的概率决策”**，系统提示词本身就是最强条件之一。\n\n### 3. 子问题：熟悉 RLHF 流程吗？怎么简明解释给面试官？\n答：\n传统的 RLHF(Reinforcement Learning from Human Feedback- 基于人类反馈的强化学习). 经典 RLHF 三步：先做 SFT（让模型会按指令回答），再训练奖励模型（学习人类偏好），最后用强化学习（常见 PPO）优化策略。工业实践里，DPO 也常作为更简化替代路线。核心目标是把“可读”提升为“符合人类偏好和安全要求”。\n\nLLM训练图:\n\n**预训练阶段**是 LLM 训练的第一阶段，目标是让模型学习语言的基本规律和世界知识。这个阶段使用海量的文本数据(通常是数 TB 级别)，通过自监督学习的方式训练模型。\n\n**后训练阶段**则是要解决预训练模型的不足。预训练后的模型虽然具备了强大的语言能力，但它只是一个\"预测下一个词\"的模型，并不知道如何遵循人类的指令, 后训练阶段就是要解决让模型对齐人类的偏好和价值观。后训练 (经典 RLHF) 通常包含三个步骤。\n\n- 第一步是**监督微调(SFT)**，目标是让模型学会遵循指令和对话格式。\n- 第二步是**奖励建模(RM)**。SFT 后的模型虽然能遵循指令，但生成的回答质量参差不齐。我们需要一种方式来评估回答的质量，这就是奖励模型的作用.\n- 第三步是**强化学习微调**。有了奖励模型后，我们就可以用强化学习来优化语言模型，让它生成更高质量的回答。最经典的算法是 PPO(Proximal Policy Optimization).\n\n传统的 RLHF(Reinforcement Learning from Human Feedback- 基于人类反馈的强化学习)需要大量人工标注偏好数据，成本高昂。为了降低成本，研究者提出了 RLAIF(Reinforcement Learning from AI Feedback)，用强大的 AI 模型(如 GPT-4)来替代人类标注员。RLAIF 的工作流程是:用 SFT 模型生成多个候选回答，用强大的 AI 模型对回答进行评分和排序，用 AI 的评分训练奖励模型，用奖励模型进行强化学习。实验表明，RLAIF 的效果接近甚至超过 RLHF，同时成本大幅降低。\n\n追问：为什么很多团队近年会从 PPO 转向 DPO？\n\n团队从 PPO 转向 DPO，主要是因为 DPO 去掉了奖励模型和在线RL环节，训练更稳、成本更低、迭代更快；但在需要强探索和长时序优化的任务里，PPO 仍有不可替代的价值。\n\n## 2. 主干问题：LoRA/QLoRA 如何落地，数据集怎么做？\n\n### 1. 子问题：微调实战（LoRA/QLoRA）与数据集构建\n主问题：LoRA/QLoRA 的原理、流程和上线方法是什么？\n\n口述答案：\nLoRA 通过低秩适配器在冻结基座模型下训练，QLoRA 进一步量化基座参数以降低显存成本，适合资源受限下快速迭代。实战里我更关注数据质量：覆盖真实失败样本、边界样本、格式样本；再配合离线评测、线上灰度和可回滚机制。微调不是万能药，若问题本质是检索错召回，先优化 RAG 往往更有效。\n\n常见追问：\n\n1. QLoRA 省资源的代价是什么？\n2. 训练数据多少条才有意义？\n3. 微调后效果变差怎么排查与回滚？\n\n### 2. 子问题：有微调过 Agent 能力吗？数据集如何收集？\n答：\nAgent 微调的重点不是“最终答案”，而是“决策轨迹”, **教会模型如何更好地“思考”和“使用工具”**，本质上是一种**行为克隆（Behavioral Cloning）.**\n\n常见做法是让强教师模型生成高质量 Thought/Action/Observation **决策**轨迹，再过滤失败样本，结合人工修正构造训练集。\n\n数据来源一般包括合成任务、真实线上失败案例和专家示范。实践里先做行为克隆打基础，再用偏好数据做策略优化，提升稳定性。\n\n---\n\n### 三、RAG 面试题（12）\n\n### 3. 子问题：熟悉模型微调（LoRA / QLoRA）流程吗？\n答：\n LoRA/QLoRA 作为低成本模型微调行为的手段。\n\nLoRA是在冻结基座模型参数前提下训练低秩适配器，QLoRA进一步把基座模型做4-bit量化，显著降低显存和训练成本。LoRA做的是模型输出行为和风格稳定性和一致性\n\n落地时我会先定义验收指标，再做高质量数据构建，尤其补齐线上失败样本；训练阶段重点调 target modules 和 rank 等关键参数；评估不只看任务指标，还看安全和回归；上线采用灰度A/B和可回滚策略。\n\n微调收益主要由数据质量和评估体系决定，如果这两块不扎实，微调很容易出现局部提升但整体退化\n\n问：训练数据要多少才有意义？\n\n答：没有绝对值，关键是“高质量+覆盖失败样本”；常见从几千到几万条高质量指令数据起步。\n\n问：RAG 和 LoRA 怎么分工？\n\n答：RAG解决“事实与时效”，LoRA解决“行为与风格”；通常先做RAG，再用LoRA补稳定性和格式一致性。\n\n追问：QLoRA 为什么更省资源？主要代价是什么？\n\n答: QLoRA进一步把基座模型做4-bit量化，显著降低显存和训练成本\n\n## 3. 补充原问：LoRA 在 Agent 微调中的应用\n\n### 32.微调技术:解释一下LoRA(Low-RankAdaptation)的原理,以及它在智能体微调中的应用场景。\n\nLoRA 的核心是：不改大模型原参数，只学一个“低秩增量”。\nLoRA适合“行为和表达对齐”，不适合“实时知识更新”；\n\n在智能体微调里的常见应用场景：\n工具调用格式稳定化：让模型更稳定地产生 JSON / function call。\n角色风格一致化：如客服、投研、写作助手的语气和输出结构。\n领域术语适配：金融、法律、医疗等垂类表达更专业。\n多租户个性化：每个客户挂不同 LoRA adapter，而不是训多套大模型。\n\n## 4. 补充原问：前沿论文与 RAG/Agent 工程启发\n\n### 37.学习能力:最近半年你关注了哪些AI领域的前沿技术或论文?请分享一篇让你印象深刻的论文。\n我印象最深的一篇是 LinearRAG (arXiv:2510.10114)。\n讲的就是现在主流的引入图关系库，先做图关系库多步推理，然后再进行向量检索，这种方式是比较重的。对，因为首先你构建一个重型的准确的图数据库和复杂推理，这个就比较复杂。所以这篇论文就是想说。可以在业务里优先做轻量结构化的索引，加两个阶段的检索加重排，先拿到稳定的收益。是类似于广告召回中的两段式检索。先去用用户的问题找到相关的实体，再去由实体去找信息。\n\n## 5. 补充原文：BERT、NLP、TFRecord 与 TensorFlow / Transformer 关系\n\n### 2.10 Bert模型与现在大语言模型LLM的区别?\n\nBERT 可以理解为“擅长理解文本、不擅长自由生成”的 Transformer 模型。\n- BERT：Encoder-only，偏“理解”；\n- 主流 LLM（如 GPT 类）：Decoder-only，自回归逐词生成，偏“生成 + 推理”。\n- 结果上：BERT 常用于打分 / 判别；LLM 常用于对话、生成、Agent。\n\n### 2.11 NLP是什么\n\nNLP（自然语言处理）不是单一模型，而是一组“让机器处理文本”的能力集合，核心包括：\n- 文本理解：分词、实体识别、意图识别、语义匹配、情感 / 分类；\n- 文本生成：标题生成、摘要改写、问答对话；\n- 文本检索与排序：query-文档相关性打分、重排（rerank）；\n- 文本质量与安全：去重、错别字、违禁 / 低质内容识别。\n\n### 2.13 模型训练用的TFRecord是什么\n\nTFRecord 是 TensorFlow 常用的训练数据二进制格式。\n“模型训练前的 TFRecord”通常指：把原始样本（CSV / Parquet / 日志）先清洗、特征化，然后序列化成 `.tfrecord` 文件再喂给训练。\n\n### 2.14 TensorFlow 和 Transformer 架构 是啥关系啊\n\n两者是“框架”和“模型架构”的关系：\n- TensorFlow：深度学习框架（训练 / 推理工具链）；\n- Transformer：神经网络架构（模型怎么设计）。\n\nTensorFlow 是工程平台，Transformer 是算法结构；前者解决“怎么高效训练和上线”，后者定义模型内部计算方式（如自注意力）。\n","title":"05_模型调优与微调核心问答"},"01_AI/06_评测与监控/01_核心问答.md":{"md":"# 06_评测与监控核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：Agent 应用如何做离线评测与线上监控？\n\n### 1. 子问题：评估体系与线上监控（LLM/Agent）\n\n主问题：如何设计一套可落地的 LLM/Agent 评估体系？\n\n口述答案：\n评估要“离线 + 在线 + 人评”三位一体。离线看能力覆盖（事实性、推理、安全、格式）；在线看业务指标（成功率、转化、时延、成本、稳定性）；人评校准自动评估偏差。对 Agent 还要看过程指标，如步数、工具成功率、重试率、中断率。上线后通过持续监控与坏例回流形成闭环，避免模型漂移无人感知。\n\n常见追问：\n\n1. 为什么 BLEU/ROUGE 评 LLM 不够？\n2. LLM-as-a-Judge 的偏差怎么控制？\n3. 线上成功率下降如何快速归因？\n\n### 2. 子问题：为什么传统的 NLP 评估指标（如 BLEU, ROUGE）对于评估现代 LLM 的生成质量来说，存在很大的局限性？\n\n答：\nBLEU/ROUGE 主要比较词面重合，适合翻译或摘要早期任务，但对现代 LLM 明显不够。它们难衡量语义等价、事实准确、推理正确和安全性，还会惩罚“措辞不同但内容正确”的回答。面试可强调：现在评估要从词匹配升级到“语义+事实+推理+对齐”的多维体系。\n\n### 3. 子问题：请介绍几个目前行业内广泛使用的 LLM 综合性基准测试，并说明它们各自的侧重点。（例如：MMLU, Big-Bench, HumanEval）\n\n答：\nMMLU 主要看跨学科知识与解题能力，覆盖多门学科；Big-Bench 更偏能力边界与复杂任务泛化；HumanEval 聚焦代码生成，通常用 pass@k 评估。可补充 GSM8K 看数学推理。面试里建议说“公开基准用于横向比较，但最终还要叠加业务数据集做纵向验证”，这样更工程化。\n\n### 4. 子问题：什么是“LLM-as-a-Judge”？使用 LLM 来评估另一个 LLM 的输出，有哪些优点和潜在的偏见？\n\n答：\nLLM-as-a-Judge 是用强模型按预设 Rubric 去评估候选模型输出，优点是快、可规模化、口径相对统一。风险在于偏见：位置偏好、冗长偏好、风格偏好，以及裁判模型自身知识错误。实践上一般配“自动评审+人工抽检”，并做双盲与顺序打乱，减少系统性偏差。\n\n### 5. 子问题：如何设计一个评估方案来衡量 LLM 的特定能力，比如“事实性/幻觉水平”、“推理能力”或“安全性”？\n\n答：\n\n**1.衡量“事实性/幻觉水平”：**\n\n- **就是基于一个知识库进行问答。然后看这个模型所回答的是否能从这个知识库中找到答案进行匹配，不是自己瞎编的。另外就是设计一些能够以对抗性的问题，能够诱导模型产生幻觉的问题。比如说询问不存在的人或者事件的信息，然后看一下模型的回答。**\n\n**2. 衡量“推理能力”：**\n\n- 那推理能力就是让模型做一些数，数学题或者逻辑推理的题，或者需需要自行设计一些推理的任务。然后呢，一评估的时候，一个是看结果的评估，就看最后这个回答的是否是准确。另外一个是过程的评估，就是看模型的思维链。要主要看它的推理步骤是否合乎逻辑，是否正确和推理过程。\n\n**3. 衡量“安全性”：**\n\n- 安全性就是模模型是否会拒绝一些回答有害、不道德或者危险的一些用户请求。所以就要找一些对抗性的提示词数据集，然后包含了一些精心设计的引导模型绕过安全护栏的危险问题。另外一个思路就是专门的红蓝攻防，由人类专家主动的构造性的做一些攻击性的提示。评判方法就是看这个模型的一个拒绝率。模型看拒绝回，要拒绝回答这个有害问题的比例。以及误伤率，就是模型会错误的拒绝回答一个正常安全的一个问题。还有就是人工评估介入审核。\n\n### 6. 子问题：评估一个 Agent 为什么比评估一个基础 LLM 更加困难和复杂？评估的维度有哪些不同？\n\n答：\n基础 LLM 多是单轮“输入-输出”评估，而 Agent 是多步交互系统，过程会影响结果，状态也持续变化，所以复杂度高很多。除了结果正确性，还要评估步骤效率、工具调用质量、异常恢复能力、成本和时延。对LLM的评估更像是“**产品质量检测**”，而对Agent的评估更像是“**路况复杂的真实驾驶测试**”，不仅要看是否到达终点，更要看驾驶过程中的效率、安全性和应对突发状况的能力。\n\n**评估维度的不同：**\n\n\n| **评估维度**    | **基础 LLM**                                                                        | **Agent**                                                                                                                                                     |\n| ----------- | --------------------------------------------------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------- |\n| **核心评估对象**  | **单个回答的质量** (Quality of a single response)                                        | **整个任务完成过程** (The entire task completion process)                                                                                                             |\n| **主要维度**    | - **准确性 (Accuracy)** - **流畅性 (Fluency)** - **相关性 (Relevance)** - **安全性 (Safety)** | - **任务成功率 (Task Success Rate):** 能否最终完成目标？ - **效率 (Efficiency):** 完成任务花了多少资源？（见下文） - **鲁棒性 (Robustness):** 能否处理异常和错误？ - **自主性 (Autonomy):** 在没有人类干预的情况下能走多远？  |\n| **新增的过程维度** | (无)                                                                               | - **成本 (Cost):** LLM调用次数、API费用、Token消耗。 - **延迟 (Latency):** 完成任务的总时间。 - **步骤数 (Number of Steps):** 任务分解和执行的步数。 - **纠错能力 (Error Recovery):** 从工具报错或错误状态中恢复的能力。 |\n| **评估方法**    | 静态数据集上的基准测试 (MMLU, HumanEval)                                                     | **交互式环境**中的基准测试 (WebArena, AgentBench)                                                                                                                        |\n\n\n### 7. 子问题：你了解哪些专门用于评估 Agent 能力的基准测试？这些基准通常如何构建测试环境和任务？\n\n答：\n常见有 WebArena、AgentBench、GAIA。它们一般构建可复现沙箱环境（网页、终端、数据库、工具接口），给高层任务目标，让 Agent 自主拆解执行，最后通过脚本检查终态是否达成目标。相比静态题库，这类基准更贴近真实任务流程，能评估规划、工具使用和鲁棒性，而不仅是最终文本质量。\n\n随着Agent研究的兴起，一系列专门用于评估Agent能力的基准测试被开发出来，它们的核心特点是提供**可控的、可复现的交互式环境**。\n\n**几个知名的Agent能力基准测试：**\n\n1. **WebArena:**\n  - **专注领域：** **网页浏览与操作**。是构建了一个高度逼真的独立的网页环境磨难器，环境模拟器复刻了包括多个真实网站，如电商论坛、开发写作工具的功能，让 A 智能在这个独立的环境里完成复杂的任务。比如说是在电商网站上找到一个满足满足要求的商品并加入购物车。然后评估方式是最终在网页状态会会程序化的判断，比如说判断购物车里是否有正确的商品。\n2. **AgentBench:**\n  - **专注领域：** **通用Agent能力的综合评估**。Agent Bench 是一个全面，比较全面的包含了八种不同的环境来评估 Agent 的能力。比如说是操作系统环境，在 Linux 终端操作文件，执行命令。比如说在数据库环境，对一个 SQL 数据库进行查询。比如说知识图谱环境，在知识图谱中进行多条推理。比如说一些简单的文字与与冒险游戏。\n3. **GAIA (General AI Assistants):**\n  - **专注领域：** **模拟人类使用真实工具完成复杂任务**。就是完成，模拟人类使用真实工具完成一个比较极具挑战性的任务。一般这种任务需要多种工具并用才能解决，比如说用网页搜索、代码、文件操作才能一并解决。”\n\n**这些基准通常如何构建测试环境和任务？**\n\n测试环境的构建一般是构建一个可控隔离的沙箱环境, 不会让 A 生态来访问真实的互联网环境。一般是用 Docker 容器来封装一个包含浏览器终端文件系统的独立环境。对于网页浏览，本地会托管一个网站的静态版本，使用或使用外部后台来模拟响应 Agent 的请求。评估任务的话，通常会以一个高层次的目标的形式给出，不是给具体的操作步骤和命令。这样可以涵盖要测试的 Agent 的综合的能力，比如说信息检索工具的使用、推理规划和记忆等。这个任务通常也会附带一个明确的可程序化验证的成功标准。评估的话，就是你根据上面的设置一个评估标准，去整一个脚本，去来自动的检查这个沙箱环境的一些最终的任务状态。\n\n### 8. 子问题：在评估一个 Agent 的任务完成情况时，除了最终结果的正确性，还有哪些过程指标是值得关注的？（例如：效率、成本、鲁棒性）\n\n答：\n过程指标建议至少看六项：步骤数、总时延、Token/费用、工具调用成功率、重试率、异常恢复时长。原因是很多系统“能做对但代价太高”，线上不可用。这些过程指标可直接指导优化方向，比如减少无效循环、提升重排质量或改进工具参数校验，比只看准确率更有工程价值。\n\n**值得关注的关键过程指标包括：**\n\n**1. 效率 (Efficiency):**\n\n- 成本方向，你要考虑 token 的调用量以及工具 API 的调用费用。\n- 步骤数，就是 Agent 在执行、思考、行动的循环总次数。通常更少的步骤完成任务被 Agent 认为规划能力更强。\n- 计算的耗时，总耗时和计算的时间。\n\n**2. 鲁棒性 (Robustness):**\n\n- 错误处理能力, 就是当工具类返回错误或者网页加载失败，或者遇到其他预预期之外的情况时，A 智能能否识别并采取纠正措施，比如尝试不同的工具或者修正参数或者重新规划。错误与处理能力。\n- 抗干扰能力，就是在环境中加入一些噪声或者误导性的信息来看，评估现在的成功率下降多少。\n\n**3. 自主性(Autonomy & Alignment):**\n\n- 一个需要人类干预的次数，需要人类干预次数越少，说明这智能更自主，需要人类帮助次数越少。\n- 行为的可解释性，看Agent 的思考过程是否清晰和合乎逻辑。\n- 计划的遵循程度，如果agent提前制定一个计划，看他在在执行过程当中，多大程度遵循了自己的计划。\n\n### 9. 子问题：在进行人工评估时，如何设计合理的评估准则和流程，以保证评估结果的客观性和一致性？\n\n答：\n要先把维度原子化，比如准确性、完整性、安全性、简洁性，并给每档分数明确定义和示例。流程上做盲评、多评审、冲突仲裁和一致性统计（如 Kappa），避免主观漂移。对模型对比任务，成对比较通常比绝对打分更稳定。总结句：人工评估不是“凭感觉”，而是标准化实验流程。\n\n### 10. 子问题：如何持续监控和评估一个已经部署上线的 LLM 应用或 Agent 服务的表现，以应对可能出现的性能衰退或行为漂移？\n\n答：\n\n一个完整的监控评估体系应包含以下几个层面：\n\n1. **采集和监控（Automated Monitoring）：**\n\n- 采集和监控指标，包括一次请求完整的所有的交互的数据，包括用户的输入、模型的中间思考过程、最终的输出以及调用的工具、延迟以及 token 的消耗等等。\n- 很重要的一点就是用户的反馈，在产品的界面中嵌入一些用户反馈机制，比如说顶踩的按钮/打分和一些意见反馈等等。\n- 还有一些间接指标: 输出指标中回答的长度、代码块的比例、JSON 格式错误率、拒绝回答率等，以及过程指标，agent的执行过程中的平均步数、工具调用频率、工具调用失败率这些。\n\n**2. 审核与分析（Review and Analysis）：**\n\n- **自动化质量评估：**一个是用程序定期的抽样，从生产流量中随机抽取一小部分的样本，来做评估。还有一个思路就是用一个更强大的裁判的大模型，根据一套评估的准则，以及是否有害，是否跑题，对抽样样本进行自动打分。还有就将抽样样本与内户维护的一个高质量的一个黄金评估机进行对比，看模型在这些关键问题上的表现是否稳定。\n- **定期人工审计：** 定期组织运营或评估团队，对生产环境中的随机样本、用户反馈的坏案例、以及自动化监控发现的异常案例进行深入的人工分析。\n\n**3. 反馈闭环与模型迭代（Feedback Loop and Model Iteration）：**\n\n- 将生产环境中发现的有价值的案例，特别是失败案例和用户不喜欢的案例，清洗标注后，持续的加入到评估集和微调数据集中，定期的进行模型的再训练和微调，以适应新的数据分布和用户需求，然后再上线新版本的 时候，注意用 AB 测试框架，小流量验证新版本是否优于旧版本，确定每次迭代都是正向的。\n\n通过建立这样一个“**采集/监控 -> 分析 -> 迭代**”的闭环，我们可以主动地管理和维护线上服务的质量，而不是被动地等待用户投诉。\n\n---\n\n### 五、JD补充专题（LLM调优 / Multi-Agent / 微调 / 向量检索）\n\n说明：以下内容根据你提供的岗位 JD 关键词补充，目标是“先讲清原理，再给出可口述答案”。\n\n### 1. 子问题：LangChain / LangGraph 项目上线后看哪些指标？\n\n答：\n我会分四类看：任务成功率（业务结果）、链路稳定性（错误率/重试率/中断率）、性能与成本（p95 时延、token 成本）、质量指标（幻觉率、格式通过率、人工接管率）。没有这套指标，就无法判断是模型问题还是编排问题。\n\n追问：如果成功率下降，你会按什么顺序定位是 Prompt、检索、工具还是图编排的问题？\n\n我按图编排→工具→检索→Prompt 的顺序做漏斗定位，先看编排流程收敛和可用性，再看语义质量，用固定回放集和分层指标做归因，\n\n1. **图编排层（先查）**\n\n看 `loop_ratestep_count_p95timeout_rateretry_rate`。\n\n如果步数暴涨、回环增多、超时增多，优先判定是路由/终止条件问题。\n\n1. **工具层**\n\n看工具 `success_rate5xx/429schema校验失败率p95延迟`。\n\n如果调用失败或慢，是工具可用性/契约问题。\n\n1. **检索层**\n\n看 `hit@k/recall@k`、空召回率、过滤后命中率、索引新鲜度。\n\n如果召回质量掉了，答案成功率会同步下降，即使 Prompt 不变。\n\n1. **Prompt 层（最后查）**\n\n在“同一检索结果 + 同一工具返回”下做 Prompt A/B。\n\n若前面都正常但输出格式、拒答边界、推理稳定性变差，才定位为 Prompt 回归。\n\n**症状到根因的速判**\n\n- 步数/超时突然上升：图编排\n- 工具报错和慢调用上升：工具\n- 空召回或错召回上升：检索\n- 链路都健康但答案质量掉：Prompt\n\n## 2. 补充原问：Agent 好坏如何评价？\n\n### 1. 子问题：agent好坏是如何评价的？\n\n**口述答案（约300字）**：\nAgent评估我会分“效果、效率、稳定性、安全性”四个维度。效果看任务完成率、答案正确率、引用准确率；效率看首token时延、端到端时延、单任务token和外部API成本；稳定性看工具调用成功率、重试率、超时率、回环率；安全性看越权调用、敏感操作拦截率和审计完整性。评测方法上采用“离线集+线上流量”双轨：离线做可重复回归，线上看真实用户反馈与业务指标。最重要的是坏例回流机制，把失败case结构化记录并分类到Prompt、检索、工具、编排四层。面试里我会强调：评估不是单一准确率，而是以业务目标为核心的综合评分体系。\n**来源**：公开社区资料\n\n## 3. 补充原问：除了准确率还看什么？\n\n### 1.评估指标:如何评估一个AlAgent的好坏?除了准确率,还会关注哪些指标(如推理速度、成本、幻觉率)\n\n效率层面的一个指标，一个是托管的费用以及调用外国 API 的费用。还有一个是系统完成一次任务的整体耗时，以及推理任务，推理执行任务的一个步骤数。\n还有一个是鲁棒性层面的指标。就是说系统在调用工具，工具会出现一些异常超时或者返回信息不符合预期的时候，系统会怎么样？思考推理进行下一步的动作。以及当外界条件出现一些噪声的时候，这个系统的成功率是否会保持在一个比较稳定的水平？\n还有个是自主性，人工干预次数: 一个是看这个系统有运行一个复杂任务时候，人工介入的一个情况。行为可解释性:还有一个是人工的去看这个系统整个的推理思考过程，它是不是符合逻辑。计划偏离度:还有一个思路就是这个系统如果是先规划后执行，可以它执行的步骤和它，看看是否按它的，完全按它的规划来，还是有所偏离。\n\n## 4. 补充原问：意图识别准确率如何定义与计算？\n\n### 1. 子问题：意图识别准确率大概能到多少？怎么算出来的？\n\n**口述答案（约300字）**：\n准确率我不会给拍脑袋数字，必须先定义口径。通常我会按离线和在线两套指标：离线看标注测试集上的Accuracy、F1、混淆矩阵；在线看业务口径的任务完成率、误路由率和人工接管率。比如“准确率95%”要明确是Top1还是TopK、是否包含低置信度拒答样本。计算流程是：先构建分层数据集（高频、长尾、对抗样本），再做固定版本评测；上线后通过埋点还原“预测意图-真实落地结果”，做按周回归。对面试官我会强调：单看准确率不够，要看错误代价。如果一个低频误判会触发高风险动作，就要提高阈值并强制二次确认，宁可多澄清一次也不能错执行业务。\n**来源**：公开社区资料","title":"06_评测与监控核心问答"},"01_AI/07_安全与风控/01_核心问答.md":{"md":"# 07_安全与风控核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：如何约束 Agent 的权限和高风险动作？\n\n### 1. 子问题：安全对齐与高风险动作控制（含HITL）\n主问题：如何确保 Agent 安全、可控、可追责？\n\n口述答案：\n安全要分层做：模型层做对齐训练，系统层做最小权限与工具白名单，执行层做沙箱隔离与资源限额，业务层对高风险动作强制人工审批。再配合红队测试、注入攻击测试、全链路审计日志和告警阈值。核心原则是“先可控再智能”：即使模型偶发漂移，也不能直接触达不可逆动作。\n\n常见追问：\n\n1. 如何设计高风险动作审批流？\n2. 红队测试怎么选样本与评估口径？\n3. 安全与体验冲突时如何平衡？\n\n### 2. 子问题：如何确保一个 Agent 的行为是安全、可控且符合人类意图的？在 Agent 的设计中，有哪些保障对齐方法？\n答：\n要做分层安全：\n\n模型层做对齐训练（如 RLHF/DPO），对基础LLM进行微调，使其遵循“有用、诚实、无害”的原则，这是所有安全措施的基石\n\n系统层做最小权限和工具白名单, 只给Agent完成其任务所必需的最少的工具和权限\n\n执行层做沙箱隔离与资源限额，将Agent的执行环境与宿主系统隔离, 让Agent生成的代码或命令在一个受控的沙箱（如Docker容器、虚拟机）中执行。这样即使Agent被劫持或产生恶意代码，其破坏范围也被限制在沙箱内部，不会影响到外部系统.\n\n业务层做高风险动作的人类确认（HITL）。在执行如“删除文件”、“发送邮件”、“执行金融交易”等敏感操作前，Agent必须生成一个执行计划，并暂停等待人类用户的明确批准.\n\n再配合护栏规则、红队测试和行为审计日志。\n\n### 3. 子问题：什么是红队测试？它在发现 LLM 和 Agent 的安全漏洞与偏见方面扮演着什么角色？\n答：\n它的价值是发现常规测试覆盖不到的高风险边界情况，尤其对 Agent 很关键，因为 Agent 具备执行能力。红队测试是用攻击者视角主动找Agent系统弱点, 以评估和提升其安全性和鲁棒性。常见手法有越权请求、提示注入、越狱诱导、工具滥用。实践上红队结果应回流到规则护栏、权限策略和训练数据，形成持续加固闭环。\n\n### 4. 子问题：Human-in-the-loop 在 LangGraph 怎么落地？\n答：\n我会在关键节点使用 interrupt 或审批节点，让系统在“高风险动作前”暂停，等待人工确认后继续。典型场景是资金操作、批量发送、生产变更。这样保留自动化效率，同时把不可逆动作的最终控制权交给人。\n\n## 2. 补充材料：为什么需要执行沙箱\n\n### 4) Understanding Manus sandbox - your cloud computer\n\n- 原文链接：\n  - [https://manus.im/blog/manus-sandbox](https://manus.im/blog/manus-sandbox)\n- 核心思想：\n  - 将 Agent 执行环境放在沙箱中，形成可隔离、可复现、可回放的“云电脑”执行面。\n  - 沙箱让工具调用不直接触达核心系统，降低高权限动作风险。\n  - 文章强调“思考能力”必须和“安全执行环境”配套，才能上线生产场景。\n- 文章概述（约500~1000字）：\n  - 这篇文章的重点是把 Agent 的“执行面”讲清楚：模型会推理并不等于系统可以安全上线，真正落地还需要一个可控的运行环境。Manus 把这个运行环境定义为 sandbox（云电脑），核心价值是隔离、可复现、可治理。隔离意味着 Agent 的浏览器操作、代码执行、文件读写都在受控环境中完成，不直接接触用户本机或核心生产系统；可复现意味着每次任务过程可追踪、可回放，便于故障排查和合规审计；可治理意味着可以施加权限边界、资源配额、网络策略和操作白名单。文章强调很多 Agent 事故并非“模型胡说”，而是执行环节缺乏约束，例如重复提交、高权限误操作、异常重试放大。沙箱机制相当于给 Agent 套上工程安全带，把高风险动作从“默认放行”改成“可验证后执行”。从面试表达看，你可以把这篇文章提炼为三层：安全层（权限/隔离）、稳定层（重试/回滚/断点恢复）、观测层（日志/轨迹/审计）。再补一句“Agent 的生产门槛不是会不会回答，而是能不能安全执行”，就能把你和只谈模型能力的候选人拉开差距。\n- 面试可能问的点：\n  - 问：为什么 Agent 项目必须做执行沙箱？\n  答：因为 Agent 一旦具备网页操作、代码执行和外部调用能力，风险从“答错”升级为“误执行”。沙箱把执行面与核心系统隔离，能限制破坏范围，避免高权限误操作直达生产环境。没有沙箱，很多企业场景即使效果好也不敢上线。\n  - 问：沙箱里如何做权限控制、资源限制和审计回放？\n  答：我会做最小权限白名单（可访问域名、可用工具、可写目录），再加 CPU/内存/时长限额和网络出口策略。所有关键动作记录为结构化事件日志，绑定任务ID和操作者，支持按步骤回放，便于定位问题、追责和合规审计。\n  - 问：沙箱模式对稳定性、排障和合规有什么收益？\n  答：稳定性上可通过隔离和限额避免故障扩散；排障上有可回放轨迹，能快速复现实例并修复；合规上可形成“谁在何时做了什么”的审计链。对企业来说，这三点比单次模型效果更关键，决定系统是否可持续运营。\n\n---\n","title":"07_安全与风控核心问答"},"01_AI/08_框架协议与工程化/01_核心问答.md":{"md":"# 08_框架协议与工程化核心问答\n\n## 使用说明\n\n- 本文件按主题聚合同类问题，内部保留原资料中的关键答案与补充材料。\n- 优先保留原有表达和问答结构，减少额外再创作。\n- 每个问题末尾都标明来源，方便回查原文件。\n\n## 1. 主干问题：工具调用如何做稳定性与可靠性治理？\n\n### 1. 子问题：工具调用与可靠性治理（Function Calling）\n\n主问题：LLM 如何调用工具？怎么把工具链路做稳？\n\n口述答案：  \nFunction Calling 的本质是让模型在结构化工具说明书, 描述约束下输出“调用意图 + 参数”，由编排层真实执行并回填结果。要从“会调”走向“稳调”，需要三层治理：输入层做 schema 校验与默认值补齐，调用层做超时、重试、熔断、并发限额，结果层做幂等键、去重与统一错误码。重试策略要区分可重试和不可重试错误，避免高危写操作被重复执行。\n\n常见追问：\n\n1. 读接口和写接口重试策略怎么区分？\n2. 如何避免工具调用越权？\n  1. **最小权限 + 白名单**\n    当前任务必需工具，不给全量工具；每个工具用短期、范围受限的凭证（按用户/会话绑定）。\n  2. **调用前二次鉴权（服务端强校验）**\n    说“要调用”不算数，服务端必须再校验：角色权限、资源归属、参数是否合法（如 userId 只能操作自己的数据）。\n  3. **高风险动作强制人工确认 + 可追溯**\n    息、下单、删改数据这类动作必须 HITL；全链路审计日志+告警+一键熔断，异常时立刻停调用。\n3. 工具故障时如何降级不拖垮主链路？\n\n### 2. 子问题：Tool Use 是扩展 Agent 能力的有效途径。请解释 LLM 是如何学会调用外部 API 或工具的？（可以从 Function Calling 的角度解释）\n\n答：\nFunction Calling 的核心是给模型一份结构化工具说明（名称、功能、参数 Schema），让它在对话中先判断“要不要调工具”，再输出结构化调用参数。agent编排层执行工具后，把结果回填给模型做二次生成。面试可补一句：线上稳定性取决于参数校验、超时重试、幂等处理和失败降级，不只是模型会不会调用。\n\n**Function Calling的工作原理如下：**\n\n1. **工具定义与注册 (Tool Definition & Registration):**\n  - 对于每一个工具，我们需要定义：\n    - **函数名称 (Function Name):**\n    - **函数描述 (Function Description):** 用自然语言清晰地描述这个函数的功能。\n    - **参数列表 (Parameters):** 定义函数需要哪些输入参数，每个参数的名称、类型、和描述。\n2. **LLM的决策与意图识别 (LLM's Decision & Intent Recognition):**\n  - 在与用户交互时，我们将用户的提问**连同所有已注册的工具描述**一起发送给LLM。\n  - LLM会分析用户的意图。如果它认为只靠自身知识无法回答，且用户的意图与某个工具的功能相匹配，它就会决定调用该工具。\n3. **生成结构化的调用指令 (Generating Structured Calling Instructions):**\n  - 当LLM决定调用工具时，它的输出**不再是自
