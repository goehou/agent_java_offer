Frontier。\n  - 其中最关键的是 URL Frontier。它不是简单 FIFO，而是整个调度中心，要同时解决三个问题：优先级、礼貌性和新鲜度。优先级上，我会按页面重要性和更新频率来安排抓取顺序；礼貌性上，会按 host 维度拆队列，同一 host 串行抓取，并加抓取间隔；新鲜度上，对更新频繁的重要页面提高重抓频率。  \n  另外系统还要重点处理去重、DNS 缓存、robots.txt、失败恢复和 spider trap。总结来说，爬虫系统最核心的不是‘抓得快’，而是‘调度得稳、过滤得准、恢复得动’\n  - 去重: \n    - URL去重: 防止重复 URL 进入 Frontier; 常用 Bloom Filter / HashSet / Redis Set\n    - 内容去重: 防止不同 URL 对应相同内容, 常用哈希值、checksum\n- 搜索系统:\n\n搜索系统主链路可以压缩成四个字：**召回、粗排、精排、展现**。\n\n1. 写入链路（离线/准实时）\n  - 文档采集进来\n  - 解析、清洗、分词、抽字段\n  - 建倒排索引\n  - 生成排序特征\n  - 索引写入搜索引擎\n\n这条链路是“把数据变成可搜索”。\n\n1. 查询链路（在线）\n\n用户输入 query 后：\n\n- Query 理解：分词、纠错、同义词扩展\n- 召回：从倒排索引快速拿到候选文档\n- 排序：按 BM25/相关性模型/点击率模型综合排序\n- 返回前做过滤、去重、高亮、分页  \n这条链路是“把 query 变成结果页”。\n\n1. 召回怎么理解\n\n召回阶段的目标不是最精准，而是**别漏掉可能相关的候选**。  \n常见方式：\n\n- 倒排索引召回\n- 同义词扩召回\n- 拼写纠错召回\n- 向量召回（语义检索）  \n搜索系统里，召回更看覆盖率和延迟。\n\n1. 排序怎么理解\n\n排序阶段才真正决定“谁排前面”。  \n常见排序信号：\n\n- 文本相关性\n- 热度\n- 点击率/转化率\n- 时效性\n- 个性化特征  \n可以分粗排和精排：  \n粗排先快速筛一遍，精排再用更贵的模型细算。\n\n1. 自动补全怎么讲\n\n自动补全和全文搜索不完全一样。  \n它更强调**前缀匹配 + 高频词优先 + 低延迟**。  \n常见实现：\n\n- Trie / 前缀树\n- 倒排 + 前缀索引\n- Redis ZSet 存热点 query  \n排序通常结合：前缀命中、历史频次、时效性、个性化。\n\n## 2. 信息流与聊天系统\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：Feed 推拉模型、在线状态、消息存储与同步\n\n信息流系统设计，按“朋友圈/微博首页”这个场景，用最通俗的方式讲。\n\n**先定目标**\n\n1. 用户发一条动态后，粉丝能较快看到。\n2. 首页打开要快。\n3. 高峰期不能崩。\n4. 允许“几秒内慢慢同步”，但不能乱。\n\n**系统分成5个角色**\n\n1. 发帖服务：负责接收“发动态”。\n2. 关系服务：知道“谁关注了谁”。\n3. 消息队列：做缓冲，防止瞬间流量把系统打挂。\n4. 推送工人：从队列取任务，分发到各粉丝首页。\n5. 首页服务：用户打开首页时，快速拿到内容。\n\n---\n\n**一、发帖流程（写入）**\n\n1. 用户发帖，先把帖子存到帖子库。\n2. 生成一条“分发任务”放入消息队列。\n3. 推送工人拿到任务，查粉丝列表。\n4. 把“这条帖子编号”写进粉丝的首页列表。\n5. 粉丝下次打开首页，就能直接看到。\n\n这就是“写扩散”：发帖时先分发，读的时候更快。\n\n---\n\n**二、看首页流程（读取）**\n\n1. 用户打开首页。\n2. 首页服务先读“我的首页列表”（只存帖子编号）。\n3. 再根据编号批量取帖子正文、作者信息、点赞数。\n4. 组合后返回给前端。\n\n这里“首页列表只存编号”很关键，省内存、速度快。\n\n---\n\n**三、为什么还要读扩散**\n\n如果是普通用户，粉丝不多，写扩散很合适。  \n\n但如果是大V，发一条要写几百万粉丝首页，写入压力太大。\n\n所以大V用“读扩散”：\n\n1. 发帖时先不全量分发。\n2. 粉丝打开首页时，再临时拉取并合并大V内容。\n\n**最终做法：混合**\n\n1. 普通用户：写扩散（读快）。\n2. 大V用户：读扩散（写稳）。\n\n---\n\n**四、怎么保证稳定**\n\n1. 幂等：同一条分发任务重复执行，也只写一次。\n2. 重试：第三方或下游失败，自动重试。\n3. 死信队列：多次失败先隔离，避免堵主链路。\n4. 监控：重点看“队列堆积、首页延迟、分发成功率”。\n\n---\n\n**面试可直接说（60秒）**\n\n“我会把信息流推送拆成发帖链路和首页读取链路。发帖先落库，再把分发任务写入消息队列，由分发服务异步把帖子编号写进粉丝首页列表；用户读首页时先拿编号，再批量取正文和作者信息。核心取舍是写扩散和读扩散：普通用户走写扩散保证首页快，大V走读扩散避免写放大，采用混合模式。系统通过幂等、重试、失败隔离和监控保证高并发下稳定运行。”\n\n如何设计一个聊天系统?\n\n先确认范围：支持 1 对 1、最多 100 人群聊、在线状态、多端登录、离线推送。  \n\n通信层(客户端和后台)我会选 WebSocket 做长连接，因为聊天是双向实时场景。登录注册等非实时接口走 HTTP 即可。  \n\n架构上分成：\n\n聊天服务. 聊天服务是有状态的，因为要websocket维护长连接；通过服务发现给用户分配最合适的聊天节点，避免单机过载\n\n在线状态服务. 5秒钟的这个心跳机制来判断这个用户是在线还是离线。对，这个也不要太实时，不然在地铁就信号抖动的地方会频繁上下线，对用户体验不好。\n\n存储层.  聊天消息我更倾向 KV 存储，原因是写入量大、低延迟要求高、可水平扩展。消息主键不能只用时间戳，我会引入可排序的 message_id，保证同会话内顺序。用户关系方面，用户资料和关系链可放关系库；\n\n通知服务. 就是去发送消息，在线通 知直接将在线这条消息同步给接收方对应的那个 聊天chat 节点。离线通知就给它写到离线通知的 kv 存储里, 再去调用APS 或者 Firebase 这些原生的push接口通知\n\n流程是：\n\n双方在线:  发送方写入聊天服务，生成 message_id，先落消息存储，再投递给接收方在线节点；\n\n如果接收方离线，Worker -> 离线推送服务: 发离线推送.  B上线后 -> 拉取增量消息(message_id > 本地最大ID)\n\n多端同步, 用每台设备自己的 cur_max_message_id 拉增量，保证手机和电脑最终一致。  \n\n群聊方面，小群可以给每个成员维护收件箱副本，读取简单、延迟低(写扩散)；大群则要避免全量复制，可改为按需拉取或分层广播 (读扩散)。最后补上重试、死信、幂等和监控，保证消息不丢、可追踪、可恢复。\n\n## 补充原文：Elasticsearch 基础、查询与深分页\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n#### 2.5.1 ES基础概念\n\nES 术语：\n- `Index`：相当于数据库的 Table\n- `Document`：相当于数据库的一行记录\n- `Field`：相当于数据库的 Column\n- `Mapping`：相当于数据库的 Schema\n- `DSL`：相当于数据库的 SQL\n- 中文分词器常用 IK\n\n倒排索引：\n- key 存储：ES 还有一层 `Term Index`，只存储部分词前缀，并常驻内存；在内存中通常以 `FST` 形式保存，节省内存。\n- value 存储：`PostingList` 会用 `FOR` 压缩文档 ID，并用 `Roaring Bitmaps` 支持交并集运算。\n\n#### 2.5.2 ES数据写入与查询\n\nES 数据写入：\n- 协调节点负责路由。\n- 数据先写内存缓冲区，每隔 1s 刷到文件系统缓存，所以 Query 是近实时的。\n- 为防节点宕机，ES 还会写 `translog`，但 translog 落盘也有时间窗口，因此节点异常时存在短暂数据丢失风险。\n- 主分片写成功后并行复制到副本，副本完成后返回 ack。\n\nES 查询：\n- `Get`（按 ID 查）是实时的，会先查 translog；\n- `Query`（按 query 匹配）是近实时的，主要查 segment。\n- `QUERY_THEN_FETCH` 分两阶段：\n  - Query Phase：每个分片先返回局部 topN doc id；\n  - Fetch Phase：协调节点合并排序后，再向目标分片拉取完整文档。\n\n#### 2.5.4 ES深分页\n\nES 深分页的问题本质是：每个分片都要先返回 `from + size` 条候选，再由协调节点做全局合并排序，页数越深，排序和内存成本越高。\n\n常见解法：\n- 业务上限制最大页数；\n- `from/size` 只用于浅分页；\n- 批处理任务用 `scroll`；\n- 实时高并发深翻页用 `search_after`，用上一页最后一条记录作为游标。\n\n## 补充原文：朋友圈系统与点赞架构（来自补充整理）\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 微信朋友圈这样的社交系统，应该如何设计？\n\n一个比较通俗的拆法是：\n1. **发布链路**\n- 用户点击发朋友圈时，客户端先把内容缓存到本地，立刻给用户成功反馈；\n- 图片/视频先就近上传到 CDN；\n- 客户端把图片地址、文字、可见范围等元数据提交给后端；\n- 后端写入“朋友圈发布表”。\n\n2. **索引层 / 相册层**\n- 发布表写成功后，再往相册表写一条索引，指向真正的发布内容；\n- 这样用户查看自己历史内容时，可以先走索引，再回源到发布表。\n\n3. **时间线分发**\n- 后台离线任务或异步任务，根据可见范围，把这条朋友圈写入好友的时间线表；\n- 好友刷朋友圈时，本质上查的是时间线表，而不是全局扫发布表。\n\n4. **读取链路**\n- 时间线里拿到帖子索引；\n- 再根据图片 URL 去 CDN 拉内容；\n- 有新内容时可做红点提醒。\n\n### 朋友圈权限控制怎么做？\n\n权限本质上是“关系 + 可见范围 + 用户配置”的联合判断。\n\n一种可讲的工程化思路是：\n- 用户和好友之间的关系、朋友圈权限设置、总可见范围这些信息，都需要在服务端持久化；\n- 同时客户端会缓存一部分权限数据，用于本地快速判断和展示优化；\n- 每次刷新朋友圈时，再结合当前用户与发帖人的关系、帖子本身的可见范围，做一次最终判定。\n\n一句话说：\n**发布时控制可分发范围，读取时再做一次权限校验，形成双层控制。**\n\n### 如何设计高并发的朋友圈点赞系统架构？\n\n点赞和评论通常是独立数据，不建议和主帖子强耦合。\n\n常见做法：\n1. **Redis 存点赞集合**\n- 每条朋友圈对应一个 Redis Set；\n- Set 里放给这条朋友圈点赞的用户 ID；\n- 点赞数量可以直接用 `SCARD`，点赞列表可用 `SMEMBERS` 或分页拉取。\n\n2. **好友可见点赞**\n- 如果“只有好友才能看见某个点赞”，可以把“当前用户的好友集合”和“这条朋友圈的点赞用户集合”做交集判断；\n- 工程上可以通过 `SISMEMBER` 之类方式快速判断是否可见。\n\n3. **重复点赞幂等**\n- 如果用数据库存点赞关系，可以用 `(user_id, post_id)` 联合唯一键保证一个人只能点一次；\n- 如果用 Redis Set，本身天然去重，重复添加不会产生第二条记录。\n\n面试里可以总结为：\n**朋友圈主链路是“发帖异步分发到时间线”，点赞链路是“独立存储、缓存优先、关系裁剪可见性、幂等防重”。**\n","title":"04_搜索推荐与聊天核心问答"},"03_系统设计/05_交易与风控/01_核心问答.md":{"md":"# 05_交易与风控核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 预订与支付钱包\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：库存一致性、事务边界、支付状态机、对账\n\n设计一个支付系统:\n\n我先假设这是一个电商支付后端，不自己存信用卡信息，而是接入第三方 PSP，比如 Stripe 这种；系统需要支持买家付款，也就是 pay-in，后续还要支持给卖家结算，也就是 pay-out。另外我会默认这个系统需要高可靠、可审计，而且要能做对账。\n\n在这个前提下，我会把系统拆成几个核心模块。  \n最核心的是 **Payment Service**，它负责统一接收支付请求、维护支付状态机，并协调整个流程。然后会有一个 **PSP Adapter**，专门对接外部支付渠道。内部还会有 **Ledger** 做账务记账，**Wallet** 维护卖家的余额，另外还需要 **Webhook Handler** 处理 PSP 的异步回调，以及 **Reconciliation Service** 做每日对账。\n\n核心支付流程上，我会这样设计：  \n用户在 checkout 时，前端先调用 Payment Service。Payment Service 会先创建一条 payment event，以及一个或多个 payment order，然后调用 PSP 注册支付请求，并带上全局唯一的 payment_order_id 作为幂等键。PSP 返回一个 token 之后，前端就可以基于这个 token 去拉起 PSP 的 hosted payment page，让用户在 PSP 页面完成支付。支付完成后，PSP 一方面会把用户 redirect 回我们的结果页，另一方面会通过 webhook 异步通知我们最终支付结果。我们的后端收到 webhook 后，再更新 payment order 状态；如果支付成功，再继续更新 wallet 和 ledger。\n\n我觉得这个系统最关键的难点有三个。  \n第一个是 **幂等性**，也就是要防止重复扣款。因为用户可能重复点击，网络也可能超时重试，所以同一个 payment order 必须带同一个 idempotency key，服务端要通过唯一约束或者幂等表保证只处理一次；同时调用 PSP 时也要把这个幂等键传过去。\n\n第二个是 **一致性和失败恢复**。支付系统一定会遇到 webhook 延迟、网络异常、内部服务部分失败这些情况，所以我不会假设它是天然强一致的。我会把支付状态设计成明确的状态机，比如 pending、success、failed、unknown，并且配合 retry queue 和 dead letter queue 做失败重试。对于最终仍然不一致的情况，要靠 reconciliation，也就是拿 PSP 或银行的结算结果跟内部 ledger 做逐笔对账。\n\n第三个是 **账务正确性**。这里我会用 **double-entry ledger**，也就是复式记账。因为钱包余额更像业务视图，而 ledger 才是真正的财务真相来源。这样每一笔资金流转都有借贷对应关系，后续无论审计、追踪还是修账都会更可靠。\n\n最后总结一下，我设计支付系统时最关注的不是单纯高并发，而是 correctness，也就是不能重复扣款、不能丢单、账必须对得上。在回答这类题时，我一般会先讲需求边界，再讲高层架构和核心流程，最后重点展开幂等、失败恢复、对账和账务系统这几个关键点。这样回答会比较完整。\n","title":"05_交易与风控核心问答"},"03_系统设计/06_增长与邀请码系统/01_核心问答.md":{"md":"# 06_增长与邀请码系统核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 分布式 ID 与短链系统\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：全局唯一 ID、短链编码、热点与重定向\n- 练习建议：\n  - 对比口述：UUID / 号段 / Snowflake\n  - 追问准备：“短链冲突和高并发写入如何处理？”\n\n这类题可以按“ID 系统 + 短链系统 + 热点治理”三段来答。\n\n**一、分布式 ID：UUID、号段、Snowflake 怎么选**\n\n1. UUID\n\n- 优点：无中心、生成简单、全局唯一性好。  \n- 缺点：字符串长、无序，做 DB 主键会导致索引离散、页分裂多。  \n- 适用：不追求有序、量不大或离线场景。\n\n1. 号段模式（Segment/Leaf）\n\n- 思路：从 DB 一次批量申请一段 ID（如 10000 个），本地内存递增发放。  \n- 优点：趋势递增、性能高、实现简单。  \n- 缺点：依赖号段服务和 DB；要处理号段预取、服务高可用。  \n- 适用：业务系统主键、订单号等“希望有序且高性能”的场景。\n\n1. Snowflake\n\n- 思路：时间戳 + 机器ID + 序列号（常见 41+10+12）。  \n- 优点：本地生成、趋势递增、吞吐高、长度固定。  \n- 难点：时钟回拨、机器ID分配、跨机房部署。  \n- 解法:  持久化 lastTimestamp，服务重启时先校验，防止重启后时钟更小。或者是把时间上报给 Zookeeper 之类的中间件，让他们来校验和管理每个机器的这个时钟。\n- 适用：高并发在线系统主流方案。\n\n面试一句话：  \n\n“要无依赖选 UUID；要数据库友好选号段；要高并发低延迟通常选 Snowflake，但要重点治理时钟回拨和机器号冲突。”\n\n---\n\n**二、短链系统：生成、冲突、跳转链路**\n\n1. 生成方案\n\n- 自增ID(号段/雪花算法)转62进制（最常见）`id -> base62 short code`，短、稳定、可控。  \n- 插入DB数据 （依赖唯一索引兜底防短码冲突）,写入冲突时重试（重新生成或加盐）。 \n- 写入redis加缓存\n\n生产常见：主方案用自增ID+Base62，别名短链做去重哈希辅助。\n\n1. 跳转链路（读路径）\n\n客户端 -> CDN/网关 -> 短链服务 -> Redis 查短码映射(code -> long_url) -> 命中返回 301/302 到长链。  \n\n未命中再查 DB，回填缓存（设置 TTL）。  \n\n埋点异步化：点击日志入 MQ，避免阻塞跳转主链路。\n\n1. 301/302 怎么选\n\n- 301：长期不变，利于 SEO 和缓存。  \n- 302：可控性高，便于后续改目标链接。\n\n很多业务默认 302，营销活动常用。\n\n---\n\n**三、热点 key 与缓存穿透（追问高频）**\n\n1. 热点 key\n\n- 现象：某短码爆红，请求集中打单 key。  \n- 治理：本地缓存 + Redis，多副本读、热点预热、限流熔断、热点隔离。\n\n1. 缓存穿透（查不存在短码）\n\n- 参数校验（非法短码直接拦）。  \n- Bloom Filter 预判不存在。  \n- 空值缓存（短 TTL）防止反复回源。\n\n1. 缓存击穿/雪崩顺带提\n\n- 击穿：热点失效瞬间并发回源 -> 互斥重建。  \n- 雪崩：大量 key 同时失效 -> TTL 抖动 + 限流降级。\n\n---\n\n## 2. 补充原问：邀请码系统设计（五阶段版）\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n如果让我设计一个邀请码系统，我会先把它当成一个增长中台能力，而不是单次活动接口。因为它后面可能会服务注册拉新、交易返佣、活动裂变等多个场景。所以我会把核心链路拆成五段：邀请码生成、邀请码下发、邀请码验证、邀请关系绑定、邀请奖励发放。这里我会坚持一个原则：**绑定关系必须强一致，奖励发放可以最终一致**，这样既能保证业务正确性，也能把高并发压力拆开。\n\n先说**生成阶段**。这一层核心是保证邀请码唯一、可读、可控。我一般会做两种模式：一种是活动开始前批量预生成，另一种是用户触发时实时生成。预生成适合大活动，能减少高峰时实时生成压力；实时生成适合长尾场景，节省库存。邀请码 code 的生成，首先用雪花算法生成一个全局唯一的 ID，且是自增的。然后再通过 Base62 的编码转换成字符串+数字，生成一个短的 8 位的码，便于传播。生成结果先落权威存储，再把热点数据同步到 Redis，这样后面查码时会快很多。\n\n第二个是**验证阶段**。这里是所有请求进入系统后的第一道关键校验。我一般会先过 API Gateway，做鉴权、限流、黑名单、参数合法性检查。真正验码的时候优先查 Redis，因为邀请码是否存在、是否过期、是否被禁用、是否达到使用次数上限，这些都适合放缓存里快速判断。只有缓存没命中或者缓存不确定的时候，才回源数据库查权威状态。除此之外，这一层我还会把风控前置，比如设备异常、IP 异常、账号异常、短时间高频尝试，这些如果命中风险规则，就不进入后面的绑定逻辑。\n\n第三个是**绑定阶段**，这是整个系统最核心的地方。这一层我一定会做成强一致。请求进入绑定逻辑之后，我会先做幂等校验，比如每次请求都带 `request_id`，防止用户重复点击或者客户端超时重试导致重复绑定。真正写绑定关系时，我会依赖数据库事务和唯一约束来保证“同一个被邀请人在同一个场景下只能绑定一次”。\n\n第四个是**发奖阶段**。发奖我不会放在主链路同步执行，因为这样会拖慢接口，也会把库存、账户、消息通知这些下游系统耦合进来。所以我的做法是，绑定成功后只做一件事：发一条“绑定成功事件”到 MQ，比如 Kafka 或 RocketMQ。下游奖励服务异步消费，按规则决定是发现金、发积分、发优惠券还是发返佣。这里也必须做幂等，因为 MQ 可能会重复投递，所以消费方要保证同一个奖励事件只生效一次。\n\n如果面试官再问我“这套设计为什么能扛住高并发”，我会补一句：**前面三段主要靠缓存、限流和风控削峰；绑定阶段靠幂等、事务和唯一约束保证正确性；发奖阶段靠 MQ 异步解耦压力。** 所以整个系统的设计思路其实就是八个字：**前链路做短，后链路做异步。**\n","title":"06_增长与邀请码系统核心问答"},"03_系统设计/07_地图与大规模存储/01_核心问答.md":{"md":"# 07_地图与大规模存储核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 地图位置与大规模媒体存储\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：地理索引、邻近检索、大文件存储与分发\n\n这道题我会设计一个“附近地点检索服务”，核心目标是输入用户经纬度和搜索半径，低延迟返回附近商家。第一是附近搜索，第二是商家详情查询，第三是商家增删改；并且写入不要求实时生效，比如次日生效。量级上我会先估算，假设1亿DAU、每人每天5次搜索，搜索QPS大约5000，属于典型读多写少系统，所以优化重点放在读路径。\n\n两个无状态服务：LBS检索服务和Business商家服务。LBS只负责“按位置找候选商家”，Business负责商家详情和低频写操作。数据层是商家主表加地理索引表，主从架构承接读写分离。关键难点是地理检索：不能用全表扫距离，也不能只靠经纬度普通索引，因为二维范围检索效率差。我会选Geohash做空间索引，把地图切成网格并编码成字符串前缀。查询时先根据半径选择geohash精度，比如500米用更细精度；再计算用户所在网格和8个邻居网格，批量拿到候选商家ID；最后做一次精确距离计算并排序。\n\n这里要主动讲边界问题：只查当前网格会漏掉边缘商家，所以必须查邻居网格；另外网格是方形而半径是圆形，所以最后要做精确距离过滤。若结果不足，可以逐步扩圈，逐级放大搜索范围，直到满足返回数量。\n\n缓存上我会做两层：第一层缓存“geohash到商家ID列表”，第二层缓存“business_id到商家详情”。缓存键不用精确经纬度，而用geohash，避免用户轻微移动导致缓存碎片。扩展方面，商家主表可按business_id分片；geo索引表优先用读副本扩吞吐，不急于复杂分片。部署上采用多Region多AZ，兼顾低延迟、高可用和数据合规。\n\n总结：**附近搜索 = 地图切格子（Geohash）做快速候选 + 精确距离做最终过滤。**\n","title":"07_地图与大规模存储核心问答"},"03_系统设计/08_分布式与算法补强/01_核心问答.md":{"md":"# 08_分布式与算法补强核心问答\n\n## 使用说明\n\n- 本文件按系统设计主题收敛原计划中的讲稿和口述材料。\n- 仍以面试口述为中心，不强行改写原文。\n- 内容基于系统设计专题资料重组整理。\n\n## 1. 补强专题（算法与分布式基础）\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n- 主题：高频补位题（数据流算法 + 分布式基础）\n- 参考主题：\n  - 任务调度系统\n  - 一小时内 Top K 高频 IP\n  - 基数估计（Cardinality Estimation）\n  - 成员查询（Membership Query）\n  - 范围查询（Range Query）\n  - Raft\n  - 跳表（Skip List）\n- 练习建议：\n  - 口述 3 个“秒答题”：TopK、布隆过滤器、Raft 选主\n  - 整理“系统设计高频追问清单”至少 15 条\n\n## 2. 练习建议\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n### 建议目标\n\n1. 完成 10 次系统设计 10 分钟口述（每天 1 次）。\n2. 每天至少记录 2 个追问，累计 >= 20 个。\n3. 至少形成 5 个可复用答题模板：限流、存储、消息、支付、搜索。\n","title":"08_分布式与算法补强核心问答"},"03_系统设计/README.md":{"md":"# 03_系统设计\n\n## 主题索引\n\n- [00_方法论与估算](00_方法论与估算/01_核心问答.md)\n- [01_高并发系统](01_高并发系统/01_核心问答.md)\n- [02_缓存与KV系统](02_缓存与KV系统/01_核心问答.md)\n- [03_消息队列与监控告警](03_消息队列与监控告警/01_核心问答.md)\n- [04_搜索推荐与聊天](04_搜索推荐与聊天/01_核心问答.md)\n- [05_交易与风控](05_交易与风控/01_核心问答.md)\n- [06_增长与邀请码系统](06_增长与邀请码系统/01_核心问答.md)\n- [07_地图与大规模存储](07_地图与大规模存储/01_核心问答.md)\n- [08_分布式与算法补强](08_分布式与算法补强/01_核心问答.md)\n\n## 说明\ 时候单 Agent，什么时候 Multi-Agent；多 Agent 的收益不是“更酷”，而是 **上下文隔离、专业化和并发**。这点和 某AI应用平台 官方对 Sub-agent 的说法完全一致。\n\n**2）RAG / 知识库 / memory**\n至少要能顺下来：文档清洗 → chunk 策略 → 索引 → recall → rerank → prompt assembly → citation / grounding。然后能回答：为什么要 multi-query、是否要二次筛选、embedding 检索和规则知识库有什么差异、错知识/过期知识怎么治理。公开面经里这些都被直接问到了。\n\n**3）大代码库里如何让 AI 理解项目**\n这题很可能会打到你。你要准备一套像样答案：目录图谱、模块摘要、rules/约束、关键调用链、核心 domain object、增量索引、变更影响分析、只给局部上下文而不是整仓塞满。公开面经已经出现了“几十万行代码项目里怎么让 AI 快速理解结构”。\n\n**4）AI 出码为什么会错，怎么提高留用率**\n你要能讲“看起来对但逻辑错”的根因：上下文缺失、需求不清、约束没喂、检索命中不准、工具执行反馈不够、评测闭环缺失。然后讲治理动作：任务切小、先影响分析、规则库、检索、计划先行、双 Agent review、单测/集测、灰度/双跑。面经里直接问到了出码留用率、复杂业务质量下降原因、错知识误导。\n\n**5）MCP / tools / workflow orchestration**\n某AI应用平台 官方文档和岗位要求都提到了 MCP 和大量工具集成。你至少要能回答：MCP 解决什么问题、和传统 tool calling 的关系、权限/鉴权怎么做、工具结果如何标准化、失败重试和超时如何处理。\n\n**6）评测与质量监控**\n不是只会说 accuracy。你要讲离线和在线两套：任务成功率、步骤成功率、工具调用成功率、引用正确率、用户采纳率、人工复核率、延迟、token 成本、回退率、重试率。某AI应用平台 公开面经里有“如何建立 AI 应用质量监控体系”，官方也明显把“靠谱”和“交付结果”放在核心位置。\n\n**7）灰度、双跑、线上稳定性**\n公开面经里已经问到“灰度切流 + 在线双跑”。这是二面很喜欢的工程味问题。你要能讲：新旧链路如何并行、结果怎么比对、日志和埋点怎么做、怎么降级回滚、如何避免影响真实用户。\n\n**8）基础功不能空**\nTransformer、HNSW、Redis、缓存一致性、Linux/Git、网络基础、一道中等算法题，这些不能完全不备。某AI应用平台 的 AI 岗公开面经里这些东西反复出现。\n\n你可以优先把下面 12 题过一遍：\n\n1. 你做的 Agent 系统里，**规划、执行、工具调用、memory** 分别怎么设计？\n2. **Single Agent 和 Multi-Agent** 你怎么选？什么场景必须拆？\n3. **Sub-agent** 的收益到底是什么，除了“并行”还有什么？\n4. **上下文隔离**\n\n每个子代理只看自己需要的信息，减少主上下文污染、幻觉和 prompt 变长问题。\n\n1. **职责专业化**\n\n可以按角色拆分（检索、执行、审校、风控），每个子代理用不同提示词/工具/模型，更稳。\n\n1. **故障隔离**\n\n某个子代理跑偏或失败，不会拖垮整条链路；可以局部重试、局部回滚。\n\n1. **权限最小化**\n\n给不同子代理不同权限（只读/可写/高危工具禁用），安全边界更清晰。\n\n1. **成本与性能分层**\n\n简单任务给小模型，关键步骤给强模型，实现“该省省、该强强”。\n\n1. 知识库/RAG 里，**chunk、召回、rerank、multi-query** 你怎么做？\n2. **规则知识库** 和 **embedding memory** 的差别是什么？\n\n`规则知识库` 和 `embedding memory` 的差别可以记成：**硬规则 vs 软记忆**。\n\n- 规则库：稳定、可审计、可追责（适合合规/风控）。  \n- embedding：覆盖广、能处理长尾，但可能召回偏差。\n\n **适用场景**  \n\n- 规则库：风控边界、权限、计费、交易限制。  \n- embedding：FAQ、经验复用、个性化上下文、知识问答。\n\n**工程实践**  \n\n  **规则库做“硬约束和最终裁决”，embedding 做“语义检索和补充上下文”。**\n\n1. 如果知识库内容**过期或错误**，怎么避免误导模型？\n\n先说入库，所有知识都必须带版本号、生效/失效时间、来源等级和责任人，过期内容自动降权或下线；像费率、风控、政策这类高风险知识要人工审核后才能进入高可信索引。\n\n第二层是检索，先做 metadata 硬过滤，只查有效时间内、可信来源的数据，再做向量+关键词混检和重排序，把相似度、新鲜度、可信度一起打分，避免旧文档因语义相近被误召回。\n\n第三层是生成，要求模型“有证据才回答”，必须带引用；证据不足或冲突时直接拒答或提示人工确认。\n\n最后是线上止损，快速封禁问题文档ID或来源, 持续监控过期命中率、引用覆盖率、冲突率、幻觉率，指标异常就一键切高可信索引并回滚快照。\n\n1. 在一个**几十万行代码仓库**里，你怎么让 AI 快速理解项目结构？\n\n我不会让 AI 一上来就读几十万行代码，这样又慢又乱。\n\n第一步先把项目画成目录/地图：哪是入口、哪是核心业务、哪是数据库、哪是外部接口。先让 AI 知道“这个系统大概怎么跑”。\n\n第二步再做“按需找文件”，比如要改登录，就只给它登录相关的 5 到 10 个文件，不会把全仓库都塞进去。\n\n第三步是先看主流程，比如一个请求怎么从 Controller 走到 Service，再到数据库，这样 AI 很快能抓住主干，不会在细节里迷路。\n\n第四步是边看边验证，AI 说某个类负责某功能，我会让它用搜索和调用关系再确认一下. 最后把确认过的结论沉淀成小文档，比如“模块说明、关键入口、常见坑”，下次再问就更快。\n\n核心思路就一句话：**先搭框架，再看细节；渐进式披露相关内容；每一步都要验证以及沉淀摘要。** \n\n1. 为什么你们不是让 AI **直接从 PRD 出码**，而是“方案驱动”？\n2. AI 出码“**看起来对但逻辑错**”时，你怎么发现、怎么兜底？\n\n第一步写代码时引入spec规范约束, 主要是给 AI 做一些硬性的不能做的约束。引入一些正确的范例，以及团队的代码规约。 测试时需求拆成可验证的用例，至少覆盖三类：正常场景、边界场景和异常场景，比如空参数、重复请求、并发冲突、超时重试这些最容易出问题的点。\n\n第二步我会做小流量灰度，不只看接口 200，还看真实业务指标，比如成功率、错误率、延迟、资金和库存是否异常，确认逻辑在真实流量下也成立。\n\n第三步是兜底机制，新逻辑必须挂 Feature Flag，发现异常可以一键关闭并切回旧逻辑；写操作加幂等键，避免重复扣费或重复下单；关键链路保留审计日志和 request_id，出问题可以快速回放定位。\n\n1. **MCP / tool calling** 如何做权限控制、失败重试和结果标准化？\n\n我们做 MCP / tool calling，不让模型直接“自由调用”，而是经过一个 Tool Gateway。\n\n第一层是权限控制：按用户、Agent、场景做 RBAC/ABAC，默认最小权限，只开放白名单工具；高危工具（下单、转账、删数据）必须二次确认，参数也做 schema 校验和额度限制。\n\n第二层是失败重试：先做错误分类，只有超时、限流、临时 5xx 这类可恢复错误才重试；业务错误、参数错误、权限错误不重试。重试采用指数退避+抖动，设最大重试次数和总超时，配熔断与降级，防止雪崩。写操作必须幂等键，避免重试造成重复副作用。\n\n第三层是结果标准化：所有工具返回统一 envelope，例如 `code/message/data/retryable/trace_id`，并把外部错误码映射成平台标准错误码；模型只消费标准字段，不直接依赖第三方原始响应。这样做的价值是：权限可控、重试可预期、结果可编排，也方便监控和审计。  \n\n**模型只负责决策，工具网关负责安全与可靠性。**\n\n1. Agent 应用怎么做**评测和线上监控**？\n\n面试就按“**离线评测 + 线上监控 + 回归闭环**”讲。\n\n**可背版（300-500字）**  \n\n离线侧先做分层评测，第一层看任务成功率（是否完成目标），第二层看过程质量（工具调用是否正确、是否越权、是否死循环），第三层看安全与鲁棒性（注入攻击、脏数据、长尾问题）。数据集要覆盖真实用户样本、边界样本和故障样本，并保留一套黄金集做版本对比。\n\n线上侧我会盯四类指标：效果指标（成功率、人工接管率、用户满意度）、效率指标（P50/P95延迟、步骤数、token成本）、稳定性指标（工具失败率、重试率、超时率、回环率）、安全指标（越权调用、拒答命中、敏感操作拦截）。同时全链路打 trace_id，把一次任务里“计划-调用-结果-最终答复”串起来，便于定位问题。治理上要有灰度发布、实时告警和一键降级，异常时先止损再排查。\n\n最后把线上 bad case 回流到离线评测集，持续做 A/B 和回归测试。\n\n1. 如果要做**灰度切流、在线双跑、回滚**，你会怎么设计？\n\n","title":"01_AI应用平台核心问答"},"05_项目表达/02_交易Agent与风控平台/01_核心问答.md":{"md":"# 02_交易Agent与风控平台核心问答\n\n## 使用说明\n\n- 本文件按公司或场景聚合相关面试题。\n- 以场景化题单形式保留核心问答，便于专项冲刺。\n\n## 1. 交易Agent与风控平台\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n\n\n### 你最该准备的 12 道题\n\n**1. 如果让你设计 交易型Agent产品 的后端架构，你会怎么拆？**\n你要能讲出：`Query理解 -> 任务路由 -> 检索/RAG -> 工具调用 -> 风控校验 -> 执行 -> 结果解释 -> 观测与评测`。\n面试官想听的不是“我会用 LangChain/Dify”，而是**怎么把分析和执行分层、怎么设护栏、怎么追踪一次用户请求到真实下单的全链路**。这类题是被 交易型Agent产品 的官方产品形态直接“暗示”出来的。\n\n**2. Agent 为什么不能只做成固定 workflow？什么时候该用 planning？**\n你要能区分：\n固定流程适合低风险、强约束任务；\nAgent/planning 适合不确定查询、需要多轮推理和多工具决策；\n而交易场景里真正高风险的动作，常常不能完全交给自由规划，必须加**硬规则/风控闸门**。\n这题是典型的 “AI 工程能力 + 业务安全感” 题。结合现在后端/AI 工程岗位的高频题，Agent 的 planning、memory、tools、action 本身就是常见考点。\n\n**3. 如何做多工具调用？工具失败怎么办？**\n你要准备：工具 schema、超时、熔断、重试、fallback、幂等、权限隔离、结果校验。\n在 某交易平台 这种产品里，工具不只是搜索或问答，还包括**行情、新闻、持仓、风控、下单**。一旦工具失败，不能只说“返回错误”，要说明**如何降级成建议模式而不是执行模式**。\n\n**4. 如何做 RAG，文档切片怎么设计，如何评估效果？**\n这是现在 AI 工程方向的通用高频题。你至少要能回答：chunk 大小、overlap、metadata、hybrid retrieval、MMR 去重、重排序、离线评估与线上指标。牛客整理的 2026 Java/AI 工程题里，把 RAG 架构、检索优化、长上下文处理和效果评估都列成高频点。\n\n**5. 多轮对话怎么维护上下文？记忆机制怎么做？**\n你要能讲出：短期记忆（会话窗口）、长期记忆（向量库/用户画像）、事件记忆（重要操作）、摘要压缩、失效策略。\n如果你回答成“我把历史消息全塞回去”，会比较弱。Agent 面试现在已经会追问 memory 的实际工程取舍。\n\n**6. 怎么防 Agent 幻觉、误导性分析和 Prompt 注入？**\n这题在交易场景尤其要命。你应该准备：\n模型输出结构化约束、只允许白名单工具、引用证据、敏感动作二次确认、风控规则优先、注入隔离、工具输出校验、策略与执行分层。\n牛客的 AI 工程整理里把**幻觉、Prompt 注入攻击、自动化评估体系**都列成高频追问。\n\n**7. 为什么交易系统里会优先用 WebSocket？REST 怎么配合？**\n一个稳的回答应该是：\n行情、订单状态、仓位变化适合 WebSocket 的低延迟实时推送；\n查询历史、配置类接口、回补丢包适合 REST；\n系统设计上经常是 **WebSocket 收实时流 + REST 做补数/对账**。\n某交易平台 官方文档本身就把 WebSocket 当成核心接口，并支持通过 WebSocket 下单。\n\n**8. Order book 的 snapshot + 增量更新怎么保证正确？**\n这是非常像交易所面试题的点。你要能讲：\n先拿 snapshot，再合并增量；\n价格档同价替换、数量为 0 删除、无同价则按 bid 降序 / ask 升序插入；\n定期或每次计算 checksum，对不上就触发重拉快照。\n某交易平台 官方文档甚至直接给了 **CRC32** 的构造方式。\n\n**9. 为什么下单要设计 clientOid？怎么做幂等？**\n这一题几乎就是送分题，因为 某交易平台 文档都写明了：`clientOid` 是客户端自定义订单 ID，官方明确提醒它是客户端与服务端之间**唯一的幂等保证字段**，不传会有重复下单风险。\n你要会顺着讲：\n请求去重、重试安全、网络超时后的查询补偿、订单状态最终一致性。 \n\n**10. 交易场景里如何做风控？**\n你至少要会拆成这几层：\n输入风控（参数校验、黑白名单、用户状态）\n策略风控（仓位、杠杆、限价/市价约束）\n执行风控（频控、订单上限、重复单）\n结果风控（成交回执、对账、告警）\n官方文档里能直接看到交易参数校验、持仓模式差异、订单上限等规则，所以这块非常可能被问。\n\n**11. 如果模型服务抖动，怎么降级？**\n标准答案别只说“熔断”。你最好说成：\n先降级到纯行情/规则引擎；\n保留查询和分析，不开放自动执行；\n缓存最近一次结构化建议；\n对外返回明确的“不确定”状态；\n并打通 tracing、成本、时延、成功率监控。\n这类问题在 AI 工程面里也很高频，尤其首字延迟、失败率、AB 实验和自动化评估。\n\n**12. 你如何评估一个 Agent 做得好不好？**\n这题一定别只答“看用户满意度”。\n建议你至少讲 4 类指标：\n任务完成率、工具调用成功率、执行成功率、时延/成本；\n再加上业务指标，比如留存、复访、转化，或者误触发率、人工兜底率。\n因为 交易型Agent产品 官方强调的是从**分析到执行的全链路闭环**，所以评估指标也不能只看聊天质量。\n\n### 如果岗位偏链上 / Wallet / Onchain Agent，再加这组题\n\n某链上钱包产品 官方还有一条 **某链上钱包产品 Skill** 产品线，主打“**为 AI Agent 而生**”、**0 Gas 交易**、**一键跨链**、**x402 自主支付**、**8+ 主流公链**、**Order Mode**，还给了 `swapQuote / swapSend / orderQuote / orderCreate / orderSubmit` 的代码示例。\n如果你的 JD 里出现 **Wallet / Onchain / Skill / x402 / cross-chain / no gas** 这些词，就要额外准备：\n“Gasless 交易怎么实现？”\n“跨链订单状态机怎么设计？”\n“为什么用 order mode 而不是多 API 串联？”\n“AI Agent 的自主支付权限怎么控？”\n“签名、订单提交、状态追踪怎么做幂等和补偿？”\n\n### 我对你这场面试的实际判断\n\n如果你面的是交易平台侧的 Agent 开发岗位，我会判断它不像纯大模型平台岗，而更像 **AI Agent 工程 + 交易执行系统 + 风控/实时数据** 的混合岗。\n也就是说，**Java 后端、并发、MySQL/Redis/MQ** 这些基础不能丢；同时 **RAG、tool calling、memory、幻觉治理、评测、Prompt/上下文管理** 也要能讲；最后你还得补上 **order book、WebSocket、幂等、对账、风控** 这些交易系统味道很重的内容。这个判断主要来自公开产品形态、接口设计和行业常见技术栈。\n\n你今晚如果时间不多，我建议你按这个顺序刷：\n**先背 12 题里的 7/8/9/10**，因为这些最像交易平台场景题；\n然后补 **2/3/6/12**，这是 Agent 岗最容易拉开差距的部分；\n最后再复习 **Java 并发、MySQL 索引、Redis 分布式锁、MQ 幂等** 这些后端基本盘。公开的 Java/AI 工程高频题汇总里，这些仍然是必考区。\n\n如果你手上有具体 JD，可以继续按岗位描述定制一版“最可能被问的 20 题 + 每题怎么答”。\n\n\n## 2. 延伸追问与场景化回答\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n**1. 先判断你做的是不是真 Agent，而不是套壳工作流**\n他很可能会问：\n“你这个系统为什么一定要用 Agent，不是 workflow 就够了吗？”\n“你的规划、执行、观察、反思是怎么拆的？”\n“MCP、tool calling、function calling、workflow orchestration 到底有什么区别？”\n“多 Agent 什么时候值得上，什么时候反而更差？”\n这类问题很像最近公开 Agent 面试高频题，也和交易平台在 Agent Hub / MCP 方向上的投入一致。\n\n**2. 深挖你项目的系统架构**\n这类 usually 是二面的核心。你很可能会被追问：\n“你的 Agent 整体架构图是什么？”\n“状态怎么存？短期记忆、长期记忆怎么分？”\n“任务是同步还是异步？失败重试怎么做？”\n“工具调用失败、超时、返回脏数据时怎么 fallback？”\n“怎么避免无限循环、上下文污染、重复执行？”\n公开 JD 里通常会强调 API/微服务化、容器化、监控告警、灰度发布、弹性扩缩和线上稳定性。\n\n**3. RAG 和知识系统，几乎一定会被问**\n高概率问题包括：\n“你的检索链路怎么设计，query rewrite / recall / rerank / answer generation 各怎么做？”\n“为什么选这个 embedding 模型和向量库？”\n“你怎么处理时效性、脏数据、权限隔离？”\n“怎么评估 RAG 真的有效，不是看起来有效？”\n这类岗位通常会把 RAG、向量数据库、Embeddings、评测和持续学习写得比较明确；公开 Agent 面经里也把 RAG 列成高频。\n\n**4. 模型与评测：技术总监会看你有没有“量化思维”**\n很可能会问：\n“你怎么评估 Agent 成功率？”\n“线上看哪些指标？”\n“prompt、模型、工具、检索，到底是谁导致了失败？”\n“有没有离线评测集？线上 A/B 怎么做？”\n“什么时候考虑 LoRA / QLoRA，什么时候只做 prompt + RAG 就够？”\n因为这类 AI 岗通常会要求做 **线下评测集、线上 A/B、效果与成本度量、LoRA/QLoRA、DPO/ORPO、合成数据增强**。\n\n**5. 安全和合规，这一块在交易平台场景里很像“必问题”**\n这是我觉得你最要重点准备的。公开安全研究与行业实践里，普遍会点名 **Prompt Injection、插件/Skill 供应链风险、API Key 与账户权限滥用、自动执行导致误操作和权限扩大** 等问题。\n\n所以技术总监很可能会直接问：\n“如果 Agent 可以下单，你怎么做权限边界？”\n“Prompt injection 怎么防？”\n“外部工具或 Skill 被污染怎么办？”\n“API Key 怎么最小权限化？”\n“是否需要 human-in-the-loop，在哪一层拦？”\n“日志里如何脱敏？审计链怎么做？”\n你回答这类题时，最好带上 **read-only 默认、动作分级授权、额度限制、风控前置校验、双确认、审计日志、回放、沙箱执行、密钥隔离** 这些词。因为这和交易平台公开安全材料的方向高度一致。\n\n**6. 会看你有没有交易所业务 sense，不只是技术 sense**\n这类岗位说明里经常会提到：要懂 **交易所业务数据流、用户旅程、风控与合规、ROI 导向**，还偏好有 **AI x Crypto、交易、投研、链上探索** 经验的人。\n\n所以他可能会问：\n“Agent 在交易所里最先该落在哪个场景，客服、投研、风控还是交易助手？”\n“这个 Agent 给平台带来的核心指标是什么，转化率、留存、响应时延、拦截率、人工替代率？”\n“如果你只能做一个 MVP，你先做哪个能力，为什么？”\n“你怎么看 AI 在现货 / 合约 / 风控 / 合规里的边界？”\n这类题不是考你背行业知识，而是看你能不能把技术和业务结果连起来。\n\n**7. 还会有一小部分工程基础/八股/算法穿插**\n公开 Agent 面经里，除了 Agent 本身，还常见 Redis、HTTPS、拓扑排序、训练流程这类基础题。总监不一定细抠，但可能突然穿插 1-2 个来验证底子。\n\n\n\n我给你押一组**最像交易平台二面现场会出现的题**：\n\n1. 你做过的 Agent 项目里，哪一部分最能证明它不是普通 chatbot？\n2. 为什么这个场景适合 Agent，而不是固定 workflow？\n3. 你的 tool schema 怎么设计，如何约束模型少乱调工具？\n4. 你的 RAG 是怎么做召回、重排、引用和 freshness 控制的？\n5. 线上失败最多的是哪类 case，怎么定位是模型问题还是系统问题？\n6. 你如何评估 task success rate、tool success rate、latency、cost 和人工接管率？\n\n\n\n1. 如果让你给一个交易平台做一个“可真实交易”的 Agent，你如何设计权限和风控边界？\n\n可以把这题讲成“**九个词对应三层防线**”，面试会很清晰：\n\n1. **权限层（先防误用）**  \n\n`read-only 默认`：新 Agent 默认只能查行情和持仓，不能下单。  \n\n`动作分级授权`：查阅、模拟下单、真实下单、调杠杆、撤单分别授权。  \n\n`密钥隔离`：按环境/策略/账户拆分 API Key，生产密钥放 KMS/HSM，不落盘，定期轮转。以及子账户隔离\n\n2. **交易前风控层（先校验再执行）**  \n\n`额度限制`：单笔限额、单日限额、单策略限额、最大仓位、最大杠杆。  \n\n`风控前置校验`：在下单网关校验价格偏离、滑点、频率、风险敞口，不通过直接拒单。  \n\n`双确认`：高风险动作（大额开仓/高杠杆/新币对）要求二次确认，可人工审批或双签。\n\n3. **运行与追责层（可追溯可止损）**  \n\n`审计日志`：完整记录“输入-推理摘要-风控结果-最终指令-交易回执”。  \n\n`回放`：按 request_id 回放一次决策链，用于事故复盘和策略评估。  \n\n`沙箱执行`：新策略先模拟盘/影子模式，稳定后再灰度真实资金。\n\n\n\n1. prompt injection 在交易场景里最危险的后果是什么，怎么防？\n\n最危险的后果一句话：**让 Agent“绕过风控去执行高风险真实下单”，造成快速亏损甚至爆仓，而且是自动连续发生**。\n\n1. **执行权隔离**：LLM 只产出“建议”，最终下单必须经过确定性风控引擎。  \n\n2. **上下文隔离**：外部内容（新闻、社媒、RAG）一律标记`untrusted`，永不当系统指令。  \n\n3. **工具白名单 + 参数校验**：只允许固定动作；杠杆、数量、币对、方向都做硬校验。  \n\n4. **高危双确认**：大额/高杠杆/新策略必须人工确认或双签。  \n\n5. **运行时止损**：异常行为检测（频次突增、风险暴露异常）+ 一键熔断`read-only`。\n\n\n\n1. Skill / plugin 供应链被污染时，系统层怎么止损？\n\n核心是要先保证资金和安全和边界，然后再恢复服务，宁可短时降级，也不能带毒运行。\n\n首先把线上的大模型的权限只给到只读。然后去关闭对第三方这个工具的调用，暂停高位的任务队列。后续定位影响面，以及是最终导致的是哪个插件的原因。然后把这个插件做回滚到安全的版本，然后逐步的恢复恢复线上的服务。\n\n\n\n1. 为什么交易平台要做 Agent Hub / MCP，而不是继续让大家自己调 API？\n\n交易平台做 Agent Hub / MCP，主要是解决“大家各自调 API”带来的三大问题：接入慢、质量不稳、风险不可控。  \n第一，开发效率。直接调 API 每家都要重复做鉴权、重试、限流、参数校验和工具封装；Hub + MCP 用统一协议和工具描述，接入周期从“周级”降到“天级”。  \n第二，风险治理。交易场景高风险，平台必须把权限分级、额度限制、风控前置校验、审计日志、熔断降级做成系统能力；如果全靠各家自己实现，安全和合规口径会碎片化。  \n第三，生态和商业化。Hub 能做插件发现、版本管理、灰度发布、计量计费和质量评分，形成开发者生态网络效应。  \n所以本质上是：**底层保留原生 API 给高阶团队，上一层提供 Agent Hub/MCP 给规模化生态**，既保灵活性又保平台可控性。\n\n1. 如果只有 2 个工程师 + 6 周时间，你会给一个交易平台做什么 MVP？\n\n链上赚钱agent, 结合X402协议, 参与链上活动, 打土狗,做PVP, 预测市场, 一周需求调研。一周做整个工工具下游依赖数据链的打通。后一到两周做开发。再后面2周做测试、审计、稳定性建设以及小流量灰度与实盘。\n","title":"02_交易Agent与风控平台核心问答"},"05_项目表达/03_垂直写作与审阅平台/01_核心问答.md":{"md":"# 03_垂直写作与审阅平台核心问答\n\n## 使用说明\n\n- 本文件按公司或场景聚合相关面试题。\n- 以场景化问答形式保留核心问题与参考答案。\n\n## 1. 垂直写作与审阅平台高频问答\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n# 垂直写作与审阅平台面试题整理\n\n说明：下面保留场景化口述版答案，并补充通用参考答案，便于快速复习。\n\n## 1. 通用大模型为什么不能直接解决医药科研写作？\n\n你答：\n\n“因为医药科研不是一个只看语言流畅度的场景，而是一个强依赖证据链、专业术语、时效性和可追溯性的场景。通用模型能写得像，但不代表写得对。  \n在这个场景里，核心不是生成，而是检索-筛选-归因-分析-校验-生成这条链路。没有高质量专业数据、引用约束、工具调用和自检机制，模型很容易出现假引用、旧结论、逻辑跳步和专业误判。”\n\n\n**参考答案：**\n\nRAG 主要解决了 LLM 的以下核心问题：\n\n1. **知识的静态性与过时性：** LLM 的知识被“冻结”在其训练数据截止的那个时间点。RAG 通过连接一个可以随时更新的外部知识库，使得 LLM 能够获取和利用最新的信息，解决了知识过时的问题。\n2. **幻觉（Hallucination）：** LLM 在回答其知识范围外或不确定的问题时，倾向于捏造事实。RAG 通过提供具体的、相关的上下文，将 LLM 的回答“锚定”在这些事实依据上，显著降低了幻觉的产生。\n3. **缺乏专业领域知识与私有知识：** 对 LLM 进行微调来注入特定领域的知识成本高昂且效果有限。RAG 可以轻松地将模型与任何私有数据集（如公司内部文档、个人笔记）连接起来，使其成为一个领域专家。\n\n与微调相比，RAG 的优势是：知识更新成本低、可追溯性与可解释性更强、能降低幻觉，并且对于注入事实性知识的场景更具成本效益。\n\n## 2. 如果让你设计一个 AI 写科研综述/研究报告的系统，你怎么设计？\n\n你可以按这 7 层说：\n\n用户意图识别层：识别用户意图，是综述、竞争情报、靶点评估、临床方案草拟，还是文献问答。  \n规划层Planner：把任务拆成子问题，比如“检索范围”“纳入排除标准”“证据分层”“结果结构”。  \n检索层：同时查 公司数据库 / 专业权威数据源。  \n排序层：去重、时间过滤、质量评分、可信度打分。  \n分析层：对文献做主题聚类、观点对比、结论归纳、冲突证据标注。  \n生成层：按照目标格式输出，并给每一段挂来源。  \n校验层：检查引用是否真实、结论是否被证据支持、是否存在越权推断。\n\n\n\n先说大的架构上的参考2.1, 再说写论文细化场景的编排思考参考2.2\n\n## 2.1. 如果让你从 0 到 1 搭一个 AI ToC 后端服务，你会怎么拆：\n\n1. **接入层**\n\nAPI Gateway + 鉴权（JWT）+ 限流（用户/IP/设备）+ 灰度路由。长响应用 SSE/WebSocket，短请求走 HTTP。\n\n1. **编排层（Agent Runtime）**\n\n把流程做成状态机/图：意图识别 -> 检索/工具 -> 生成 -> 审核 -> 返回。每个节点有超时、重试、最大步数、熔断和降级。\n\n1. **模型层**\n\n模型路由（大模型/小模型切换）。\n\n1. **能力层**\n\nPrompt 模板中心、Tool 调用、RAG 检索服务（向量+关键词混检）。\n\n1. **数据层**\n\nMySQL（用户/订单/任务状态）、Redis（会话和缓存）、对象存储（文件/产物）、向量库（知识检索）。关键写操作必须幂等键，避免重试导致重复副作用。\n\n1. **安全与治理层**\n\n输入输出内容安全、提示词注入防护、工具白名单、最小权限、审计日志全链路可追溯。\n\n1. **可观测与运维层**\n\nMetrics + Logs + Traces 三件套；重点盯成功率、时延、成本、幻觉率、工具失败率。上线策略：可灰度、可监控、可回滚。\n\n\n\n\n\n## 2.2. 如果让你设计一个 AI 写论文/写报告的多步工作流，你会怎么拆？\n\n我会优先把它设计成 `workflow`，不是直接放任 Agent 自由发挥，最需要的是可控、可回溯、可评估。\n\nLangGraph状态机确保每步可回滚、可审计；多Agent协作胜过单Agent。\n\n我一般会拆成 6 步：\n\n1. **意图识别**\n\n先识别用户到底要什么，是综述、研究计划、竞品分析、资料整理，还是问答。这里要把输出格式、篇幅、语气、引用要求先定下来。\n\n1. **做规划**\n\n规划目标输出结构, 把问题拆成几个子任务, 多agent分工执行每个负责一节, 制定执行方案。\n\n1. **多agent并行- 资料召回(搜文献)**\n\n去文献库、知识库、内部资料里拿候选材料。这个环节通常会做向量检索、关键词检索和 rerank。\n\n1. **多agent并行- 证据筛选(分析数据)**\n\n对召回结果做去重、时间过滤、来源权重、可信度评分，把真正能用的证据留下来。\n\n1. **多agent并行- 内容生成(写稿)**\n\n根据目标结构输出正文，比如摘要、背景、方法、结论、对比表、建议。生成时要求让每一段都绑定证据。\n\n1. **后置校验(审稿)**\n\n检查引用是否真实、结论是否越界、格式是否符合要求。要把低置信度内容标出来给用户确认。必须多步 + 反思 + Human review\n\n### 额外加分点（展示你懂企业落地）\n\n- **可扩展**：支持多租户（不同医院独立实例）。\n- **评估指标**：临床准确率（与医生一致性>95%）、幻觉率<1%、处理速度、ROI（用户节省时间）。\n- **风险控制**：Agent只做“建议+证据链”；所有输出带来源溯源。\n\n\n\n\n\n## 3. 怎么降低“假引用”和幻觉？\n\n这是高频题，你可以这么答：\n\n“我会从四层做控制。  \n第一层是数据源控制：只允许白名单源进入关键链路，比如 PubMed、官方指南、临床试验注册库、专利库。  \n第二层是生成前约束：先抽证据再生成，要求引用 ID 先被检索系统验证。  \n第三层是生成后校验：检查引用是否存在、标题是否匹配、结论是否能被原文支撑。  \n第四层是结果展示约束：把‘事实’和‘模型推断’分开展示，对不确定内容明确标注。”\n\n\n**参考答案：**\n\n1. **降低幻觉：** RAG 通过提供事实依据，让回答有据可循。微调虽然能注入知识，但模型仍可能在不确定时产生幻觉。\n2. **衡量“事实性/幻觉水平”：**\n  - **基于知识库的 QA：** 构建一个问题集，其中每个问题的答案都可以从一个确定的知识源中找到。\n  - **对抗性问题：** 设计一些诱导模型产生幻觉的问题，比如询问关于不存在的人物或事件的信息。\n  - **评估方法：** 使用 LLM-as-a-Judge 或 Faithfulness 指标，判断生成答案是否与提供的源知识相符。\n\n## 4. 如果让你做评估体系，你怎么评？\n\n你答：\n\n“我会把评估拆成四层：  \n一是检索质量，看召回是否全、排序是否准、来源是否权威；  \n二是事实性，看结论和引用的一致性、引用真实性、是否越界推理；  \n三是任务完成度，看有没有真正回答用户的问题，而不是只给摘要；  \n四是用户价值，看节省了多少时间、是否能直接进入下游工作流。  \n如果是生产环境，我会做离线评估 + 人工专家抽检 + 线上行为指标结合。”\n\n\n**参考答案：**\n\n全面地评估一个 RAG 系统，必须将其拆分为**检索阶段**和**生成阶段**两个独立但又相互关联的部分进行评估。\n\n**第一阶段：检索性能评估（Retrieval Evaluation）**\n\n这个阶段的目标是评估检索器能否“找得对、找得全”。\n\n1. **上下文精确率（Context Precision）：** 衡量检索到的文档中有多少是真正与问题相关的。\n2. **上下文召回率（Context Recall）：** 衡量所有相关的文档中，有多少被检索器成功找回来了。\n3. **Hit Rate：** 检索到的文档中是否至少包含一个相关文档。\n4. **MRR：** 第一个相关文档排名的倒数的平均值。\n5. **nDCG@k：** 同时考虑检索结果的相关性等级和它们在结果列表中的排名。\n\n**第二阶段：生成性能评估（Generation Evaluation）**\n\n这个阶段的目标是评估 LLM 在给定上下文后，能否生成“忠实、准确、有用”的答案。\n\n1. **忠实度/可溯源性（Faithfulness / Groundedness）：** 生成的答案是否完全基于所提供的上下文，是否存在捏造或幻觉。\n2. **答案相关性（Answer Relevancy）：** 生成的答案是否直接、清晰地回答了用户的原始问题。\n3. **答案正确性（Answer Correctness）：** 答案中的信息是否事实准确。\n\n另外，对已上线的系统还要持续监控输入分布、输出质量、用户反馈和自动化评估结果，以应对数据漂移和模型漂移。\n\n## 5. Workflow 和 Agent，你会怎么选？\n\n参考答法：\n\n“我一般会从任务的稳定性和开放度来选。  \n如果任务路径相对固定，比如文献检索、摘要生成、引用整理、格式输出，这类场景我会优先选 workflow，因为更稳定、可控、好评估。  \n如果任务比较开放，用户目标不明确，需要系统自己拆步骤、决定调用哪些工具，那我会考虑 Agent。  \n所以我不会把 Agent 当成默认答案。生产环境里经常是 workflow 为主，Agent 为辅，用 Agent 去补 workflow 覆盖不到的部分。”\n\n## 7. 你会怎么降低幻觉？\n\n参考答法：\n\n“我会从系统层做，而不是只依赖 prompt。  \n第一层是数据源控制，只允许高可信来源进入关键链路。  \n第二层是检索增强，让模型尽量基于真实材料回答，而不是凭参数记忆。  \n第三层是生成约束，比如要求结构化输出、强制引用、区分事实和推断。  \n第四层是结果校验，检查引用真实性、标题匹配度、结论是否被证据支持。  \n如果场景再严一点，我还会加人工复核或者专家抽检。  \n我的理解是，降低幻觉本质上是一个系统设计问题，而不是一个 prompt 小技巧。”\n\n\n**参考答案：**\n\n1. RAG 通过提供具体的、相关的上下文，将 LLM 的回答“锚定”在这些事实依据上，显著降低了幻觉的产生。\n2. RAG 可以清晰地展示出答案是基于哪些源文档生成的，用户可以点击查看来源进行事实核查。\n3. **如何衡量“事实性/幻觉水平”：**\n  - **基于知识库的 QA：** 构建一个问题集，其中每个问题的答案都可以从一个确定的知识源（如 Wikipedia、公司内部文档、数据库）中找到。\n  - **对抗性问题：** 设计一些诱导模型产生幻觉的问题，比如询问关于不存在的人物或事件的信息。\n  - **评估方法：** 使用一个更强大的 LLM，让它判断生成的答案是否与提供的源知识相符或矛盾。\n\n## 8. 如果用户上传很多文档，你会怎么做知识库检索？\n\n参考答法：\n\n我会先做文档预处理，包括清洗、切分、元数据抽取和索引构建。  \n切分时不会只做机械 chunk，我会尽量结合段落、标题、语义边界来处理，避免上下文断裂。  \n然后是 embedding 建索引，召回时可以先做向量检索，再加关键词召回，最后用 rerank 提高相关性。  \n拿到检索结果后，再按时间、来源、主题去做二次筛选，把最相关的内容拼到上下文里。  \n如果要让用户信任结果，我还会把引用位置、原文片段和来源一起返回。\n\n\n**参考答案：**\n\n一个完整的 RAG 流水线可以分为两个主要阶段：**离线的数据准备（索引）阶段**和**在线的查询（推理）阶段**。\n\n**离线阶段：**\n\n1. 数据加载（Load）：从各种数据源加载原始文档。\n2. 文本切块（Split / Chunk）：将长文档切割成更小的、语义完整的文本块。\n3. 嵌入（Embed）：使用嵌入模型将每一个文本块转换成高维向量。\n4. 存储（Store）：将文本块内容及其向量存储到向量数据库。\n\n**在线阶段：**\n\n1. 用户提问（User Query）\n2. 查询嵌入（Embed Query）\n3. 向量检索（Retrieve）\n4. （可选）重排序（Re-rank）\n5. 增强与生成（Augment & Generate）\n\n文本切块策略没有唯一的最佳方案。实践中通常会从一个合理基线开始，然后通过评估检索质量，针对具体文档类型和查询场景进行迭代优化。有时甚至会采用多尺度切块策略，即同时索引不同大小的块，以应对不同粒度的查询。\n\n基础的向量检索之外，还可以使用混合搜索（BM25 + 向量检索）、重排序（Cross-Encoder）、多查询检索（Multi-Query Retrieval）等技术来提升检索质量。\n\n## 9. 如果让你用 Python 设计一个 AI 服务后端，你会怎么搭？\n\n参考答法：\n\n“我会优先用 FastAPI 来搭服务层，因为它比较适合做 AI 应用接口，开发效率高，也方便做异步。  \n数据层可以根据场景接 MySQL 或 Postgres，缓存和会话状态可以用 Redis。  \n如果有长任务，比如检索、生成报告、处理文件，我会引入异步任务机制，比如任务队列或者后台任务。  \n模型调用层我会单独封装，做统一的请求、重试、日志、限流和 fallback。  \n如果前端需要流式输出，我会提供 SSE 或 WebSocket。  \n另外我会比较关注可观测性，比如日志、trace、错误监控和 token 成本统计，因为 AI 服务上线后这些都很重要。”\n\n\n**参考答案：**\n\n前后端采用 React + FastAPI + LangChain + Chroma + SQLite + SQLModel 架构。\n\n我会优先用 FastAPI 来搭服务层，因为它比较适合做 AI 应用接口，开发效率高，也方便做异步。数据层可以根据场景接 MySQL 或 Postgres，缓存和会话状态可以用 Redis。如果有长任务，比如检索、生成报告、处理文件，我会引入异步任务机制，比如任务队列或者后台任务。模型调用层我会单独封装，做统一的请求、重试、日志、限流和 fallback。如果前端需要流式输出，我会提供 SSE 或 WebSocket。\n\n我用分层和契约两条线保证清晰度。分层上，API 层只处理入参校验和响应协议；Service 层负责业务编排和规则决策；Repository/Model 层只负责数据读写与实体映射；Workflow 层专注状态转移与节点执行。契约上，层间统一使用 DTO 和明确的错误码，不透传底层实现细节。这样即使替换 LLM、切换向量库或升级存储，也主要影响局部层，不会牵动整条链路，代码可维护性和可测试性都更高。\n\n## 10. 如果用户问一个很复杂的问题，Agent 怎么拆解任务？\n\n参考答法：\n\n“我会先让系统识别任务意图和最终目标，再把它拆成几个可执行的子问题。  \n每个子问题再匹配最适合的工具，比如检索、数据库查询、摘要、对比分析、格式化输出。  \n执行时我会尽量保留中间结果，避免模型每一步都从零开始想。  \n等所有子任务完成后，再把中间结果做聚合，统一生成最终答案。  \n同时我会设置边界，比如最大步骤数、工具调用白名单和失败回退逻辑，避免 Agent 无限制发散。”\n\n## 11. 你怎么理解 ToB 和 ToC 的差异？如果公司从 ToB 往 ToC 做，你觉得技术上会有什么变化？\n\n参考答法：\n\n“ToB 和 ToC 的重点不太一样。  \nToB 更看重专业能力、准确性、定制化和交付深度，很多时候功能不一定花哨，但要稳定、可信、能融入客户流程。  \nToC 更看重体验、易用性、响应速度、留存和增长。  \n如果公司从 ToB 往 ToC 做，我觉得技术上会更强调几个点：  \n第一，交互体验要更轻更顺滑；  \n第二，系统并发和成本控制会更敏感；  \n第三，用户路径要更短，不能太依赖复杂配置；  \n第四，评估指标会从交付成功扩展到留存、活跃和转化。  \n所以技术架构上可能要兼顾快速试错和规模化能力。”\n\n\n\nQ1：为什么选择LangGraph而不是CrewAI或AutoGen来编排医疗多Agent？\n回答要点：\nLangGraph是状态机（State Machine），每步状态（Task State）持久化到数据库，支持可回滚、可审计——医疗场景下必须满足HIPAA/NMPA审计要求。\nCrewAI适合快速原型，但状态管理弱；LangGraph支持循环边（cycles）+ Human-in-the-Loop，完美匹配我们第6步（Critic & Verifier）和第8步（Auditor）。\n\nQ2：如果某个Agent（比如Literature Retrieval）失败了，你的Workflow怎么处理？\n回答要点：\n用LangGraph的conditional edges + retry机制（内置exponential backoff）。\n第1步Gatekeeper Agent先做风险评估；失败时自动路由到Human-in-the-Loop节点，同时记录完整日志（Prompt + Output + Error）。\n医疗特有：如果检索不到最新指南，系统会标记“证据不足”\n\nQ3：如何保证整个流程严格遵守HIPAA/GDPR/NMPA，尤其是PHI处理？\n回答要点：\nTokenization + 最小化原则：Gatekeeper Agent（第1步）在入口就把患者姓名/MRN脱敏成Token，只有必要Agent能看到原始数据，且所有Agent运行在私有化/零保留（Zero-Retention）环境。\n每步输出都带audit trail（LangGraph的checkpointer自动保存），支持事后追溯。\n\nQ5：医疗场景下如何有效降低LLM幻觉？你们Workflow里具体用了哪些技术？\n回答要点：\n多Agent协作验证：第5步Writer生成后，第6步Critic Agent模拟“同行评审”（Cross-check文献、GRADE证据等级）。\n技术栈：RAG（实时抓PubMed）+ Tool Calling（调用真实数据库）+ Reflection Loop（让Agent自己反思3次）。\n指标：目标幻觉率<1%，通过Human + Automated Eval双重把关。\n\nQ8：如果输入包含医学影像或多模态数据（CT/MRI + 检验单），Workflow如何扩展？\n回答要点：\n在第3步增加Vision Agent（CheXagent类模型），输出结构化影像报告后合并到主流程。\nLangGraph支持多模态状态，无缝对接。\n\nQ12：你如何持续迭代优化这个Workflow？\n回答要点：\n每周收集医生Feedback → 自动触发RAG更新 + Agent Prompt优化。\n用LangSmith/LangGraph监控每个Agent的Latency & Success Rate，自动告警。\n","title":"03_垂直写作与审阅平台核心问答"},"05_项目表达/04_搜索推荐平台/01_核心问答.md":{"md":"# 04_搜索推荐平台核心问答\n\n## 使用说明\n\n- 本文件按公司或场景聚合相关面试题。\n- 优先保留原文表达和题目组织方式。\n\n## 1. 搜索推荐平台\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n\n### 原文内容\n\n最贴近的一篇公开面经，是 **“某出行与搜索平台 AI agent 开发日常实习面经”**。里面真被问到的题有：\n**3 分钟介绍项目、网络抖动和真实故障怎么区分、Agent 给出错误排障建议时怎么办（本质是幻觉治理）、RAG 检索准确率怎么统计、RAG 知识库系统全链路设计、Redis 三剑客、MySQL 为什么用 B+ 树**。发帖人还明确说了：**整体主要是场景题，八股只问了 Redis 和 B+ 树这两个点**。这套题型和“智能搜索”非常贴近。([牛客网](https://www.nowcoder.com/feed/main/detail/9b2042a59f2e4d7cb0b2b43ceda5cdbb))\n\n另一条更偏 **某出行与搜索平台 AI 方向 Java** 的公开面经，题会更全一些，基本可以当成你这次准备的高频池：\n**微调和 Prompt 工程区别、推理显存优化、怎么评估 hallucination、如何平衡推理速度和效果、RAG 全流程、参数调优和结果过滤、多轮对话上下文一致性、并发控制和请求排队、限流降级、数据库索引失效、接口幂等、统一异常返回、Redis 场景与穿透/击穿、微服务熔断、鉴权与防重放、慢接口定位、异步回调和超时控制、日志与监控告警**。这已经非常像“智能搜索后端/平台”会问的内容了。([牛客网](https://www.nowcoder.com/enterprise/652/interview))\n\n如果你面的是 **Java/后端偏智能搜索**，还要叠加某出行与搜索平台后端的常规深挖。公开后端面经里，某出行与搜索平台会问到：\n**项目架构、做过哪些架构升级、如何发布和兼容老版本、微服务通信、线程池参数怎么定、发布时恰好有任务在跑怎么处理、线程池执行过程、导出数据太大内存放不下怎么办、线上 OOM 排查、ThreadLocal 为什么会泄漏、Redis 底层和适用场景**，还会有一道算法题。另一篇实习后端面经里还出现了 **Redis 热 key、策略模式、单例模式**。([牛客网](https://www.nowcoder.com/discuss/784185543411109888?utm_source=chatgpt.com))\n\n更偏 **搜索/推荐/算法** 的公开帖子里，能看到的题型也很有参考价值：\n有人面 **某出行与搜索平台算法工程师（机器学习/运筹优化方向）** 时，笔试有 **LIS 变种做到 O(nlogn)、Dijkstra + 路径还原、贝叶斯定理、SVD**；技术面问了 **带权随机抽样、XGBoost vs LightGBM、推荐系统冷启动、拼车订单匹配建模、实时 ETA 系统设计、如何减少司机空驶率**。这条是社区用户帖，不能当官方题库，但对“某出行与搜索平台搜推/搜索”风格有参考价值。([牛客网](https://www.nowcoder.com/feed/main/detail/97156ae8ab3a45189326e3ab7d54cd5c))\n\n为什么我判断它会很看重 **ES / 检索性能 / 向量检索**？因为某出行与搜索平台自己公开过 ES 体系的规模：**内部所有在线检索场景统一跑在某出行与搜索平台 ES 引擎上，平台规模 3000+ 节点、5PB 数据、超过万亿条数据、峰值写入 TPS 达到 2000w/s、每天近 10 亿次检索查询**。同时，某出行与搜索平台 AI 开放平台也公开写过，它的 **句向量** 能力已经广泛用于 **语义搜索**，AI Labs 也长期布局 NLP、对话系统、智能助手、路线规划和 ETA 等方向。面到搜索岗，系统设计和性能题基本跑不掉。([公开技术文章](https://www.cnblogs.com))\n\n你可以把这次准备压缩成 4 组。\n\n**第一组：RAG / 智能搜索核心题**  \nRAG 全链路、召回/重排/生成怎么拆、检索准确率怎么评估、怎么处理幻觉、向量库索引怎么选、ES 和向量库怎么混合检索、缓存怎么做、延迟和成本怎么压。\n\n**第二组：Agent 工程化题**\n意图识别、任务规划、工具调用、上下文管理、异常回退、异步回调、请求排队、限流降级、日志监控、网络抖动和真实故障的区分。\n\n**第三组：Java 后端基础题**\nRedis、MySQL、索引失效、B+ 树、幂等、熔断、线程池、OOM、发布兼容、热 key、缓存击穿/穿透。([牛客网](https://www.nowcoder.com/feed/main/detail/9b2042a59f2e4d7cb0b2b43ceda5cdbb))\n\n**第四组：搜索/推荐算法与系统设计题**\n冷启动、召回/排序思路、带权随机、最短路、ETA/实时系统、在线学习、性能权衡。([牛客网](https://www.nowcoder.com/feed/main/detail/97156ae8ab3a45189326e3ab7d54cd5c))\n\n如果你只想要一版**最值得优先准备的 12 题**，我会建议你先把这几道准备熟：\n\n1. 讲清楚一个你做过的 **RAG / Agent / 搜索** 项目。\n2. **RAG 检索准确率**怎么评估。\n\n首先一个是对检索性能的评估，这边主要的目标是评估它，我们这个检索流程能否找的对和找找的全。评估首先需要构造一个有标注的数据集。然后呢，通过离线或在线的一些核心指标，\n\n**第一阶段：检索性能评估 (Retrieval Evaluation)** 这个阶段的目标是评估我们的检索器（Retriever）能否“**找得对、找得全**”。评估需要一个包含（问题，相关文档ID）的标注数据集。主要指标:\n\n1. **上下文精确率 (Context Precision):** 衡量检索到的文档中有多少是真正与问题相关的。它反映了**检索结果的信噪比**。Precision@K：TopK 中相关片段占比\n2. **上下文召回率 (Context Recall):** 衡量所有相关的文档中，有多少被我们的检索器成功找回来了。它反映了**信息查找的全面性**。Recall@K：所有正确证据被召回了多少\n3. Hit@K**:** TopK 里是否至少命中一个正确证据\n  **第二阶段：生成性能评估 (Generation Evaluation)** 这个阶段的目标是评估LLM在给定上下文后，能否生成“**忠实、准确、有用**”的答案。\n\n- **核心指标（通常需要LLM-as-a-Judge或人工评估）：**\n  1. **可溯源性/忠诚度 (Faithfulness / Groundedness):**\n    - **评估问题：** 生成的答案是否完全基于所提供的上下文？是否存在捏造或幻觉？\n  2. **答案相关性 (Answer Relevancy):**\n    - **评估问题：** 生成的答案是否直接、清晰地回答了用户的原始问题？\n  3. **答案正确性 (Answer Correctness):**\n    - **评估问题：** 答案中的信息是否事实准确？（这是一个更严格的指标，因为有时即使忠于原文，原文也可能是错的）\n- **自动化评估框架：**\n  - 像 **RAGAS**, **ARES**, **TruLens** 这样的开源框架，它们使用LLM-as-a-Judge的思想，将上述的Faithfulness, Relevancy等指标自动化计算出来，极大地提高了评估效率。例如，RAGAS会生成问题、答案，并自动检查答案是否忠实于上下文。\n\n1. **RAG幻觉治理**怎么做。\n\n一个是检索的时候提升检索质量。主要的思路可以是参考我们的召回通路，一个是用 query 改写，然后增强意图分类，然后使用多通路召回，比如说使用向量加 ES 的 BM25，文本匹配的混合。然后在检索中之后是在检索回来时候，会加一个 rerank 粗排过滤阶段。还可以再进一步引入模型侧的反思机制。我觉得信息不够，可以进行二阶段的检测。\n\n第二个是在生成时会有一些提升生成的效果的措施。一个是在 prompt 里明确指基于给定证据回答。还有一个是强制模型，强制著名引用的来源。然后就是生成后用一些评估手段来正确的评估它生成的质量，包括生成的整个忠忠诚度，包括正确性或者相关性这些指标。然后还要对生成的这个工程指标，包括幻觉率、引用率，这些做一个长期的监控。\n\n1. **网络抖动 vs 服务真实故障**怎么区分。\n2. **ES + 向量库**如何混合检索。\n3. 向量检索“**慢和贵**”怎么优化。\n\n- **延迟-慢：** RAG的“检索+生成”两步天然比直接调用LLM要慢。在实时交互场景下，检索和LLM生成的延迟都必须被极致优化。\n- **成本-贵：**\n  - **计算成本：** 大规模文档的嵌入、向量数据库的运行、LLM的API调用，都是持续的成本支出。\n  - **存储成本：** 向量索引本身会占用大量的存储空间，尤其是高维度的嵌入。\n- 优化思路: 就是整个把整个阶段拆成 Embedding 嵌入、 向量检索/存储、重排，这几大阶段，然后先找到最大的一个瓶颈。\n- 如果是 embedding 阶段太贵的话，可以换一个更便宜的模型。\n- 如果是 AN 阶段是在线阶段，如果觉得太慢的话，可以通过调 AN 的一些召回参数，在召回率和实验之间找到一个平衡点。\n- 向量存储的成本的话，可以通过一些压缩存储来降低内存和机器的成本。\n- 召回的时候混合检索，比如说 BM25加向量检索，减少纯向量误召回，能降低后续的重排成本。\n\n1. **Redis 三剑客**和典型使用场景。\n2. **MySQL 为什么用 B+ 树**。\n3. **数据库索引失效**怎么排查。\n\n先用 explain 看这个它的是否找到索引，以及扫描行数是否会比较异常的大。我再检查你这个 sql 的写法是否正确，是否有，是否会破坏索引或者走不到索引。如果思考没问题的话，再看一下是否走到那个联合索引的最左匹配查询。\n\n1. **接口幂等 + 限流 + 熔断**怎么设计。\n2. **异步回调与超时控制**怎么做。\n3. **高并发智能搜索服务**如何做缓存、队列、监控和降级。\n\n缓存这边就用多级缓存，本地缓存加 Redis 先挡住热点。缓存的对象一般是热门 query 的结果，或者热门倒排向量，或者 Top K。然后缓存钥匙，防雪崩防雪崩，加 TTL 抖动，防击穿，防穿透，缓存设计，减少掉带版本号，然后只支持版本的就是单向移动，然后避免是这个版本回退和脏数据。\n\n队列的话就是尽量的要缩短这个同步链路，就是长的任务一定要异步化，然后可以离线处理，就是一些大的任务尽量离线做处理。\n\n然后监控的话就是 Metrics、Logs、Traces 三件套。空。这是 QPS 呀，P99呀，超时率呀，稳定率呀，召回质量呀，CTR 呀，业务指标是 CTR 啊，机器资源是 CPU ，内存\n\n然后就是做业务降级，比如说是可以走一些次次要简单的本地逻辑，比如说对关键的召回，比如说走一个本地的降量质量分，或者是走一个本地的小型模型之类的。再或者就是走一些兜底缓存或者热门的结果。\n\n1.针对excel表格, rag召回质量不好, 有什么好的改进方法?\n\n- 不要按纯文本切块，要做“表格结构化切块”：sheet -> 表 -> 行 -> 单元格。\n- 每行都补齐表头语义，比如把行序列化成“日期=xxx, 客户=xxx, 金额=xxx”。\n- 做混合检索：关键词检索（BM25）+ 向量检索 + 元数据过滤（sheet、字段、日期）。\n- TopK 后加 rerank，减少“看起来相关但答非所问”的片段。\n\n2.Excel 表格里，它单个单元格的字段内容太多了，已经超过了切分长度了，这可以可以怎么处理呢？\n\n- 对“单元格内部”再分段（句子/段落级），不是硬截断。\n- 建两级索引：行级摘要索引 + 单元格明细索引。\n- 检索先命中摘要，再回源拉明细 chunk。\n- 超长字段可存“摘要向量 + 原文指针”，避免一次塞满上下文\n\n3.RAG 离线构建的时候，它那个要实时性的要求比较高，每次那个文档一改动，可能就需要全量的做 embedding 替换向量数据库，这个成本比较高，怎么解呢？\n\n- 用 chunk 级哈希做变更检测，只重算变更 chunk。\n- 向量库做 upsert/delete by chunk_id，不动未变部分。\n- 索引更新异步化（消息队列），读写解耦。\n- 做版本化索引，支持灰度切换，避免重建时服务抖动。\n\n4.我是想做增量更新的话，可可以有有可行性吗？因为它每次增量更新完，它的向量的整个排序都变化了，又得重新更新一遍，怎么解呢？\n\n- 通常不用。向量检索排序是查询时实时算相似度，不是全库预排序。\n- 实践上用“Base 索引 + Delta 增量索引”，查询时合并结果。\n- 只在低峰期做周期性 merge/compact，提升检索效率。\n- 只有在大规模分布变化时，才做全量重训或重建。\n\n5.但是用户可能有涉及到各类各式各样的问题，比如说是日期，用户想看，比如说过去某一天的一个当天的一个文档记录。但是呢，他这个文档上传 Word 的时候他就，那更新时间就不准了。那如果我那我只能去解析文档里的信息来提取出来这个日期了。但是这样的话，可能就要把全站所有的文档，可能有很大很大的文档都得全都提取，这样成本太高了。针对这个痛点可以怎么解呢？\n\n- 建“业务时间元数据”字段，不只依赖文件更新时间。\n- 只对新增和变更文档做抽取；历史库按热度异步回填。\n- 查询时先用日期索引粗筛，再对 TopN 候选做深度解析。\n- 抽取结果持久化并缓存，避免重复算。\n\n6.那如果这次建了元数据的需求是按日期搜索，下次日期就按作者或者其他新新的字段搜索，那是不是还得重重建索引呢？这有什么好的解法吗？\n\n**一般不需要重建向量索引**。  \n我们只需要把检索拆成两层：\n\n1. **语义层（向量索引）**\n  - 负责“内容相关性”，尽量稳定。\n  - 不因“按日期/按作者过滤”而变。\n2. **结构层（元数据索引）**\n  - 负责“字段过滤和排序”，比如 date/author/tag/region。\n  - 新字段上线时扩 schema + 回填该字段即可。\n\n实际查询流程：\n\n- 先按元数据筛候选（date=xxx、author=yyy）\n- 再在候选集做向量召回 + 重排  \n这样既快又准。\n\n","title":"04_搜索推荐平台核心问答"},"05_项目表达/05_大模型应用平台/01_核心问答.md":{"md":"# 05_大模型应用平台核心问答\n\n## 使用说明\n\n- 本文件按公司或场景聚合相关面试题。\n- 优先保留原文表达和题目组织方式。\n\n## 1. 大模型应用平台\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n我全网看下来，**“某大模型应用平台产品线的 Agent 开发一面”公开直接同名资料不算多**，但把 **某头部互联网公司 AI Agent 开发一面、某大模型应用平台大模型一面、某大模型应用平台后端/AI 后端一面、以及某大模型应用平台 Agent 相关 JD** 拼起来，画像已经比较清楚了：**一面最常见的是“项目深挖 + Agent/RAG 细节 + 一点模型基础 + 一点工程基础/手撕”**，而且面试官很爱连续追问，不太接受泛泛而谈。([牛客网](https://www.nowcoder.com/feed/main/detail/36f397670374455896bd05de6858c06a))\n\n**岗位侧重点**也比较明确。公开职位描述里，某大模型应用平台 Agent 技术研发会做 **Multi-Agent 框架、Memory 机制**，还会做 **UI-Agent、DeepResearch Agent**；另外某头部互联网公司的 Agent 相关岗位也明显要求你熟悉 **Agentic AI、RAG、Workflow、多 Agent 协作、模型效果与性能评估**。这意味着你今天下午这一面，大概率不会只问“会不会调 API”，而是会看你能不能把 Agent 做成完整系统。([BOSS直聘](https://m.zhipin.com/job_detail/41ac5d50f49e184503B_3d-1EVJU.html?utm_source=chatgpt.com))\n\n我建议你现在优先刷这 12 个问题，命中率最高：  \n1）你做的 Agent 为什么是这个架构，不是别的；  \n2）单 Agent 和多 Agent 怎么选，子 Agent 如何分工；  \n3）tool 调错时怎么兜底；  \n4）memory 怎么分层设计；  \n5）skills / MCP / RAG 各自解决什么问题；  \n6）上下文过长怎么处理；  \n7）知识库从入库到回答的完整链路；  \n8）多路召回怎么做权重和评估；  \n9）你们为什么选这个框架，比如 LangChain / LangGraph / 自研；  \n10）如何评测 Agent 效果；  \n11）你项目里最难的一个工程问题是什么；  \n12）一道常规算法题和一两个 Java/后端基础问题。这个清单是我根据多份某头部互联网公司/某大模型应用平台/Agent 一面真实问题汇总出来的。([牛客网](https://www.nowcoder.com/feed/main/detail/36f397670374455896bd05de6858c06a))\n\n如果你想要一个更直接的判断：**这一面最像“拿你的项目当主线，顺手检查你是不是真的懂 Agent 系统，而不是只会搭 demo”**。尤其某大模型应用平台 Agent 的 JD 本身就对 **Multi-Agent、Memory、DeepResearch/UI-Agent、评估与工程落地** 有明确要求，所以你的回答一定要从“系统怎么设计、为什么这么设计、怎么评估、怎么做稳定性和安全性”这几个维度展开。([BOSS直聘](https://m.zhipin.com/job_detail/41ac5d50f49e184503B_3d-1EVJU.html?utm_source=chatgpt.com))\n\n你现在最值钱的准备顺序是：**先把你最强项目用 3 分钟、8 分钟、15 分钟三种版本讲顺，再把 RAG、memory、tool calling、multi-agent、skills、评测体系 各准备一个标准答案，最后过一遍 Java/Redis/MySQL/算法手撕。** 这样最贴近我搜到的真实一面分布。([牛客网](https://www.nowcoder.com/feed/main/detail/36f397670374455896bd05de6858c06a))\n\n你要的话，我下一条直接给你做一份 **“某大模型应用平台 Agent 开发一面冲刺题 30 题 + 参考回答提纲”**。\n","title":"05_大模型应用平台核心问答"},"05_项目表达/06_AIGC内容平台/01_核心问答.md":{"md":"# 06_AIGC内容平台核心问答\n\n## 使用说明\n\n- 本文件按公司或场景聚合相关面试题。\n- 优先保留原文表达和题目组织方式。\n\n## 1. AIGC内容平台\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n你可以重点准备下面这套题库：\n\n讲一个你做过的复杂系统，怎么拆服务、做幂等、做降级。\n\nRedis 缓存击穿、雪崩、双写一致性怎么处理。\n\n- 双写一致性建议：**先更新 DB，再删除缓存**（不是更新缓存）。\n\nMySQL 索引、回表、MVCC、事务隔离在真实业务里怎么落地。\n\n- **事务隔离怎么选（先定一致性级别）**\n  - 读多写少、报表类：常用 READ COMMITTED，减少锁冲突。\n  - 交易/库存/余额：常用 REPEATABLE READ（MySQL 默认），必要时配合行锁与唯一约束。\n  - RR 能保证同一事务内快照读一致，避免读来读去结果变动。InnoDB 在 RR 下对 for update / update 走当前读+加锁，能抑制并发写冲突。\n  - **快照读 = 稳定看历史；当前读 = 锁住看现在并准备改。**\n\n\n\nKafka 如何保证至少一次、顺序、去重。\n\n跨地域多机房部署，如何做流量切换和容灾。\n\n海外/弱网环境下，接口超时、重试、熔断怎么设计。\n\nSSE、WebSocket、长轮询在 AI 流式返回里怎么选。\n\n大模型返回很慢或失败时，前后端怎么协同降级。\n\n异步任务/视频生成任务如何排队、取消、重试、回调。\n\n按“状态机 + 消息队列 + 回调投递器”来设计。\n\n前端提交视频生成请求后，先落任务表，任务状态从 CREATED 进入 QUEUED，投递进入消息队列, 再由 Worker 消费执行，进入 RUNNING，最终收敛到 SUCCEEDED / FAILED / CANCELED / TIMEOUT。\n\n排队 入队时按幂等键来去重, 按 优先级 + create_time 排序, 再根据租户做配额限制，避免大客户把全局资源打满。\n\n取消分两类：任务再排队中直接出队并置 CANCELED，任务已经在运行中走 CANCEL_REQUESTED，Worker在阶段边界轮询取消标记，安全释放GPU和临时文件。\n\n重试只针对可重试错误，比如超时、网络抖动，采用指数退避加抖动，并限制最大次数，超过阈值进死信队列。不可重试错误如参数非法、内容违规，直接失败。\n\n回调采用“至少一次”投递，带签名和时间戳做鉴权，失败重试并入回调死信队列；回调接收方业务方按 task_id/event_id 做幂等消费。\n\n如果做一个 Agent 创作助手，工作流怎么编排、状态怎么保存、怎么观测。\n\n工作流可以用推荐图或者状态机，大致包括这么几个节点。刚开始进来先是意图的识别，然后就是任务的规划。然后这就是分段执分段执行任务，分段执行过程中可以进行检索编排。然后再进行任务的审审校核对。然后就进行任务，如果核对不通过，可能要根据沈教的建议，再做一一版修改。之后是人工审核节点。然后是做任务的发布。\n\n状态怎么保存？状态可以理解为就是记忆。这里分短期记忆和长期记忆。短期记忆就是在一次上下文会话过程中需要使用的信息。它对，它可以保存到内存里，也可以保存到 Redis 里。如果是长期记忆的话，比如说用户的特用户的特征、行为方式，或者是专业知识类似的东西可以考虑存到向量检索，或者是买次口这样的关系型数据库里。对，如果是一些日志行为类的，可以像参考龙虾，存到本地的 MD 文件里。\n\n怎么观测？一般可观测的最小三件套，一个是 log 日志，一个是 metric 指标，然后是 trace 链路追踪这一套。然后具体的观测指标，一个是首先就是系统的稳定性、系统的延迟、P99、P95、CPU 之类的。然后还有一点就是成本的监控，就是 token token 的一个监控。然后是图片排的话，涉及到一些就是执行步骤，执行步数的一些监控。啊，其次还有是业务方向的监控，比如说是业务的成功率，超超时率、失败失败率、失败的错误码的分布情况。其次还有监控整个 Agent 的一个鲁棒性，就是在工具调用失败这个情况下，它是怎么弄呢？然后还观测 Agent 的一个主动性，就是它观察它需要人工介入的一个情况，以及观察它它的一个推理的过程，人工观察它的推理的过程是否符合逻辑，以及最后它如果它是按计划执行，它的执行的过程是否严格的遵守它的计划。\n\n算法:\n公开能看到的有“麻将算法实现”“会议室 II”等，说明它不是纯聊天式面试，通常会带至少一道编码题\n\n要。下面这版我按 **“某AIGC内容平台 Java / Agent / 服务端岗”** 来给你整理，优先基于公开能查到的爱诗面经和它当前公开岗位/产品特征来倒推。公开面经里高频出现的是 **项目深挖、Redis/MySQL/Kafka、高可用与跨地域部署、手写题**；而公司公开产品和岗位又明显带有 **视频生成、Agent 创作助手、API 平台、服务端/AIGC 后端** 的特点，所以面试大概率会是 **传统后端基础 + 场景设计 + 一点 AI 应用工程化** 的混合题型。\n\n你可以直接按这 30 题准备。\n\n## 一、项目深挖题\n\n1. **讲一个你做过的最复杂、最能体现价值的项目。**\n  答题抓手：业务背景、核心指标、你的职责、技术难点、结果提升。别平铺直叙，要能讲出“为什么难”。\n2. **这个项目里，你做的部分如果拿掉，会发生什么？**\n  答题抓手：证明你不是打杂。讲你负责链路的不可替代性，比如核心接口、核心模块、核心优化。\n3. **项目里最难的一次故障是什么？你怎么定位和止损？**\n  答题抓手：现象、排查路径、根因、止血、复盘、长期治理。要体现工程负责人思维。\n4. **如果现在让你重做一次这个项目，你会怎么改架构？**\n  答题抓手：说出当时的局限，再给出升级方案，比如异步化、缓存分层、配置中心、观测补齐。\n5. **你在项目里做过最有技术含量的优化是什么？**\n  答题抓手：最好讲性能、稳定性、成本、吞吐四选一，给出前后对比数据。\n6. **项目里做过哪些 trade-off？为什么没选别的方案？**\n  答题抓手：体现成熟度。比如强一致 vs 最终一致、同步 vs 异步、自研 vs 现成组件。\n\n## 二、Java / MySQL / Redis / MQ 基础设施题\n\n1. **MySQL 索引为什么能加速？什么情况下会失效？**\n  答题抓手：B+ 树、回表、覆盖索引、最左匹配、范围查询、函数操作导致失效。\n2. **MVCC 是什么？你怎么解释 Read View？**\n  答题抓手：版本链、undo log、快照读、当前读。不要只背定义，最好结合你业务里的事务场景说。\n3. **事务隔离级别怎么选？你真实工作里用到过哪些？**\n  答题抓手：不要只说四个级别，讲清在库存、营销、账户这种场景里怎么选。\n4. **Redis 常用数据结构分别适合什么场景？**\n  答题抓手：String、Hash、List、Set、ZSet、Bitmap、HyperLogLog。最好带真实业务例子。\n5. **Redis 缓存击穿、穿透、雪崩分别怎么处理？**\n  答题抓手：互斥锁、逻辑过期、布隆过滤器、随机过期时间、热点隔离、降级兜底。\n6. **Redis 和 MySQL 双写一致性怎么保证？**\n  答题抓手：延迟双删、binlog 订阅、消息队列异步刷新、读写路径隔离。要敢讲“不可能绝对强一致”。\n7. **Redis 哨兵和 Cluster 分别解决什么问题？**\n  答题抓手：高可用 vs 横向扩展；主从切换、槽位分片、客户端路由。\n8. **Kafka 怎么保证消息不丢、不重、不乱？**\n  答题抓手：生产幂等、acks、ISR、消费者提交 offset、业务幂等、分区有序。\n9. **消息队列消费失败怎么处理？**\n  答题抓手：重试、死信队列、补偿任务、人工介入、幂等键设计。\n10. **你会怎么设计一个支持优雅停机的消费者？**\n  答题抓手：停止拉取、消费完手头消息、提交 offset、释放资源、优雅关闭线程池。这个方向在公开面经里出现过。\n\n## 三、高可用 / 系统设计题\n\n1. **如果服务部署在多地域机房，怎么做容灾切流？**\n  答题抓手：DNS/GSLB、入口层切流、配置中心、灰度、流量染色、降级开关。公开面经里有“新加坡机房挂了怎么切”的类似题。\n2. **跨地域调用延迟高、抖动大，你怎么保证链路稳定？**\n  答题抓手：就近接入、异步化、超时重试、熔断、批处理、缓存前置。\n3. **高并发接口突然被打爆，你的止血顺序是什么？**\n  答题抓手：限流、降级、缓存、扩容、隔离、熔断。要有“先保核心链路”的意识。\n4. **如何设计一个高可用的异步任务平台？**\n  答题抓手：任务状态机、重试策略、优先级队列、幂等、取消、回调、失败补偿。\n5. **配置更新如果不能靠 Redis pub/sub 强一致分发，你会怎么做？**\n  答题抓手：配置中心长轮询、版本号、灰度发布、本地缓存、强校验。这个思路在公开 Go 面经里有类似影子。\n6. **如果一个外部依赖服务很慢，但又不能完全去掉，怎么设计调用链？**\n  答题抓手：超时、重试、隔离线程池、熔断、缓存快照、兜底数据。\n7. **如何做接口幂等？不同业务类型有何不同？**\n  答题抓手：token、防重表、唯一索引、状态机、消息去重。最好用支付、任务提交、批处理举例。\n8. **怎么设计可观测性，才能快速定位线上问题？**\n  答题抓手：日志、指标、trace、告警、链路 ID、错误码分层、关键业务埋点。\n\n## 四、AI / Agent / 视频生成后端题\n\n1. **如果让你做一个“视频生成任务平台”，后端核心模块怎么拆？**\n  答题抓手：任务接入层、参数校验、队列调度、模型服务编排、素材存储、回调通知、计费额度、审计日志。爱诗公开产品和岗位都明显会碰到这类问题。\n2. **视频生成往往耗时很长，前端如何实时看到进度？**\n  答题抓手：任务状态机 + 轮询 / SSE / WebSocket；阶段进度、失败原因、取消、重试。公开面经里 AI 流式交互题不少。\n3. **SSE、WebSocket、长轮询，做 AI 流式返回时你怎么选？**\n  答题抓手：单向推流优先 SSE，双向实时交互用 WebSocket，兼容差时再考虑轮询。顺手讲代理层、断线重连、背压。\n4. **如果做一个 Agent 创作助手，你怎么设计工作流？**\n  答题抓手：用户意图解析、提示词优化、素材收集、镜头规划、模型选择、任务编排、结果评估、人工回改。你做过 Agent，要把 LangGraph/状态图经验讲进去。\n5. **多模型协同生成时，怎么做失败重试和成本控制？**\n  答题抓手：路由策略、fallback、预算控制、质量分层、缓存中间结果、按场景选模型。\n6. **怎么评估一个 AI 创作 Agent 做得好不好？**\n  答题抓手：任务完成率、平均生成时长、失败率、用户二次编辑率、满意度、成本、复用率。别只说准确率。\n\n## 五、你最该重点背熟的 5 道“高命中题”\n\n如果你时间不够，先把这 5 道准备到能讲 3 到 5 分钟：\n\n**第一道：讲你做过的最复杂项目。**\n要讲成“我能扛系统”。\n\n**第二道：Redis 和 MySQL 一致性怎么保证。**\n这是后端厂高频里的高频。\n\n**第三道：多机房 / 海外部署如何做容灾切流。**\n这很像爱诗会问的场景题。\n\n**第四道：如何设计一个视频生成异步任务系统。**\n这是你把 Java 后端经验翻译成 AI 应用能力的关键。\n\n**第五道：如果做一个 Agent 创作助手，你的状态机/workflow 怎么设计。**\n这是你和普通 Java 候选人拉开差距的题。\n\n## 六、你回答时最容易踩的坑\n\n第一，**只讲技术点，不讲业务价值**。\n爱诗这种公司不太吃“我会八股”，更想知道你能不能把系统做成产品能力。\n\n第二，**把 AI 讲得太虚**。\n别空谈“大模型很强”。你要落到：任务编排、状态机、异步调度、流式返回、失败补偿、成本控制。\n\n第三，**项目深挖讲不出取舍**。\n成熟工程师一定要能说出“为什么不用另一个方案”。\n\n第四，**没有把 Java 经验翻译成 AI 经验**。\n你原来做搜索、营销、规则、工作流，这些都可以转译成 Agent 的记忆、规划、工具链、编排和评测。\n\n## 七、你可以直接背的一段自我定位\n\n你开场可以这么说：\n\n“我本身是偏平台和复杂系统的后端研发，长期做 Java、分布式、搜索/营销相关系统。最近一段时间我把能力重点延伸到了 AI 应用工程化，自己从 0 到 1 做过基于 LangGraph + RAG 的智能体项目。我的优势不是只会调模型，而是能把 AI 能力真正做成稳定可上线的服务，包括工作流编排、异步任务、缓存与存储、可观测、失败重试和成本控制。”\n\n这段话的作用，是让面试官一开始就把你归到 **“能做 AI 应用后端的人”**，而不是普通 Java。\n\n你要的话，我下一条直接给你出一版 **“某AIGC内容平台 60 分钟模拟面试”**，我来当面试官，一题一题问你。\n","title":"06_AIGC内容平台核心问答"},"05_项目表达/07_综合场景题/01_核心问答.md":{"md":"# 07_综合场景题核心问答\n\n## 使用说明\n\n- 本文件按公司或场景聚合相关面试题。\n- 优先保留原文表达和题目组织方式。\n\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n场景题:\n\n设计一个抢红包的系统，1、规则同wx红包，2、可以设置红包的权限，3、考虑数据量+并发\n\nGateway -> 红包服务(无状态) -> Redis Cluster(高并发原子扣减) -> MQ -> 账务服务 -> MySQL(主存)\n\n- Redis负责“抢红包瞬时并发”\n- MQ解耦削峰，避免直接打库\n- MySQL负责“最终账务与审计”\n\n\n\n## 补充：如果让你从 0 到 1 搭一个 AI ToC 后端服务，你会怎么拆\n\n### 资料说明\n\n- 本节内容来自个人面试资料的重组整理与公开资料归纳。\n### 原文内容\n\n1. **接入层**  \nAPI Gateway + 鉴权（JWT）+ 限流（用户/IP/设备）+ 灰度路由。  \n长响应用 SSE/WebSocket，短请求走 HTTP。\n\n2. **编排层（Agent Runtime）**  \n把流程做成状态机/图：意图识别 -> 检索/工具 -> 生成 -> 审核 -> 返回。  \n每个节点有超时、重试、最大步数、熔断和降级。\n\n3. **模型层**  \n模型路由（大模型/小模型切换）。\n\n4. **能力层**  \nPrompt 模板中心、Tool 调用、RAG 检索服务（向量+关键词混检）。\n\n5. **数据层**  \nMySQL（用户/订单/任务状态）、Redis（会话和缓存）、对象存储（文件/产物）、向量库（知识检索）。  \n关键写操作必须幂等键，避免重试导致重复副作用。\n\n6. **安全与治理层**  \n输入输出内容安全（涉政/涉黄/隐私）、提示词注入防护、工具白名单、最小权限、审计日志全链路可追溯。\n\n7. **可观测与运维层**  \nMetrics + Logs + Traces 三件套；重点盯成功率、时延、成本、幻觉率、工具失败率。  \n上线策略：可灰度、可监控、可回滚。\n","title":"07_综合场景题核心问答"},"05_项目表达/README.md":{"md":"# 05_项目表达\n\n## 主题索引\n\n- [01_AI应用平台](01_AI应用平台/01_核心问答.md)\n- [02_交易Agent与风控平台](02_交易Agent与风控平台/01_核心问答.md)\n- [03_垂直写作与审阅平台](03_垂直写作与审阅平台/01_核心问答.md)\n- [04_搜索推荐平台](04_搜索推荐平台/01_核心问答.md)\n- [05_大模型应用平台](05_大模型应用平台/01_核心问答.md)\n- [06_AIGC内容平台](06_AIGC内容平台/01_核心问答.md)\n- [07_综合场景题](07_综合场景题/01_核心问答.md)\n\n## 说明\n\n- 本目录承接项目口述、场景化追问和实战题整理。\n- 场景题按业务方向聚合，便于按场景专项冲刺。\n- 这些内容也可以继续反向补入 AI / 后端 / 系统设计主题目录。\n- 内容已统一匿名化成场景版，不代表任何官方题库、真实面试流程或内部资料。\n","title":"05_项目表达"},"README.md":{"md":"# interview_prep\n\n这是这套面试资料库的主入口。\n目标不是堆零散题目，而是把 Java 后端、AI Agent、系统设计、算法和项目表达资料重组为**适合复习、口述和追问展开**的结构。\n\n## 先看什么\n\n如果你第一次进入这套资料，建议按这个顺序：\n\n1. 先看 [00_导航/README.md](00_导航/README.md)\n2. 再看 [总索引](00_导航/总索引.md)\n3. 最后进入你当前最需要的方向目录\n\n如果你时间有限，最短路径是：\n\n- Java 后端转 Agent：先看 `01_AI`，再补 `02_后端`\n- 后端面试冲刺：先看 `02_后端`，再刷 `03_系统设计`\n- 项目口述强化：直接进 `05_项目表达`\n\n## 这套资料怎么组织\n\n统一按下     out.push('<p>' + inline(para.map(l => l.trim()).join('\n'), ctx).replace(/\n/g, '<br>') + '</p>');
    para = [];
  };
  while (i < lines.length) {
    const l = lines[i];
    let m;
    if (!l.trim() || RE.anchor.test(l)) { flush(); i++; continue; }
    if ((m = l.match(RE.fence))) {
      flush();
      const fence = m[1], ind = indentOf(l), buf = [];
      i++;
      while (i < lines.length && !isFenceEnd(lines[i], fence)) {
        buf.push(lines[i].slice(Math.min(ind, indentOf(lines[i]))));
        i++;
      }
      i++;
      out.push(codeBlock(buf.join('\n'), m[2]));
      continue;
    }
    if ((m = l.match(RE.heading))) { flush(); out.push(heading(m[1].length, m[2], ctx)); i++; continue; }
    if (RE.hr.test(l)) { flush(); out.push('<hr>'); i++; continue; }
    if (l.includes('|') && i + 1 < lines.length && lines[i + 1].includes('|') && RE.tableSep.test(lines[i + 1])) {
      flush(); i = table(lines, i, out, ctx); continue;
    }
    if (RE.quote.test(l)) {
      flush();
      const buf = [];
      while (i < lines.length && RE.quote.test(lines[i])) buf.push(lines[i++].replace(RE.quote, ''));
      out.push('<blockquote>' + blocks(buf, ctx) + '</blockquote>');
      continue;
    }
    if (RE.item.test(l)) { flush(); i = list(lines, i, out, ctx); continue; }
    para.push(l);
    i++;
  }
  flush();
  return out.join('\n');
}

function heading(lvl, raw, ctx) {
  const id = uniqueId(ctx, raw);
  ctx.headings.push({ lvl, text: plain(raw), id });
  return `<h${lvl} id="${esc(id)}">${inline(raw, ctx)}</h${lvl}>`;
}

function codeBlock(code, lang) {
  code = code.replace(/^\n+|\n+$/g, '');
  return `<div class="code"><div class="code-bar"><span>${esc(lang || 'text')}</span><button class="copy" type="button">复制</button></div><pre><code>${esc(code)}</code></pre></div>`;
}

function splitRow(l) {
  let s = l.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
  return s.split(/(?<!\\)\|/).map(c => c.trim());
}

function table(lines, i, out, ctx) {
  const head = splitRow(lines[i]);
  const aligns = splitRow(lines[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : '');
  i += 2;
  const rows = [];
  while (i < lines.length && lines[i].trim() && lines[i].includes('|')) rows.push(splitRow(lines[i++]));
  const cell = (tag, c, k) => `<${tag}${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${inline(c, ctx)}</${tag}>`;
  out.push('<div class="table-wrap"><table><thead><tr>' + head.map((c, k) => cell('th', c, k)).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + head.map((_, k) => cell('td', r[k] || '', k)).join('') + '</tr>').join('') + '</tbody></table></div>');
  return i;
}

// 列表：按缩进归属子内容，递归渲染；兼容仓库里 2/4 空格混用的嵌套
function list(lines, i, out, ctx) {
  const first = lines[i].match(RE.item);
  const base = first[1].length;
  const ordered = /\d/.test(first[2]);
  const items = [];
  while (i < lines.length) {
    const m = lines[i].match(RE.item);
    if (!m || m[1].length < base || /\d/.test(m[2]) !== ordered) break;
    const ind = m[1].length;
    const contentInd = ind + m[2].length + Math.min(m[3].length, 4);
    const body = [m[4]];
    let blank = false;
    i++;
    while (i < lines.length) {
      const ln = lines[i];
      if (!ln.trim()) { body.push(''); blank = true; i++; continue; }
      const li = indentOf(ln);
      if (li > ind) { body.push(ln.slice(Math.min(li, contentInd))); blank = false; i++; continue; }
      if (blank || RE.item.test(ln) || RE.heading.test(ln) || RE.fence.test(ln) || RE.hr.test(ln) || RE.quote.test(ln)) break;
      body.push(ln.trim()); // 惰性续行
      i++;
    }
    while (body.length && !body[body.length - 1].trim()) body.pop();
    items.push(body);
  }
  const start = ordered ? parseInt(first[2], 10) : 1;
  const tag = ordered ? 'ol' : 'ul';
  out.push(`<${tag}${ordered && start !== 1 ? ` start="${start}"` : ''}>` +
    items.map(b => '<li>' + blocks(b, ctx).replace(/^<p>([\s\S]*?)<\/p>/, '$1') + '</li>').join('') + `</${tag}>`);
  return i;
}

function emph(s) {
  return s
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w])__(?=\S)([\s\S]*?\S)__(?!\w)/g, '$1<strong>$2</strong>')
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>')
    .replace(/(^|[^*\w])\*(?=[^\s*])([^*\n]*?[^\s*])\*(?![*\w])/g, '$1<em>$2</em>');
}

function inline(src, ctx) {
  const keep = [];
  const hold = html => '\u0001' + (keep.push(html) - 1) + '\u0002';
  let s = src.replace(/(`+)([^`]|[^`][\s\S]*?[^`])\1(?!`)/g, (_, t, c) => hold('<code>' + esc(c.replace(/^ ([\s\S]*) $/, '$1')) + '</code>'));
  s = s.replace(/\\([\\`*_{}[\]()#+\-.!|~<>])/g, (_, c) => hold(esc(c)));
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^&]*?&quot;)?\)/g, (_, alt, url) =>
    /^(https?:|data:image\/)/i.test(url) || !/^[a-z]+:/i.test(url) ? hold(`<img src="${url}" alt="${alt}" loading="lazy">`) : alt);
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;[\s\S]*?&quot;)?\)/g, (_, text, url) => hold(link(emph(text), url, ctx)));
  s = s.replace(/(^|[^\w/"=])(https?:\/\/[^\s<>\u0001\u0002（）()，。；、]+)/g, (_, pre, url) => {
    const tail = (url.match(/[.,;:!?]+$/) || [''])[0];
    url = url.slice(0, url.length - tail.length);
    return pre + hold(`<a href="${url}" target="_blank" rel="noopener">${url}</a>`) + tail;
  });
  s = emph(s);
  while (/\u0001\d+\u0002/.test(s)) s = s.replace(/\u0001(\d+)\u0002/g, (_, k) => keep[+k]);
  return s;
}

function resolvePath(base, rel) {
  const parts = base.split('/').slice(0, -1);
  for (const seg of rel.split('/')) {
    if (!seg || seg === '.') continue;
    if (seg === '..') { if (!parts.length) return null; parts.pop(); } else parts.push(seg);
  }
  return parts.join('/');
}

function link(text, url, ctx) {
  url = url.replace(/&amp;/g, '&');
  if (/^(https?:|mailto:)/i.test(url)) return `<a href="${esc(url)}" target="_blank" rel="noopener">${text}</a>`;
  if (/^[a-z][\w+.-]*:/i.test(url)) return text; // 其它协议（如 javascript:）不渲染为链接
  if (url.startsWith('#')) return `<span class="dead-link">${text}</span>`;
  let p = url.split('#')[0];
  try { p = decodeURIComponent(p); } catch (e) { /* 保持原样 */ }
  const target = resolvePath((ctx && ctx.path) || '', p);
  if (target != null) {
    if (DOCS[target]) return `<a href="${docHref(target)}">${text}</a>`;
    const readme = (target ? target.replace(/\/$/, '') + '/' : '') + 'README.md';
    if (DOCS[readme]) return `<a href="${docHref(readme)}">${text}</a>`;
  }
  return `<span class="dead-link" title="${esc(url)}">${text}</span>`;
}

/* ======================================================================
 * 文档扫描：标题、问题卡片、统计
 * ==================================================================== */
const scanCache = {};
function scan(path) {
  if (scanCache[path]) return scanCache[path];
  const lines = normalize(DOCS[path].md).split('\n');
  const heads = [];
  const ctx = { ids: {} };
  let fence = null;
  lines.forEach((l, i) => {
    if (fence) { if (isFenceEnd(l, fence)) fence = null; return; }
    const f = l.match(RE.fence);
    if (f) { fence = f[1]; return; }
    const m = l.match(RE.heading);
    if (m) heads.push({ lvl: m[1].length, text: plain(m[2]), id: uniqueId(ctx, m[2]), line: i });
  });
  return (scanCache[path] = { lines, heads });
}

const META_RE = /^(使用说明|资料说明|原文内容|题目列表|主题题单|说明|目录|一句话总结)$/;
const PSEUDO_RE = /^\*\*([^*][^\n]*?)\*\*\s*$/;
const cleanQ = t => t.replace(/^\d+(\.\d+)*[.、．)）]?\s*/, '').replace(/^(子问题|主干问题|问|追问)[:：]\s*/, '').trim();

// 用整行加粗（如 **1）Agent 架构怎么设计**）充当小标题的写法，拆成独立卡片
function splitPseudo(bodyLines) {
  const pre = [], parts = [];
  let cur = null, fence = null;
  for (const l of bodyLines) {
    if (fence) { if (isFenceEnd(l, fence)) fence = null; (cur ? cur.lines : pre).push(l); continue; }
    const f = l.match(RE.fence);
    if (f) fence = f[1];
    const m = !f && l.match(PSEUDO_RE);
    if (m && plain(m[1]).length <= 60) { cur = { q: plain(m[1]).replace(/[：:]\s*$/, ''), lines: [] }; parts.push(cur); }
    else (cur ? cur.lines : pre).push(l);
  }
  return { pre, parts };
}

const cardCache = {};
function cardsOf(path) {
  if (cardCache[path]) return cardCache[path];
  const { lines, heads } = scan(path);
  const topic = TOPIC_BY_PATH[path];
  const cards = [];
  const stack = [];
  if (topic) heads.forEach((h, j) => {
    while (stack.length && stack[stack.length - 1].lvl >= h.lvl) stack.pop();
    const q = cleanQ(h.text);
    const meta = META_RE.test(q);
    const next = heads[j + 1];
    const leaf = !next || next.lvl <= h.lvl;
    if (h.lvl >= 2 && h.lvl <= 4 && leaf && q) {
      const bodyLines = lines.slice(h.line + 1, next ? next.line : lines.length).filter(l => !RE.anchor.test(l));
      const crumbs = stack.filter(s => s.lvl >= 2 && !s.meta && s.q).map(s => s.q);
      const push = (question, body, extra) => cards.push(Object.assign({ id: path + '|' + h.id, path, topic, q: question, body, anchor: h.id, crumbs }, extra));
      const { pre, parts } = splitPseudo(bodyLines);
      if (parts.length >= 2) {
        const preText = pre.join('\n').trim();
        if (!meta && preText) push(q, preText);
        parts.forEach(p => {
          const body = p.lines.join('\n').trim();
          if (body) push(cleanQ(p.q) || p.q, body, {
            id: path + '|' + h.id + '|' + uniqueId({ ids: {} }, p.q),
            crumbs: meta ? crumbs : crumbs.concat(q),
            mark: p.q.slice(0, 24),
          });
        });
      } else {
        const body = bodyLines.join('\n').trim();
        if (!meta && body) push(q, body);
      }
    }
    stack.push({ lvl: h.lvl, q, meta });
  });
  return (cardCache[path] = cards);
}

const PROBLEM_RE = /^\s*[-*+]\s+`(\d+)`\s+(.+?)\s*$/gm;
function statsOf(path) {
  const md = DOCS[path].md;
  return {
    chars: md.replace(/[\s#*`>|\-_=~]/g, '').length,
    cards: cardsOf(path).length,
    problems: (md.match(PROBLEM_RE) || []).length,
  };
}

function radialMap() {
  const R1 = 118, R2 = 250, GAP = 1.2;
  const N = TOPICS.length + DIRS.length * GAP;
  const maxC = Math.max(1, ...TOPICS.map(t => t.stats.chars));
  const P = (a, r) => [+(Math.cos(a) * r).toFixed(1), +(Math.sin(a) * r).toFixed(1)];
  const leaves = [];
  let s = GAP / 2;
  DIRS.forEach(d => {
    d.topics.forEach(t => { leaves.push({ t, a: -Math.PI / 2 + (s + .5) / N * Math.PI * 2 }); s += 1; });
    s += GAP;
  });
  let links = '', dirs = '', leafs = '';
  DIRS.forEach(d => {
    const ls = leaves.filter(l => l.t.dir === d);
    if (!ls.length) return;
    const a = (ls[0].a + ls[ls.length - 1].a) / 2;
    const [dx, dy] = P(a, R1);
    const mid = (R1 + R2) / 2;
    const [c1x, c1y] = P(a, mid);
    links += `<path class="lk" data-dir="${esc(d.key)}" d="M0,0L${dx},${dy}" style="stroke:${d.color}"/>`;
    ls.forEach(l => {
      const [c2x, c2y] = P(l.a, mid), [x2, y2] = P(l.a, R2);
      links += `<path class="lk" data-dir="${esc(d.key)}" data-path="${esc(l.t.path)}" d="M${dx},${dy}C${c1x},${c1y} ${c2x},${c2y} ${x2},${y2}" style="stroke:${d.color}"/>`;
    });
    const w = Math.round(textW(d.name, 14) + 24);
    const dtip = tipHtml(d.name, [['主题', d.topics.length], ['问题卡片', sum(d.topics, t => t.stats.cards)], ['字数', fmt(sum(d.topics, t => t.stats.chars))]]);
    dirs += `<a class="dir-node" href="#/dir/${encodeURIComponent(d.key)}" data-dir="${esc(d.key)}" data-tip="${esc(dtip)}">` +
      `<rect x="${dx - w / 2}" y="${dy - 14}" width="${w}" height="28" rx="14" style="stroke:${d.color}"/>` +
      `<text x="${dx}" y="${dy}" text-anchor="middle" dominant-baseline="central">${esc(d.name)}</text></a>`;
  });
  leaves.forEach(({ t, a }) => {
    const [x, y] = P(a, R2);
    const r = +(3.5 + 6.5 * Math.sqrt(t.stats.chars / maxC)).toFixed(1);
    const deg = a * 180 / Math.PI;
    const flip = Math.cos(a) < -1e-6;
    const [lx, ly] = P(a, R2 + r + 7);
    leafs += `<a class="leaf" href="${docHref(t.path)}" data-dir="${esc(t.dir.key)}" data-path="${esc(t.path)}" data-tip="${esc(topicTip(t))}">` +
      `<circle class="hit" cx="${x}" cy="${y}" r="15"/>` +
      `<circle class="pt" cx="${x}" cy="${y}" r="${r}" style="fill:${t.dir.color}"/>` +
      `<text x="${lx}" y="${ly}" transform="rotate(${(flip ? deg + 180 : deg).toFixed(1)} ${lx} ${ly})" text-anchor="${flip ? 'end' : 'start'}" dominant-baseline="central">${esc(t.name)}</text></a>`;
  });
  return `<svg viewBox="-410 -410 820 820" role="img" aria-label="知识地图：${DIRS.length} 个方向、${TOPICS.length} 个主题">
    <g>${links}</g>
    <g class="root"><circle r="46"/><text y="-9" text-anchor="middle" dominant-baseline="central">Agent</text><text y="10" text-anchor="middle" dominant-baseline="central">Offer</text></g>
    <g>${dirs}</g><g>${leafs}</g></svg>`;
}

function bindMap() {
  const map = $('#map');
  if (!map) return;
  const els = $$('.lk, .leaf, .dir-node', map);
  const highlight = pred => {
    map.classList.toggle('dim', !!pred);
    els.forEach(el => el.classList.toggle('hl', !!pred && pred(el)));
  };
  const onEnter = e => {
    const leaf = e.target.closest('.leaf'), dn = e.target.closest('.dir-node');
    if (leaf) {
      const p = leaf.dataset.path, dk = leaf.dataset.dir;
      highlight(el => el.dataset.path === p || (el.dataset.dir === dk && (el.classList.contains('dir-node') || (el.classList.contains('lk') && !el.dataset.path))));
    } else if (dn) {
      const dk = dn.dataset.dir;
      highlight(el => el.dataset.dir === dk);
    }
  };
  map.addEventListener('mouseover', onEnter);
  map.addEventListener('focusin', onEnter);
  map.addEventListener('mouseout', e => {
    const g = e.target.closest('.leaf, .dir-node');
    if (g && !g.contains(e.relatedTarget)) highlight(null);
  });
  map.addEventListener('focusout', () => highlight(null));
}

function decorateProblems(root) {
  $$('li', root).forEach(li => {
    const code = li.firstChild;
    if (!code || code.nodeName !== 'CODE' || !/^\d+$/.test(code.textContent)) return;
    li.classList.add('problem');
    li.parentElement.classList.add('problems');
    const name = li.textContent.replace(/^\d+\s*/, '').trim();
    li.insertAdjacentHTML('beforeend', `<a class="lc" href="https://leetcode.cn/problemset/?search=${encodeURIComponent(name)}" target="_blank" rel="noopener">搜题 ↗</a>`);
  });
}

function applyMarks(root, terms) {
  if (!root) return [];
  $$('mark.hit', root).forEach(m => m.replaceWith(document.createTextNode(m.textContent)));
  root.normalize();
  if (!terms || !terms.length) return [];
  const re = new RegExp(terms.map(escRe).join('|'), 'gi');
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  const marks = [];
  nodes.forEach(n => {
    const s = n.nodeValue;
    re.lastIndex = 0;
    if (!re.test(s)) return;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    while ((m = re.exec(s))) {
      if (!m[0]) { re.lastIndex++; continue; }
      if (m.index > last) frag.append(s.slice(last, m.index));
      const mk = document.createElement('mark');
      mk.className = 'hit';
      mk.textContent = m[0];
      frag.append(mk);
      marks.push(mk);
      last = m.index + m[0].length;
    }
    frag.append(s.slice(last));
    n.replaceWith(frag);
  });
  return marks;
}

function focusTarget(anchor, marks, fresh) {
  const target = anchor ? document.getElementById(anchor) : null;
  let el = target;
  if (marks && marks.length) {
    el = (target && marks.find(m => target.compareDocumentPosition(m) & Node.DOCUMENT_POSITION_FOLLOWING)) || marks[0];
  }
  if (!el) { if (fresh) window.scrollTo(0, 0); return; }
  const y = el.getBoundingClientRect().top + scrollY - (el.nodeName === 'MARK' ? innerHeight / 3 : 76);
  window.scrollTo({ top: Math.max(0, y), behavior: fresh ? 'auto' : 'smooth' });
  el.classList.remove('flash');
  void el.offsetWidth;
  el.classList.add('flash');
}

function onScroll() {
  if (state.view === 'doc') {
    const h = document.documentElement;
    const max = h.scrollHeight - h.clientHeight;
    progressEl.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  }
  if (spy) spy();
}
let scrollQueued = false;
window.addEventListener('scroll', () => {
  if (scrollQueued) return;
  scrollQueued = true;
  requestAnimationFrame(() => { scrollQueued = false; onScroll(); });
}, { passive: true });

const cs = { scope: null, info: null, order: [], i: 0, revealed: false, filter: store.get('cardFilter', 'all'), shuffle: false };

function cardsForScope(scope) {
  if (scope === 'all') return { title: '全部方向', cards: allCards() };
  const d = DIR_BY_KEY[scope];
  if (d) return { title: d.name, cards: d.topics.flatMap(t => cardsOf(t.path)) };
  const t = TOPIC_BY_PATH[scope];
  if (t) return { title: t.name, cards: cardsOf(t.path) };
  return null;
}
function rebuildOrder() {
  const f = cs.filter;
  let list = cs.info.cards.filter(c => f === 'all' || (f === 'todo' ? mastery[c.id] !== 'known' : mastery[c.id] === 'learning'));
  if (cs.shuffle) {
    list = list.slice();
    for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  }
  cs.order = list;
  cs.i = Math.min(cs.i, Math.max(0, list.length - 1));
  cs.revealed = false;
}
function showCards(scope) {
  let info = cardsForScope(scope);
  if (!info) { scope = 'all'; info = cardsForScope('all'); }
  setView('cards');
  document.title = `卡片练习 · ${info.title} · Agent Offer`;
  if (cs.scope !== scope) { cs.scope = scope; cs.i = 0; }
  cs.info = info;
  rebuildOrder();
  renderCards();
  window.scrollTo(0, 0);
}
function renderCards() {
  const all = cs.info.cards;
  const c = cs.order[cs.i];
  const k = knownCount(all);
  const st = c && mastery[c.id];
  const opts = `<option value="all">全部方向（${allCards().length}）</option>` + DIRS.map(d => {
    const n = sum(d.topics, t => cardsOf(t.path).length);
    if (!n) return '';
    return `<optgroup label="${esc(d.name)}"><option value="${esc(d.key)}">${esc(d.name)} · 全部（${n}）</option>` +
      d.topics.filter(t => cardsOf(t.path).length).map(t => `<option value="${esc(t.path)}">${esc(t.name)}（${cardsOf(t.path).length}）</option>`).join('') + '</optgroup>';
  }).join('');
  const card = c ? `<div class="card">
      <div class="card-crumbs"><i class="dot"></i>${esc(c.topic.dir.name)} › <a href="${docHref(c.path)}">${esc(c.topic.name)}</a>${c.crumbs.map(x => ' › ' + esc(trunc(x, 22))).join('')}
        ${st ? `<span class="card-state">${st === 'known' ? '✓ 已掌握' : '↺ 还不熟'}</span>` : ''}</div>
      <h2 class="card-q">${esc(c.q)}</h2>
      ${cs.revealed ? `<div class="card-a md">${renderMd(c.body, { path: c.path })}</div>` : '<button type="button" class="reveal" data-act="reveal">先自己口述一遍，再点击显示答案 <kbd>Space</kbd></button>'}
      <div class="card-foot"><a href="${docHref(c.path, c.anchor)}" ${c.mark ? `data-mark="${esc(c.mark)}"` : ''}>在原文中查看 ↗</a></div>
    </div>
    <div class="card-actions">
      <button type="button" class="btn" data-act="prev">← 上一张</button>
      <button type="button" class="btn ${st === 'learning' ? 'on' : ''}" data-act="learning">↺ 还不熟 <kbd>1</kbd></button>
      <button type="button" class="btn ${st === 'known' ? 'on' : ''}" data-act="known">✓ 已掌握 <kbd>2</kbd></button>
      <button type="button" class="btn" data-act="next">下一张 →</button>
    </div>`
    : `<div class="card empty">${all.length ? '当前筛选下没有卡片' + (cs.filter !== 'all' ? '，可以切换到「全部」继续复习。' : '。') : '这个范围里还没有可抽取的问题卡片。'}</div>`;
  main.innerHTML = `<div class="cards-page" style="--dc:${c ? c.topic.dir.color : 'var(--accent)'}">
    <div class="cards-head">
      <h1>卡片练习</h1>
      <select class="select" id="card-scope" aria-label="练习范围">${opts}</select>
      <div class="seg" role="group" aria-label="筛选">${[['all', '全部'], ['todo', '未掌握'], ['learning', '还不熟']].map(([f, n]) => `<button type="button" data-filter="${f}" class="${cs.filter === f ? 'on' : ''}">${n}</button>`).join('')}</div>
      <button type="button" class="btn sm ${cs.shuffle ? 'on' : ''}" data-act="shuffle">⤮ 随机顺序</button>
    </div>
    <div class="cards-status">
      <span>${cs.order.length ? `第 <b>${cs.i + 1}</b> / ${cs.order.length} 张` : '0 张'}</span>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${all.length}" aria-valuenow="${k}" aria-label="掌握进度"><b style="width:${all.length ? k / all.length * 100 : 0}%"></b></div>
      <span>已掌握 <b>${k}</b> / ${all.length}</span>
    </div>
    ${card}
    <div class="hint"><span><kbd>Space</kbd> 显示 / 隐藏答案</span><span><kbd>←</kbd> <kbd>→</kbd> 切换</span><span><kbd>1</kbd> 还不熟</span><span><kbd>2</kbd> 已掌握</span><span>进度保存在本机浏览器</span></div>
  </div>`;
  const sel = $('#card-scope');
  sel.value = cs.scope;
  if (sel.value !== cs.scope) sel.value = 'all';
  sel.addEventListener('change', () => { location.hash = '#/cards/' + encodeURIComponent(sel.value); });
}
function cardAct(act) {
  const c = cs.order[cs.i];
  const n = cs.order.length;
  if (act === 'shuffle') { cs.shuffle = !cs.shuffle; cs.i = 0; rebuildOrder(); renderCards(); return; }
  if (!c) return;
  if (act === 'reveal') { cs.revealed = !cs.revealed; renderCards(); return; }
  if (act === 'next' || act === 'prev') {
    cs.i = (cs.i + (act === 'next' ? 1 : -1) + n) % n;
    cs.revealed = false;
    renderCards();
    window.scrollTo(0, 0);
    return;
  }
  if (act === 'known' || act === 'learning') {
    const on = mastery[c.id] !== act;
    setMastery(c.id, on ? act : null);
    updateMinis();
    if (on && n > 1) cardAct('next'); else renderCards();
  }
}
main.addEventListener('click', e => {
  if (state.view !== 'cards') return;
  const b = e.target.closest('[data-act], [data-filter]');
  if (!b) return;
  if (b.dataset.filter) {
    cs.filter = b.dataset.filter;
    store.set('cardFilter', cs.filter);
    cs.i = 0;
    rebuildOrder();
    renderCards();
  } else cardAct(b.dataset.act);
});

/* ======================================================================
 * 全文搜索
 * ==================================================================== */
const searchEl = $('#search'), sInput = $('#search-input'), sResults = $('#search-results'), sCount = $('#search-count');
let sIndex = null, sItems = [], sSel = 0, sTerms = [];

const stripMd = l => l.replace(RE.anchor, '')
  .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
  .replace(/^\s*(#{1,6}\s+|>\s?|[-*+]\s+|\d+[.)]\s+)/, '')
  .replace(/[*_`~|]/g, ' ')
  .replace(/\s+/g, ' ').trim();

function buildIndex() {
  sIndex = [];
  const paths = TOPICS.map(t => t.path).concat(NAV_DOCS.map(([p]) => p));
  for (const path of paths) {
    const { lines, heads } = scan(path);
    let hi = -1;
    lines.forEach((l, i) => {
      while (hi + 1 < heads.length && heads[hi + 1].line <= i) hi++;
      const text = stripMd(l);
      if (!text) return;
      const head = heads[hi];
      sIndex.push({ path, text, lower: text.toLowerCase(), head, isHead: !!head && head.line === i });
    });
  }
}
function openSearch(q) {
  searchEl.hidden = false;
  if (typeof q === 'string') sInput.value = q;
  sInput.focus();
  sInput.select();
  doSearch();
}
function closeSearch() { searchEl.hidden = true; }
function snippet(text, terms) {
  const lower = text.toLowerCase();
  const pos = Math.min(...terms.map(t => { const p = lower.indexOf(t); return p < 0 ? Infinity : p; }));
  const start = Math.max(0, (isFinite(pos) ? pos : 0) - 32);
  let s = esc(text.slice(start, start + 140));
  terms.forEach(t => { s = s.replace(new RegExp(escRe(esc(t)), 'gi'), m => `<mark>${m}</mark>`); });
  return (start ? '…' : '') + s + (start + 140 < text.length ? '…' : '');
}
const docLabel = path => { const t = TOPIC_BY_PATH[path]; return t ? `${t.dir.name} › ${t.name}` : (NAV_DOCS.find(([p]) => p === path) || [0, DOCS[path].title])[1]; };
function doSearch() {
  const q = sInput.value.trim();
  sSel = 0;
  if (!q) {
    sItems = [];
    sCount.textContent = '';
    sResults.innerHTML = `<div class="sr-empty">搜索全部 ${TOPICS.length} 个主题的正文与标题<br>试试：<a data-q="幂等">幂等</a> · <a data-q="RAG 召回">RAG 召回</a> · <a data-q="G1">G1</a> · <a data-q="限流">限流</a> · <a data-q="MCP">MCP</a></div>`;
    return;
  }
  if (!sIndex) buildIndex();
  const terms = sTerms = q.toLowerCase().split(/\s+/).filter(Boolean);
  const topicHits = TOPICS.filter(t => terms.every(w => t.name.toLowerCase().includes(w)));
  const hits = sIndex.filter(it => terms.every(w => it.lower.includes(w)));
  hits.sort((a, b) => b.isHead - a.isHead);
  const shown = hits.slice(0, 100);
  const groups = new Map();
  shown.forEach(h => { if (!groups.has(h.path)) groups.set(h.path, []); groups.get(h.path).push(h); });
  sItems = [];
  let html = '';
  if (topicHits.length) {
    html += '<div class="sr-group">主题</div>';
    topicHits.forEach(t => {
      sItems.push({ kind: 'topic', path: t.path });
      html += `<div class="sr-item head" data-i="${sItems.length - 1}"><small>${esc(t.dir.name)}</small><div class="snip">${snippet(t.name, terms)}</div></div>`;
    });
  }
  groups.forEach((list, path) => {
    const d = TOPIC_BY_PATH[path] ? TOPIC_BY_PATH[path].dir : null;
    html += `<div class="sr-group"><i class="dot" style="--dc:${d ? d.color : 'var(--muted)'}"></i>${esc(docLabel(path))} · ${list.length}</div>`;
    list.forEach(h => {
      sItems.push({ kind: 'line', path, head: h.head });
      html += `<div class="sr-item${h.isHead ? ' head' : ''}" data-i="${sItems.length - 1}">${h.isHead || !h.head ? '' : `<small>${esc(h.head.text)}</small>`}<div class="snip">${snippet(h.text, terms)}</div></div>`;
    });
  });
  sResults.innerHTML = html || '<div class="sr-empty">没有找到匹配内容，换个关键词试试</div>';
  sCount.textContent = hits.length ? `共 ${hits.length} 处匹配${hits.length > shown.length ? `（显示前 ${shown.length}）` : ''}` : '';
  selectResult(0);
}
function selectResult(i) {
  const els = $$('.sr-item', sResults);
  if (!els.length) return;
  sSel = (i + els.length) % els.length;
  els.forEach((el, k) => el.classList.toggle('sel', k === sSel));
  els[sSel].scrollIntoView({ block: 'nearest' });
}
function openResult(it) {
  if (!it) return;
  closeSearch();
  if (it.kind === 'topic') { location.hash = docHref(it.path); return; }
  state.pendingMark = sTerms;
  const h = docHref(it.path, it.head && it.head.id);
  if (location.hash === h) route(); else location.hash = h;
}
sInput.addEventListener('input', debounce(doSearch, 90));
sInput.addEventListener('keydown', e => {
  if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); selectResult(sSel + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectResult(sSel - 1); }
  else if (e.key === 'Enter') { e.preventDefault(); openResult(sItems[sSel]); }
});
sResults.addEventListener('click', e => {
  const q = e.target.closest('[data-q]');
  if (q) { sInput.value = q.dataset.q; doSearch(); sInput.focus(); return; }
  const it = e.target.closest('.sr-item');
  if (it) openResult(sItems[+it.dataset.i]);
});
sResults.addEventListener('mousemove', e => {
  const it = e.target.closest('.sr-item');
  if (it && +it.dataset.i !== sSel) selectResult(+it.dataset.i);
});
searchEl.addEventListener('mousedown', e => { if (e.target === searchEl) closeSearch(); });

/* ======================================================================
 * 全局事件：复制、快捷键、带定位的跳转
 * ==================================================================== */
function copyText(t) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.cssText = 'position:fixed;opacity:0';
  document.body.append(ta);
  ta.select();
  try { document.execCommand('copy'); } finally { ta.remove(); }
  return Promise.resolve();
}
document.addEventListener('click', e => {
  const copy = e.target.closest('.copy');
  if (copy) {
    copyText(copy.closest('.code').querySelector('code').textContent)
      .then(() => { copy.textContent = '已复制'; setTimeout(() => { copy.textContent = '复制'; }, 1200); })
      .catch(() => { copy.textContent = '复制失败'; });
    return;
  }
  if (e.target.closest('[data-action="search"]')) { openSearch(); return; }
  const mk = e.target.closest('a[data-mark]');
  if (mk) state.pendingMark = [mk.dataset.mark];
});
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select' || e.target.isContentEditable;
  if ((e.key === 'k' || e.key === 'K') && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openSearch(); return; }
  if (!searchEl.hidden) return;
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); openSearch(); return; }
  if (state.view !== 'cards') return;
  if ((e.key === ' ' || e.key === 'Enter') && e.target.closest('button, a')) return; // 交给元素自身的点击
  const act = { ' ': 'reveal', Enter: 'reveal', ArrowRight: 'next', ArrowLeft: 'prev', 1: 'learning', 2: 'known' }[e.key];
  if (act) { e.preventDefault(); cardAct(act); }
});

/* ======================================================================
 * 路由
 * ==================================================================== */
function notFound() {
  setView('404');
  main.innerHTML = `<div class="page"><div class="panel empty" style="min-height:260px">找不到这个页面。<br><a href="#/">返回总览</a></div></div>`;
}
function route() {
  const [r, a] = location.hash.slice(1).split('::');
  let path, anchor;
  try { path = decodeURIComponent(r || '/'); anchor = a ? decodeURIComponent(a) : ''; } catch (e) { return notFound(); }
  if (path.startsWith('/doc/')) return showDoc(path.slice(5), anchor);
  if (path.startsWith('/dir/')) return showDir(path.slice(5));
  if (path === '/cards' || path.startsWith('/cards/')) return showCards(path.slice(7) || 'all');
  if (path === '/' || path === '') return showHome();
  notFound();
}
window.addEventListener('hashchange', route);

renderSidebar();
route();
})();
</script>
